const poemTitles=['আলোর দিকে যাত্রা','বৃষ্টির পরে নীরবতা','শব্দের ভেতরে মানুষ','ফিরে আসার জানালা','এক মুঠো শান্তি','রাতের নদী','জানালার পাশে চাঁদ','শূন্যতার সঙ্গে কথা','দূরের পাখির ডাক','মাটির গন্ধ','অপেক্ষার শেষ আলো','ভোরের আগে'];
const poemBodies=['ভাঙা পথের শেষে দাঁড়িয়ে দেখি—অন্ধকার কখনো শেষ কথা নয়। দূরে একটি ক্ষুদ্র আলোও পথ চিনিয়ে দিতে পারে।\n\nমানুষ যখন মানুষের পাশে দাঁড়ায়, তখন রাতের গভীরতাও ধীরে ধীরে ভোরের ভাষা শিখে ফেলে।','বৃষ্টির শেষে জানালার কাঁচে যে অল্প আলো থেমে থাকে, সেখানে পুরোনো দিনের গন্ধ মিশে থাকে। শহর ঘুমিয়ে পড়লেও কিছু শব্দ মানুষের ভেতর জেগে থাকে।\n\nসেই শব্দগুলোই একদিন কবিতা হয়ে ফিরে আসে।','শব্দ শুধু উচ্চারণ নয়—কখনো আশ্রয়, কখনো প্রতিবাদ, কখনো আবার ফিরে যাওয়ার পথ। আমরা যত্ন করে লিখলে শব্দও মানুষের প্রতি যত্নশীল হয়ে ওঠে।','সব অপেক্ষা পূর্ণতা পায় না। তবু অপেক্ষা মানুষকে নিজের ভেতরের গভীরতা চিনতে শেখায়। যে নীরবতা সহ্য করতে পারে, সে আলোকে নতুনভাবে দেখতে শেখে।'];
const letters=['নিজের কাছে ফেরার চিঠি','অপ্রকাশিত বন্ধুকে','মায়ের জন্য কয়েকটি লাইন','ভবিষ্যতের আমিকে','একটি অসমাপ্ত চিঠি'];
const environments=['একটি গাছের ছায়ায়','নদীকে বাঁচানোর কথা','প্লাস্টিকমুক্ত একটি সকাল','শহরের জন্য সবুজ জানালা','পাখিদের ছোট্ট আশ্রয়'];
const prolaps=['একটু থামার প্রয়োজন','দয়ার ভেতরের নীরবতা','অভিমান পেরিয়ে আলো','নিজের পাশে বসা','মানুষকে বুঝতে শেখা'];
const edits=['জীবনানন্দ দাশের কবিতা সম্পাদনা','রবীন্দ্রনাথের পাঠতথ্য সংযোজন','নজরুলের কবিতার বানান যাচাই','সুফিয়া কামালের জীবনপঞ্জি সংশোধন'];
function coverSvg(){return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${CONFIG.cover1}"/><stop offset="1" stop-color="${CONFIG.cover2}"/></linearGradient></defs><rect width="1600" height="620" fill="url(#g)"/><circle cx="250" cy="100" r="230" fill="white" opacity=".18"/><path d="M0 510 C350 390 560 610 900 475 S1370 355 1600 500 V620 H0Z" fill="white" opacity=".17"/></svg>`)}`}
function avatarSvg(){const initials=CONFIG.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('');return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${CONFIG.avatar1}"/><stop offset="1" stop-color="${CONFIG.avatar2}"/></linearGradient></defs><rect width="400" height="400" rx="200" fill="url(#g)"/><text x="200" y="240" text-anchor="middle" font-family="Arial,Noto Sans Bengali" font-size="120" font-weight="700" fill="white">${initials}</text></svg>`)}`}
function makePosts(){let out=[];for(let i=0;i<45;i++){let type=['poem','recitation','letter','environment','prolap','discussion','edit'][i%7],title,body,media=null; if(type==='poem'){title=poemTitles[i%poemTitles.length];body=poemBodies[i%poemBodies.length]} if(type==='recitation'){title=['আমার স্বর, আমার পথ','বৃষ্টির শব্দে কবিতা','নীরবতার উচ্চারণ','আলো ফেরার গান'][i%4];body='কবিতার প্রতিটি উচ্চারণে থাকে শ্বাস, স্মৃতি ও অনুভবের নিজস্ব ছন্দ। এই আবৃত্তিতে শব্দের পাশাপাশি নীরবতারও একটি ভূমিকা আছে।';media={kind:'recitation',poster:POSTERS[i%4],audio:WAV}} if(type==='letter'){title=letters[i%letters.length];body='প্রিয় মানুষ, ক্লান্ত হলে একটু থেমে যেয়ো—কিন্তু নিজের আলোকে ছোট করে দেখো না। পথ দীর্ঘ হলেও তোমার ভেতরে ফিরে আসার একটি দরজা সবসময় খোলা থাকে।'} if(type==='environment'){title=environments[i%environments.length];body='প্রকৃতি আমাদের কাছ থেকে বড় কোনো ভাষণ চায় না; সে চায় ছোট ছোট দায়িত্ব। একটি গাছ, পরিষ্কার একটি নদীতীর, প্লাস্টিকের বদলে সচেতনতা—এসবই আগামী দিনের প্রতি আমাদের চিঠি।'} if(type==='prolap'){title=prolaps[i%prolaps.length];body='সব প্রশ্নের উত্তর আজই পাওয়া দরকার নেই। কখনো নিজের পাশে কিছুক্ষণ নীরবে বসে থাকা, নিজের শ্বাস শুনে নেওয়া এবং তাড়াহুড়া থেকে একটু দূরে আসাও বড় একটি উত্তর।'} if(type==='discussion'){title='কবিতা কি শুধু অনুভূতি?';body='কবিতা অনুভূতি থেকে জন্ম নেয়, কিন্তু ভাষা, নির্মাণ, পাঠকের অভিজ্ঞতা এবং সময়ের সঙ্গে তার গভীর সম্পর্ক থাকে। এই আলোচনায় সেই নির্মাণের কিছু দিক নিয়ে ভাবা হয়েছে।'} if(type==='edit'){title=edits[i%edits.length];body='তথ্য, বানান ও উৎস মিলিয়ে এই সম্পাদনাটি সংরক্ষণ করা হয়েছে। ভুল বা অসম্পূর্ণতা থাকলে পাঠক রিপোর্ট করতে পারবেন; অনুমোদিত সম্পাদনা সরাসরি মুছে ফেলা যাবে না।'} out.push({id:'demo-'+CONFIG.id+'-'+(i+1),type,title,body,createdAt:new Date(Date.now()-i*86400000).toISOString(),likes:18+(i*7)%190,comments:2+(i*3)%24,media,pinned:i===0,privacy:'Public'})}return out}
let posts=read(postKey,null)||makePosts();if(posts.length<45){posts=makePosts();write(postKey,posts)}
function label(t){return {poem:'কবিতা',recitation:'আবৃত্তি',letter:'চিঠিপত্র',environment:'পরিবেশের কথা',prolap:'ছোট কথার প্রলাপ',discussion:'সাহিত্য আলোচনা',edit:'সম্পাদনা',photo:'প্রোফাইল আপডেট',cover:'কভার আপডেট'}[t]||'প্রকাশনা'}
function bnDate(v){try{return new Intl.DateTimeFormat('bn-BD',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit',timeZone:'Asia/Dhaka'}).format(new Date(v))}catch(_){return v}}
function currentAvatar(){return state.avatar||avatarSvg()}function currentCover(){return state.cover||coverSvg()}
function applyProfile(){document.documentElement.style.setProperty('--cover1',CONFIG.cover1);document.documentElement.style.setProperty('--cover2',CONFIG.cover2);document.documentElement.style.setProperty('--avatar1',CONFIG.avatar1);document.documentElement.style.setProperty('--avatar2',CONFIG.avatar2);$('#coverImg').src=currentCover();$('#avatarImg').src=currentAvatar();$('#coverImg').style.setProperty('--coverX',state.coverX+'%');$('#coverImg').style.setProperty('--coverY',state.coverY+'%');$('#coverImg').style.setProperty('--coverZoom',state.coverZoom);$('#avatarImg').style.setProperty('--avatarX',state.avatarX+'%');$('#avatarImg').style.setProperty('--avatarY',state.avatarY+'%');$('#avatarImg').style.setProperty('--avatarZoom',state.avatarZoom);$('#bioText').textContent=state.bio;$('#profileName').textContent=CONFIG.name;$('#profileUsername').textContent=CONFIG.username;$('#profileNameBar').textContent=CONFIG.name;$$('[data-owner-only]').forEach(x=>x.classList.toggle('hidden',!OWNER));$$('[data-visitor-only]').forEach(x=>x.classList.toggle('hidden',OWNER));if(CONFIG.badge){$('#roleBadge').textContent=CONFIG.badge;$('#roleBadge').classList.remove('hidden')}else $('#roleBadge').classList.add('hidden')}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;D.body.append(t);setTimeout(()=>t.remove(),2200)}
function authorLink(){return CONFIG.role==='founder'?'founder-profile.html':CONFIG.role==='admin'?'admin-profile.html':'profile.html?user='+encodeURIComponent(CONFIG.id)}
function postCard(p){let media='';if(p.media?.kind==='recitation')media=`<div class="post-media recitation-poster" data-photo="${esc(p.media.poster)}" data-caption="${esc(p.title)}"><img src="${p.media.poster}" alt="${esc(p.title)}"></div><audio controls preload="none" src="${p.media.audio}"></audio>`;else if(p.media?.url)media=`<div class="post-media" data-photo="${esc(p.media.url)}" data-caption="${esc(p.media.caption||p.title)}"><img src="${esc(p.media.url)}" alt="${esc(p.title)}"></div>`;return `<article class="card post ${p.pinned?'pinned':''}" data-id="${esc(p.id)}" data-type="${esc(p.type||'poem')}" data-template="${esc(p.template||'pearl')}"><div class="post-head"><div class="author"><a class="author-avatar" href="${authorLink()}"><img src="${currentAvatar()}" alt=""></a><div><a class="author-name" href="${authorLink()}">${esc(CONFIG.name)}</a><span class="post-time">${bnDate(p.createdAt)} · ${esc(p.privacy||'Public')}</span></div></div><button class="dots" data-post-menu="${esc(p.id)}" aria-label="পোস্টের অপশন">•••</button></div><span class="post-tag">${label(p.type)}${p.pinned?' · পিন করা':''}</span><h3 class="post-title" data-toggle-post>${esc(p.title)}</h3><div class="post-body ${p.body.length>170?'long':''}">${esc(p.body)}</div>${p.body.length>170?'<button class="read-more" data-toggle-post>আরও দেখুন →</button>':''}${media}<div class="post-stats"><span>❤️ ${p.likes} জন</span><span>${p.comments} মন্তব্য · ${Math.max(1,Math.floor(p.likes/5))} শেয়ার</span></div><div class="post-actions"><button class="action" data-react><span class="action-icon">♡</span> <span class="action-label">লাইক</span></button><button class="action" data-comments><span class="action-icon">◌</span> মন্তব্য</button><button class="action" data-share><span class="action-icon">↗</span> শেয়ার</button><button class="action" data-save><span class="action-icon">▱</span> সেভ</button></div><div class="comments hidden"><div class="comment"><div class="comment-avatar">${names[0][0]}</div><div class="comment-bubble"><a class="comment-author" href="profile.html?user=rakibul-hasan">${names[0]}</a>লেখাটির ভাষা সহজ, কিন্তু অনুভব গভীর হয়েছে।</div></div><div class="comment"><div class="comment-avatar">${names[1][0]}</div><div class="comment-bubble"><a class="comment-author" href="profile.html?user=nusrat-kabir">${names[1]}</a>শেষের অংশটি বিশেষভাবে ভালো লেগেছে।</div></div><div class="comment-row"><input class="comment-input" placeholder="মন্তব্য লিখুন…"><button class="comment-send" data-comment-send>➤</button></div></div></article>`}
function renderHome(){const list=$('#postList');list.innerHTML=posts.map(postCard).join('');}
function renderArchive(type){const rows=posts.filter(p=>p.type===type);$('#tabContent').innerHTML=`<section class="card" style="padding:14px"><div class="side-title"><strong>${label(type)}</strong><small>${rows.length}টি</small></div><div class="archive-list">${rows.map(p=>`<div class="archive-item"><a href="#${p.id}" data-open-archive="${p.id}">${esc(p.title)}</a><small>${bnDate(p.createdAt)}</small></div>`).join('')||'<div class="empty">এখনো কোনো প্রকাশনা নেই।</div>'}</div></section>`}
function renderAbout(){$('#tabContent').innerHTML=`<section class="card" style="padding:15px"><h2>পরিচিতি</h2><p style="color:var(--muted);line-height:1.9">${esc(state.bio)}</p><h3>বন্ধুতালিকা</h3><div class="archive-list">${names.slice(0,8).map((n,i)=>`<div class="archive-item"><a href="profile.html?user=${encodeURIComponent(n)}">${n}</a><small>${i%2?'অনুসরণ করছেন':'বন্ধু'}</small></div>`).join('')}</div></section>`}
function showTab(tab){$$('.tab-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='home'){$('#tabContent').innerHTML=`${OWNER?'<section class="card composer" id="composer">':'<section class="card composer hidden" id="composer">'}<div class="composer-top"><div class="mini-avatar"><img src="${currentAvatar()}" alt=""></div><button class="composer-prompt" data-open-composer>আজ আপনার ভেতরে কী কথা জমে আছে?</button></div><div class="composer-panel hidden"><select id="composeType" class="comment-input" style="height:42px"><option value="">বিষয় নির্বাচন করুন</option><option value="poem">কবিতা</option><option value="recitation">আবৃত্তি</option><option value="letter">চিঠিপত্র</option><option value="environment">পরিবেশ</option><option value="prolap">ছোট প্রলাপ</option></select><input id="composeTitle" placeholder="শিরোনাম"><textarea id="composeBody" placeholder="আপনার লেখা লিখুন…"></textarea><div class="composer-tools"><button class="tool-btn" data-compose-media="image">▧ ছবি</button><button class="tool-btn" data-compose-media="audio">◉ অডিও</button><button class="tool-btn" data-compose-media="video">▷ ভিডিও</button><button class="btn primary composer-submit" data-publish>প্রকাশ করুন</button></div></div></section><section id="postList" class="post-list"></section>`;renderHome()}else if(tab==='about')renderAbout();else renderArchive(tab)}

function mapPost(x){return{id:x.id,type:x.type||x.category||'poem',title:x.title||'শিরোনামহীন',body:x.body||'',createdAt:x.created_at||new Date().toISOString(),likes:Number(x.likes_count||x.likes||0),comments:Number(x.comments_count||x.comments||0),privacy:x.visibility||'Public',pinned:!!x.is_pinned,template:x.card_style||'pearl',media:x.media_url?{url:x.media_url,caption:x.caption||x.title}:null}}
async function loadDynamic(){
 if(!sb)return;
 const file=(location.pathname.split('/').pop()||'').toLowerCase();
 const q=new URLSearchParams(location.search);let raw=(q.get('user')||'').trim();
 const session=await getSession();
 if(!raw&&file==='profile.html')raw=session?.user?.id||'';
 if(file==='founder-profile.html'&&!raw){try{const r=await sb.from('user_roles').select('user_id').eq('role','founder').eq('active',true).limit(1).maybeSingle();raw=r.data?.user_id||''}catch(_){}}
 if(file==='admin-profile.html'&&!raw){raw=session?.user?.id||''}
 if(!raw)return;
 loading(true);
 const p=await getProfile(raw);
 if(!p){loading(false);return}
 try{
   Object.assign(CONFIG,{id:p.id||CONFIG.id,name:p.display_name||p.full_name||CONFIG.name,username:'@'+String(p.username||CONFIG.username||'member').replace(/^@/,''),role:p.role||CONFIG.role,badge:(p.role==='founder'?'Founder':p.role==='admin'?'Admin':CONFIG.badge||''),bio:p.bio||CONFIG.bio});
   state.bio=p.bio||state.bio; if(p.avatar_url)state.avatar=p.avatar_url;if(p.cover_url)state.cover=p.cover_url;
   OWNER=!!(session?.user?.id&&String(session.user.id)===String(p.id));
   window.__BD_TARGET_PROFILE_ID=p.id;window.__BD_TARGET_PROFILE_USERNAME=String(p.username||'').replace(/^@/,'');
   const r=await sb.from('posts').select('*').eq('author_id',p.id).in('status',['published','published_flagged']).order('created_at',{ascending:false}).limit(100);
   if(!r.error&&r.data?.length)posts=r.data.map(mapPost);
   applyProfile();buildSides();showTab('home');
 }catch(err){console.warn('Profile loader:',err)}finally{loading(false)}
}
async function openMessage(){
 const id=window.__BD_TARGET_PROFILE_ID||CONFIG.id;const username=window.__BD_TARGET_PROFILE_USERNAME||String(CONFIG.username||'').replace(/^@/,'');
 const session=await getSession();
 if(!session?.user?.id){notice('বার্তা পাঠাতে আগে লগইন করুন');setTimeout(()=>location.href='login.html?redirect='+encodeURIComponent(location.href),700);return}
 if(String(session.user.id)===String(id)){notice('এটি আপনার নিজের প্রোফাইল');return}
 notice('কথোপকথন খোলা হচ্ছে…');
 const u=new URLSearchParams();u.set('user',id||username);if(username)u.set('username',username);u.set('from','profile');location.href='messages.html?'+u.toString();
}
D.addEventListener('click',e=>{const b=e.target.closest('[data-message],[data-profile-action="message"]');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openMessage()},true);

<script id="bd-v102-final-sidebar-runtime">
(()=>{
'use strict';
const D=document,W=window;
const one=s=>D.querySelector(s);
const all=s=>Array.from(D.querySelectorAll(s));
const SEL={
  leftHandle:'#leftEdgeMenu,[data-left-edge],.edge-menu-left,.edge.left,[data-bd9-handle="left"]',
  rightHandle:'#rightEdgeMenu,[data-right-edge],.edge-menu-right,.edge.right,[data-bd9-handle="right"]',
  left:'#mobileDrawer,#leftDrawer,[data-bd9-drawer="left"]',
  right:'#rightMobileDrawer,#rightDrawer,[data-bd9-drawer="right"]',
  back:'#drawerBackdrop,#backdrop,.drawer-backdrop'
};
let pushed=false;
function drawers(which){return all(which==='right'?SEL.right:SEL.left)}
function backdrop(){return one(SEL.back)}
function forceClose(fromHistory=false){
  [...drawers('left'),...drawers('right')].forEach(x=>{
    x.classList.remove('open','bd-force-open');
    x.removeAttribute('data-bd-open');
    x.style.removeProperty('transform');
    x.style.removeProperty('pointer-events');
  });
  const b=backdrop();if(b){b.classList.remove('show','bd-force-show');b.style.removeProperty('opacity');b.style.removeProperty('pointer-events')}
  D.body.classList.remove('locked','bd-drawer-open');
  if(!fromHistory&&pushed&&history.state?.bdSidebar){pushed=false;history.back()}
}
function forceOpen(which){
  const target=drawers(which)[0];if(!target)return;
  [...drawers('left'),...drawers('right')].forEach(x=>{
    const on=x===target;x.classList.toggle('open',on);x.classList.toggle('bd-force-open',on);
    if(on){x.dataset.bdOpen='1';x.style.setProperty('transform','translate3d(0,0,0)','important');x.style.setProperty('pointer-events','auto','important')}
    else{x.removeAttribute('data-bd-open');x.style.removeProperty('transform');x.style.removeProperty('pointer-events')}
  });
  const b=backdrop();if(b){b.classList.add('show','bd-force-show');b.style.setProperty('opacity','1','important');b.style.setProperty('pointer-events','auto','important')}
  D.body.classList.add('locked','bd-drawer-open');
  if(!history.state?.bdSidebar){history.pushState({...(history.state||{}),bdSidebar:which},'');pushed=true}
}
function isClose(t){return t.closest('[data-close-drawer],[data-bd9-close],.drawer-close,#closeDrawer,#closeRightDrawer')}
function handlePointer(e){
  const t=e.target;
  if(t.closest(SEL.leftHandle)){e.preventDefault();e.stopPropagation();forceOpen('left');return}
  if(t.closest(SEL.rightHandle)){e.preventDefault();e.stopPropagation();forceOpen('right');return}
  if(isClose(t)||t===backdrop()){e.preventDefault();e.stopPropagation();forceClose();return}
}
W.addEventListener('pointerdown',handlePointer,true);
W.addEventListener('popstate',()=>{if(D.body.classList.contains('bd-drawer-open')){pushed=false;forceClose(true)}});
D.addEventListener('keydown',e=>{if(e.key==='Escape')forceClose()},true);

function fallbackProfileSidebars(){
  const l=one('#leftDrawerBody'),r=one('#rightDrawerBody');
  const ls=one('#leftSide'),rs=one('#rightSide');
  if(l&&!l.children.length&&ls?.innerHTML.trim())l.innerHTML=ls.innerHTML;
  if(r&&!r.children.length&&rs?.innerHTML.trim())r.innerHTML=rs.innerHTML;
  if(l&&!l.children.length)l.innerHTML='<section class="side-card"><div class="side-title"><strong>আপন ভুবন</strong></div><div class="side-list"><button class="side-link" data-story-touch>✦ Story Touch</button><button class="side-link" data-side-panel="messages">▢ Messenger</button><button class="side-link" data-side-panel="archive">◫ Archive</button><button class="side-link" data-side-panel="settings">⚙ Settings</button></div></section>';
  if(r&&!r.children.length)r.innerHTML='<section class="side-card"><div class="side-title"><strong>প্রোফাইল</strong></div><div class="side-list"><button class="side-link" data-tab="home">হোম</button><button class="side-link" data-tab="poem">কবিতা</button><button class="side-link" data-tab="recitation">আবৃত্তি</button><button class="side-link" data-tab="letter">চিঠিপত্র</button><button class="side-link" data-tab="environment">পরিবেশ</button></div></section>';
}
function syncThemeText(){
  const dark=D.documentElement.getAttribute('data-theme')==='dark';
  D.documentElement.classList.toggle('bd-final-dark',dark);
  all('#composerPrompt,.composer-prompt,[data-open-composer],#editorCaption,.caption-input,.caption-field').forEach(el=>{
    el.style.setProperty('color',dark?'#ffffff':'#14243a','important');
    el.style.setProperty('-webkit-text-fill-color',dark?'#ffffff':'#14243a','important');
    el.style.setProperty('opacity','1','important');
  });
}
function init(){fallbackProfileSidebars();syncThemeText()}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',init,{once:true});else init();
setTimeout(init,350);setTimeout(init,1200);setTimeout(init,2600);
new MutationObserver(syncThemeText).observe(D.documentElement,{attributes:true,attributeFilter:['data-theme','data-r99-palette']});
})();
</script>
