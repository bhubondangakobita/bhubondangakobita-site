'use strict';
const D=document,W=window;
const $=(s,r=D)=>r.querySelector(s),$$=(s,r=D)=>[...r.querySelectorAll(s)];
const memory={};
function safeGet(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(_){return k in memory?memory[k]:f}}
function safeSet(k,v){memory[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(_){ }return v}
function safeRemove(k){delete memory[k];try{localStorage.removeItem(k)}catch(_){}}
function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':'&quot;'}[c]))}
function uid(p='id'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function bnDate(v){try{return new Intl.DateTimeFormat('bn-BD',{timeZone:'Asia/Dhaka',day:'numeric',month:'long',year:'numeric'}).format(new Date(v))}catch(_){return''}}
function bnNum(n){return new Intl.NumberFormat('bn-BD').format(Number(n)||0)}
function initials(n){return String(n).trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2)}
function svgAvatar(name,c1='#7468e8',c2='#c85cae'){const t=escapeHTML(initials(name));return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g"><stop stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="300" height="300" rx="150" fill="url(#g)"/><text x="150" y="175" text-anchor="middle" font-size="92" font-weight="800" font-family="sans-serif" fill="white">${t}</text></svg>`)} `}
function svgCover(name,role){const label=escapeHTML(name),sub=role==='founder'?'বাংলা কবিতা ও সাহিত্যচর্চার একটি মুক্ত ভুবন':role==='admin'?'কবিতা, সম্পাদনা ও সাহিত্যিক আলোচনার ভুবন':'শব্দ, অনুভব ও মানুষের কাছে ফেরার পথ';return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#55b9cd"/><stop offset=".5" stop-color="#7187df"/><stop offset="1" stop-color="#bb86df"/></linearGradient></defs><rect width="1600" height="500" rx="40" fill="url(#g)"/><circle cx="1450" cy="40" r="250" fill="white" opacity=".12"/><path d="M0 390 Q420 280 820 380 T1600 340 V500 H0Z" fill="white" opacity=".12"/><text x="800" y="230" text-anchor="middle" font-size="78" font-family="sans-serif" font-weight="800" fill="white">${label}</text><text x="800" y="300" text-anchor="middle" font-size="28" font-family="sans-serif" fill="white" opacity=".83">${sub}</text></svg>`)} `}
const directory=[
 {id:'ishita-nowrin',name:'ঈশিতা নওরীন',username:'ishita-nowrin',role:'user',bio:'আলো, অপেক্ষা ও ফিরে আসার কবিতা লিখি। শব্দকে আমি মানুষের কাছে ফেরার পথ মনে করি।',c1:'#8767e8',c2:'#d15ca7'},

 {id:'nusrat-kabir',name:'নুসরাত কবির',username:'nusrat-kabir',role:'user',bio:'নারী, প্রকৃতি ও স্মৃতির কবিতা লিখি।',c1:'#c45a9d',c2:'#845ee3'},
 {id:'adiba-rahman',name:'আদিবা রহমান',username:'adiba-rahman',role:'user',bio:'ছোট কবিতা ও আবৃত্তিতে আগ্রহী।',c1:'#5ab5c8',c2:'#8072e5'},
 {id:'sabir-ahmed',name:'সাবির আহমেদ',username:'sabir-ahmed',role:'user',bio:'শহরের নীরবতা নিয়ে লিখি।',c1:'#7568e8',c2:'#4bb0c8'},
 {id:'meherab-neel',name:'মেহরাব নীল',username:'meherab-neel',role:'user',bio:'রাত, স্মৃতি এবং মানুষের নীরবতা নিয়ে লিখি।',c1:'#296eaa',c2:'#845bd2'},
 {id:'arif-hasan',name:'আরিফ হাসান',username:'arif-hasan',role:'user',bio:'চিঠি ও ভ্রমণকথা লিখি।',c1:'#c58a44',c2:'#db5f95'},
 {id:'samia-adrita',name:'সামিয়া আদৃতা',username:'samia-adrita',role:'user',bio:'কণ্ঠে কবিতা এবং গল্পে মানুষ।',c1:'#49b499',c2:'#617ce5'},
 {id:'mahmudsohel5500',name:'মাহমুদ সোহেল',username:'mahmudsohel5500',role:'founder',bio:'ভুবনডাঙ্গার কবিতা—বাংলা কবিতা ও সাহিত্যচর্চার একটি মুক্ত ভুবন। মানুষের ভেতরের নীরবতা, মানবিকতা ও সত্যের পাশে থাকাই আমার সাহিত্যিক পথ।',c1:'#6158d8',c2:'#c855a7'},
 {id:'nazmul-admin',name:'নাজমুল হক',username:'nazmul-admin',role:'admin',bio:'কবিতা, সম্পাদনা ও সাহিত্যিক আলোচনার সঙ্গে যুক্ত। শুদ্ধ পাঠ, নির্ভুল তথ্য এবং সুন্দর প্রকাশনা আমার কাজের অগ্রাধিকার।',c1:'#4287db',c2:'#7658d8'}
];
const query=new URLSearchParams(location.search);
const targetId=query.get('user')||PROFILE_CONFIG.id;
const target=directory.find(x=>x.id===targetId)||Object.assign({},PROFILE_CONFIG,{id:targetId,username:targetId,name:query.get('name')||PROFILE_CONFIG.name});
const storedIdentity=safeGet('bd_current_user',null);
const current=storedIdentity||{id:PROFILE_CONFIG.id,username:PROFILE_CONFIG.username,name:PROFILE_CONFIG.name,role:PROFILE_CONFIG.role};
const forceVisitor=query.get('view')==='visitor';
const isOwner=!forceVisitor&&(String(current.id)===String(target.id)||String(current.username)===String(target.username));
const isFounder=String(current.role).toLowerCase()==='founder';
const profileKey=`bd_profile_${target.id}`;
const storedProfile=safeGet(profileKey,{});
const profile=Object.assign({},target,storedProfile);
profile.avatar=profile.avatar||svgAvatar(profile.name,profile.c1,profile.c2);profile.cover=profile.cover||svgCover(profile.name,profile.role);
const defaultSettings={profileVisibility:'public',bioVisibility:'public',friendVisibility:'public',postVisibility:'public',messagePermission:'everyone',followPermission:'everyone',storyVisibility:'friends',dark:false,theme:'pearl'};
let settings=Object.assign({},defaultSettings,safeGet(`bd_settings_${target.id}`,{}));
function relationshipKey(a,b){return `bd_follow_${a}_${b}`}
function follows(a,b){return !!safeGet(relationshipKey(a,b),false)}
function isFriend(a,b){return follows(a,b)&&follows(b,a)}
function allowed(level){if(isOwner)return true;if(level==='public')return true;if(level==='logged')return !!current?.id;if(level==='followers')return follows(current.id,target.id);if(level==='friends')return isFriend(current.id,target.id);return false}

rget.id}`,arr);return arr}

function renderArchive(id){const category=archiveCategory(id);let rows=posts.filter(p=>p.category===category);if(rows.length<20){const base=rows.length?rows:posts.slice(0,1);for(let i=rows.length;i<20;i++){rows.push({...base[i%base.length],id:`${target.id}-${id}-archive-${i}`,title:`${category} সংরক্ষণ — ${bnNum(i+1)}`,createdAt:new Date(Date.now()-i*86400000*4).toISOString(),category})}}return `<section class="archive-head glass"><h2>${category}</h2><p>শিরোনাম ও প্রকাশের তারিখ অনুযায়ী সংরক্ষিত কাজ।</p><input class="archive-search" placeholder="শিরোনাম খুঁজুন…" data-archive-search></section><div class="archive-list">${rows.slice(0,20).map(p=>`<button class="archive-row" data-open-original="${p.id}"><span><strong>${escapeHTML(p.title)}</strong><small>${bnDate(p.createdAt)} · ${category}</small></span><span class="archive-type">খুলুন ›</span></button>`).join('')}</div>`}
function renderAbout(){const friends=directory.filter(x=>x.id!==target.id).slice(0,9);return `<section class="about-card glass"><h2>পরিচিতি</h2><p>${allowed(settings.bioVisibility)?escapeHTML(profile.bio):'পরিচিতি গোপন রাখা হয়েছে।'}</p><div class="about-grid" style="margin-top:12px"><div class="about-item"><span>অবস্থান</span><strong>ঢাকা, বাংলাদেশ</strong></div><div class="about-item"><span>যোগ দিয়েছেন</span><strong>জুলাই ২০২৬</strong></div><div class="about-item"><span>সাহিত্যিক আগ্রহ</span><strong>কবিতা, চিঠি, আবৃত্তি</strong></div><div class="about-item"><span>Contribution</span><strong>${profile.role==='founder'?'Founder':profile.role==='admin'?'Admin':'সক্রিয় লেখক'}</strong></div></div></section><section class="about-card glass" style="margin-top:12px"><h2>বন্ধুতালিকা</h2>${allowed(settings.friendVisibility)?`<div class="friends-grid">${friends.map(p=>`<a class="friend-card" href="${profileUrl(p)}">${avatarHTML(p)}<strong>${p.name}</strong></a>`).join('')}</div>`:'<div class="privacy-lock"><div class="lock-icon">⌾</div><strong>বন্ধুতালিকা গোপন</strong></div>'}</section>`}
function renderMore(){return `<section class="about-card glass"><h2>আরও</h2><div class="side-list"><button class="side-action" data-open-activity><span class="mini-icon">◷</span><span><strong>Activity log</strong><small>প্রোফাইলের কার্যক্রম</small></span></button><button class="side-action" data-open-memories><span class="mini-icon">☆</span><span><strong>Memories</strong><small>পুরোনো স্মৃতি</small></span></button><button class="side-action" data-open-saved><span class="mini-icon">▱</span><span><strong>Saved posts</strong><small>সংরক্ষিত লেখা</small></span></button><button class="side-action" data-open-archive><span class="mini-icon">▤</span><span><strong>Archive</strong><small>আর্কাইভ</small></span></button><button class="side-action" data-open-settings><span class="mini-icon">⚙</span><span><strong>Settings</strong><small>Privacy ও Theme</small></span></button></div></section>`}
function renderContent(){renderTabs();const h=$('#tabContent');if(!allowed(settings.profileVisibility)){h.innerHTML=`<section class="privacy-lock glass"><div class="lock-icon">⌾</div><h2>এই প্রোফাইলটি গোপন</h2><p>শুধু অনুমোদিত ব্যক্তি এই প্রোফাইলের লেখা ও তথ্য দেখতে পারবেন।</p></section>`;return}if(activeTab==='home')h.innerHTML=renderHome();else if(activeTab==='about')h.innerHTML=renderAbout();else if(activeTab==='more')h.innerHTML=renderMore();else h.innerHTML=renderArchive(activeTab)}

function activityPanel(){const events=safeGet(`bd_activity_${target.id}`,[]);const seed=['প্রোফাইলের Bio আপডেট করেছেন','কভার ছবি পরিবর্তন করেছেন','একটি কবিতা প্রকাশ করেছেন','একটি মন্তব্য লিখেছেন','একটি পোস্ট সংরক্ষণ করেছেন','Story privacy পরিবর্তন করেছেন'];return `<div class="side-card glass"><div class="side-title">Activity log</div><div class="side-list">${(events.length?events:seed.map((x,i)=>({text:x,date:new Date(Date.now()-i*86400000).toISOString()}))).map(e=>`<div class="side-action"><span class="mini-icon">◷</span><span><strong>${escapeHTML(e.text)}</strong><small>${bnDate(e.date)}</small></span></div>`).join('')}</div></div>`}
function simplePanel(title){return `<div class="side-card glass"><div class="side-title">${title}</div><div class="side-list">${posts.slice(0,10).map(p=>`<button class="side-action" data-open-original="${p.id}"><span class="mini-icon">▱</span><span><strong>${escapeHTML(p.title)}</strong><small>${bnDate(p.createdAt)}</small></span></button>`).join('')}</div></div>`}
function storyPanel(){const people=directory.filter(x=>x.id!==current.id);const doubled=[...people,...people];return `<div class="story-strip glass"><div class="story-track">${doubled.map((p,i)=>`<button class="story-item" data-story="${p.id}">${avatarHTML(p)}<span>${p.name}</span></button>`).join('')}</div></div><div class="side-card glass"><button class="side-action owner-only" data-add-story><span class="mini-icon">＋</span><span><strong>নিজের Story যোগ করুন</strong><small>ছবি, লেখা বা ছোট ভিডিও</small></span></button><button class="side-action owner-only" data-story-archive><span class="mini-icon">▤</span><span><strong>Story archive</strong><small>পুরোনো Story</small></span></button></div>`}
function openStory(personId){const p=directory.find(x=>x.id===personId)||profile;$('#layerHost').innerHTML=`<section class="story-view"><div class="story-top"><div style="display:flex;align-items:center;gap:9px">${avatarHTML(p)}<strong>${p.name}</strong></div><button class="close-btn" data-close-layer>×</button></div><div class="story-stage">কখনো কখনো একটি ছোট আলোই দীর্ঘ অন্ধকারের পথ চিনিয়ে দেয়।</div><div class="story-bottom"><input placeholder="ব্যক্তিগত Reply লিখুন…"><button>➤</button></div></section>`;history.pushState({layer:'story'},'')}
function openViewer(src,caption){$('#layerHost').innerHTML=`<section class="viewer"><div class="viewer-head"><strong>${escapeHTML(profile.name)}</strong><button class="close-btn" data-close-layer>×</button></div><div class="viewer-stage"><img src="${src}" alt="${escapeHTML(caption||'ছবি')}"></div><div class="viewer-foot"><span>${escapeHTML(caption||'')}</span><span>♡ প্রতিক্রিয়া · মন্তব্য · শেয়ার</span></div></section>`;history.pushState({layer:'viewer'},'')}
let editorMode='avatar',editorData='';
function openEditor(mode){editorMode=mode;editorData=mode==='avatar'?profile.avatar:profile.cover;$('#layerHost').innerHTML=`<section class="editor-overlay"><div class="editor-card glass"><div class="drawer-head" style="margin:0 0 12px;padding:0 0 10px"><strong>${mode==='avatar'?'প্রোফাইল ছবি':'কভার ছবি'} পরিবর্তন</strong><button class="close-btn" data-close-layer>×</button></div><div class="editor-preview ${mode==='avatar'?'avatar-mode':''}" id="editorPreview"><img id="editorImage" src="${editorData}" alt="Preview"></div><div class="editor-controls"><input id="editorFile" type="file" accept="image/*"><label>Zoom <input id="zoomRange" type="range" min="1" max="2.6" step=".01" value="1"></label><label>ডানে–বামে <input id="xRange" type="range" min="-120" max="120" value="0"></label><label>ওপরে–নিচে <input id="yRange" type="range" min="-120" max="120" value="0"></label><input id="captionInput" type="text" placeholder="ছবির ক্যাপশন লিখুন"></div><div class="editor-actions"><button data-editor-reset>Reset</button><button data-close-layer>Cancel</button><button class="save" data-editor-save>Save</button></div></div></section>`;history.pushState({layer:'editor'},'')}
function closeLayer(noHistory=false){$('#layerHost').innerHTML='';if(!noHistory&&history.state?.layer)history.back()}
function saveProfile(){safeSet(profileKey,{bio:profile.bio,avatar:profile.avatar,cover:profile.cover,coverPos:profile.coverPos,avatarPos:profile.avatarPos});safeSet(`bd_posts_${target.id}`,posts)}
function logActivity(text){const a=safeGet(`bd_activity_${target.id}`,[]);a.unshift({id:uid('act'),text,date:new Date().toISOString()});safeSet(`bd_activity_${target.id}`,a.slice(0,100))}
function editBio(){if(!isOwner)return;const box=$('#bioBox'),text=$('#bioText'),old=profile.bio;box.innerHTML=`<textarea id="bioEditor" style="width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:16px">${escapeHTML(old)}</textarea>`;const ed=$('#bioEditor');ed.focus();function save(cancel=false){if(!$('#bioEditor'))return;profile.bio=cancel?old:ed.value.trim()||old;saveProfile();logActivity('প্রোফাইলের Bio আপডেট করেছেন');box.innerHTML=`<span id="bioText">${escapeHTML(profile.bio)}</span><div class="bio-hint owner-only">ডবল ক্লিক বা ডবল ট্যাপ করে Bio সম্পাদনা করুন</div>`;toast(cancel?'পরিবর্তন বাতিল হয়েছে':'Bio সংরক্ষিত হয়েছে')}ed.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();save()}if(e.key==='Escape')save(true)});ed.addEventListener('blur',()=>setTimeout(()=>save(),50),{once:true})}
function switchTab(id){activeTab=id;renderContent();$('#profileMain').scrollTo({top:$('#tabs').offsetTop-8,behavior:'smooth'})}
function openOriginal(id){activeTab='home';renderedCount=45;renderContent();setTimeout(()=>{const c=$(`[data-post-id="${CSS.escape(id)}"]`);if(c){c.classList.add('expanded');const eb=$('[data-expand]',c);if(eb)eb.textContent='কম দেখুন ↑';c.scrollIntoView({behavior:'smooth',block:'center'})}},80)}
function handleMenuAction(action,card){const id=card?.dataset.postId,p=posts.find(x=>x.id===id);if(!p)return;if(action==='delete'){if(confirm('পোস্টটি মুছে ফেলবেন?')){posts=posts.filter(x=>x.id!==id);saveProfile();renderContent();toast('পোস্ট মুছে ফেলা হয়েছে')}}else if(action==='archive'){p.archived=true;saveProfile();renderContent();toast('আর্কাইভে নেওয়া হয়েছে')}else if(action==='pin'){posts.forEach(x=>x.pinned=false);p.pinned=true;saveProfile();renderContent();toast('প্রোফাইলে পিন করা হয়েছে')}else if(action==='save'){safeSet(`bd_saved_${current.id}_${id}`,true);toast('সংরক্ষিত হয়েছে')}else if(action==='copy'){navigator.clipboard?.writeText(location.href.split('#')[0]+'#'+id);toast('লিংক কপি হয়েছে')}else if(action==='edit'){const title=$('.post-title-btn',card),body=$('.post-body',card);title.contentEditable='true';body.contentEditable='true';title.focus();toast('শিরোনাম ও লেখা সম্পাদনা করে বাইরে ট্যাপ করুন');const save=()=>{p.title=title.textContent.trim();p.body=body.textContent.trim();title.contentEditable=body.contentEditable='false';saveProfile();logActivity('একটি পোস্ট সম্পাদনা করেছেন')};card.addEventListener('focusout',()=>setTimeout(save,30),{once:true})}else if(action==='hide'){safeSet(`bd_hidden_${current.id}_${id}`,true);renderContent();toast('পোস্ট লুকানো হয়েছে')}else if(action==='report'){toast('রিপোর্ট পর্যালোচনার জন্য পাঠানো হয়েছে')}else if(action==='block'){toast('ব্যবহারকারী Block তালিকায় যোগ হয়েছে')}else if(action==='follow'){$('[data-follow]')?.click()}else toast('সেটিং সংরক্ষণ করা হয়েছে')}
function bindEvents(){
 D.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}
  const jump=e.target.closest('[data-tab-jump]');if(jump){switchTab(jump.dataset.tabJump);return}
  if(e.target.closest('#leftEdge')){openDrawer('left');return}if(e.target.closest('#rightEdge')){openDrawer('right');return}if(e.target.closest('[data-close-drawer]')||e.target=== $('#scrim')){closeDrawers();return}
  const more=e.target.closest('[data-profile-more]');if(more){$('#profileDropdown')?.classList.toggle('hidden');return}
  if(e.target.closest('[data-open-settings]')){if(!isOwner){toast('Settings শুধু প্রোফাইল মালিকের জন্য');return}openPanel('Settings',settingsPanel());return}
  if(e.target.closest('[data-open-activity]')){if(!isOwner){toast('Activity log গোপন');return}openPanel('Activity log',activityPanel());return}
  if(e.target.closest('[data-open-saved]')){if(!isOwner){toast('Saved posts গোপন');return}openPanel('Saved posts',simplePanel('Saved posts'));return}
  if(e.target.closest('[data-open-memories]')){openPanel('Memories',simplePanel('Memories'));return}
  if(e.target.closest('[data-open-archive]')){if(!isOwner){toast('Archive গোপন');return}openPanel('Archive',simplePanel('Archive'));return}
  if(e.target.closest('[data-open-story]')){openPanel('Story Touch',storyPanel(),'left');return}
  const story=e.target.closest('[data-story]');if(story){openStory(story.dataset.story);return}
  if(e.target.closest('[data-close-layer]')){closeLayer();return}
  if(e.target.closest('#coverEditBtn')){openEditor('cover');return}if(e.target.closest('#avatarEditBtn')){openEditor('avatar');return}
  const v=e.target.closest('[data-view-photo]');if(v){openViewer(v.dataset.viewPhoto,v.dataset.caption);return}
  const follow=e.target.closest('[data-follow]');if(follow){const k=relationshipKey(current.id,target.id),on=!follows(current.id,target.id);safeSet(k,on);renderActions();toast(on?(follows(target.id,current.id)?'আপনারা এখন বন্ধু':'Following হয়েছে'):'Unfollow করা হয়েছে');return}
  if(e.target.closest('[data-share-profile]')){navigator.share?.({title:profile.name,url:location.href})||navigator.clipboard?.writeText(location.href);toast('প্রোফাইল লিংক শেয়ার করা হয়েছে');return}
  if(e.target.closest('[data-profile-edit]')){openPanel('প্রোফাইল সম্পাদনা',`<div class="settings-group glass"><div class="setting-row"><label>নাম</label><input id="nameSetting" value="${escapeHTML(profile.name)}" style="width:58%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:16px"></div><div class="setting-row"><label>Username</label><input id="usernameSetting" value="${escapeHTML(profile.username)}" style="width:58%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:16px"></div><button class="profile-action primary" data-save-profile-info>সংরক্ষণ করুন</button></div>`);return}
  if(e.target.closest('[data-view-as]')){location.href=location.pathname+'?view=visitor';return}
  const dots=e.target.closest('[data-post-dots]');if(dots){$$('[data-post-menu]').forEach(x=>{if(x!==dots.nextElementSibling)x.classList.add('hidden')});dots.nextElementSibling.classList.toggle('hidden');return}
  const action=e.target.closest('[data-menu-action]');if(action){handleMenuAction(action.dataset.menuAction,action.closest('.post-card'));action.closest('[data-post-menu]')?.classList.add('hidden');return}
  const expand=e.target.closest('[data-expand]');if(expand){const c=expand.closest('.post-card');c.classList.toggle('expanded');$$('[data-expand]',c).forEach(b=>b.textContent=c.classList.contains('expanded')?'কম দেখুন ↑':'আরও দেখুন →');return}
  const card=e.target.closest('.post-card');if(card&&!e.target.closest('button,a,input,textarea,form,.dropdown')){card.classList.toggle('expanded');$$('[data-expand]',card).forEach(b=>b.textContent=card.classList.contains('expanded')?'কম দেখুন ↑':'আরও দেখুন →');return}
  const comment=e.target.closest('[data-comment]');if(comment){$('.comments',comment.closest('.post-card')).classList.toggle('hidden');return}
  const save=e.target.closest('[data-save]');if(save){const c=save.closest('.post-card'),id=c.dataset.postId,on=!safeGet(`bd_saved_${current.id}_${id}`,false);safeSet(`bd_saved_${current.id}_${id}`,on);save.classList.toggle('active',on);save.innerHTML=`${on?'▣':'▱'} <span>সেভ</span>`;toast(on?'সংরক্ষিত হয়েছে':'সংরক্ষণ সরানো হয়েছে');return}
  const share=e.target.closest('[data-share]');if(share){const id=share.closest('.post-card').dataset.postId,url=location.href.split('#')[0]+'#'+id;navigator.share?.({title:'ভুবনডাঙ্গার কবিতা',url})||navigator.clipboard?.writeText(url);toast('লিংক শেয়ার করা হয়েছে');return}
  const react=e.target.closest('[data-react]');if(react){const wrap=react.closest('.reaction-wrap'),picker=$('.reaction-picker',wrap);if(react.dataset.long==='1'){delete react.dataset.long;return}const id=react.closest('.post-card').dataset.postId;safeSet(`bd_reaction_${current.id}_${id}`,'👍');renderContent();return}
  const r=e.target.closest('[data-reaction]');if(r){const card=r.closest('.post-card'),id=card.dataset.postId;safeSet(`bd_reaction_${current.id}_${id}`,r.dataset.reaction);renderContent();return}
  const original=e.target.closest('[data-open-original]');if(original){closeDrawers(true);openOriginal(original.dataset.openOriginal);return}
  if(e.target.closest('[data-load-more]')){renderedCount=Math.min(45,renderedCount+10);renderContent();return}
  if(e.target.closest('[data-open-composer]')){const f=$('#composerForm');f.classList.remove('hidden');const type=e.target.closest('[data-type]')?.dataset.type;if(type)$('select',f).value=type==='ছবি'?'সাধারণ প্রকাশনা':type;return}
  if(e.target.closest('#mediaChoose')){$('#mediaInput')?.click();return}
  if(e.target.closest('[data-save-profile-info]')){profile.name=$('#nameSetting').value.trim()||profile.name;profile.username=$('#usernameSetting').value.trim()||profile.username;saveProfile();location.reload();return}
  if(e.target.closest('[data-toggle-dark]')){settings.dark=!settings.dark;safeSet(`bd_settings_${target.id}`,settings);D.body.classList.toggle('dark',settings.dark);e.target.closest('.toggle').classList.toggle('on',settings.dark);return}
  if(e.target.closest('[data-editor-reset]')){$('#zoomRange').value=1;$('#xRange').value=0;$('#yRange').value=0;updateEditorTransform();return}
  if(e.target.closest('[data-editor-save]')){const cap=$('#captionInput').value.trim(),z=$('#zoomRange').value,x=$('#xRange').value,y=$('#yRange').value;if(editorMode==='avatar'){profile.avatar=editorData;profile.avatarPos=`calc(50% + ${x}px) calc(50% + ${y}px)`}else{profile.cover=editorData;profile.coverPos=`calc(50% + ${x}px) calc(50% + ${y}px)`}const post={id:uid('photo'),authorId:target.id,authorName:profile.name,authorUsername:profile.username,authorRole:profile.role,title:editorMode==='avatar'?'প্রোফাইল ছবি পরিবর্তন করেছেন':'কভার ছবি পরিবর্তন করেছেন',category:'আপডেট',body:cap||'',createdAt:new Date().toISOString(),reactions:0,comments:0,shares:0,media:editorData};posts.unshift(post);saveProfile();logActivity(post.title);closeLayer(true);setIdentity();renderContent();toast('ছবি সংরক্ষিত এবং পোস্ট হয়েছে');return}
 });
 D.addEventListener('change',e=>{if(e.target.matches('[data-setting]')){settings[e.target.dataset.setting]=e.target.value;safeSet(`bd_settings_${target.id}`,settings);toast('Privacy সংরক্ষিত হয়েছে')}if(e.target.id==='mediaInput'&&e.target.files[0]){const f=e.target.files[0],r=new FileReader();r.onload=()=>{e.target.dataset.data=r.result;$('#attachmentPreview').innerHTML=f.type.startsWith('image/')?`<img src="${r.result}" alt="Preview">`:f.type.startsWith('video/')?`<video src="${r.result}" controls></video>`:`<audio src="${r.result}" controls></audio>`};r.readAsDataURL(f)}if(e.target.id==='editorFile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{editorData=r.result;$('#editorImage').src=editorData};r.readAsDataURL(e.target.files[0])}})
 D.addEventListener('input',e=>{if(['zoomRange','xRange','yRange'].includes(e.target.id))updateEditorTransform();if(e.target.matches('[data-archive-search]')){const q=e.target.value.trim().toLowerCase();$$('.archive-row').forEach(r=>r.classList.toggle('hidden',!r.innerText.toLowerCase().includes(q)))}})
 D.addEventListener('submit',e=>{if(e.target.matches('.comment-form')){e.preventDefault();const card=e.target.closest('.post-card'),id=card.dataset.postId,input=$('input',e.target),arr=safeGet(`bd_comments_${id}`,[]);arr.push({id:uid('c'),authorId:current.id,authorName:current.name||current.username,text:input.value.trim(),date:new Date().toISOString()});safeSet(`bd_comments_${id}`,arr);renderContent();setTimeout(()=>{$(`[data-post-id="${CSS.escape(id)}"] .comments`)?.classList.remove('hidden')},40);return}if(e.target.id==='composerForm'){e.preventDefault();const fd=new FormData(e.target),media=$('#mediaInput')?.dataset.data||null;const p={id:uid('post'),authorId:target.id,authorName:profile.name,authorUsername:profile.username,authorRole:profile.role,title:fd.get('title'),category:fd.get('category'),body:fd.get('body'),createdAt:new Date().toISOString(),reactions:0,comments:0,shares:0,media};posts.unshift(p);saveProfile();logActivity('নতুন '+p.category+' প্রকাশ করেছেন');renderContent();toast('পোস্ট প্রকাশিত হয়েছে')}})
 D.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-react]');if(!b)return;clearTimeout(b._t);b._t=setTimeout(()=>{b.dataset.long='1';$('.reaction-picker',b.closest('.reaction-wrap')).classList.remove('hidden')},520)});D.addEventListener('pointerup',e=>{const b=e.target.closest('[data-react]');if(b)clearTimeout(b._t)});
 $('#bioBox').addEventListener('dblclick',editBio);let tap=0;$('#bioBox').addEventListener('touchend',()=>{const n=Date.now();if(n-tap<350)editBio();tap=n});

}
function updateEditorTransform(){const img=$('#editorImage');if(!img)return;img.style.setProperty('--zoom',$('#zoomRange').value);img.style.setProperty('--tx',$('#xRange').value+'px');img.style.setProperty('--ty',$('#yRange').value+'px')}
