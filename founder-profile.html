<style id="bdx-universal-sidebar-theme-v13">
/* =========================================================
   BHUBONDANGA UNIVERSAL SIDEBAR + FOUR THEME SYSTEM v13
   Same shell on every public/profile/category page.
   Existing page content is preserved.
   ========================================================= */
:root{
  --bdx-rail-width:clamp(185px,17vw,238px);
  --bdx-rail-top:150px;
  --bdx-primary:var(--primary,#688bf0);
  --bdx-violet:var(--violet,#8f75ec);
  --bdx-green:var(--green,#4f987d);
  --bdx-text:var(--text,#173052);
  --bdx-soft:var(--soft,#687995);
  --bdx-line:var(--line,rgba(102,126,170,.18));
  --bdx-surface:var(--surface2,rgba(255,255,255,.92));
  --bdx-page:var(--page,#eef3fa);
  --bdx-shadow:var(--shadow,0 14px 38px rgba(74,85,151,.11));
}

/* Four approved visual identities. */
html[data-bdx-palette="pearl"]{
  --primary:#688bf0!important;--violet:#8f75ec!important;--green:#4f987d!important;
  --bdx-primary:#688bf0;--bdx-violet:#8f75ec;--bdx-green:#4f987d;
}
html[data-bdx-palette="moon"]{
  --primary:#438fdf!important;--violet:#6776df!important;--green:#4597a0!important;
  --bdx-primary:#438fdf;--bdx-violet:#6776df;--bdx-green:#4597a0;
  --bg:radial-gradient(circle at 8% 0,rgba(85,171,234,.18),transparent 28%),radial-gradient(circle at 96% 5%,rgba(95,116,224,.14),transparent 29%),linear-gradient(155deg,#f7fcff,#e7f1fb 56%,#edf0fc)!important;
}
html[data-bdx-palette="lavender"]{
  --primary:#846fe1!important;--violet:#b079db!important;--green:#6e8db4!important;
  --bdx-primary:#846fe1;--bdx-violet:#b079db;--bdx-green:#6e8db4;
  --bg:radial-gradient(circle at 8% 0,rgba(164,126,229,.18),transparent 28%),radial-gradient(circle at 96% 5%,rgba(215,141,214,.14),transparent 29%),linear-gradient(155deg,#fdfaff,#eee8fa 56%,#f6edf9)!important;
}
html[data-bdx-palette="rose"]{
  --primary:#d06ea9!important;--violet:#9778e4!important;--green:#5697a1!important;
  --bdx-primary:#d06ea9;--bdx-violet:#9778e4;--bdx-green:#5697a1;
  --bg:radial-gradient(circle at 8% 0,rgba(236,119,173,.17),transparent 28%),radial-gradient(circle at 96% 5%,rgba(161,119,229,.15),transparent 29%),linear-gradient(155deg,#fff9fc,#f4eaf5 56%,#edf5fa)!important;
}

/* Middle mode works even on older pages that only had light/dark. */
html[data-theme="middle"],html[data-mode="middle"]{
  --page:#dce5f1!important;
  --surface:rgba(239,245,252,.83)!important;
  --surface2:rgba(248,251,255,.95)!important;
  --text:#18304f!important;
  --soft:#5d708d!important;
}

/* Disable the old theme launchers/panels that caused page click-lock. */
#themeToggle,
[data-theme-switch],
[data-drawer-theme],
[data-repair-theme],
[data-theme-trigger],
[data-theme]:not(html),
.theme-switch-row,
.unified-theme-launch,
#themePanel,#themeModal,#themeSheet,#unifiedThemePanel,
.theme-modal,.theme-sheet,.unified-theme-panel,.unified-theme-backdrop{
  display:none!important;
}

/* Hide previous duplicated navigation rails and drawers. */
body > .edge,
body > button.edge,
body > .edge-menu,
#leftDrawer,#rightDrawer,#mobileDrawer,#rightMobileDrawer,
#leftSidebar,#rightSidebar,
main.layout > .left-col,main.layout > .right-col,
main.layout > aside.sidebar,
.layout > .left-col,.layout > .right-col{
  display:none!important;
}

/* Use the complete central content area between the two new rails. */
@media (min-width:900px){
  body > main,
  body > main.layout,
  body > .layout,
  body > .page-shell,
  body > .main-shell,
  body > .content-shell{
    width:min(980px,calc(100vw - (var(--bdx-rail-width) * 2) - 42px))!important;
    max-width:calc(100vw - (var(--bdx-rail-width) * 2) - 42px)!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }
  body > main.layout,
  body > .layout{
    display:block!important;
    grid-template-columns:none!important;
  }
  body > main.layout > .center,
  body > main.layout > .center-col,
  body > .layout > .center,
  body > .layout > .center-col{
    display:block!important;
    width:100%!important;
    max-width:none!important;
    min-width:0!important;
    margin:0!important;
  }
}
@media (max-width:899px){
  body > main,
  body > main.layout,
  body > .layout,
  body > .page-shell,
  body > .main-shell,
  body > .content-shell{
    width:100%!important;
    max-width:100%!important;
    margin-left:auto!important;
    margin-right:auto!important;
  }
}

/* Universal fixed desktop rails. */
.bdx-rail{
  position:fixed;
  top:var(--bdx-rail-top);
  bottom:12px;
  z-index:920;
  width:var(--bdx-rail-width);
  padding:0 2px 3px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}
.bdx-rail::-webkit-scrollbar,.bdx-drawer::-webkit-scrollbar{display:none}
.bdx-rail-left{left:10px}
.bdx-rail-right{right:10px}

.bdx-card{
  margin-bottom:8px;
  padding:8px;
  border:1px solid var(--bdx-line);
  border-radius:15px;
  background:color-mix(in srgb,var(--bdx-surface) 88%,transparent);
  box-shadow:var(--bdx-shadow);
  backdrop-filter:blur(22px) saturate(135%);
  -webkit-backdrop-filter:blur(22px) saturate(135%);
  color:var(--bdx-text);
}
.bdx-identity{text-align:center;padding:10px 8px}
.bdx-logo{font:29px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.bdx-identity h2{margin:4px 0 2px;color:var(--bdx-primary);font-size:15px}
.bdx-identity p{color:var(--bdx-soft);font-size:7.5px}
.bdx-quote{margin-top:7px;padding:7px 6px;border-left:3px solid var(--bdx-primary);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--bdx-primary) 8%,transparent);color:var(--bdx-soft);font-size:7.5px}

.bdx-nav{display:grid;gap:3px}
.bdx-nav a,.bdx-profile-link,.bdx-quick-link,.bdx-action-link,.bdx-mode{
  min-height:35px;
  padding:5px 7px;
  border:1px solid color-mix(in srgb,var(--bdx-line) 76%,transparent);
  border-radius:9px;
  display:grid;
  grid-template-columns:25px minmax(0,1fr) auto;
  gap:6px;
  align-items:center;
  background:color-mix(in srgb,var(--bdx-surface) 66%,transparent);

}
.bdx-nav a:hover,.bdx-nav a[aria-current="page"],.bdx-profile-link:hover,.bdx-quick-link:hover{
  color:var(--bdx-primary);
  border-color:var(--bdx-line);
  background:color-mix(in srgb,var(--bdx-primary) 9%,transparent);
}
.bdx-icon{
  width:25px;height:25px;border:1px solid var(--bdx-line);border-radius:8px;
  display:grid;place-items:center;background:var(--bdx-surface);font:15px/1 system-ui;
}
.bdx-card h3{margin:0 0 6px;font-size:11px}
.bdx-card-title{display:flex;align-items:center;justify-content:space-between;gap:6px}

.bdx-theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bdx-theme{
  min-height:46px;
  padding:5px 4px;
  border:1px solid var(--bdx-line);
  border-radius:10px;
  background:var(--bdx-surface);
  color:var(--bdx-text);
  font-size:7.4px;
  font-weight:800;
}
.bdx-theme[aria-pressed="true"]{outline:2px solid var(--bdx-primary);outline-offset:-2px}
.bdx-swatch{display:block;width:100%;height:17px;margin-bottom:4px;border-radius:6px}
.bdx-theme[data-bdx-style="pearl"] .bdx-swatch{background:linear-gradient(135deg,#d8e7ff,#d8c8fa,#dcf4ed)}
.bdx-theme[data-bdx-style="moon"] .bdx-swatch{background:linear-gradient(135deg,#68b5ff,#6b7be3)}
.bdx-theme[data-bdx-style="lavender"] .bdx-swatch{background:linear-gradient(135deg,#aa8bea,#d99bdd)}
.bdx-theme[data-bdx-style="rose"] .bdx-swatch{background:linear-gradient(135deg,#f28db7,#a686eb)}
.bdx-mode{width:100%;margin-top:6px;grid-template-columns:25px 1fr auto;text-align:left}

.bdx-account{text-align:center}
.bdx-account-avatar{
  width:48px;height:48px;margin:0 auto 5px;border:1px solid var(--bdx-line);border-radius:50%;
  display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--bdx-primary),var(--bdx-violet));color:#fff;font:20px/1 system-ui;
}
.bdx-account-avatar img{width:100%;height:100%;object-fit:cover}
.bdx-account strong{display:block;font-size:10px}
.bdx-account p{margin:2px 0 7px;color:var(--bdx-soft);font-size:7.5px}
.bdx-account-buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bdx-account-buttons a,.bdx-account-buttons button{
  min-height:32px;border:1px solid var(--bdx-line);border-radius:9px;display:grid;place-items:center;
  background:var(--bdx-surface);color:var(--bdx-primary);font-size:8px;font-weight:800;text-decoration:none!important;
}
.bdx-account-buttons .primary{border:0;background:linear-gradient(135deg,var(--bdx-primary),var(--bdx-violet));color:#fff}
.bdx-account-buttons .wide{grid-column:1/-1}

.bdx-contact{
  display:block;padding:7px;border-left:3px solid var(--bdx-green);border-radius:0 8px 8px 0;
  background:color-mix(in srgb,var(--bdx-green) 8%,transparent);color:var(--bdx-soft)!important;
  text-decoration:none!important;font-size:7.4px;font-weight:700;
}
.bdx-note{margin-top:6px;color:var(--bdx-soft);font-size:7.3px}

/* Mobile drawers use the exact same content. */
.bdx-edge{
  position:fixed;top:61%;z-index:1450;width:31px;height:76px;border:1px solid var(--bdx-line);
  display:none;place-items:center;background:linear-gradient(180deg,var(--bdx-surface),color-mix(in srgb,var(--bdx-violet) 45%,var(--bdx-surface)));
  color:var(--bdx-primary);box-shadow:var(--bdx-shadow);font-size:16px;
}
.bdx-edge-left{left:0;border-left:0;border-radius:0 12px 12px 0}
.bdx-edge-right{right:0;border-right:0;border-radius:12px 0 0 12px}
.bdx-overlay{
  position:fixed;inset:0;z-index:2100;display:none;background:rgba(4,13,29,.52);backdrop-filter:blur(3px)
}
.bdx-overlay.show{display:block}
.bdx-drawer{
  position:fixed;top:0;bottom:0;z-index:2110;width:min(350px,89vw);padding:9px;overflow:auto;
  background:var(--bdx-page);transition:transform .23s ease;box-shadow:0 20px 70px rgba(0,0,0,.26)
}
.bdx-drawer-left{left:0;transform:translateX(-104%)}
.bdx-drawer-right{right:0;transform:translateX(104%)}
.bdx-drawer.open{transform:none}
.bdx-drawer-head{position:sticky;top:-9px;z-index:2;margin:-9px -9px 7px;padding:10px;display:flex;align-items:center;justify-content:space-between;background:var(--bdx-page);border-bottom:1px solid var(--bdx-line)}
.bdx-drawer-head strong{font-size:14px}
.bdx-close{width:35px;height:35px;border:1px solid var(--bdx-line);border-radius:50%;display:grid;place-items:center;background:var(--bdx-surface);color:var(--bdx-text);font-size:20px}
body.bdx-drawer-lock{overflow:hidden!important}

@media(max-width:899px){
  .bdx-rail{display:none}

}
@media(min-width:900px){

}
@media(max-width:420px){
  .bdx-edge{width:27px;height:68px}
}

function toBnDateNumber(value){
  const map=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(value).replace(/\d/g,d=>map[Number(d)]);
}
function dhakaCalendarParts(date){
  const shifted=new Date(date.getTime()+21600000);
  return{
    year:shifted.getUTCFullYear(),
    month:shifted.getUTCMonth()+1,
    day:shifted.getUTCDate(),
    weekday:shifted.getUTCDay(),
    hour:shifted.getUTCHours()
  };
}
function banglaCalendarDate(date){
  const p=dhakaCalendarParts(date);
  const current=Date.UTC(p.year,p.month-1,p.day);
  const thisStart=Date.UTC(p.year,3,14);
  let startYear,banglaYear;
  if(current>=thisStart){startYear=p.year;banglaYear=p.year-593}
  else{startYear=p.year-1;banglaYear=p.year-594}
  let elapsed=Math.floor((current-Date.UTC(startYear,3,14))/86400000);
  const names=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
  const leap=(startYear+1)%400===0||((startYear+1)%4===0&&(startYear+1)%100!==0);
  const lengths=[31,31,31,31,31,31,30,30,30,30,leap?30:29,30];
  let month=0;
  while(month<11&&elapsed>=lengths[month]){elapsed-=lengths[month];month++}
  return toBnDateNumber(elapsed+1)+' '+names[month]+' '+toBnDateNumber(banglaYear)+' বঙ্গাব্দ';
}
function fallbackIslamicParts(date){
  const p=dhakaCalendarParts(date);
  let y=p.year,m=p.month,d=p.day;
  if(m<=2){y-=1;m+=12}
  const a=Math.floor(y/100);
  const b=2-a+Math.floor(a/4);
  let jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5;
  jd+=2;
  const islamicToJD=(iy,im,id)=>id+Math.ceil(29.5*(im-1))+(iy-1)*354+Math.floor((3+11*iy)/30)+1948439.5-1;
  jd=Math.floor(jd)+0.5;
  const iy=Math.floor((30*(jd-1948439.5)+10646)/10631);
  const im=Math.min(12,Math.ceil((jd-(29+islamicToJD(iy,1,1)))/29.5)+1);
  const id=Math.floor(jd-islamicToJD(iy,im,1)+1);
  return{year:iy,month:im,day:id};
}
function samsungSafeHijriParts(date){
  try{
    const fmt=new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura-nu-latn',{
      timeZone:'Asia/Dhaka',day:'numeric',month:'numeric',year:'numeric'
    });
    let out={};
    if(typeof fmt.formatToParts==='function'){
      fmt.formatToParts(date).forEach(part=>{
        if(part.type==='day'||part.type==='month'||part.type==='year'){
          out[part.type]=Number(String(part.value).replace(/\D/g,''));
        }
      });
    }else{
      const nums=fmt.format(date).match(/\d+/g)||[];
      out={month:Number(nums[0]),day:Number(nums[1]),year:Number(nums[2])};
    }
    if(out.year>=1300&&out.year<=1600&&out.month>=1&&out.month<=12&&out.day>=1&&out.day<=30)return out;
  }catch(e){}
  return fallbackIslamicParts(date);
}
function hijriCalendarDate(date){
  const p=samsungSafeHijriParts(date);
  const names=['মহররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
  return toBnDateNumber(p.day)+' '+names[p.month-1]+' '+toBnDateNumber(p.year)+' হিজরি';
}
function gregorianCalendarDate(date){
  const p=dhakaCalendarParts(date);
  const names=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  return toBnDateNumber(p.day)+' '+names[p.month-1]+' '+toBnDateNumber(p.year)+' খ্রিস্টাব্দ';
}
function weekdayCalendarName(date){
  return ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'][dhakaCalendarParts(date).weekday];
}

(function renderUniversalProfileDates(){

    document.querySelectorAll('.hijri').forEach(x=>x.textContent=hijriCalendarDate(now));

})();

function compress(file,maxW=1200,q=.82){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{let w=im.width,h=im.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',q))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function choose(kind){const inp=$('#imageInput');inp.dataset.kind=kind;inp.click()}
$('#imageInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const kind=e.target.dataset.kind;try{const data=await compress(f,kind==='cover'?1600:700,.84);localStorage.setItem(CONFIG.storagePrefix+(kind==='cover'?'Cover':'Avatar'),data);profileData[kind]=data;renderProfile();toast('ছবি পরিবর্তন হয়েছে')}catch(err){toast('ছবি পরিবর্তন করা যায়নি')}e.target.value=''});
function editBio(){if(!isOwner)return;const next=prompt('আপনার বায়ো লিখুন',profileData.bio);if(next!==null&&next.trim()){profileData.bio=next.trim();localStorage.setItem(CONFIG.storagePrefix+'Bio',profileData.bio);renderProfile();toast('বায়ো সংরক্ষিত হয়েছে')}}

 let arr=[['🖋️','কবিতা'],['☁️','ছোট কথার প্রলাপ'],['🎙️','আবৃত্তি'],['🌱','পরিবেশের কথা'],['✉️','চিঠিপত্র'],['🧸','শিশুতোষ']];
 if(CONFIG.role==='founder')arr.push(['☾','মধ্যরাতের প্রলাপ'],['🎵','গান']);
 $('#composerChoices').innerHTML=arr.map(x=>`<button class="compose-type"><span>${x[0]}</span><span>${x[1]}</span></button>`).join('');
}
document.addEventListener('click',async e=>{
 const c=e.target.closest('[data-comment]');if(c){c.closest('.post').querySelector('.comments').classList.toggle('open');return}
 const m=e.target.closest('[data-post-menu]');if(m){postMenu(m.dataset.postMenu);return}
 if(e.target.closest('[data-profile-menu]')){profileMenu();return}
 if(e.target.closest('#avatarWrap')){avatarMenu();return}
 if(e.target.closest('#coverEdit')||e.target.closest('#cover')){if(!e.target.closest('.profile-panel'))coverMenu();return}
 if(e.target.closest('#profileBio')){editBio();return}
 const tab=e.target.closest('[data-tab]');if(tab){visibleCount=20;renderContent(tab.dataset.tab);return}
 if(e.target.closest('[data-more-tabs]')){openSheet('আরও বিভাগ',CONFIG.moreTabs.map(x=>({label:x[1],action:'tab:'+x[0],icon:'i-bookmark'})));return}
 if(e.target.closest('[data-load-more]')){visibleCount+=20;renderContent(activeTab);toast('আরও লেখা দেখানো হয়েছে');return}
 if(e.target.closest('#composerPrompt')){$('#composerChoices').hidden=!$('#composerChoices').hidden;return}
 if(e.target.closest('[data-open-left]')){$('#leftDrawer').classList.add('open');$('#backdrop').classList.add('show');document.body.classList.add('locked');return}
 if(e.target.closest('[data-open-right]')){$('#rightDrawer').classList.add('open');$('#backdrop').classList.add('show');document.body.classList.add('locked');return}
 if(e.target.closest('[data-close]')||e.target=== $('#backdrop')){closeAll();return}
 if(e.target.closest('[data-theme-trigger]')){theme();return}
 if(e.target.closest('[data-logout]')){logout();return}
 if(e.target.closest('[data-message]')){location.href=logged()?'messages.html':'login.html';return}
 if(e.target.closest('[data-follow]')){if(!logged())location.href='login.html';else toast('ফলো অবস্থা পরিবর্তন হয়েছে');return}
 const act=e.target.closest('[data-sheet-action]')?.dataset.sheetAction;if(!act)return;
 if(act.startsWith('tab:')){closeAll();renderContent(act.split(':')[1]);return}
 if(act==='theme'){theme();return}if(act==='logout'){logout();return}
 if(act==='change-avatar'){closeAll();choose('avatar');return}if(act==='change-cover'){closeAll();choose('cover');return}
 if(act==='copy-profile'||act==='copy-post'){await navigator.clipboard?.writeText(location.href);toast('লিঙ্ক কপি হয়েছে');closeAll();return}
 if(act==='share-profile'){if(navigator.share)navigator.share({title:profileData.name,url:location.href});else await navigator.clipboard?.writeText(location.href);closeAll();return}
 if(act==='view-as'){location.href=location.pathname+'?view=visitor';return}
 toast('অপশনটি নির্বাচন করা হয়েছে');closeAll();
});
document.addEventListener('submit',e=>{const f=e.target.closest('.comment-form');if(!f)return;e.preventDefault();if(!logged()){location.href='login.html';return}const ta=f.querySelector('textarea'),v=ta.value.trim();if(!v)return;const item=document.createElement('div');item.className='comment';item.innerHTML=`<a href="profile.html">${esc(session.user.user_metadata?.full_name||'আপনি')}</a> — ${esc(v)}`;f.previousElementSibling.appendChild(item);ta.value='';toast('মন্তব্য যোগ হয়েছে')});
async function init(){
 const theme=localStorage.getItem('bhubondangaTheme');if(theme)document.documentElement.dataset.theme=theme;
 if(localStorage.getItem(CONFIG.storagePrefix+'Bio'))profileData.bio=localStorage.getItem(CONFIG.storagePrefix+'Bio');
 if(client){try{session=(await client.auth.getSession()).data?.session||null;if(session){userRole=session.user.app_metadata?.role||session.user.user_metadata?.role||'user';try{const r=await client.from('user_roles').select('role,active').eq('user_id',session.user.id).eq('active',true).maybeSingle();if(r.data?.role)userRole=r.data.role}catch(e){}}client.auth.onAuthStateChange((_e,s)=>{session=s;initRender()})}catch(e){}}
 initRender();
}
function initRender(){
 const q=new URLSearchParams(location.search),target=q.get('user');
 isOwner=logged()&&q.get('view')!=='visitor'&&(!target||target==='me'||target===session.user.id);
 if(CONFIG.role==='founder')isOwner=isOwner&&userRole==='founder';
 if(CONFIG.role==='admin')isOwner=isOwner&&['admin','founder'].includes(userRole);
 renderSidebars();renderQuick();renderProfile();tabs();composerTypes();renderContent('home');
}
init();
})();

</script>

<script id="bdx-universal-sidebar-theme-script-v13">
(function(){
'use strict';
const D=document,H=D.documentElement;
const $=(s,r=D)=>r.querySelector(s);
const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch(e){return f}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const user=read('bhubondangaCurrentUser',read('bhubondangaSessionUser',null));
const logged=Boolean(user&&(user.name||user.displayName||user.username||user.email));
const role=String(user?.role||user?.app_metadata?.role||'user').toLowerCase();
const currentFile=(location.pathname.split('/').pop()||'index.html').toLowerCase();

const NAV=[
 ['index.html','⌂','হোম'],
 ['poem.html','🖋','কবিতা'],
 ['recitation.html','🎙','আবৃত্তি'],
 ['madhyorater-prolap.html','☾','মধ্যরাতের প্রলাপ'],
 ['environment.html','🌱','পরিবেশের কথা'],
 ['letter.html','✉','চিঠিপত্র'],
 ['small-prolap.html','☁','ছোট কথার প্রলাপ'],
 ['discussion.html','◌','সাহিত্য আলোচনা'],
 ['famous-poet.html','♙','খ্যাতিমান কবি'],
 ['famous-quotes.html','❝','মনীষীদের বাণী'],
 ['humanitarian-notice.html','♡','মানবিক আবেদন']
];

const THEMES=[
 ['pearl','মুক্তা গ্লাস'],
 ['moon','নীল জ্যোৎস্না'],
 ['lavender','ল্যাভেন্ডার'],
 ['rose','অরোরা গোলাপি']
];

function normalizeFile(href){return String(href).split('?')[0].split('#')[0].toLowerCase()}
function navHtml(){
 return '<nav class="bdx-nav">'+NAV.map(([href,icon,label])=>
  '<a href="'+href+'" '+(normalizeFile(href)===currentFile?'aria-current="page"':'')+'>'+
  '<span class="bdx-icon">'+icon+'</span><span>'+label+'</span><span>›</span></a>'
 ).join('')+'</nav>';
}
function identityHtml(){
 return '<section class="bdx-card bdx-identity"><div class="bdx-logo">🌿</div><h2><a href="index.html">আপন ভুবন</a></h2>'+
 '<p>আপনার লেখা, পাঠ ও সাহিত্যিক পথচলার নিজস্ব জায়গা।</p>'+
 '<div class="bdx-quote">“আপনার ক্ষতগুলোকে জ্ঞানে পরিণত করুন।”</div></section>';
}
function themeHtml(){
 const palette=localStorage.getItem('bhubondangaGlassTheme')||localStorage.getItem('bhubondangaStyle')||'pearl';
 const mode=localStorage.getItem('bhubondangaThemeMode')||localStorage.getItem('bhubondangaTheme')||H.dataset.theme||'light';
 const modeLabel=mode==='dark'?'ডার্ক':mode==='middle'?'মিডল':'লাইট';
 return '<section class="bdx-card"><div class="bdx-card-title"><h3>চারটি থিম</h3><small style="font-size:7px;color:var(--bdx-soft)">সব পেজে একই</small></div>'+
 '<div class="bdx-theme-grid">'+THEMES.map(([key,label])=>
 '<button class="bdx-theme" type="button" data-bdx-style="'+key+'" aria-pressed="'+(palette===key)+'">'+
 '<span class="bdx-swatch"></span>'+label+'</button>').join('')+'</div>'+
 '<button class="bdx-mode" type="button" data-bdx-mode><span class="bdx-icon">◐</span><span>আলো: <b data-bdx-mode-label>'+modeLabel+'</b></span><span>›</span></button></section>';
}
function leftHtml(){
 return identityHtml()+'<section class="bdx-card">'+navHtml()+'</section>'+themeHtml()+
 '<section class="bdx-card"><a class="bdx-contact" href="founder-profile.html">জরুরি প্রয়োজনে মাহমুদ সোহেলের সঙ্গে যোগাযোগ করুন</a><p class="bdx-note">প্রতিষ্ঠাতার প্রোফাইল ও যোগাযোগের মাধ্যম দেখুন।</p></section>';
}
function avatarMarkup(){
 const url=user?.avatar||user?.avatar_url||user?.profileImage||'';
 if(url)return '<img src="'+esc(url)+'" alt="">';
 return '♙';
}
function accountHtml(){
 if(!logged){
  return '<section class="bdx-card bdx-account"><div class="bdx-account-avatar">♙</div><strong>অতিথি পাঠক</strong><p>লেখা প্রকাশ ও প্রতিক্রিয়ার জন্য লগইন করুন</p>'+
  '<div class="bdx-account-buttons"><a class="primary" href="login.html">লগইন</a><a href="register.html">রেজিস্টার</a></div></section>';
 }
 const name=user.name||user.displayName||user.username||user.email||'ভুবনডাঙ্গার সদস্য';
 let profile='profile.html';
 if(role==='founder')profile='founder-profile.html';
 else if(role==='admin')profile='admin-profile.html';
 const dashboard=role==='founder'?'founder-dashboard.html':role==='admin'?'admin-dashboard.html':'';
 return '<section class="bdx-card bdx-account"><div class="bdx-account-avatar">'+avatarMarkup()+'</div><strong>'+esc(name)+'</strong><p>আপনার ব্যক্তিগত ভুবন</p>'+
 '<div class="bdx-account-buttons"><a class="primary" href="'+profile+'">প্রোফাইল</a><a href="edit-profile.html">সম্পাদনা</a>'+
 '<a href="messages.html">ইনবক্স</a><a href="notifications.html">নোটিফিকেশন</a>'+
 (dashboard?'<a class="wide" href="'+dashboard+'">ড্যাশবোর্ড</a>':'')+
 '<button class="wide" type="button" data-bdx-logout>লগআউট</button></div></section>';
}
function profileLinks(){
 const links=[
  ['profile.html','সাধারণ কবি/লেখক প্রোফাইল'],
  ['founder-profile.html','Founder প্রোফাইল'],
  ['admin-profile.html','Admin প্রোফাইল'],
  ['poet-profile.html','খ্যাতিমান কবির প্রোফাইল'],
  ['thinker-profile.html','মনীষীর প্রোফাইল']
 ];
 return '<section class="bdx-card"><h3>প্রোফাইলসমূহ</h3><div class="bdx-nav">'+links.map(([h,t])=>
 '<a href="'+h+'"><span class="bdx-icon">♙</span><span>'+t+'</span><span>›</span></a>').join('')+'</div></section>';
}
function quickHtml(){
 const links=[
  ['bhubondangar-lekhok.html','ভুবনডাঙ্গার লেখক'],
  ['favorite-authors.html','প্রিয় লেখক'],
  ['messages.html','ইনবক্স'],
  ['notifications.html','নোটিফিকেশন'],
  ['humanitarian-notice.html','যাচাইকৃত মানবিক নোটিস'],
  ['about.html','আমাদের সম্পর্কে'],
  ['contact.html','যোগাযোগ'],
  ['complaint.html','অভিযোগ করুন'],
  ['policy.html','নীতিমালা']
 ];
 return '<section class="bdx-card"><h3>দ্রুত দেখুন</h3><div class="bdx-nav">'+links.map(([h,t])=>
 '<a href="'+h+'"><span class="bdx-icon">•</span><span>'+t+'</span><span>›</span></a>').join('')+'</div></section>';
}
function rightHtml(){
 return accountHtml()+profileLinks()+quickHtml()+themeHtml()+
 '<section class="bdx-card"><p class="bdx-note">সাধারণ সাহিত্যিক লেখা সংশ্লিষ্ট category newsfeed-এ প্রকাশিত হবে। মানবিক আবেদন যাচাইয়ের পর অগ্রাধিকার পাবে।</p></section>';
}
function drawerHead(title){
 return '<div class="bdx-drawer-head"><strong>'+title+'</strong><button class="bdx-close" type="button" data-bdx-close>×</button></div>';
}
function renderShell(){
 const left=leftHtml(),right=rightHtml();
 $('#bdxDesktopLeft').innerHTML=left;
 $('#bdxDesktopRight').innerHTML=right;
 $('#bdxMobileLeft').innerHTML=drawerHead('🌿 আপন ভুবন')+left;
 $('#bdxMobileRight').innerHTML=drawerHead(logged?'আপনার ভুবন':'অতিথি পাঠক')+right;
 syncThemeButtons();
}
function closeDrawers(){
 $('#bdxMobileLeft').classList.remove('open');
 $('#bdxMobileRight').classList.remove('open');
 $('#bdxOverlay').classList.remove('show');
 D.body.classList.remove('bdx-drawer-lock');
}
function openDrawer(side){
 closeDrawers();
 $('#bdxOverlay').classList.add('show');
 $(side==='left'?'#bdxMobileLeft':'#bdxMobileRight').classList.add('open');
 D.body.classList.add('bdx-drawer-lock');
}
function applyPalette(key){
 H.dataset.bdxPalette=key;
 localStorage.setItem('bhubondangaGlassTheme',key);
 localStorage.setItem('bhubondangaStyle',key);
 syncThemeButtons();
}
function applyMode(mode){
 H.dataset.theme=mode;
 H.dataset.mode=mode;
 localStorage.setItem('bhubondangaTheme',mode);
 localStorage.setItem('bhubondangaThemeMode',mode);
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',mode==='dark'?'#071426':'#f7f9ff');
 syncThemeButtons();
}
function syncThemeButtons(){
 const palette=H.dataset.bdxPalette||'pearl';
 document.querySelectorAll('[data-bdx-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bdxStyle===palette)));
 const mode=H.dataset.theme||H.dataset.mode||'light';
 const label=mode==='dark'?'ডার্ক':mode==='middle'?'মিডল':'লাইট';
 document.querySelectorAll('[data-bdx-mode-label]').forEach(x=>x.textContent=label);
}
function cycleMode(){
 const current=H.dataset.theme||H.dataset.mode||'light';
 const list=['light','middle','dark'];
 applyMode(list[(list.indexOf(current)+1)%list.length]);
}
async function logout(){
 try{
  if(window.supabaseClient?.auth)await window.supabaseClient.auth.signOut({scope:'local'});
  else if(window.supabase?.auth)await window.supabase.auth.signOut();
 }catch(e){}
 localStorage.removeItem('bhubondangaCurrentUser');
 localStorage.removeItem('bhubondangaSessionUser');
 location.href='login.html';
}

const initialPalette=localStorage.getItem('bhubondangaGlassTheme')||localStorage.getItem('bhubondangaStyle')||'pearl';
const initialMode=localStorage.getItem('bhubondangaThemeMode')||localStorage.getItem('bhubondangaTheme')||H.dataset.theme||H.dataset.mode||'light';
applyPalette(initialPalette);
applyMode(initialMode);
renderShell();

$('#bdxOpenLeft').addEventListener('click',()=>openDrawer('left'));
$('#bdxOpenRight').addEventListener('click',()=>openDrawer('right'));
$('#bdxOverlay').addEventListener('click',closeDrawers);

$('#bdx-universal-shell-v13').addEventListener('click',function(e){
 const close=e.target.closest('[data-bdx-close]');
 if(close){closeDrawers();return}
 const style=e.target.closest('[data-bdx-style]');
 if(style){e.preventDefault();applyPalette(style.dataset.bdxStyle);return}
 const mode=e.target.closest('[data-bdx-mode]');
 if(mode){e.preventDefault();cycleMode();return}
 const logoutButton=e.target.closest('[data-bdx-logout]');
 if(logoutButton){e.preventDefault();logout();return}
});
D.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()});

/* A safety reset for pages previously left locked by a broken theme modal. */
D.body.classList.remove('theme-open','unified-theme-open');
})();
</script>
