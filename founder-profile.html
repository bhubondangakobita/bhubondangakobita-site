function toBnDateNumber(value){
  const map=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(value).replace(/\d/g,d=>map[Number(d)]);
}
function dhakaCalendarParts(date){
  const shifted=new Date(date.getTime()+21600000);
  return{
    year:shifted.getUTCFullYear(),
    month:shifted.getUTCMonth()+1,
    day:shifted.getUTCDate(),
    weekday:shifted.getUTCDay(),
    hour:shifted.getUTCHours()
  };
}
function banglaCalendarDate(date){
  const p=dhakaCalendarParts(date);
  const current=Date.UTC(p.year,p.month-1,p.day);
  const thisStart=Date.UTC(p.year,3,14);
  let startYear,banglaYear;
  if(current>=thisStart){startYear=p.year;banglaYear=p.year-593}
  else{startYear=p.year-1;banglaYear=p.year-594}
  let elapsed=Math.floor((current-Date.UTC(startYear,3,14))/86400000);
  const names=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
  const leap=(startYear+1)%400===0||((startYear+1)%4===0&&(startYear+1)%100!==0);
  const lengths=[31,31,31,31,31,31,30,30,30,30,leap?30:29,30];
  let month=0;
  while(month<11&&elapsed>=lengths[month]){elapsed-=lengths[month];month++}
  return toBnDateNumber(elapsed+1)+' '+names[month]+' '+toBnDateNumber(banglaYear)+' বঙ্গাব্দ';
}
function fallbackIslamicParts(date){
  const p=dhakaCalendarParts(date);
  let y=p.year,m=p.month,d=p.day;
  if(m<=2){y-=1;m+=12}
  const a=Math.floor(y/100);
  const b=2-a+Math.floor(a/4);
  let jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5;
  jd+=2;
  const islamicToJD=(iy,im,id)=>id+Math.ceil(29.5*(im-1))+(iy-1)*354+Math.floor((3+11*iy)/30)+1948439.5-1;
  jd=Math.floor(jd)+0.5;
  const iy=Math.floor((30*(jd-1948439.5)+10646)/10631);
  const im=Math.min(12,Math.ceil((jd-(29+islamicToJD(iy,1,1)))/29.5)+1);
  const id=Math.floor(jd-islamicToJD(iy,im,1)+1);
  return{year:iy,month:im,day:id};
}
function samsungSafeHijriParts(date){
  try{
    const fmt=new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura-nu-latn',{
      timeZone:'Asia/Dhaka',day:'numeric',month:'numeric',year:'numeric'
    });
    let out={};
    if(typeof fmt.formatToParts==='function'){
      fmt.formatToParts(date).forEach(part=>{
        if(part.type==='day'||part.type==='month'||part.type==='year'){
          out[part.type]=Number(String(part.value).replace(/\D/g,''));
        }
      });
    }else{
      const nums=fmt.format(date).match(/\d+/g)||[];
      out={month:Number(nums[0]),day:Number(nums[1]),year:Number(nums[2])};
    }
    if(out.year>=1300&&out.year<=1600&&out.month>=1&&out.month<=12&&out.day>=1&&out.day<=30)return out;
  }catch(e){}
  return fallbackIslamicParts(date);
}
function hijriCalendarDate(date){
  const p=samsungSafeHijriParts(date);
  const names=['মহররম','সফর','রবিউল আউয়াল','রবিউস সানি','জমাদিউল আউয়াল','জমাদিউস সানি','রজব','শাবান','রমজান','শাওয়াল','জিলকদ','জিলহজ'];
  return toBnDateNumber(p.day)+' '+names[p.month-1]+' '+toBnDateNumber(p.year)+' হিজরি';
}
function gregorianCalendarDate(date){
  const p=dhakaCalendarParts(date);
  const names=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  return toBnDateNumber(p.day)+' '+names[p.month-1]+' '+toBnDateNumber(p.year)+' খ্রিস্টাব্দ';
}
function weekdayCalendarName(date){
  return ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'][dhakaCalendarParts(date).weekday];
}

(function renderUniversalProfileDates(){

    document.querySelectorAll('.hijri').forEach(x=>x.textContent=hijriCalendarDate(now));

})();

 $('#cover').style.setProperty('--cover-image',profileData.cover?`url("${profileData.cover}")`:'linear-gradient(135deg,rgba(105,164,222,.55),rgba(184,164,229,.52))');
 $('#profileBio').classList.toggle('owner',isOwner);
 $('#coverEdit').hidden=!isOwner;$('#avatarCamera').hidden=!isOwner;
 const a=$('#heroActions');
 if(isOwner){a.innerHTML=`<button class="primary" data-follow>${ico('i-users')} অনুসারী</button><button data-message>${ico('i-message')} বার্তা</button><button class="dots" data-profile-menu>${ico('i-more')}</button>`}
 else{a.innerHTML=`<button class="primary" data-follow>${ico('i-users')} ফলো করুন</button><button data-message>${ico('i-message')} বার্তা পাঠান</button><button class="dots" data-profile-menu>${ico('i-more')}</button>`}
 $('#composer').hidden=!(isOwner&&CONFIG.allowComposer);
}
function tabs(){
 let t=CONFIG.tabs.slice();$('#categories').innerHTML=t.map(x=>`<button class="cat${x[0]==='home'?' active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')+`<button class="cat" data-more-tabs>আরও⌄</button>`;
}
const demoPosts=[
 {id:1,type:'কবিতা',title:'মায়ের হাতের গন্ধ',body:'পৃথিবীর সব সুগন্ধ মুছে গেলেও\nমায়ের হাতের গন্ধ থেকে যায়;\nভাতের ধোঁয়া, শীতের কম্বল,\nআর অসুখের রাতে জেগে থাকা প্রার্থনার মতো।',date:'২০ জুলাই, ২০২৬ · ১:৪৮ AM'},
 {id:2,type:'ছোট কথার প্রলাপ',title:'অভিমান আসলে অপেক্ষার একটি ছায়া',body:'যার কাছে কোনো প্রত্যাশা নেই, তার ওপর অভিমানও হয় না। অভিমান মানে মানুষটি একবার ফিরে তাকাক—এই নীরব অপেক্ষা।',date:'২০ জুলাই, ২০২৬ · ১০:১০ AM'},
 {id:3,type:'আবৃত্তি',title:'আমার স্বর, আমার পথ',body:'শব্দ যখন কণ্ঠে এসে আশ্রয় নেয়, তখন কবিতার আরেকটি জীবন শুরু হয়।',date:'১৯ জুলাই, ২০২৬ · ৮:৩০ PM'}
];
const titleData={
 poem:['মায়ের হাতের গন্ধ','বৃষ্টির পরের নীরবতা','যে শহর তোমাকে মনে রাখে','অপেক্ষার সিঁড়ি'],
 recitation:['আমার স্বর, আমার পথ','নক্ষত্রের কাছে পাঠ','শব্দের ভেতর দিয়ে'],
 prolap:['অভিমান আসলে অপেক্ষার একটি ছায়া','সব উত্তর শব্দে বলা যায় না','মুখোমুখি নীরবতা'],
 children:['রঙিন ঘুড়ি','চাঁদের সঙ্গে আড়ি','বৃষ্টির স্কুল'],
 environment:['নদীর কাছে ক্ষমা','একটি গাছের চিঠি','সবুজ ফিরুক'],
 songs:['তুমি এলে ভোর হয়','অচেনা নক্ষত্র','ফিরে এসো গান হয়ে'],
 letters:['তোমার নামে একটি চিঠি','বাবাকে লেখা','হারানো বন্ধুর কাছে'],
 edits:['সংকল্প — কাজী নজরুল ইসলাম','বিদ্রোহী — কাজী নজরুল ইসলাম','বনলতা সেন — জীবনানন্দ দাশ']
};
function postCard(p){
 return `<article class="glass post" data-post="${p.id}"><div class="author"><a class="author-avatar" href="${CONFIG.profileHref}"><img src="${esc(profileData.avatar||window.DEFAULT_AVATAR)}" alt=""></a><div><a href="${CONFIG.profileHref}"><strong>${esc(profileData.name)}</strong></a><small>${esc(p.date)}</small></div><button class="post-menu" data-post-menu="${p.id}">${ico('i-more')}</button></div><span class="tag">${esc(p.type)}</span><a href="post-details.html?id=${p.id}"><h3>${esc(p.title)}</h3></a><div class="post-body">${esc(p.body)}</div><a class="readmore" href="post-details.html?id=${p.id}">পূর্ণ লেখা পড়ুন →</a><div class="actions"><button class="action" data-like>${ico('i-heart')} <span>ভালোবাসা</span></button><button class="action" data-comment>${ico('i-message')} <span>মন্তব্য</span></button><button class="action" data-share>${ico('i-share')} <span>শেয়ার</span></button><button class="action" data-save>${ico('i-bookmark')} <span>সেভ</span></button></div><div class="comments"><div class="comment-list"></div><form class="comment-form"><textarea aria-label="মন্তব্য লিখুন" placeholder="মন্তব্য লিখুন..."></textarea><button aria-label="পাঠান">➤</button></form></div></article>`;
}
function renderContent(tab='home'){
 activeTab=tab;$$('.cat').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 const content=$('#content');
 if(tab==='home'){content.innerHTML=`<section class="glass section-head"><div><h2>${CONFIG.poetMode?'কবির প্রকাশনা':'প্রকাশিত লেখা'}</h2><small>প্রথমে ২০টি, তারপর “আরও দেখুন”</small></div></section><section class="post-list">${demoPosts.slice(0,visibleCount).map(postCard).join('')}</section><button class="more-btn" data-load-more>আরও দেখুন</button>`;return}
 const map={poem:'poem',recitation:'recitation',prolap:'prolap',children:'children',environment:'environment',songs:'songs',letters:'letters',edits:'edits'};
 const key=map[tab]||'poem',arr=titleData[key]||[];
 content.innerHTML=`<section class="glass section-head"><div><h2>${esc($(`[data-tab="${tab}"]`)?.textContent||'শিরোনাম')}</h2><small>শুধু ক্লিকযোগ্য শিরোনাম ও প্রকাশের সময়</small></div></section><section class="title-list">${arr.slice(0,visibleCount).map((x,i)=>`<a class="glass title-item" href="post-details.html?id=${key}-${i+1}"><div><h3>${esc(x)}</h3><p>${esc(profileData.name)} · ${20-i} জুলাই, ২০২৬</p></div><span>মূল লেখা →</span></a>`).join('')}</section><button class="more-btn" data-load-more>আরও দেখুন</button>`;
}
function openSheet(title,items){
 $('#sheetTitle').textContent=title;$('#sheetList').innerHTML=items.map(i=>`<${i.href?'a':'button'} class="sheet-item${i.danger?' danger':''}" ${i.href?`href="${i.href}"`:'type="button"'} ${i.action?`data-sheet-action="${i.action}"`:''}>${ico(i.icon||'i-settings')}<span>${esc(i.label)}</span></${i.href?'a':'button'}>`).join('');
 $('#backdrop').classList.add('show');$('#sheet').classList.add('open');document.body.classList.add('locked');
}
function closeAll(){['leftDrawer','rightDrawer'].forEach(id=>$('#'+id).classList.remove('open'));$('#backdrop').classList.remove('show');$('#sheet').classList.remove('open');document.body.classList.remove('locked')}
function profileMenu(){
 if(isOwner){
  const dash=CONFIG.role==='founder'?'founder-dashboard.html':CONFIG.role==='admin'?'admin-dashboard.html':'settings.html';
  openSheet('প্রোফাইল সেটিংস',[
   {label:'প্রোফাইল সম্পাদনা করুন',href:'edit-profile.html',icon:'i-edit'},
   {label:'ড্যাশবোর্ড',href:dash,icon:'i-dashboard'},
   {label:'প্রোফাইল সেটিংস',href:'settings.html',icon:'i-settings'},
   {label:'আর্কাইভ',href:'archive.html',icon:'i-archive'},
   {label:'ভিজিটর হিসেবে দেখুন',action:'view-as',icon:'i-eye'},
   {label:'কার্যকলাপের ইতিহাস',href:'archive.html#activity',icon:'i-history'},
   {label:'প্রাইভেসি',href:'settings.html#privacy',icon:'i-lock'},
   {label:'প্রোফাইল শেয়ার করুন',action:'share-profile',icon:'i-share'},
   {label:'প্রোফাইল লিঙ্ক কপি করুন',action:'copy-profile',icon:'i-copy'},
   {label:'থিম পরিবর্তন',action:'theme',icon:'i-settings'},
   {label:'লগআউট',action:'logout',icon:'i-lock',danger:true}
  ]);
 }else openSheet('প্রোফাইল',[
   {label:'ফলো করুন',action:'follow',icon:'i-users'},{label:'বার্তা পাঠান',href:'messages.html',icon:'i-message'},
   {label:'প্রোফাইল শেয়ার করুন',action:'share-profile',icon:'i-share'},{label:'প্রোফাইল লিঙ্ক কপি করুন',action:'copy-profile',icon:'i-copy'},
   {label:'প্রিয় তালিকায় যুক্ত করুন',action:'favorite',icon:'i-heart'},{label:'রিপোর্ট করুন',action:'report-profile',icon:'i-flag',danger:true}
 ]);
}
function postMenu(id){
 openSheet('পোস্টের অপশন',isOwner?[
  {label:'পোস্ট সেভ করুন',action:'save-post',icon:'i-bookmark'},{label:'পোস্ট সম্পাদনা করুন',action:'edit-post',icon:'i-edit'},
  {label:'প্রাইভেসি সম্পাদনা',action:'privacy-post',icon:'i-lock'},{label:'নিউজফিড দৃশ্যমানতা',action:'feed-visibility',icon:'i-eye'},
  {label:'লিঙ্ক কপি করুন',action:'copy-post',icon:'i-copy'},{label:'আর্কাইভে নিন',action:'archive-post',icon:'i-archive'},
  {label:'ডিলিট করুন',action:'delete-post',icon:'i-trash',danger:true}
 ]:[
  {label:'পোস্ট সেভ করুন',action:'save-post',icon:'i-bookmark'},{label:'লিঙ্ক কপি করুন',action:'copy-post',icon:'i-copy'},
  {label:'প্রিয় তালিকায় যুক্ত করুন',action:'favorite',icon:'i-heart'},{label:'রিপোর্ট করুন',action:'report-post',icon:'i-flag',danger:true}
 ]);
}
function avatarMenu(){
 const items=[{label:'প্রোফাইল ছবি দেখুন',action:'view-avatar',icon:'i-eye'}];
 if(isOwner)items.push({label:'প্রোফাইল ছবি পরিবর্তন করুন',action:'change-avatar',icon:'i-camera'},{label:'স্টোরি যোগ করুন',action:'add-story',icon:'i-edit'});
 openSheet('প্রোফাইল ছবি',items);
}
function coverMenu(){
 const items=[{label:'কভার দেখুন',action:'view-cover',icon:'i-eye'}];
 if(isOwner)items.push({label:'কভার পরিবর্তন করুন',action:'change-cover',icon:'i-camera'});
 openSheet('কভার ছবি',items);
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function theme(){const a=['light','middle','dark'],c=document.documentElement.dataset.theme||'light',n=a[(a.indexOf(c)+1)%a.length];document.documentElement.dataset.theme=n;localStorage.setItem('bhubondangaTheme',n);toast('থিম পরিবর্তন হয়েছে')}
async function logout(){try{if(client)await client.auth.signOut({scope:'local'})}catch(e){}location.href='login.html'}
function compress(file,maxW=1200,q=.82){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{let w=im.width,h=im.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',q))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function choose(kind){const inp=$('#imageInput');inp.dataset.kind=kind;inp.click()}
$('#imageInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;const kind=e.target.dataset.kind;try{const data=await compress(f,kind==='cover'?1600:700,.84);localStorage.setItem(CONFIG.storagePrefix+(kind==='cover'?'Cover':'Avatar'),data);profileData[kind]=data;renderProfile();toast('ছবি পরিবর্তন হয়েছে')}catch(err){toast('ছবি পরিবর্তন করা যায়নি')}e.target.value=''});
function editBio(){if(!isOwner)return;const next=prompt('আপনার বায়ো লিখুন',profileData.bio);if(next!==null&&next.trim()){profileData.bio=next.trim();localStorage.setItem(CONFIG.storagePrefix+'Bio',profileData.bio);renderProfile();toast('বায়ো সংরক্ষিত হয়েছে')}}
function composerTypes(){
 let arr=[['🖋️','কবিতা'],['☁️','ছোট কথার প্রলাপ'],['🎙️','আবৃত্তি'],['🌱','পরিবেশের কথা'],['✉️','চিঠিপত্র'],['🧸','শিশুতোষ']];
 if(CONFIG.role==='founder')arr.push(['☾','মধ্যরাতের প্রলাপ'],['🎵','গান']);
 $('#composerChoices').innerHTML=arr.map(x=>`<button class="compose-type"><span>${x[0]}</span><span>${x[1]}</span></button>`).join('');
}
document.addEventListener('click',async e=>{
 const c=e.target.closest('[data-comment]');if(c){c.closest('.post').querySelector('.comments').classList.toggle('open');return}
 const m=e.target.closest('[data-post-menu]');if(m){postMenu(m.dataset.postMenu);return}
 if(e.target.closest('[data-profile-menu]')){profileMenu();return}
 if(e.target.closest('#avatarWrap')){avatarMenu();return}
 if(e.target.closest('#coverEdit')||e.target.closest('#cover')){if(!e.target.closest('.profile-panel'))coverMenu();return}
 if(e.target.closest('#profileBio')){editBio();return}
 const tab=e.target.closest('[data-tab]');if(tab){visibleCount=20;renderContent(tab.dataset.tab);return}
 if(e.target.closest('[data-more-tabs]')){openSheet('আরও বিভাগ',CONFIG.moreTabs.map(x=>({label:x[1],action:'tab:'+x[0],icon:'i-bookmark'})));return}
 if(e.target.closest('[data-load-more]')){visibleCount+=20;renderContent(activeTab);toast('আরও লেখা দেখানো হয়েছে');return}
 if(e.target.closest('#composerPrompt')){$('#composerChoices').hidden=!$('#composerChoices').hidden;return}
 if(e.target.closest('[data-open-left]')){$('#leftDrawer').classList.add('open');$('#backdrop').classList.add('show');document.body.classList.add('locked');return}
 if(e.target.closest('[data-open-right]')){$('#rightDrawer').classList.add('open');$('#backdrop').classList.add('show');document.body.classList.add('locked');return}
 if(e.target.closest('[data-close]')||e.target=== $('#backdrop')){closeAll();return}
 if(e.target.closest('[data-theme]')){theme();return}
 if(e.target.closest('[data-logout]')){logout();return}
 if(e.target.closest('[data-message]')){location.href=logged()?'messages.html':'login.html';return}
 if(e.target.closest('[data-follow]')){if(!logged())location.href='login.html';else toast('ফলো অবস্থা পরিবর্তন হয়েছে');return}
 const act=e.target.closest('[data-sheet-action]')?.dataset.sheetAction;if(!act)return;
 if(act.startsWith('tab:')){closeAll();renderContent(act.split(':')[1]);return}
 if(act==='theme'){theme();return}if(act==='logout'){logout();return}
 if(act==='change-avatar'){closeAll();choose('avatar');return}if(act==='change-cover'){closeAll();choose('cover');return}
 if(act==='copy-profile'||act==='copy-post'){await navigator.clipboard?.writeText(location.href);toast('লিঙ্ক কপি হয়েছে');closeAll();return}
 if(act==='share-profile'){if(navigator.share)navigator.share({title:profileData.name,url:location.href});else await navigator.clipboard?.writeText(location.href);closeAll();return}
 if(act==='view-as'){location.href=location.pathname+'?view=visitor';return}
 toast('অপশনটি নির্বাচন করা হয়েছে');closeAll();
});
document.addEventListener('submit',e=>{const f=e.target.closest('.comment-form');if(!f)return;e.preventDefault();if(!logged()){location.href='login.html';return}const ta=f.querySelector('textarea'),v=ta.value.trim();if(!v)return;const item=document.createElement('div');item.className='comment';item.innerHTML=`<a href="profile.html">${esc(session.user.user_metadata?.full_name||'আপনি')}</a> — ${esc(v)}`;f.previousElementSibling.appendChild(item);ta.value='';toast('মন্তব্য যোগ হয়েছে')});
async function init(){
 const theme=localStorage.getItem('bhubondangaTheme');if(theme)document.documentElement.dataset.theme=theme;
 if(localStorage.getItem(CONFIG.storagePrefix+'Bio'))profileData.bio=localStorage.getItem(CONFIG.storagePrefix+'Bio');
 if(client){try{session=(await client.auth.getSession()).data?.session||null;if(session){userRole=session.user.app_metadata?.role||session.user.user_metadata?.role||'user';try{const r=await client.from('user_roles').select('role,active').eq('user_id',session.user.id).eq('active',true).maybeSingle();if(r.data?.role)userRole=r.data.role}catch(e){}}client.auth.onAuthStateChange((_e,s)=>{session=s;initRender()})}catch(e){}}
 initRender();
}
function initRender(){
 const q=new URLSearchParams(location.search),target=q.get('user');
 isOwner=logged()&&q.get('view')!=='visitor'&&(!target||target==='me'||target===session.user.id);
 if(CONFIG.role==='founder')isOwner=isOwner&&userRole==='founder';
 if(CONFIG.role==='admin')isOwner=isOwner&&['admin','founder'].includes(userRole);
 renderSidebars();renderQuick();renderProfile();tabs();composerTypes();renderContent('home');
}
init();
})();

</script>
</body></html>
