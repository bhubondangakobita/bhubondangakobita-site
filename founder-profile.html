const poemBodies=['ভাঙা পথের শেষে দাঁড়িয়ে দেখি—অন্ধকার কখনো শেষ কথা নয়। দূরে একটি ক্ষুদ্র আলোও পথ চিনিয়ে দিতে পারে।\n\nমানুষ যখন মানুষের পাশে দাঁড়ায়, তখন রাতের গভীরতাও ধীরে ধীরে ভোরের ভাষা শিখে ফেলে।','বৃষ্টির শেষে জানালার কাঁচে যে অল্প আলো থেমে থাকে, সেখানে পুরোনো দিনের গন্ধ মিশে থাকে। শহর ঘুমিয়ে পড়লেও কিছু শব্দ মানুষের ভেতর জেগে থাকে।\n\nসেই শব্দগুলোই একদিন কবিতা হয়ে ফিরে আসে।','শব্দ শুধু উচ্চারণ নয়—কখনো আশ্রয়, কখনো প্রতিবাদ, কখনো আবার ফিরে যাওয়ার পথ। আমরা যত্ন করে লিখলে শব্দও মানুষের প্রতি যত্নশীল হয়ে ওঠে।','সব অপেক্ষা পূর্ণতা পায় না। তবু অপেক্ষা মানুষকে নিজের ভেতরের গভীরতা চিনতে শেখায়। যে নীরবতা সহ্য করতে পারে, সে আলোকে নতুনভাবে দেখতে শেখে।'];

const edits=['জীবনানন্দ দাশের কবিতা সম্পাদনা','রবীন্দ্রনাথের পাঠতথ্য সংযোজন','নজরুলের কবিতার বানান যাচাই','সুফিয়া কামালের জীবনপঞ্জি সংশোধন'];
function coverSvg(){return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${CONFIG.cover1}"/><stop offset="1" stop-color="${CONFIG.cover2}"/></linearGradient></defs><rect width="1600" height="620" fill="url(#g)"/><circle cx="250" cy="100" r="230" fill="white" opacity=".18"/><path d="M0 510 C350 390 560 610 900 475 S1370 355 1600 500 V620 H0Z" fill="white" opacity=".17"/></svg>`)}`}
function avatarSvg(){const initials=CONFIG.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('');return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${CONFIG.avatar1}"/><stop offset="1" stop-color="${CONFIG.avatar2}"/></linearGradient></defs><rect width="400" height="400" rx="200" fill="url(#g)"/><text x="200" y="240" text-anchor="middle" font-family="Arial,Noto Sans Bengali" font-size="120" font-weight="700" fill="white">${initials}</text></svg>`)}`}
function makePosts(){let out=[];for(let i=0;i<45;i++){let type=['poem','recitation','letter','environment','prolap','discussion','edit'][i%7],title,body,media=null; if(type==='poem'){title=poemTitles[i%poemTitles.length];body=poemBodies[i%poemBodies.length]} if(type==='recitation'){title=['আমার স্বর, আমার পথ','বৃষ্টির শব্দে কবিতা','নীরবতার উচ্চারণ','আলো ফেরার গান'][i%4];body='কবিতার প্রতিটি উচ্চারণে থাকে শ্বাস, স্মৃতি ও অনুভবের নিজস্ব ছন্দ। এই আবৃত্তিতে শব্দের পাশাপাশি নীরবতারও একটি ভূমিকা আছে।';media={kind:'recitation',poster:POSTERS[i%4],audio:WAV}} if(type==='letter'){title=letters[i%letters.length];body='প্রিয় মানুষ, ক্লান্ত হলে একটু থেমে যেয়ো—কিন্তু নিজের আলোকে ছোট করে দেখো না। পথ দীর্ঘ হলেও তোমার ভেতরে ফিরে আসার একটি দরজা সবসময় খোলা থাকে।'} if(type==='environment'){title=environments[i%environments.length];body='প্রকৃতি আমাদের কাছ থেকে বড় কোনো ভাষণ চায় না; সে চায় ছোট ছোট দায়িত্ব। একটি গাছ, পরিষ্কার একটি নদীতীর, প্লাস্টিকের বদলে সচেতনতা—এসবই আগামী দিনের প্রতি আমাদের চিঠি।'} if(type==='prolap'){title=prolaps[i%prolaps.length];body='সব প্রশ্নের উত্তর আজই পাওয়া দরকার নেই। কখনো নিজের পাশে কিছুক্ষণ নীরবে বসে থাকা, নিজের শ্বাস শুনে নেওয়া এবং তাড়াহুড়া থেকে একটু দূরে আসাও বড় একটি উত্তর।'} if(type==='discussion'){title='কবিতা কি শুধু অনুভূতি?';body='কবিতা অনুভূতি থেকে জন্ম নেয়, কিন্তু ভাষা, নির্মাণ, পাঠকের অভিজ্ঞতা এবং সময়ের সঙ্গে তার গভীর সম্পর্ক থাকে। এই আলোচনায় সেই নির্মাণের কিছু দিক নিয়ে ভাবা হয়েছে।'} if(type==='edit'){title=edits[i%edits.length];body='তথ্য, বানান ও উৎস মিলিয়ে এই সম্পাদনাটি সংরক্ষণ করা হয়েছে। ভুল বা অসম্পূর্ণতা থাকলে পাঠক রিপোর্ট করতে পারবেন; অনুমোদিত সম্পাদনা সরাসরি মুছে ফেলা যাবে না।'} out.push({id:'demo-'+CONFIG.id+'-'+(i+1),type,title,body,createdAt:new Date(Date.now()-i*86400000).toISOString(),likes:18+(i*7)%190,comments:2+(i*3)%24,media,pinned:i===0,privacy:'Public'})}return out}
let posts=read(postKey,null)||makePosts();if(posts.length<45){posts=makePosts();write(postKey,posts)}
function label(t){return {poem:'কবিতা',recitation:'আবৃত্তি',letter:'চিঠিপত্র',environment:'পরিবেশের কথা',prolap:'ছোট কথার প্রলাপ',discussion:'সাহিত্য আলোচনা',edit:'সম্পাদনা',photo:'প্রোফাইল আপডেট',cover:'কভার আপডেট'}[t]||'প্রকাশনা'}
function bnDate(v){try{return new Intl.DateTimeFormat('bn-BD',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit',timeZone:'Asia/Dhaka'}).format(new Date(v))}catch(_){return v}}

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;D.body.append(t);setTimeout(()=>t.remove(),2200)}
function authorLink(){return CONFIG.role==='founder'?'founder-profile.html':CONFIG.role==='admin'?'admin-profile.html':'profile.html?user='+encodeURIComponent(CONFIG.id)}
function postCard(p){let media='';if(p.media?.kind==='recitation')media=`<div class="post-media recitation-poster" data-photo="${esc(p.media.poster)}" data-caption="${esc(p.title)}"><img src="${p.media.poster}" alt="${esc(p.title)}"></div><audio controls preload="none" src="${p.media.audio}"></audio>`;else if(p.media?.url)media=`<div class="post-media" data-photo="${esc(p.media.url)}" data-caption="${esc(p.media.caption||p.title)}"><img src="${esc(p.media.url)}" alt="${esc(p.title)}"></div>`;return `<article class="card post ${p.pinned?'pinned':''}" data-id="${esc(p.id)}"><div class="post-head"><div class="author"><a class="author-avatar" href="${authorLink()}"><img src="${currentAvatar()}" alt=""></a><div><a class="author-name" href="${authorLink()}">${esc(CONFIG.name)}</a><span class="post-time">${bnDate(p.createdAt)} · ${esc(p.privacy||'Public')}</span></div></div><button class="dots" data-post-menu="${esc(p.id)}" aria-label="পোস্টের অপশন">•••</button></div><span class="post-tag">${label(p.type)}${p.pinned?' · পিন করা':''}</span><h3 class="post-title" data-toggle-post>${esc(p.title)}</h3><div class="post-body ${p.body.length>170?'long':''}">${esc(p.body)}</div>${p.body.length>170?'<button class="read-more" data-toggle-post>আরও দেখুন →</button>':''}${media}<div class="post-stats"><span>❤️ ${p.likes} জন</span><span>${p.comments} মন্তব্য · ${Math.max(1,Math.floor(p.likes/5))} শেয়ার</span></div><div class="post-actions"><button class="action" data-react><span class="action-icon">♡</span> <span class="action-label">প্রতিক্রিয়া</span></button><button class="action" data-comments><span class="action-icon">◌</span> মন্তব্য</button><button class="action" data-share><span class="action-icon">↗</span> শেয়ার</button><button class="action" data-save><span class="action-icon">▱</span> সংরক্ষণ</button></div><div class="comments hidden"><div class="comment"><div class="comment-avatar">${names[0][0]}</div><div class="comment-bubble"><a class="comment-author" href="profile.html?user=rakibul-hasan">${names[0]}</a>লেখাটির ভাষা সহজ, কিন্তু অনুভব গভীর হয়েছে।</div></div><div class="comment"><div class="comment-avatar">${names[1][0]}</div><div class="comment-bubble"><a class="comment-author" href="profile.html?user=nusrat-kabir">${names[1]}</a>শেষের অংশটি বিশেষভাবে ভালো লেগেছে।</div></div><div class="comment-row"><input class="comment-input" placeholder="মন্তব্য লিখুন…"><button class="comment-send" data-comment-send>➤</button></div></div></article>`}
function renderHome(){const list=$('#postList');list.innerHTML=posts.map(postCard).join('');}
function renderArchive(type){const rows=posts.filter(p=>p.type===type);$('#tabContent').innerHTML=`<section class="card" style="padding:14px"><div class="side-title"><strong>${label(type)}</strong><small>${rows.length}টি</small></div><div class="archive-list">${rows.map(p=>`<div class="archive-item"><a href="#${p.id}" data-open-archive="${p.id}">${esc(p.title)}</a><small>${bnDate(p.createdAt)}</small></div>`).join('')||'<div class="empty">এখনো কোনো প্রকাশনা নেই।</div>'}</div></section>`}
function renderAbout(){$('#tabContent').innerHTML=`<section class="card" style="padding:15px"><h2>পরিচিতি</h2><p style="color:var(--muted);line-height:1.9">${esc(state.bio)}</p><h3>বন্ধুতালিকা</h3><div class="archive-list">${names.slice(0,8).map((n,i)=>`<div class="archive-item"><a href="profile.html?user=${encodeURIComponent(n)}">${n}</a><small>${i%2?'অনুসরণ করছেন':'বন্ধু'}</small></div>`).join('')}</div></section>`}
function showTab(tab){$$('.tab-btn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='home'){$('#tabContent').innerHTML=`${OWNER?'<section class="card composer" id="composer">':'<section class="card composer hidden" id="composer">'}<div class="composer-top"><div class="mini-avatar"><img src="${currentAvatar()}" alt=""></div><button class="composer-prompt" data-open-composer>আজ আপনার ভেতরে কী কথা জমে আছে?</button></div><div class="composer-panel hidden"><select id="composeType" class="comment-input" style="height:42px"><option value="">বিষয় নির্বাচন করুন</option><option value="poem">কবিতা</option><option value="recitation">আবৃত্তি</option><option value="letter">চিঠিপত্র</option><option value="environment">পরিবেশ</option><option value="prolap">ছোট প্রলাপ</option></select><input id="composeTitle" placeholder="শিরোনাম"><textarea id="composeBody" placeholder="আপনার লেখা লিখুন…"></textarea><div class="composer-tools"><button class="tool-btn" data-compose-media="image">▧ ছবি</button><button class="tool-btn" data-compose-media="audio">◉ অডিও</button><button class="tool-btn" data-compose-media="video">▷ ভিডিও</button><button class="btn primary composer-submit" data-publish>প্রকাশ করুন</button></div></div></section><section id="postList" class="post-list"></section>`;renderHome()}else if(tab==='about')renderAbout();else renderArchive(tab)}
function postMenu(id,btn){$('.post-menu')?.remove();const p=posts.find(x=>x.id===id);const m=D.createElement('div');m.className='post-menu';const owner=`<button class="menu-item" data-menu-action="edit">পোস্ট সম্পাদনা করুন</button><button class="menu-item" data-menu-action="privacy">গোপনীয়তা: ${p.privacy||'Public'}</button><button class="menu-item" data-menu-action="pin">${p.pinned?'আনপিন করুন':'প্রোফাইলে পিন করুন'}</button><button class="menu-item" data-menu-action="archive">আর্কাইভে নিন</button><button class="menu-item" data-menu-action="save">সংরক্ষণ করুন</button><button class="menu-item" data-menu-action="copy">লিংক কপি করুন</button><button class="menu-item" data-menu-action="notify">নোটিফিকেশন নিয়ন্ত্রণ</button><button class="menu-item" data-menu-action="delete" style="color:var(--danger)">পোস্ট মুছে ফেলুন</button>`;const visitor=`<button class="menu-item" data-menu-action="save">পোস্ট সংরক্ষণ করুন</button><button class="menu-item" data-menu-action="copy">লিংক কপি করুন</button><button class="menu-item" data-menu-action="follow">লেখককে Follow/Unfollow</button><button class="menu-item" data-menu-action="less">এই ধরনের পোস্ট কম দেখান</button><button class="menu-item" data-menu-action="hide">পোস্ট লুকান</button><button class="menu-item" data-menu-action="report">রিপোর্ট করুন</button><button class="menu-item" data-menu-action="block">ব্যবহারকারীকে Block করুন</button>`;m.innerHTML=OWNER?owner:visitor;m.dataset.id=id;btn.closest('.post').append(m)}
function menuAction(action,id){const p=posts.find(x=>x.id===id),card=$(`.post[data-id="${CSS.escape(id)}"]`);if(!p)return;if(action==='edit'){const old=p.body,txt=prompt('পোস্ট সম্পাদনা করুন',old);if(txt!==null){p.body=txt;savePosts()}}if(action==='privacy'){p.privacy=p.privacy==='Public'?'Friends':p.privacy==='Friends'?'Only me':'Public';savePosts()}if(action==='pin'){p.pinned=!p.pinned;savePosts()}if(action==='archive'||action==='hide'||action==='delete'){posts=posts.filter(x=>x.id!==id);savePosts()}if(action==='copy'){navigator.clipboard?.writeText(location.href+'#'+id);toast('লিংক কপি হয়েছে')}if(['save','notify','follow','less','report','block'].includes(action))toast('অপশনটি কার্যকর হয়েছে');$('.post-menu')?.remove()}
function savePosts(){write(postKey,posts);showTab('home')}
function openDrawer(id){$('#backdrop').classList.add('show');$('#'+id).classList.add('open')}function closeDrawers(){$('#backdrop').classList.remove('show');$$('.drawer').forEach(x=>x.classList.remove('open'))}

function panelContent(kind){const maps={settings:['Privacy settings','Notification settings','Message settings','Login and security','Profile visibility','কে মন্তব্য করতে পারবে','কে বার্তা পাঠাতে পারবে','কে Follow করতে পারবে'],memories:['আজকের স্মৃতি','গত বছরের এই দিন','সংরক্ষিত মুহূর্ত'],saved:['সংরক্ষিত পোস্ট','প্রিয় কবিতা','প্রিয় লেখক'],archive:['Post archive','Story archive','Activity log','Draft'],notifications:['নতুন Follow','Reaction','Comment','Reply','Mention','নতুন বার্তা','Call request','System notice'],messages:['নুসরাত কবির','রাকিবুল হাসান','সামিয়া আদৃতা','তানিয়া রহমান','মেহরাব নীল']};return `<div class="archive-list">${(maps[kind]||maps.settings).map(x=>`<div class="archive-item"><button class="side-link" data-panel-action="${esc(x)}"><span class="side-icon">›</span>${esc(x)}</button></div>`).join('')}</div>`}
function profileSheet(target){const ownerAvatar=target==='avatar'&&OWNER,ownerCover=target==='cover'&&OWNER;$('#sheetTitle').textContent=target==='avatar'?'প্রোফাইল ছবি':'কভার ছবি';$('#sheetActions').innerHTML=`<button data-sheet-action="view" data-target="${target}">ছবি দেখুন</button>${ownerAvatar||ownerCover?`<button data-sheet-action="change" data-target="${target}">ছবি পরিবর্তন করুন</button><button data-sheet-action="reposition" data-target="${target}">ছবি পুনর্বিন্যাস করুন</button>`:''}${ownerAvatar?'<button data-open-story>নিজের Story যোগ করুন</button>':''}`;$('#sheet').classList.remove('hidden');$('#backdrop').classList.add('show')}
let editTarget='',editData='';function openEditor(target,reposition=false){editTarget=target;editData=target==='avatar'?currentAvatar():currentCover();$('#editorTitle').textContent=target==='avatar'?'প্রোফাইল ছবি পরিবর্তন':'কভার ছবি পরিবর্তন';$('#editorStage').className='editor-stage '+(target==='avatar'?'avatar-mode':'cover-mode');$('#editorPreview').src=editData;$('#editorCaption').value=target==='avatar'?state.avatarCaption:state.coverCaption;$('#editZoom').value=target==='avatar'?state.avatarZoom:state.coverZoom;$('#editX').value=target==='avatar'?state.avatarX:state.coverX;$('#editY').value=target==='avatar'?state.avatarY:state.coverY;$('#editorModal').classList.remove('hidden');syncEditor();if(!reposition)$('#editorFile').click()}
function syncEditor(){const z=$('#editZoom').value,x=$('#editX').value,y=$('#editY').value;$('#editorPreview').style.setProperty('--editZoom',z);$('#editorPreview').style.setProperty('--editX',x+'%');$('#editorPreview').style.setProperty('--editY',y+'%')}
function saveEditor(){const caption=$('#editorCaption').value.trim(),z=Number($('#editZoom').value),x=Number($('#editX').value),y=Number($('#editY').value);if(editTarget==='avatar'){state.avatar=editData;state.avatarZoom=z;state.avatarX=x;state.avatarY=y;state.avatarCaption=caption}else{state.cover=editData;state.coverZoom=z;state.coverX=x;state.coverY=y;state.coverCaption=caption}write(profileKey,state);addMediaEvent(editTarget,caption);$('#editorModal').classList.add('hidden');applyProfile();showTab('home');toast('ছবি ও ক্যাপশন সংরক্ষিত হয়েছে')}
function addMediaEvent(target,caption){const item={id:'media-'+Date.now(),type:target==='avatar'?'photo':'cover',title:target==='avatar'?'প্রোফাইল ছবি পরিবর্তন করেছেন':'কভার ছবি পরিবর্তন করেছেন',body:caption||'নতুন ছবি যোগ করা হয়েছে।',createdAt:new Date().toISOString(),likes:0,comments:0,privacy:'Public',media:{url:editData,caption}};posts.unshift(item);write(postKey,posts);const keys=['bhubondangaHomeUserPosts','bhubondangaIndexFeedPosts','bhubondangaProfilePosts'];keys.forEach(k=>{let a=read(k,[]);a.unshift({...item,authorName:CONFIG.name,authorUsername:CONFIG.id,authorAvatar:currentAvatar(),category:item.type});write(k,a.slice(0,160))})}
function photoViewer(src,caption){$('#photoImage').src=src;$('#photoCaption').textContent=caption||'';$('#photoViewer').classList.remove('hidden')}
function storyDrawer(){const items=names.slice(0,8);const one=items.map((n,i)=>`<button class="story-chip" data-story="${i}"><div class="ring"><span>${n[0]}</span></div><small>${n}</small></button>`).join('');$('#storyTrack').innerHTML=one+`<div aria-hidden="true" style="display:flex;gap:10px">${one}</div>`;$('#storyName').textContent=items[0];$('#storyText').textContent='আজকের ছোট একটি অনুভব—শব্দের ভেতরে মানুষের জন্য একটু জায়গা রেখে যাই।';openDrawer('storyDrawer')}
function showReaction(card,btn){$('.reaction-picker')?.remove();const p=D.createElement('div');p.className='reaction-picker';p.innerHTML='<button data-reaction="like">👍</button><button data-reaction="love">❤️</button><button data-reaction="care">🥰</button><button data-reaction="wow">😮</button>';card.append(p)}
let holdTimer;D.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-react]');if(!b)return;holdTimer=setTimeout(()=>showReaction(b.closest('.post'),b),450)},true);D.addEventListener('pointerup',()=>clearTimeout(holdTimer),true);D.addEventListener('pointercancel',()=>clearTimeout(holdTimer),true);
D.addEventListener('click',async e=>{const t=e.target;if(!t.closest('.post-menu')&&!t.closest('[data-post-menu]'))$('.post-menu')?.remove();if(t.closest('[data-post-menu]')){e.preventDefault();e.stopPropagation();const b=t.closest('[data-post-menu]');postMenu(b.dataset.postMenu,b);return}if(t.closest('[data-menu-action]')){menuAction(t.closest('[data-menu-action]').dataset.menuAction,t.closest('.post-menu').dataset.id);return}if(t.closest('[data-toggle-post]')){const card=t.closest('.post');card.classList.toggle('expanded');const b=card.querySelector('.read-more');if(b)b.textContent=card.classList.contains('expanded')?'কম দেখুন ↑':'আরও দেখুন →';return}if(t.closest('[data-comments]')){t.closest('.post').querySelector('.comments').classList.toggle('hidden');return}if(t.closest('[data-save]')){t.closest('[data-save]').classList.toggle('active');toast('সংরক্ষণ অবস্থা পরিবর্তন হয়েছে');return}if(t.closest('[data-share]')){const id=t.closest('.post').dataset.id;if(navigator.share)await navigator.share({title:CONFIG.name,url:location.href+'#'+id}).catch(()=>{});else navigator.clipboard?.writeText(location.href+'#'+id);return}if(t.closest('[data-react]')){const b=t.closest('[data-react]');b.classList.toggle('active');b.querySelector('.action-icon').textContent=b.classList.contains('active')?'👍':'♡';return}if(t.closest('[data-reaction]')){const type=t.closest('[data-reaction]').dataset.reaction,icons={like:'👍',love:'❤️',care:'🥰',wow:'😮'};const card=t.closest('.post'),b=card.querySelector('[data-react]');b.querySelector('.action-icon').textContent=icons[type];b.querySelector('.action-label').textContent={like:'পছন্দ',love:'ভালোবাসা',care:'যত্ন',wow:'বিস্ময়'}[type];b.classList.add('active');$('.reaction-picker')?.remove();return}if(t.closest('[data-comment-send]')){const card=t.closest('.post'),i=card.querySelector('.comment-input'),v=i.value.trim();if(!v)return;const c=D.createElement('div');c.className='comment';c.innerHTML=`<div class="comment-avatar">আ</div><div class="comment-bubble"><a class="comment-author" href="founder-profile.html">আপনি</a>${esc(v)}</div>`;card.querySelector('.comment-row').before(c);i.value='';return}if(t.closest('[data-photo]')){const m=t.closest('[data-photo]');photoViewer(m.dataset.photo,m.dataset.caption);return}if(t.closest('[data-cover-edit]')){openEditor('cover',true);return}if(t.closest('#cover')&&!t.closest('button')){profileSheet('cover');return}if(t.closest('#avatarMain')){profileSheet('avatar');return}if(t.closest('[data-sheet-action]')){const a=t.closest('[data-sheet-action]'),target=a.dataset.target;$('#sheet').classList.add('hidden');if(a.dataset.sheetAction==='view')photoViewer(target==='avatar'?currentAvatar():currentCover(),target==='avatar'?state.avatarCaption:state.coverCaption);else openEditor(target,a.dataset.sheetAction==='reposition');return}if(t.closest('[data-close-sheet]')){$('#sheet').classList.add('hidden');$('#backdrop').classList.remove('show');return}if(t.closest('[data-open-story]')){$('#sheet').classList.add('hidden');storyDrawer();return}if(t.closest('[data-story-touch]')){storyDrawer();return}if(t.closest('[data-story]')){const i=Number(t.closest('[data-story]').dataset.story);$('#storyName').textContent=names[i%names.length];$('#storyText').textContent=['আজকের আকাশে একটু বেশি নীল ছিল।','কবিতা লিখতে গিয়ে নিজের কাছেই ফিরে এলাম।','একটি গাছের ছায়া আজ অনেক কথা বলল।'][i%3];return}if(t.closest('[data-story-prev]')||t.closest('[data-story-next]')){const i=Math.floor(Math.random()*names.length);$('#storyName').textContent=names[i];return}if(t.closest('[data-close-drawer]')||t.id==='backdrop'){closeDrawers();$('#sheet').classList.add('hidden');return}if(t.closest('[data-side-panel]')){const k=t.closest('[data-side-panel]').dataset.sidePanel;panel(t.closest('[data-side-panel]').textContent.trim(),panelContent(k));return}if(t.closest('[data-panel-action]')){toast('সেটিং সংরক্ষিত হয়েছে');return}if(t.closest('[data-profile-more]')){$('#profileMenu').classList.toggle('hidden');return}if(!t.closest('#profileMenu'))$('#profileMenu').classList.add('hidden');if(t.closest('[data-profile-action]')){const a=t.closest('[data-profile-action]').dataset.profileAction;if(a==='settings')panel('Settings',panelContent('settings'));else toast('অপশনটি কার্যকর হয়েছে');return}if(t.closest('[data-open-composer]')){t.closest('.composer').querySelector('.composer-panel').classList.remove('hidden');return}if(t.closest('[data-publish]')){const type=$('#composeType').value,title=$('#composeTitle').value.trim(),body=$('#composeBody').value.trim();if(!type||!title||!body){toast('বিষয়, শিরোনাম ও লেখা পূরণ করুন');return}posts.unshift({id:'user-'+Date.now(),type,title,body,createdAt:new Date().toISOString(),likes:0,comments:0,privacy:'Public'});savePosts();return}if(t.closest('[data-open-archive]')){e.preventDefault();const id=t.closest('[data-open-archive]').dataset.openArchive;showTab('home');setTimeout(()=>{const c=$(`.post[data-id="${CSS.escape(id)}"]`);if(c){c.classList.add('expanded');c.scrollIntoView({behavior:'smooth',block:'center'})}},80);return}if(t.closest('[data-tab]')){showTab(t.closest('[data-tab]').dataset.tab);closeDrawers();return}if(t.closest('[data-left-edge]'))openDrawer('leftDrawer');if(t.closest('[data-right-edge]'))openDrawer('rightDrawer');if(t.closest('[data-follow]')){t.closest('[data-follow]').textContent=t.closest('[data-follow]').textContent.includes('Follow Back')?'Friends':'Following';toast('সম্পর্কের অবস্থা পরিবর্তন হয়েছে');return}if(t.closest('[data-edit-profile]')){panel('প্রোফাইল সম্পাদনা',`<div class="archive-list"><div class="archive-item">Bio-তে double-click করে সম্পাদনা করুন</div><button class="side-link" data-sheet-action="change" data-target="avatar"><span class="side-icon">◎</span>প্রোফাইল ছবি পরিবর্তন</button><button class="side-link" data-sheet-action="change" data-target="cover"><span class="side-icon">▧</span>কভার পরিবর্তন</button></div>`);return}if(t.closest('[data-close-editor]')){$('#editorModal').classList.add('hidden');return}if(t.closest('[data-save-editor]')){saveEditor();return}if(t.closest('[data-close-photo]')){$('#photoViewer').classList.add('hidden');return}const post=t.closest('.post');if(post&&!t.closest('button,a,input,textarea,select,audio,video,.comments,.post-menu')){post.classList.toggle('expanded');const b=post.querySelector('.read-more');if(b)b.textContent=post.classList.contains('expanded')?'কম দেখুন ↑':'আরও দেখুন →';return}},true);
$('#bioText').addEventListener('dblclick',()=>{if(!OWNER)return;const el=$('#bioText');el.contentEditable='true';el.focus();document.execCommand('selectAll',false,null)});$('#bioText').addEventListener('blur',()=>{if(!OWNER)return;state.bio=$('#bioText').textContent.trim();write(profileKey,state);$('#bioText').contentEditable='false';toast('Bio সংরক্ষিত হয়েছে')});
['editZoom','editX','editY'].forEach(id=>$('#'+id).addEventListener('input',syncEditor));$('#editorFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{editData=r.result;$('#editorPreview').src=editData};r.readAsDataURL(f)});
function buildSides(){const left=`<section class="side-card"><div class="side-title"><strong>আপন ভুবন</strong><small>ব্যক্তিগত কেন্দ্র</small></div><div class="side-list"><button class="side-link" data-side-panel="settings"><span class="side-icon">⚙</span>Settings</button><button class="side-link" data-side-panel="memories"><span class="side-icon">☆</span>Memories</button><button class="side-link" data-side-panel="saved"><span class="side-icon">▱</span>Saved</button><button class="side-link" data-side-panel="archive"><span class="side-icon">◫</span>Archive</button><button class="side-link" data-story-touch><span class="side-icon">✦</span>Story Touch</button></div></section><section class="side-card"><div class="side-title"><strong>প্রিয় কবি</strong></div><div class="side-list">${['জীবনানন্দ দাশ','কাজী নজরুল ইসলাম','রবীন্দ্রনাথ ঠাকুর','সুফিয়া কামাল'].map(x=>`<a class="side-link" href="profile.html?user=${encodeURIComponent(x)}"><span class="side-icon">✧</span>${x}</a>`).join('')}</div></section>`;const right=`<section class="side-card"><div class="side-title"><strong>সাহিত্যিক অবদান</strong></div><div class="side-list"><button class="side-link" data-tab="poem"><span class="side-icon">ক</span>মোট কবিতা: ${posts.filter(x=>x.type==='poem').length}</button><button class="side-link" data-tab="recitation"><span class="side-icon">◉</span>মোট আবৃত্তি: ${posts.filter(x=>x.type==='recitation').length}</button><button class="side-link" data-tab="edit"><span class="side-icon">✎</span>মোট সম্পাদনা: ${posts.filter(x=>x.type==='edit').length}</button><button class="side-link" data-side-panel="notifications"><span class="side-icon">♢</span>Notifications</button><button class="side-link" data-side-panel="messages"><span class="side-icon">▢</span>Messenger</button></div></section><section class="side-card"><div class="side-title"><strong>সক্রিয় বন্ধুরা</strong></div>${names.slice(0,5).map(n=>`<a class="mini-person" href="profile.html?user=${encodeURIComponent(n)}"><span class="mini-avatar">${n[0]}</span><span><strong>${n}</strong><small>এখন সক্রিয়</small></span><span class="online"></span></a>`).join('')}</section>`;$('#leftSide').innerHTML=left;$('#rightSide').innerHTML=right;$('#leftDrawerBody').innerHTML=left;$('#rightDrawerBody').innerHTML=right}
applyProfile();buildSides();showTab('home');
</script></body></html>
