<style>

eight:calc(100dvh - var(--app));margin:auto;padding:12px;display:grid;grid-template-columns:220px minmax(0,1fr) 235px;gap:12px;overflow:hidden}.side{min-height:0;overflow:auto;scrollbar-width:none}.side::-webkit-scrollbar,.center::-webkit-scrollbar,.drawer::-webkit-scrollbar{display:none}.center{min-width:0;overflow:auto;scrollbar-width:none;padding:0 1px 40px}.glass{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 86%,var(--primary) 14%));box-shadow:var(--shadow)}.identity{padding:14px;text-align:center}.leaf{width:48px;height:48px;margin:auto;display:grid;place-items:center;border:1px solid rgba(58,164,122,.20);border-radius:15px;background:var(--surface2);font-size:30px}.identity h3{margin:8px 0 0;color:var(--primary);font-size:17px}.identity p{margin:4px 0 0;color:var(--soft);font-size:10px;line-height:1.55}.quote{margin-top:9px;padding:8px;border-left:3px solid var(--primary);border-radius:9px;background:color-mix(in srgb,var(--primary) 7%,transparent);color:var(--soft);font-size:9px}.menu-card{margin-top:9px;padding:7px}.menu{display:grid;gap:4px}.menu-item{min-height:39px;padding:7px 8px;border:1px solid transparent;border-radius:10px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:7px;align-items:center;color:var(--soft);font-size:10px;font-weight:700}.menu-item:hover,.menu-item.active{border-color:var(--line);background:var(--surface2);color:var(--primary)}.menu-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 10%,var(--surface2));font-size:14px}.contact{margin-top:9px;padding:11px;font-size:9px;color:var(--soft)}.contact a{display:block;color:var(--primary);font-weight:800}.right-card{padding:13px;margin-bottom:9px}.right-card h3{margin:0 0 8px;font-size:15px}.mini{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;color:var(--soft);font-size:10px}.mini:first-of-type{border-top:0}.hero{padding:20px}.hero small{color:var(--green);font-weight:800}.hero h1{margin:3px 0 0;font-size:28px}.hero p{margin:7px 0 0;color:var(--soft);font-size:11px;line-height:1.7}.toolbar{margin-top:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:8px}.toolbar input,.toolbar select{min-height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--ink);padding:0 12px;outline:none}.on-this-day{margin-top:12px;padding:16px}.on-this-day h2{margin:0;font-size:18px}.on-this-day p{margin:4px 0 0;color:var(--soft);font-size:10px}.list{display:grid;gap:11px;margin-top:12px}.memory-card{padding:15px}.memory-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.memory-kind{display:inline-flex;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--primary) 10%,var(--surface2));color:var(--primary);font-size:9px;font-weight:800}.memory-date{color:var(--muted);font-size:9px}.memory-card h2{margin:9px 0 0;font:700 20px/1.45 var(--font-literary)}.memory-card p{margin:7px 0 0;color:var(--soft);font:500 11px/1.75 var(--font-literary)}.memory-actions{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.memory-actions a,.memory-actions button{min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--primary);font-weight:800}.memory-actions button.danger{color:var(--danger)}.empty{margin-top:12px;padding:38px 18px;text-align:center}.empty .bubble{font-size:42px}.empty h2{margin:8px 0 0}.empty p{margin:5px auto 0;max-width:520px;color:var(--soft);font-size:11px}.edge,.drawer,.backdrop{display:none}.toast{position:fixed;left:50%;bottom:24px;z-index:4000;max-width:calc(100% - 30px);padding:10px 15px;border-radius:999px;background:#173a63;color:#fff;opacity:0;transform:translate(-50%,12px);transition:.18s;pointer-events:none}.to @media(max-width:900px){.layout{height:auto;display:block;padding:10px 18px 70px}.side{display:none}.center{overflow:visible;padding-bottom:20px}.hero h1{font-size:24px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.edge{position:fixed;top:58%;z-index:1900;width:18px;height:54px;padding:0;border:1px solid rgba(123,91,219,.26);display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(221,213,255,.92),rgba(134,91,226,.84));color:#fff;font-size:15px;font-weight:900;box-shadow:0 8px 18px rgba(74,50,143,.18);transform:translateY(-50%)}.edge.left{left:0;border-left:0;border-radius:0 9px 9px 0}.edge.right{right:0;border-right:0;border-radius:9px 0 0 9px}.backdrop{position:fixed;inset:var(--app) 0 0;z-index:1990;background:rgba(12,17,35,.40);backdrop-filter:blur(2px)}.backdrop.open{display:block}.drawer{position:fixed;top:var(--app);bottom:0;z-index:2000;width:min(320px,88vw);display:block;padding:10px;overflow:auto;background:var(--bg);box-shadow:0 18px 55px rgba(24,18,54,.28);transition:transform .22s ease}.drawer.left{left:0;border-right:1px solid var(--line);transform:translateX(-104%)}.drawer.right{right:0;border-left:1px solid var(--line);transform:translateX(104%)}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:-10px;z-index:3;min-height:54px;margin:-10px -10px 10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 97%,transparent);backdrop-filter:blur(18px)}.drawer-close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink);font-size:22px}}
@media(max-width:520px){.app-copy strong{font-size:16px}.app-copy small{display:none}.layout{padding-left:18px;padding-right:18px}.hero{padding:15px}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.memory-card h2{font-size:18px}}

<body>
<header class="appbar"><button class="app-back" type="button" aria-label="পিছনে" onclick="history.back()">‹</button><div class="app-copy"><strong>মেমোরিজ</strong><small>আপনার সংরক্ষিত সাহিত্যিক স্মৃতি</small></div><a class="app-home" href="index.html" aria-label="হোম">⌂</a></header>
<button class="edge left" id="leftEdge" type="button" aria-label="বাম সাইডবার">›</button><button class="edge right" id="rightEdge" type="button" aria-label="ডান সাইডবার">‹</button><div class="backdrop" id="backdrop"></div><aside class="drawer left" id="leftDrawer"></aside><aside class="drawer right" id="rightDrawer"></aside>
<div class="layout"><aside class="side" id="leftSidebar"></aside><main class="center"><section class="glass hero"><small>আপনার ব্যক্তিগত ভুবন</small><h1>মেমোরিজ</h1><p>Index বা Profile থেকে “স্মৃতিতে রাখুন / Save” করা লেখা এখানে থাকবে। একই পোস্ট দুইবার দেখানো হবে না।</p></section><section class="glass toolbar"><input id="searchBox" type="search" placeholder="শিরোনাম বা লেখক খুঁজুন"><select id="typeFilter"><option value="all">সব ধরন</option><option value="poem">কবিতা</option><option value="recitation">আবৃত্তি</option><option value="letter">চিঠিপত্র</option><option value="prolap">ছোট কথার প্রলাপ</option><option value="environment">পরিবেশ</option></select><select id="sortFilter"><option value="new">নতুন আগে</option><option value="old">পুরোনো আগে</option></select></section><section class="glass on-this-day" id="onThisDay"></section><div class="list" id="memoryList"></div><section class="glass empty" id="emptyState" hidden><div class="bubble">◷</div><h2>এখনো কোনো মেমোরি নেই</h2><p>Index বা Profile-এর কোনো পোস্টে Save/স্মৃতিতে রাখুন চাপলে সেটি এখানে দেখা যাবে।</p></section></main><aside class="side" id="rightSidebar"></aside></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const D=document,H=D.documentElement,B=D.body,q=(s,c=D)=>c.querySelector(s),qa=(s,c=D)=>[...c.querySelectorAll(s)];
const theme=localStorage.getItem('bhubondangaTheme')||localStorage.getItem('bd-theme')||'light';const style=localStorage.getItem('bhubondangaGlassStyle')||'pearl';H.dataset.theme=['light','middle','dark'].includes(theme)?theme:'light';H.dataset.style=style;
function safe(v,f=[]){try{const x=JSON.parse(v);return Array.isArray(x)?x:f}catch{return f}}
function toast(t){const x=q('#toast');x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),2000)}
const menu=[['⌂','হোম','index.html'],['▤','কবিতা','poem.html'],['◉','আবৃত্তি','recitation.html'],['☾','মধ্যরাতের প্রলাপ','madhyorater-prolap.html'],['☆','খ্যাতিমান কবি','famous-poet.html'],['☁','ছোট কথার প্রলাপ','small-prolap.html'],['✉','চিঠিপত্র','letter.html'],['❝','মনীষীদের বাণী','famous-quotes.html'],['◌','সাহিত্য আলোচনা','discussion.html'],['♧','পরিবেশের কথা','environment.html'],['♙','ভুবনডাঙ্গার লেখক','bhubondangar-lekhok.html'],['✉','ইনবক্স','messages.html'],['♢','নোটিফিকেশন','notifications.html'],['◷','মেমোরিজ','memories.html'],['⚙','সেটিংস','settings.html']];
function leftHtml(){return `<section class="glass identity"><div class="leaf">🌿</div><h3><a href="index.html">আপন ভুবন</a></h3><p>আপনার লেখা, পাঠ ও সাহিত্যিক পথচলার নিজস্ব জায়গা।</p><div class="quote">“আপনার ক্ষতগুলোকে জ্ঞানে পরিণত করুন।”</div></section><section class="glass menu-card"><nav class="menu">${menu.map(x=>`<a class="menu-item ${x[2]==='memories.html'?'active':''}" href="${x[2]}"><span class="menu-icon">${x[0]}</span><span>${x[1]}</span><span>›</span></a>`).join('')}</nav></section><section class="glass contact"><a href="founder-profile.html">জরুরি প্রয়োজনে মাহমুদ সোহেলের সঙ্গে যোগাযোগ করুন</a><p>প্রতিষ্ঠাতার প্রোফাইল ও যোগাযোগের মাধ্যম দেখুন।</p></section>`}
function rightHtml(){return `<section class="glass right-card"><h3>মেমোরি পরিসংখ্যান</h3><div class="mini"><span>মোট সংরক্ষিত</span><b data-total>০</b></div><div class="mini"><span>এই দিনের স্মৃতি</span><b data-today>০</b></div><div class="mini"><span>কবিতা</span><b data-poems>০</b></div></section><section class="glass right-card"><h3>দ্রুত প্রবেশ</h3><div class="mini"><a href="profile.html">আমার প্রোফাইল</a><span>›</span></div><div class="mini"><a href="archive.html">আর্কাইভ</a><span>›</span></div><div class="mini"><a href="settings.html">সেটিংস</a><span>›</span></div></section>`}
function renderSides(){q('#leftSidebar').innerHTML=leftHtml();q('#rightSidebar').innerHTML=rightHtml();q('#leftDrawer').innerHTML=`<div class="drawer-head"><strong>🌿 আপন ভুবন</strong><button class="drawer-close" data-close type="button">×</button></div>${leftHtml()}`;q('#rightDrawer').innerHTML=`<div class="drawer-head"><strong>মেমোরিজ</strong><button class="drawer-close" data-close type="button">×</button></div>${rightHtml()}`}
function openDrawer(w){closeDrawers();q('#backdrop').classList.add('open');q(w==='left'?'#leftDrawer':'#rightDrawer').classList.add('open');B.classList.add('drawer-open')}function closeDrawers(){qa('.drawer').forEach(x=>x.classList.remove('open'));q('#backdrop').classList.remove('open');B.classList.remove('drawer-open')}
q('#leftEdge').onclick=()=>openDrawer('left');q('#rightEdge').onclick=()=>openDrawer('right');q('#backdrop').onclick=closeDrawers;D.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeDrawers()});
function normalize(){const a=safe(localStorage.getItem('bhubondangaMemories'));const b=safe(localStorage.getItem('bhubondangaSavedItems'));const map=new Map();[...a,...b].forEach((x,i)=>{if(!x)return;const id=String(x.id||x.post_id||x.url||('m'+i));if(!map.has(id))map.set(id,{id,type:String(x.type||x.kind||'poem').toLowerCase(),title:x.title||'সংরক্ষিত লেখা',author:x.author||x.authorName||'',url:x.url||('post-details.html?id='+encodeURIComponent(id)),savedAt:x.savedAt||x.createdAt||new Date().toISOString(),body:x.body||''})});return [...map.values()]}
function typeLabel(v){const s=String(v||'').toLowerCase();if(s.includes('recit'))return'আবৃত্তি';if(s.includes('letter'))return'চিঠিপত্র';if(s.includes('prolap'))return'ছোট কথার প্রলাপ';if(s.includes('environment'))return'পরিবেশ';return'কবিতা'}
function bn(n){return Number(n||0).toLocaleString('bn-BD')}function fmt(v){try{return new Intl.DateTimeFormat('bn-BD',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}catch{return''}}
let all=normalize();
function sameDay(x){const d=new Date(x.savedAt),n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()}
function render(){const search=q('#searchBox').value.trim().toLowerCase(),type=q('#typeFilter').value,sort=q('#sortFilter').value;let list=all.filter(x=>(!search||(x.title+' '+x.author+' '+x.body).toLowerCase().includes(search))&&(type==='all'||String(x.type).includes(type)));list.sort((a,b)=>(new Date(b.savedAt)-new Date(a.savedAt))*(sort==='new'?1:-1));q('#memoryList').innerHTML=list.map(x=>`<article class="glass memory-card" data-id="${String(x.id).replace(/"/g,'&quot;')}"><div class="memory-top"><span class="memory-kind">${typeLabel(x.type)}</span><span class="memory-date">${fmt(x.savedAt)}</span></div><h2>${escapeHtml(x.title)}</h2>${x.author?`<p>${escapeHtml(x.author)}</p>`:''}${x.body?`<p>${escapeHtml(x.body.slice(0,350))}${x.body.length>350?'…':''}</p>`:''}<div class="memory-actions"><a href="${escapeAttr(x.url)}">খুলুন</a><button type="button" class="danger" data-remove="${escapeAttr(x.id)}">স্মৃতি থেকে সরান</button></div></article>`).join('');q('#emptyState').hidden=list.length>0;const today=all.filter(sameDay);q('#onThisDay').innerHTML=`<h2>এই দিনের স্মৃতি</h2><p>${today.length?`আজকের তারিখে ${bn(today.length)}টি সংরক্ষিত স্মৃতি আছে।`:'আজকের তারিখের পুরোনো স্মৃতি পাওয়া যায়নি।'}</p>`;qa('[data-total]').forEach(x=>x.textContent=bn(all.length));qa('[data-today]').forEach(x=>x.textContent=bn(today.length));qa('[data-poems]').forEach(x=>x.textContent=bn(all.filter(a=>typeLabel(a.type)==='কবিতা').length))}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function remove(id){all=all.filter(x=>String(x.id)!==String(id));const ids=new Set(all.map(x=>String(x.id)));const a=safe(localStorage.getItem('bhubondangaMemories')).filter(x=>ids.has(String(x.id||x.post_id||x.url)));const b=safe(localStorage.getItem('bhubondangaSavedItems')).filter(x=>ids.has(String(x.id||x.post_id||x.url)));localStorage.setItem('bhubondangaMemories',JSON.stringify(a));localStorage.setItem('bhubondangaSavedItems',JSON.stringify(b));render();toast('মেমোরিজ থেকে সরানো হয়েছে')}
q('#searchBox').addEventListener('input',render);q('#typeFilter').addEventListener('change',render);q('#sortFilter').addEventListener('change',render);D.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){e.preventDefault();remove(b.dataset.remove)}});renderSides();render();
})();
</script>

<script id="bd-v870-single-drawer-guard">(()=>{'use strict';function run(){if(innerWidth>900)return;const selectors=['.edge-menu-left,.edge.left',' .edge-menu-right,.edge.right'];selectors.forEach(s=>{const a=[...document.querySelectorAll(s.trim())];a.slice(1).forEach(x=>x.remove())});['mobileDrawer','rightMobileDrawer','drawerBackdrop'].forEach(id=>{const a=[...document.querySelectorAll('[id="'+id+'"]')];a.slice(1).forEach(x=>x.remove())})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{run();setTimeout(run,350)},{once:true});else{run();setTimeout(run,350)}addEventListener('resize',run,{passive:true})})();</script>
