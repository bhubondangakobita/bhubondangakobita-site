<!doctype html><html lang="bn" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>মেমোরিজ | ভুবনডাঙ্গার কবিতা</title><link rel="stylesheet" href="bhubondanga-core.css"><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;font-family:'Noto Serif Bengali',serif}.memory-app{width:min(980px,calc(100% - 24px));margin:auto;padding:12px 0 80px}.memory-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--bd-line);border-radius:20px;background:var(--bd-card);box-shadow:var(--bd-shadow)}.memory-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bd-text)}.memory-logo{width:46px;height:46px;border-radius:15px}.memory-brand strong{display:block;font-size:21px}.memory-brand small{display:block;color:var(--bd-soft);font-size:9px}.memory-back{padding:9px 13px;border:1px solid var(--bd-line);border-radius:13px;background:var(--bd-card-strong);color:var(--bd-primary);font-weight:800;text-decoration:none}.memory-ticker{height:38px;margin-top:9px;overflow:hidden;border:1px solid var(--bd-line);border-radius:15px;background:var(--bd-card)}.memory-hero{margin-top:11px;padding:18px;border:1px solid var(--bd-line);border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--bd-primary) 12%,var(--bd-card)),color-mix(in srgb,var(--bd-primary-2) 10%,var(--bd-card)));box-shadow:var(--bd-shadow)}.memory-hero h1{margin:0;font-size:25px}.memory-hero p{margin:5px 0 0;color:var(--bd-soft)}.memory-list{display:grid;gap:11px;margin-top:12px}.memory-card{padding:15px;border:1px solid var(--bd-line);border-radius:20px;background:var(--bd-card);box-shadow:var(--bd-shadow)}.memory-card h2{margin:0 0 5px;font-size:19px}.memory-card p{white-space:pre-line;color:var(--bd-soft)}.memory-card a{color:var(--bd-primary);font-weight:800;text-decoration:none}.memory-empty{padding:32px;text-align:center;color:var(--bd-soft);border:1px solid var(--bd-line);border-radius:20px;background:var(--bd-card)}@media(max-width:600px){.memory-app{width:calc(100% - 16px)}.memory-brand strong{font-size:17px}.memory-brand small{font-size:8px}.memory-hero h1{font-size:21px}}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="supabase-config.js"></script><script defer src="supabase-auth.js"></script><script defer src="bhubondanga-core.js"></script></head><body><main class="memory-app"><header class="memory-head"><a class="memory-brand" href="index.html"><span class="memory-logo bhubondanga-leaf-host" data-bd-leaf="1"><svg class="bhubondanga-leaf" viewBox="0 0 64 64" aria-hidden="true"><path d="M18 51C25 39 34 27 49 13"/><path d="M26 39C17 38 11 33 9 24c9-1 16 3 20 10"/><path d="M34 29c-2-9 1-17 10-22 5 8 3 16-4 23"/><path d="M42 21c3-8 9-13 18-13 0 9-5 16-14 19"/><path d="M20 48c-7 1-13-1-17-7 6-4 13-3 19 2"/></svg></span><span><strong>ভুবনডাঙ্গার কবিতা</strong><small>বাংলা কবিতা ও সাহিত্যচর্চার একটি মুক্ত ভুবন</small></span></a><a class="memory-back" href="profile.html">প্রোফাইল</a></header><div class="memory-ticker date-strip"></div><section class="memory-hero"><h1>মেমোরিজ</h1><p>এক বছর বা তারও আগের একই সময়ের লেখা ও সাহিত্যিক স্মৃতি।</p></section><section class="memory-list" id="memoryList"><div class="memory-empty">স্মৃতি খোঁজা হচ্ছে…</div></section></main><script>(function(){'use strict';const list=document.getElementById('memoryList'),read=(k,f=[])=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function sameSeason(d,now){return d.getFullYear()<=now.getFullYear()-1&&Math.abs((d.getMonth()*31+d.getDate())-(now.getMonth()*31+now.getDate()))<=7}function render(items){items.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));list.innerHTML=items.length?items.map(x=>`<article class="memory-card"><small>${esc(new Date(x.createdAt).toLocaleDateString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'long'}))}</small><h2>${esc(x.title||'শিরোনামহীন লেখা')}</h2><p>${esc(x.body||'')}</p><a href="post-details.html?id=${encodeURIComponent(x.id||'')}">পূর্ণ লেখা পড়ুন →</a></article>`).join(''):'<div class="memory-empty">এখনো এক বছর আগের কোনো স্মৃতি পাওয়া যায়নি। সময় হলে এখানে স্বয়ংক্রিয়ভাবে দেখা যাবে।</div>'}async function load(){const now=new Date(),local=read('bhubondangaHomeUserPosts',[]).filter(x=>x&&x.createdAt&&sameSeason(new Date(x.createdAt),now));let remote=[];try{const sb=window.BhubondangaAuth?.client;if(sb){const u=(await sb.auth.getUser()).data?.user;if(u){const limit=new Date(now);limit.setFullYear(now.getFullYear()-1);const r=await sb.from('posts').select('*').eq('author_id',u.id).lte('created_at',limit.toISOString()).order('created_at',{ascending:false}).limit(200);remote=(r.data||[]).filter(x=>sameSeason(new Date(x.created_at),now)).map(x=>({id:x.id,title:x.title,body:x.body,createdAt:x.created_at}))}}}catch{}const map=new Map();[...remote,...local].forEach(x=>map.set(String(x.id||x.createdAt),x));render([...map.values()])}window.addEventListener('load',load,{once:true}) })();</script></body></html>
