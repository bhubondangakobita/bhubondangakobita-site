<!doctype html><html lang="bn" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#eef3fa"><title>Post | ভুবনডাঙ্গার কবিতা</title>
<link rel="stylesheet" href="feed-base.css" data-bd-feed-base><link rel="stylesheet" href="bhubondanga-social-lock.css" data-bd-social-lock>
<style>:root{--bd-bg:#eef3fa;--bd-card2:#fff;--bd-text:#173153;--bd-line:rgba(82,104,154,.16)}html[data-theme=dark]{--bd-bg:#081526;--bd-card2:#0e1d30;--bd-text:#edf4ff;--bd-line:rgba(154,179,225,.17)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bd-bg);color:var(--bd-text);font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif}body{overflow-x:hidden}.bd-post-focus-shell{background:var(--bd-bg)}.bd-post-focus-root{padding:0 0 90px}.bd-post-focus-root>.bd-feed-root>.bd-post{border-radius:0!important;border-inline:0!important;margin:0!important;box-shadow:none!important}@media(min-width:761px){.bd-post-focus-shell{border-inline:1px solid var(--bd-line);background:var(--bd-card2)}.bd-post-focus-root>.bd-feed-root>.bd-post{border-radius:18px!important;border:1px solid var(--bd-line)!important;margin:12px!important}}</style>
</head><body><main class="bd-post-focus-shell"><header class="bd-focus-back"><button type="button" onclick="history.length>1?history.back():location.replace('index.html')" aria-label="Back">‹</button><b>Post</b></header><div id="postFocusRoot" class="bd-post-focus-root"><div style="padding:32px;text-align:center">লোড হচ্ছে…</div></div></main>
<script src="bhubondanga-social-lock.js" data-bd-social-lock></script><script>
(async()=>{const root=document.getElementById('postFocusRoot'),q=new URLSearchParams(location.search),want=String(q.get('post')||q.get('id')||''),comments=q.get('comments')==='1';try{const t=await fetch('feed.html',{cache:'no-cache'}).then(r=>r.text()),doc=new DOMParser().parseFromString(t,'text/html');for(const st of doc.querySelectorAll('style[id],style[data-bd-component-style]')){if(st.id&&document.getElementById(st.id))continue;const n=document.createElement('style');if(st.id)n.id=st.id;n.textContent=st.textContent;document.head.appendChild(n)}root.innerHTML=doc.body.innerHTML;for(const src of doc.querySelectorAll('script[data-bd-module]')){const n=document.createElement('script');n.text=src.textContent;document.body.appendChild(n)}const mod=window.BD_MODULES?.feed;if(!mod)throw new Error('feed module');const data=await mod.mount(root,{mode:'post-focus'});await new Promise(r=>setTimeout(r,90));let cards=[...root.querySelectorAll('[data-post-id]')],card=want?cards.find(x=>String(x.dataset.postId)===want):cards[0];if(!card&&want){await data?.loadMore?.();await new Promise(r=>setTimeout(r,80));cards=[...root.querySelectorAll('[data-post-id]')];card=cards.find(x=>String(x.dataset.postId)===want)}cards.forEach(x=>x.hidden=!!card&&x!==card);root.querySelectorAll('.bd-human,[data-bd75-suggest],[data-load-more]').forEach(x=>x.hidden=true);if(card){card.hidden=false;card.scrollIntoView({block:'start'});if(comments){setTimeout(()=>{card.querySelector('[data-comment-open]')?.click();const inp=card.querySelector('.bd-comment-form input,.bd-comment-form textarea');try{inp?.focus({preventScroll:true})}catch(_){inp?.focus()}},140)}}else root.innerHTML='<div style="padding:38px;text-align:center">পোস্টটি পাওয়া যায়নি।</div>'}catch(e){console.warn(e);root.innerHTML='<div style="padding:38px;text-align:center">পোস্ট লোড করা যায়নি।</div>'}})();
</script></body></html>
