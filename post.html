<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Post | ভুবনডাঙ্গার কবিতা</title><style>html,body{margin:0;min-height:100%;background:#fff;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}#postRoot{max-width:760px;margin:auto;padding:0 8px 40px}.top{height:58px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;border-bottom:1px solid #e6e8ee;position:sticky;top:0;background:#fff;z-index:20}.top a{font-size:30px;text-decoration:none;color:#15233b;text-align:center}.top b{text-align:center;font-size:18px}input,textarea{font-size:16px!important}</style></head><body><header class="top"><a href="javascript:history.back()">‹</a><b>Post</b><span></span></header><main id="postRoot"></main><script>window.BD_MODULES=window.BD_MODULES||{};async function load(){const r=await fetch('feed.html?v=95',{cache:'no-store'}),h=await r.text(),d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('style').forEach(x=>document.head.appendChild(x.cloneNode(true)));for(const s of d.querySelectorAll('script')){if(s.src)continue;const n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n)}const id=new URLSearchParams(location.search).get('post')||'';const root=document.getElementById('postRoot');const feed=await window.BD_MODULES.feed?.mount(root,{context:'index',hideHumanitarian:true,hideFilters:true});setTimeout(()=>{const c=root.querySelector('.bd-post[data-post-id="'+CSS.escape(id)+'"]');if(c)window.dispatchEvent(new CustomEvent('bd:v95-open-post',{detail:{id}}))},80)}load()</script></body></html>
