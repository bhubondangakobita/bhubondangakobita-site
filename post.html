<!doctype html><html lang="bn"><head><meta name="bhubondanga-build" content="V134"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Post | ভুবনডাঙ্গার কবিতা</title><style>html,body{margin:0;min-height:100%;background:#f5f7fa;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;overflow-x:hidden}*{box-sizing:border-box}button,a{touch-action:manipulation}input,textarea{font-size:16px!important}#postRoot{width:min(720px,100%);margin:0 auto;padding:0 0 96px}.top{height:52px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;border-bottom:1px solid #e3e7ed;position:sticky;top:0;background:rgba(255,255,255,.98);z-index:20}.top button{width:40px;height:40px;margin:auto;border:0;background:transparent;border-radius:50%;font-size:30px;color:#15233b}.top button:active{background:#edf1f4;transform:scale(.94)}.top b{text-align:center;font-size:17px}.fail{margin:18px;padding:18px;border-radius:16px;background:#fff;border:1px solid #e3e7ed;color:#647287;text-align:center}.fail button{margin-top:10px;min-height:40px;padding:0 16px;border:0;border-radius:10px;background:#176b56;color:#fff;font-weight:700}</style></head><body><header class="top"><button type="button" onclick="history.length>1?history.back():location.replace('index.html')">‹</button><b>Post</b><span></span></header><main id="postRoot"></main><script>window.BD_MODULES=window.BD_MODULES||{};async function installFeed(){const r=await fetch('feed.html?v=134',{cache:'no-store'});if(!r.ok)throw new Error('feed');const h=await r.text(),d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('link[rel="stylesheet"]').forEach(x=>{const n=x.cloneNode(true);document.head.appendChild(n)});d.querySelectorAll('style').forEach(x=>document.head.appendChild(x.cloneNode(true)));for(const sc of d.querySelectorAll('script')){if(sc.src){const n=document.createElement('script');n.src=sc.src;document.body.appendChild(n);await new Promise((res,rej)=>{n.onload=res;n.onerror=rej})}else{const n=document.createElement('script');n.textContent=sc.textContent;document.body.appendChild(n)}}return window.BD_MODULES.feed}async function boot(){const root=document.getElementById('postRoot'),id=new URLSearchParams(location.search).get('post')||new URLSearchParams(location.search).get('id')||'';try{const feed=await installFeed();if(!feed)throw new Error('module');await feed.mount(root,{context:'post',postId:id,hideHumanitarian:true,hideFilters:true})}catch(e){root.innerHTML='<div class="fail">পোস্টটি লোড করা যায়নি।<br><button onclick="location.reload()">আবার চেষ্টা করুন</button></div>'}}boot()</script></body></html>
