}

async function bdV48Session(){const c=await ensureSupabase();if(c){try{const ss=(await c.auth.getSession()).data?.session;let role='user';if(ss?.user?.id){try{const rr=await c.from('user_roles').select('role,active').eq('user_id',ss.user.id).eq('active',true);if(!rr.error&&Array.isArray(rr.data)){if(rr.data.some(x=>String(x.role).toLowerCase()==='founder'))role='founder';else if(rr.data.some(x=>String(x.role).toLowerCase()==='admin'))role='admin';else if(rr.data[0]?.role)role=String(rr.data[0].role).toLowerCase()}}catch(_){}}if(role==='user')role=String(ss?.user?.app_metadata?.role||ss?.user?.user_metadata?.role||'user').toLowerCase();H.dataset.role=role;W.BD_ROLE=role;W.BD_SESSION=ss||null;try{localStorage.setItem('bd-role',role)}catch(_){}}catch(_){}}return c}
async function boot(){await bdV48Session();const left=Q('#leftHost'),center=Q('#centerHost'),right=Q('#rightHost');let sb=null;try{sb=await loadModule('sidebars','sidebars.html')}catch(_){}if(sb){try{await sb.mount({left,right,context:'info'})}catch(_){}}center.innerHTML="<div class=\"bd-info-shell\"><section class=\"bd-info-card\"><h1>গোপনীয়তা ও নিরাপত্তা</h1></section><section class=\"bd-info-card\"><h2>01 অ্যাকাউন্ট ও লগইন</h2><p>নাম, ইউজারনেম, ইমেইল বা সামাজিক লগইনের তথ্য আপনার অ্যাকাউন্ট চিনতে প্রয়োজন হতে পারে। পাসওয়ার্ড বা OTP কাউকে দেবেন না—ভুবনডাঙ্গার কোনো দায়িত্বশীল ব্যক্তিও এগুলো চেয়ে নেবে না।</p><p>একই ডিভাইসে লগইন থাকলে সেশন ধরে রাখার চেষ্টা করা হবে, যাতে অকারণে বারবার লগইন করতে না হয়। সন্দেহজনক কিছু মনে হলে পাসওয়ার্ড বদলে অন্য সেশন বন্ধ করুন।</p></section><section class=\"bd-info-card\"><h2>02 আপনি যা প্রকাশ করেন, কে তা দেখবে</h2><p>কবিতা, ছবি, ভিডিও, আবৃত্তি, চিঠি বা মন্তব্য প্রকাশ করলে আপনার নির্বাচিত audience সেটি দেখতে পারবে। Public, follower বা সীমিত দর্শক—যে অপশন দেওয়া থাকবে, তার অর্থ পরিষ্কারভাবে দেখানো হবে।</p><p>অন্যের ব্যক্তিগত তথ্য, ফোন নম্বর, ঠিকানা, চিকিৎসা তথ্য বা private message প্রকাশের আগে অনুমতি নিন। মানবিক আবেদনে যতটুকু প্রয়োজন ততটুকুই দিন।</p></section><section class=\"bd-info-card\"><h2>03 কপি সুরক্ষা আপনার পছন্দ</h2><p>যে লেখক নিজের লেখা অননুমোদিত কপি হওয়া কমাতে চান, তিনি copy protection চালু রাখতে পারবেন। তখন right-click বা সাধারণ copy action সীমিত করা হতে পারে।</p><p>আপনি যদি চান আপনার লেখা সহজে উদ্ধৃত বা কপি করা যাক, সেটিংস থেকে এই সুরক্ষা বন্ধ করতে পারবেন। এটি লেখকের নিজের সিদ্ধান্ত।</p></section><section class=\"bd-info-card\"><h2>04 Inbox, draft, archive ও ব্যক্তিগত অংশ</h2><p>Private message, draft এবং ব্যক্তিগত archive সাধারণ browsing-এর অংশ নয়। কোনো নির্দিষ্ট বার্তা বা কনটেন্ট রিপোর্ট হলে প্রয়োজনীয় অংশ সীমিতভাবে review করা হতে পারে—পুরো ব্যক্তিগত জীবন ঘেঁটে দেখার জন্য নয়।</p><p>Archive ও Memories আপনার নিজের নিয়ন্ত্রণে থাকবে। ভুল করে সরানো কিছু থাকলে ফিরিয়ে আনার সুযোগ যতটা সম্ভব রাখা হবে।</p></section><section class=\"bd-info-card\"><h2>05 মন্তব্য, গালি সুরক্ষা ও রিপোর্ট</h2><p>পোস্ট ও মন্তব্যে গুরুতর অপমানজনক ভাষা কমাতে স্বয়ংক্রিয় safety filter ব্যবহার করা হয়। কোনো filter শতভাগ নিখুঁত নয়, তাই কৌশলে পাশ কাটানো অপমান দেখলে রিপোর্ট করুন।</p><p>Report করা ব্যক্তির পরিচয় সাধারণ ব্যবহারকারীর সামনে প্রকাশ করা হবে না। রিপোর্টের ভিত্তিতে সিদ্ধান্ত নেয়ার সময় কনটেক্সট, পুনরাবৃত্তি এবং ক্ষতির মাত্রা দেখা হবে।</p></section><section class=\"bd-info-card\"><h2>06 Admin ও Founder কী করতে পারবেন—আর কী করবেন না</h2><p>Admin প্রকাশ্য কনটেন্ট, রিপোর্ট, মানবিক আবেদন ও প্রয়োজনীয় moderation কাজ দেখতে পারবেন। Founder role, অনুমোদিত Page/Channel, আপিল এবং বড় নীতিগত সিদ্ধান্ত দেখবেন।</p><p>কারণ ছাড়া private inbox, password, recovery code বা ব্যক্তিগত draft দেখা আমাদের নীতির অংশ নয়। দায়িত্বশীল প্রশাসনের মানে ক্ষমতারও সীমা থাকা।</p></section><section class=\"bd-info-card\"><h2>07 আপনার সেটিংস, আপনার আরাম</h2><p>Theme, font, notification, message permission, online status, story archive, comment preference, default post audience, copy protection এবং accessibility—এসব একটি পরিষ্কার Settings পেজ থেকে নিয়ন্ত্রণ করা যাবে।</p><p>কোনো অপশন বুঝতে অসুবিধা হলে তার নিচে ছোট ব্যাখ্যা থাকবে। উন্নত অপশন থাকবে, কিন্তু সাধারণ ব্যবহারকারীকে জটিলতার মধ্যে ফেলবে না।</p></section><section class=\"bd-info-card\"><h2>08 অভিযোগ, নিরাপত্তা ও পরামর্শ</h2><p>কপিরাইট, পরিচয়, নিরাপত্তা, হয়রানি বা privacy নিয়ে সমস্যা হলে Report পেজ ব্যবহার করুন। কোনো feature আরও ভালো করা যায় মনে হলে নিচের পরামর্শ বক্সে লিখুন।</p><p>ভুল রিপোর্ট বা ভুল সিদ্ধান্ত হলে সংশোধনের পথ খোলা থাকবে। আমাদের লক্ষ্য কাউকে ভয় দেখানো নয়—সমস্যা দ্রুত, শান্তভাবে এবং ন্যায্যভাবে সমাধান করা।</p></section></div>";W.dispatchEvent(new CustomEvent('bd:index-ready'))}
const form=Q('#bdSearch');const inp=Q('#bdSearchInput'),panel=Q('#bdSearchPanel');function search(q){q=q.trim().toLocaleLowerCase('bn-BD');if(!q){panel.hidden=true;return}const items=[...POETS,...CATEGORIES.map(([name,route])=>({name,kind:'বিভাগ',route,search:name}))].filter(x=>x.search.toLocaleLowerCase('bn-BD').includes(q)).slice(0,10);panel.innerHTML=items.length?items.map(x=>`<a class="bd-search-hit" href="${x.route}"><span>${x.name[0]}</span><div><b>${x.name}</b><small>${x.kind}</small></div></a>`).join(''):'<div class="bd-slot-error">কিছু পাওয়া যায়নি।</div>';panel.hidden=false}inp.addEventListener('input',()=>search(inp.value));form.addEventListener('submit',e=>{e.preventDefault();const q=inp.value.trim();if(q)location.href='search.html?q='+encodeURIComponent(q)});D.addEventListener('click',e=>{if(!e.target.closest('.bd-search')&&!e.target.closest('#bdSearchPanel'))panel.hidden=true});
