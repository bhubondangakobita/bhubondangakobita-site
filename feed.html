function rootTpl(){return `<section class="bd-feed-root"><section class="bd-human bd-glass"><div class="bd-human-plus">＋</div><div><small style="color:#4d9b7e">জরুরি · সহায়তা কেন্দ্র</small><h3>মানবিক আবেদন</h3><p>রক্ত, চিকিৎসা, নিখোঁজ ব্যক্তি অথবা জরুরি সহায়তার আবেদন পাঠান। যাচাইয়ের পর অগ্রাধিকার পেতে পারে।</p></div><div class="bd-human-actions"><a href="humanitarian-notice.html">যাচাইকৃত নোটিশ</a><a href="humanitarian.html">আবেদন করুন</a></div></section><section class="bd-feed-filter bd-glass"><h3>আপনার নিউজফিড</h3><select data-feed-filter><option value="all">সব লেখা</option><option value="poem">কবিতা</option><option value="prolap">প্রলাপ</option><option value="news">নিউজ</option></select></section><div class="bd-posts" data-posts></div></section>`}
function load(){let a=[];try{a=JSON.parse(localStorage.getItem('bd-local-posts')||'[]')}catch(_){}return [...a,...DEMO].slice(0,60)}
function reactionIcon(type){return `<span class="bd-rx-mini" data-rx="${type}"></span>`}
function templateMarkup(p){if(p.type==='news'){const n=Number(p.newsTemplate||String(p.template||'').replace(/\D/g,'')||1);return `<div class="bd-news" data-news="${n}"><div class="bd-news-mast"><b>ভুবনডাঙ্গা সংবাদ</b><small>সাহিত্য · সমাজ · সংস্কৃতি</small></div><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p></div>`}if(p.template&&p.template!=='plain')return `<div class="bd-template-card ${esc(p.template)}"><h2>${esc(p.title)}</h2><p>${esc(p.body)}</p></div>`;return `<h2 class="bd-post-title">${esc(p.title)}</h2><div class="bd-post-body">${esc(p.body)}</div>`}
function tray(){return `<div class="bd-rx-tray"><img src="reaction-pyrise.webp" alt=""><div class="bd-rx-zones">${RX.map(x=>`<button class="bd-rx-zone" data-rx-pick="${x}" aria-label="${x}"></button>`).join('')}</div></div>`}
function postMarkup(p){return `<article class="bd-post bd-glass" data-post-id="${esc(p.id)}" data-type="${esc(p.type)}"><header class="bd-post-head"><a class="bd-author" href="profile.html"><span class="bd-author-avatar">${esc((p.author||'ভ')[0])}</span><span><b>${esc(p.author||'ভুবনডাঙ্গা')}<span class="bd-role">${esc(p.role||'সদস্য')}</span></b><small>${new Date(p.createdAt||Date.now()).toLocaleString('bn-BD')}</small></span></a><button class="bd-more" data-post-more aria-label="আরও"><svg class="bd-icon"><use href="#bd-i-more"/></svg></button></header><span class="bd-tag">${esc(p.type==='poem'?'কবিতা':p.type==='news'?'নিউজ':p.type==='prolap'?'প্রলাপ':p.type)}</span>${templateMarkup(p)}${p.photo?`<div class="bd-media"><img src="${esc(p.photo)}" alt=""></div>`:''}<div class="bd-love-burst">❤️</div><section class="bd-social"><div class="bd-social-summary"><button data-reactors><span class="bd-summary-reactions">${reactionIcon('love')}${reactionIcon('like')} <span data-rx-count>০</span></span></button><button data-comment-count>০ মন্তব্য</button></div><div class="bd-actions"><div class="bd-react-host"><button class="bd-action" data-react-main aria-label="রিঅ্যাকশন"><svg class="bd-icon"><use href="#bd-i-react"/></svg></button>${tray()}</div><button class="bd-action" data-comment-open aria-label="মন্তব্য"><svg class="bd-icon"><use href="#bd-i-comment"/></svg></button><button class="bd-action" data-share aria-label="শেয়ার"><svg class="bd-icon"><use href="#bd-i-share"/></svg></button></div><div class="bd-comments" data-comments><div class="bd-comment-toolbar"><button class="active" data-sort="relevant">প্রাসঙ্গিক</button><button data-sort="new">নতুন</button><button data-sort="old">পুরনো</button></div><div class="bd-comment-list" data-comment-list></div><form class="bd-comment-form"><input placeholder="মন্তব্য লিখুন…" aria-label="মন্তব্য"><button aria-label="পাঠান"><svg class="bd-icon"><use href="#bd-i-send"/></svg></button></form></div></section><div class="bd-post-menu" hidden><button data-save>সংরক্ষণ করুন</button><button data-report>রিপোর্ট করুন</button></div></article>`}
function anchor(card,fn){const top=card.getBoundingClientRect().top;fn();requestAnimationFrame(()=>{const d=card.getBoundingClientRect().top-top;if(Math.abs(d)>1&&Math.abs(d)<innerHeight*.8){const sc=findScroller(card);if(sc===window)window.scrollBy(0,d);else sc.scrollTop+=d}})}function findScroller(el){let n=el.parentElement;while(n&&n!==document.body){const s=getComputedStyle(n);if(/auto|scroll/.test(s.overflowY)&&n.scrollHeight>n.clientHeight+3)return n;n=n.parentElement}return window}
function commentsFor(id){return COMMENTS[id]||(COMMENTS[id]=[{id:id+'-c1',name:'Mohammed Rana',text:'Testing comment',at:Date.now()-500000,score:3,owner:false,replies:[{id:id+'-r1',name:'Mohammed Rana',text:'টেস্ট রিপ্লাই',at:Date.now()-300000,score:1,owner:false}]}])}
function drawComments(card,sort='relevant'){const list=card.querySelector('[data-comment-list]'),id=card.dataset.postId;let arr=[...commentsFor(id)];if(sort==='new')arr.sort((a,b)=>b.at-a.at);else if(sort==='old')arr.sort((a,b)=>a.at-b.at);else arr.sort((a,b)=>(b.score+(b.replies?.length||0))-(a.score+(a.replies?.length||0)));list.innerHTML=arr.map(c=>commentMarkup(c)).join('');card.querySelector('[data-comment-count]').textContent=`${toBn(arr.length)} মন্তব্য`}
function commentMarkup(c,reply=false){return `<div class="bd-comment" data-comment-id="${esc(c.id)}" data-owner="${c.owner?'1':'0'}"><span class="bd-comment-avatar">${esc(c.name[0])}</span><div><div class="bd-bubble" data-comment-bubble><b>${esc(c.name)}</b>${esc(c.text)}${c.pending?'<small class="bd-pending"> · পর্যালোচনায়</small>':''}</div><div class="bd-cmeta"><button data-c-like>রিঅ্যাক্ট</button>${reply?'':'<button data-reply>রিপ্লাই</button>'}<button data-c-more>আরও</button><span>${timeAgo(c.at)}</span></div>${!reply&&c.replies?.length?`<div class="bd-replies">${c.replies.map(r=>commentMarkup(r,true)).join('')}</div>`:''}${!reply?'<form class="bd-reply-form"><input placeholder="রিপ্লাই লিখুন…"><button><svg class="bd-icon"><use href="#bd-i-send"/></svg></button></form>':''}</div></div>`}
function timeAgo(t){const m=Math.max(1,Math.round((Date.now()-t)/60000));return m<60?toBn(m)+'মি':toBn(Math.round(m/60))+'ঘ'}function toBn(n){return String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d])}
function applyRx(card,type){const id=card.dataset.postId,key='bd-rx-'+id;let old='';try{old=localStorage.getItem(key)||'';localStorage.setItem(key,type)}catch(_){}card.querySelector('[data-react-main]').classList.add('selected');card.querySelector('[data-react-main]').innerHTML=reactionIcon(type);const n=Number(card.querySelector('[data-rx-count]').dataset.n||0)+(old?0:1);card.querySelector('[data-rx-count]').dataset.n=n;card.querySelector('[data-rx-count]').textContent=toBn(n);card.querySelector('.bd-rx-tray').classList.remove('open')}
function doubleLove(card){applyRx(card,'love');const b=card.querySelector('.bd-love-burst');b.classList.remove('show');void b.offsetWidth;b.classList.add('show')}
function openCommentMenu(c){menuTarget=c;document.getElementById('bdCommentBack').classList.add('open');const m=document.getElementById('bdCommentMenu');m.classList.add('open');const owner=c.dataset.owner==='1';m.querySelector('[data-edit-comment]').hidden=!owner;m.querySelector('[data-delete-comment]').hidden=!owner}
function closeCommentMenu(){document.getElementById('bdCommentBack')?.classList.remove('open');document.getElementById('bdCommentMenu')?.classList.remove('open');menuTarget=null}
function installMenu(){if(document.getElementById('bdCommentMenu'))return;document.body.insertAdjacentHTML('beforeend',`<div class="bd-comment-menu-back" id="bdCommentBack"></div><div class="bd-comment-menu" id="bdCommentMenu"><button data-copy-comment><svg class="bd-icon"><use href="#bd-i-copy"/></svg>কপি</button><button data-edit-comment><svg class="bd-icon"><use href="#bd-i-edit"/></svg>এডিট</button><button data-delete-comment><svg class="bd-icon"><use href="#bd-i-trash"/></svg>মুছুন</button><button data-report-comment><svg class="bd-icon"><use href="#bd-i-report"/></svg>রিপোর্ট</button></div>`);document.getElementById('bdCommentBack').onclick=closeCommentMenu;const m=document.getElementById('bdCommentMenu');m.onclick=async e=>{if(!menuTarget)return;const txt=menuTarget.querySelector('[data-comment-bubble]')?.childNodes[1]?.textContent||menuTarget.querySelector('[data-comment-bubble]')?.textContent||'';if(e.target.closest('[data-copy-comment]')){await navigator.clipboard?.writeText(txt);W.BDToast?.('কমেন্ট কপি হয়েছে')}if(e.target.closest('[data-edit-comment]')){const next=prompt('কমেন্ট সম্পাদনা করুন',txt);if(next!=null&&next.trim())menuTarget.querySelector('[data-comment-bubble]').lastChild.textContent=next.trim()}if(e.target.closest('[data-delete-comment]'))menuTarget.remove();if(e.target.closest('[data-report-comment]'))W.BDToast?.('রিপোর্ট পাঠানো হয়েছে');closeCommentMenu()}}
function bindPost(card){let hold=0,down=0,lastTap=0;const rx=card.querySelector('[data-react-main]'),tray=card.querySelector('.bd-rx-tray');rx.addEventListener('pointerdown',e=>{down=Date.now();hold=setTimeout(()=>tray.classList.add('open'),330)});['pointerup','pointercancel','pointerleave'].forEach(ev=>rx.addEventListener(ev,()=>clearTimeout(hold)));rx.addEventListener('click',e=>{if(Date.now()-down<320&&!tray.classList.contains('open'))applyRx(card,'like')});tray.querySelectorAll('[data-rx-pick]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();applyRx(card,b.dataset.rxPick)}));const tapTarget=card.querySelector('.bd-media')||card.querySelector('.bd-template-card')||card.querySelector('.bd-post-body')||card.querySelector('.bd-news');tapTarget?.addEventListener('pointerup',()=>{const now=Date.now();if(now-lastTap<330)doubleLove(card);lastTap=now});card.querySelector('[data-comment-open]').onclick=()=>anchor(card,()=>{const p=card.querySelector('[data-comments]');p.classList.toggle('open');if(p.classList.contains('open'))drawComments(card)});card.querySelector('[data-comment-count]').onclick=()=>anchor(card,()=>{card.querySelector('[data-comments]').classList.add('open');drawComments(card)});card.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>anchor(card,()=>{card.querySelectorAll('[data-sort]').forEach(x=>x.classList.toggle('active',x===b));drawComments(card,b.dataset.sort)}));card.querySelector('.bd-comment-form').onsubmit=e=>{e.preventDefault();const input=e.currentTarget.querySelector('input'),text=input.value.trim();if(!text)return;const c={id:'c-'+Date.now(),name:'আপনি',text,at:Date.now(),score:0,owner:true,replies:[],pending:hasBad(text)};commentsFor(card.dataset.postId).unshift(c);input.value='';anchor(card,()=>drawComments(card,'new'));if(c.pending)W.BDToast?.('আপত্তিকর ভাষা শনাক্ত—কমেন্ট পর্যালোচনায় পাঠানো হয়েছে')};card.querySelector('[data-comments]').addEventListener('click',e=>{const c=e.target.closest('.bd-comment');if(!c)return function render(host,filter='all'){const box=host.querySelector('[data-posts]'),posts=load().filter(p=>filter==='all'||p.type===filter);box.innerHTML=posts.map(postMarkup).join('');box.querySelectorAll('.bd-post').forEach(bindPost)}
