async function toggle(card,force){
  if(!card)return false;const panel=$('[data-bd31-comment-panel]',card);if(!panel)return false;
  const opening=typeof force==='boolean'?force:(panel.hidden||panel.dataset.bd187Open!=='1');
  ensureCommentHead(panel);
  panel.hidden=!opening;panel.dataset.bd187Open=opening?'1':'0';
  panel.dataset.bd76CommentsOpen=opening?'1':'0';panel.dataset.bd71CommentsOpen=opening?'1':'0';
  card.dataset.bd76CommentsOpen=opening?'1':'0';card.dataset.bd71CommentsOpen=opening?'1':'0';
  if(opening){
    const more=$('[data-bd31-more]',panel);if(more)more.hidden=true;
    await render(card);
    const input=$('.bd31-comment-form input,.bd31-comment-form textarea',panel);
    if(input){input.disabled=false;input.removeAttribute('disabled');input.readOnly=false;input.style.pointerEvents='auto';setTimeout(()=>{try{input.focus({preventScroll:true})}catch(_){}},45)}
  }
  return opening;
}
D.addEventListener('click',e=>{
  const close=e.target.closest?.('[data-bd187-comment-close]');if(!close)return;
  e.preventDefault();e.stopPropagation();
  const card=close.closest?.(CARD);if(card)toggle(card,false);
},true);

/* Guest / login recovery. */
function legacyLoggedIn(){
  try{
    for(const k of ['bhubondangaCurrentUser','bhubondangaSessionUser']){
      const raw=localStorage.getItem(k)||sessionStorage.getItem(k);if(!raw)continue;
      const x=JSON.parse(raw);if(x?.loggedIn===true&&(x.id||x.uid||x.email||x.username))return true;
    }
  }catch(_){}
  return false;
}
async function isLoggedIn(){
  if(W.__BD_LIVE_SESSION?.user)return true;
  try{const r=await client()?.auth?.getSession?.();if(r?.data?.session?.user)return true}catch(_){}
  return legacyLoggedIn();
}
function rightRoots(){
  return ['rightSidebar','rightMobileDrawer'].map(id=>D.getElementById(id)).filter(Boolean).map(root=>$('.bd172-root[data-bd172-side="right"]',root)||root);
}
function leftRoots(){
  return ['leftSidebar','mobileDrawer'].map(id=>D.getElementById(id)).filter(Boolean).map(root=>$('.bd172-root[data-bd172-side="left"]',root)||root);
}
function guestPortal(){
  const s=D.createElement('section');s.className='bd187-guest-portal';s.dataset.bd187Guest='1';
  s.innerHTML='<span class="bd187-kicker">নতুন পাঠক?</span><h3>আপন ভুবন তৈরি করুন</h3><p>নিজের লেখা, পাঠ ও সাহিত্যিক পরিচয় এক জায়গায় রাখুন।</p><div class="bd187-guest-actions"><a href="register.html">প্রোফাইল তৈরি করুন</a><a href="login.html">লগইন</a></div>';
  return s;
}
function leftLogin(){
  const s=D.createElement('section');s.className='bd187-left-login';s.dataset.bd187LeftLogin='1';
  s.innerHTML='<strong>আপনার ভুবনে প্রবেশ করুন</strong><div class="bd187-left-actions"><a href="login.html">লগইন</a><a href="register.html">নতুন প্রোফাইল</a></div>';return s;
}
async function syncGuest(){
  const logged=await isLoggedIn();
  for(const root of rightRoots()){
    $$('.bd187-guest-portal',root).forEach(n=>n.remove());
    if(!logged){
      const g=guestPortal();
      const first=$('.bd172-card',root);
      if(first)first.insertAdjacentElement('afterend',g);else root.prepend(g);
    }
  }
  for(const root of leftRoots()){
    $$('.bd187-left-login',root).forEach(n=>n.remove());
    if(!logged){
      const l=leftLogin(),identity=$('.bd172-identity',root);
      if(identity)identity.insertAdjacentElement('afterend',l);else root.prepend(l);
    }
  }
}
let syncTimer=0,busy=false;
function scheduleGuest(){clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{if(busy)return;busy=true;try{await syncGuest()}finally{busy=false}},90)}
const sideMo=new MutationObserver(ms=>{let relevant=false;for(const m of ms)if(m.addedNodes?.length||m.removedNodes?.length){relevant=true;break}if(relevant)scheduleGuest()});
function boot(){
  $$(CARD).forEach(card=>{const p=$('[data-bd31-comment-panel]',card);if(p)ensureCommentHead(p)});
  for(const id of ['leftSidebar','rightSidebar','mobileDrawer','rightMobileDrawer']){const el=D.getElementById(id);if(el)sideMo.observe(el,{childList:true,subtree:true})}
  scheduleGuest();[300,900,1800,3200].forEach(ms=>setTimeout(scheduleGuest,ms));
  try{client()?.auth?.onAuthStateChange?.(()=>setTimeout(scheduleGuest,70))}catch(_){}
}
const feedMo=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes||[])if(n.nodeType===1){if(n.matches?.(CARD)){const p=$('[data-bd31-comment-panel]',n);if(p)ensureCommentHead(p)}for(const c of $$(CARD,n)){const p=$('[data-bd31-comment-panel]',c);if(p)ensureCommentHead(p)}}});
function start(){boot();const feed=$('#postList');if(feed)feedMo.observe(feed,{childList:true,subtree:true})}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',start,{once:true});else start();
W.BhubondangaComments187={};
W.BhubondangaMasterLock187={syncGuest};
})();
</script>
