  const c=D.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*scale));c.height=Math.max(1,Math.round(bmp.height*scale));c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close?.();
  const blob=await new Promise(r=>c.toBlob(r,'image/webp',q));return blob?new File([blob],(file.name||'comment').replace(/\.[^.]+$/,'.webp'),{type:'image/webp'}):file
 }catch(_){return file}
}
async function uploadCommentPhoto(ss,file){

  const f=await bdCompressImage(file),name=(f.name||`comment-${Date.now()}.webp`).replace(/[^a-zA-Z0-9._-]/g,'-');
  let url='';
  const adapter=W.BD_R2_UPLOAD||W.BD_MEDIA_UPLOAD||W.BhubondangaMedia?.upload;
  if(typeof adapter==='function'){
   try{const r=await adapter({file:f,kind:'comment-image',userId:ss.user.id,provider:'cloudflare-r2'});url=String(r?.url||r?.publicUrl||r?.src||'')}catch(_){}
  }
  if(!url && /^https?:$/i.test(location.protocol)){
   try{
    const fd=new FormData();fd.append('file',f,name);fd.append('kind','comment-image');fd.append('provider','cloudflare-r2');fd.append('user_id',ss.user.id);
    const r=await bdTimeout(fetch('/api/media/upload',{method:'POST',body:fd,credentials:'same-origin'}),6500);
    if(r?.ok){const j=await r.json().catch(()=>({}));url=String(j?.url||j?.publicUrl||j?.src||'')}
   }catch(_){}
  }
  if(!url){
   url=URL.createObjectURL(f);W.__BD_LOCAL_MEDIA=W.__BD_LOCAL_MEDIA||new Map();W.__BD_LOCAL_MEDIA.set(url,{file:f,kind:'comment-image',at:Date.now()});
  }
  if(c?.functions?.invoke && url && !url.startsWith('blob:')){
   try{
    const mod=await bdTimeout(c.functions.invoke('moderate-image',{body:{url,user_id:ss.user.id,context:'comment',media_provider:'cloudflare-r2'}}),5500),data=mod?.data||{};
    if(data.is_obscene===true||Number(data.score||0)>=.9){
     const until=new Date(Date.now()+15*86400000).toISOString();
     try{await c.from('profiles').update({suspended_until:until,suspension_reason:'obscene_comment_image'}).eq('id',ss.user.id)}catch(_){}
     try{await c.from('moderation_queue').insert({user_id:ss.user.id,content_type:'comment_image',media_url:url,status:'pending_review',suspension_days:15,route:'founder_admin'})}catch(_){}
     toast('ছবিটি রিভিউতে পাঠানো হয়েছে');return'';
    }
   }catch(_){}
  }
  return url;
 }catch(_){return''}
}

function bdDeepNormalize(text){
 return String(text||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g,'').toLocaleLowerCase('bn-BD').replace(/[“”‘’`´]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu,' ').replace(/\s+/g,' ').trim();
}
function bdDeepBadTerms(text){
  const n=bdDeepNormalize(text), words=n.split(" ").filter(Boolean), compact=n.replace(/\s+/g,""), found=[];
  for(const raw of BD_DEEP_BAD_TERMS){
    const t=bdDeepNormalize(raw), tw=t.split(" ").filter(Boolean), tc=t.replace(/\s+/g,"");
    let hit=false;
    for(let i=0;i<=words.length-tw.length;i++){
      if(tw.every((w,j)=>words[i+j]===w)){hit=true;break}
    }
    if(!hit && tc.length>=5 && compact.includes(tc))hit=true;
    if(hit)found.push(raw);
  }
  return [...new Set(found)];
}

function bdProfileOnlySet(){try{return new Set((JSON.parse(localStorage.getItem('bd-profile-only-posts')||'[]')||[]).map(String))}catch(_){return new Set()}}
function filteredPosts(s,filter='all'){
 const f=String(filter||'all').toLowerCase(),profileOnly=bdProfileOnlySet(),profileContext=s?.context==='profile';
 return (s?.posts||[]).filter(p=>{
  if(!p||!p.id)return false;
  const id=String(p.id),localOnly=profileOnly.has(id)||p.profileOnly===true||p.showInFeed===false||p.feedVisible===false;
  if(!profileContext&&localOnly)return false;
  if(s?.authorId&&String(p.authorId||'')!==String(s.authorId))return false;
  if(f==='all')return true;
  if(f==='reels')return p.type==='reels'||p.type==='recitation';
  return String(p.type||'').toLowerCase()===f;
 })
}
async function ensureCount(s,filter='all',need=20){

 s.remoteRefreshing=true;
 try{
  let guard=0;
  while(s.remoteHasMore&&filteredPosts(s,filter).length<need&&guard++<4){
   const offset=Math.max(0,Number(s.remoteOffset)||0),page=await loadRemotePage(offset,20,{authorId:s.authorId});
   if(!page.length){s.remoteHasMore=false;break}
   s.remoteOffset=offset+page.length;s.remoteHasMore=page.length===20;s.posts=mergePosts(s.posts,page)
  }
 }catch(_){s.remoteHasMore=false}finally{s.remoteRefreshing=false}
}

}

 else box.innerHTML='<div class="bd-feed-empty">এখনও কোনো পোস্ট পাওয়া যায়নি।</div>';

async function showMore(root){const s=STATES.get(root),sentinel=root.querySelector('[data-see-more]');if(!s||s.loadingMore||sentinel?.hidden)return;s.loadingMore=true;if(sentinel){sentinel.disabled=true;sentinel.innerHTML='<span class="spin"></span> Loading 20…'}try{const box=root.querySelector('[data-posts]'),rendered=box.querySelectorAll('.bd-post').length;if(rendered<s.displayLimit){await ensureCount(s,s.filter,s.displayLimit);await render(root,s.filter,{ensure:false});return}const oldLimit=s.displayLimit,next=oldLimit+20;await ensureCount(s,s.filter,next);const all=filteredPosts(s,s.filter),batch=all.slice(oldLimit,next);if(batch.length){const frag=D.createElement('div');frag.innerHTML=batch.map(postMarkup).join('');const cards=[...frag.children];cards.forEach(card=>{box.appendChild(card);bindPost(card)});s.displayLimit=next;await hydrateReactions(root);hydrateFollows(root)}else{s.displayLimit=Math.min(next,all.length)}const canMore=all.length>s.displayLimit||s.remoteHasMore;if(sentinel){sentinel.hidden=!canMore;sentinel.textContent=canMore?'See More':''}}finally{s.loadingMore=false}}
