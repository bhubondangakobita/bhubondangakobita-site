tifyPostAction(card,e.currentTarget));card.querySelector('[data-edit-post]')?.addEventListener('click',()=>startPostEdit(card));card.querySelector('[data-remove-feed]')?.addEventListener('click',()=>removeFromFeed(card));card.querySelector('[data-delete-post]')?.addEventListener('click',()=>deletePostAction(card));card.querySelector('[data-privacy]')?.addEventListener('click',()=>{const b=card.querySelector('[data-privacy-box]');b.hidden=!b.hidden});card.querySelectorAll('[data-privacy-value]').forEach(b=>b.onclick=()=>{setPrivacy(card,b.dataset.privacyValue);card.querySelector('[data-privacy-box]').hidden=true});card.querySelector('.bd-comment-form').onsubmit=e=>{e.preventDefault();const inp=e.currentTarget.querySelector('input');submitComment(card,inp.value).then(()=>inp.value='')};card.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{card.querySelectorAll('[data-sort]').forEach(x=>x.classList.toggle('active',x===b));drawComments(card,b.dataset.sort)});const zone=card.querySelector('[data-double-love-zone]');zone.addEventListener('pointerup',e=>{if(e.target.closest('button,a,input,textarea,select'))return;const now=Date.now(),x=e.clientX,y=e.clientY;if(now-lastTap<330&&Math.hypot(x-lastX,y-lastY)<30){doubleLove(card);lastTap=0}else{lastTap=now;lastX=x;lastY=y}});zone.addEventListener('dblclick',e=>{if(!e.target.closest('button,a,input,textarea,select'))doubleLove(card)})}
function filteredPosts(s,filter){return s.posts.filter(p=>!localHas('bd-hidden-feed-posts',p.id)&&(filter==='all'||p.type===filter))}
async function ensureCount(s,filter,count){let guard=0;while(filteredPosts(s,filter).length<count&&s.remoteHasMore&&guard<12){guard++;const page=await loadRemotePage(s.remoteOffset,20);s.remoteOffset+=page.length;s.remoteHasMore=page.length===20;s.posts=mergePosts(s.posts,page);if(!page.length)break}}
async function render(root,filter='all',opt={}){const s=STATES.get(root);s.filter=filter;if(!s.initialized){const first=await initialPosts();s.posts=first.posts;s.remoteOffset=first.remoteCount;s.remoteHasMore=first.remoteCount===20;s.initialized=true}if(opt.ensure!==false)await ensureCount(s,filter,s.displayLimit);const all=filteredPosts(s,filter),posts=all.slice(0,s.displayLimit),box=root.querySelector('[data-posts]'),more=root.querySelector('[data-see-more]');box.innerHTML=posts.length?posts.map(postMarkup).join(''):'<div class="bd-feed-empty bd-glass">এখনও কোনো প্রকাশিত পোস্ট পাওয়া যায়নি।</div>';box.querySelectorAll('.bd-post').forEach(bindPost);if(more){const canMore=all.length>s.displayLimit||s.remoteHasMore;more.hidden=!canMore;more.disabled=false;more.innerHTML='See More'}await hydrateReactions(root)}
async function showMore(root){const s=STATES.get(root),btn=root.querySelector('[data-see-more]');if(s.loadingMore)return;s.loadingMore=true;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Loading'}const next=s.displayLimit+20;await ensureCount(s,s.filter,next);s.displayLimit=next;await render(root,s.filter,{ensure:false});s.loadingMore=false}
W.addEventListener('resize',closeFloatingTray,{passive:true});W.addEventListener('scroll',closeFloatingTray,{passive:true,capture:true});D.addEventListener('pointerdown',e=>{if(BD_FLOATING_TRAY&&!e.target.closest('.bd-rx-tray,[data-react-main]'))closeFloatingTray();if(!e.target.closest('.bd-post-menu,[data-post-more]'))D.querySelectorAll('.bd-post-menu:not([hidden])').forEach(x=>x.hidden=true)},true);
async function mount(target){installMenu();const wrap=D.createElement('div');wrap.innerHTML=rootTpl();const root=wrap.firstElementChild;target.appendChild(root);const ss=await session();const s={root,posts:[],comments:new Map(),reactions:new Map(),userId:ss?.user?.id||'',displayLimit:20,remoteOffset:0,remoteHasMore:true,initialized:false,loadingMore:false,filter:'all'};STATES.set(root,s);await render(root);const onUpdated=e=>{const d=e.detail;if(!d)return;const i=s.posts.findIndex(x=>String(x.id)===String(d.id));if(i>=0)s.posts[i]=mapPost({...s.posts[i],...d});else s.posts.unshift(mapPost(d));render(root,s.filter,{ensure:false})};W.addEventListener('bd:post-updated',onUpdated);root.querySelector('[data-feed-filter]').onchange=async e=>{s.displayLimit=20;await render(root,e.target.value)};root.querySelector('[data-see-more]').onclick=()=>showMore(root);root.querySelector('[data-feed-top]').onclick=()=>{const sc=findScroller(root);if(sc===W)W.scrollTo({top:0,behavior:'smooth'});else sc.scrollTo({top:0,behavior:'smooth'})};W.BD_BUS.addEventListener('bd:post-published',async e=>{s.posts=[];s.displayLimit=20;s.remoteOffset=0;s.remoteHasMore=true;s.initialized=false;await render(root,root.querySelector('[data-feed-filter]').value)});return root}
W.BD_MODULES.feed={mount,render};if(location.pathname.endsWith('feed.html')||!D.querySelector('main')){const h=D.getElementById('bdFeedDemo');if(h)mount(h)}
})();
