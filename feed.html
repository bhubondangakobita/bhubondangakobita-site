          <div>
            <button class="bdx-btn bdx-btn-ghost" id="bdxComposerCancel" type="button">বাতিল</button>
            <button class="bdx-btn bdx-btn-primary" type="submit">প্রকাশ করুন</button>
          </div>
        </div>
      </form>
    </section>

        <div>

    <div class="bdx-load-wrap"><button class="bdx-load-more" id="bdxLoadMore" type="button" hidden>আরও দেখুন</button></div>

function profileHref(p={}){const id=p.id||p.author_id||p.user_id||'',u=String(p.username||p.author_username||'').replace(/^@/,'').toLowerCase(),r=String(p.role||p.author_role||'').toLowerCase(),n=String(p.display_name||p.author_name||'');if(r==='founder'||u==='mahmud-sohel'||n==='মাহমুদ সোহেল')return'founder-profile.html';if(r==='admin')return'admin-profile.html?user='+encodeURIComponent(id||u);return'profile.html?user='+encodeURIComponent(id||u||'member')}
function toast(msg){let t=D.getElementById('bdxToast');if(!t){t=D.createElement('div');t.id='bdxToast';t.className='bdx-toast';D.body.appendChild(t)}t.textContent=String(msg||'');t.classList.add('is-show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('is-show'),2600)}
function goLogin(){location.href='login.html?next='+encodeURIComponent(location.href)}
function isVideoPost(p){const k=String(p.media_type||p.media_kind||'').toLowerCase(),u=String(p.media_url||p.media||'').toLowerCase();return k.includes('video')||/\.(mp4|webm|mov|m4v)(?:$|\?)/.test(u)}
function mediaURL(p){return String(p.media_url||p.media||p.video_url||p.image_url||'')}
function currentProfile(){const s=state.session,u=s?.user;if(!u)return null;return state.profile||{id:u.id,username:u.user_metadata?.username||'',display_name:u.user_metadata?.full_name||u.user_metadata?.name||u.email?.split('@')[0]||'সদস্য',avatar_url:u.user_metadata?.avatar_url||'',role:u.user_metadata?.role||'user'}}

async function refreshAuth(){
  const c=client();let s=null;
  try{s=(await c?.auth?.getSession?.()).data?.session||W.__BD_LIVE_SESSION||null}catch(_){s=W.__BD_LIVE_SESSION||null}
  state.session=s;state.profile=null;
  if(s?.user&&c){try{const r=await c.from('profiles').select('id,username,display_name,avatar_url,role').eq('id',s.user.id).maybeSingle();if(!r.error&&r.data)state.profile=r.data}catch(_){}}
  const p=currentProfile(),a=$('#bdxComposerAvatar');
  if(a){a.href=p?profileHref(p):'login.html';a.replaceChildren();if(p?.avatar_url){const im=new Image();im.src=p.avatar_url;im.alt=p.display_name||'';a.appendChild(im)}else{const sp=D.createElement('span');sp.textContent=p?.display_name?.slice(0,1)||'🌿';a.appendChild(sp)}}
}

async function fetchPosts(){
  const c=client();if(!c)throw new Error('Supabase সংযোগ পাওয়া যায়নি');
  async function run(withStatus){let q=c.from('posts').select('*').order('created_at',{ascending:false}).limit(80);if(withStatus)q=q.eq('status','published');return await q}
  let r=await run(true);if(r.error)r=await run(false);if(r.error)throw r.error;
  return (r.data||[]).filter(p=>{const st=String(p.status||'published').toLowerCase(),vis=String(p.visibility||p.privacy||'public').toLowerCase();return !['deleted','archived','rejected'].includes(st)&&!['only_me','private'].includes(vis)&&String(p.type||'').toLowerCase()!=='news-page'});
}

function avatarNode(p,sizeClass=''){
  const a=D.createElement('a');a.className='bdx-avatar '+sizeClass;a.href=profileHref(p);a.setAttribute('aria-label',(p.author_name||p.display_name||'সদস্য')+'-এর প্রোফাইল');
  const src=p.author_avatar||p.avatar_url||'';if(src){const im=new Image();im.loading='lazy';im.decoding='async';im.src=src;im.alt='';a.appendChild(im)}else{a.textContent=String(p.author_name||p.display_name||'স').slice(0,1)}return a
}
function roleBadge(p){const r=String(p.author_role||p.role||'').toLowerCase(),u=String(p.author_username||p.username||'').toLowerCase();if(r==='founder'||u==='mahmud-sohel'||p.author_name==='মাহমুদ সোহেল'){const s=D.createElement('span');s.className='bdx-role';s.textContent='প্রতিষ্ঠাতা';return s}if(r==='admin'){const s=D.createElement('span');s.className='bdx-role';s.textContent='অ্যাডমিন';return s}return null}

function filteredPosts(){return state.filter==='all'?state.posts:state.posts.filter(p=>typeOf(p)===state.filter)}
function renderFeed(reset=true){
  const host=$('#bdxPostList'),rows=filteredPosts();if(reset)host.replaceChildren();
  const already=reset?0:host.children.length,target=Math.min(state.visible,rows.length);
  for(let i=already;i<target;i++)host.appendChild(postNode(rows[i]));
  if(!rows.length){const e=D.createElement('div');e.className='bdx-card bdx-empty';e.textContent='এখনও কোনো প্রকাশিত লেখা নেই।';host.appendChild(e)}
  const more=$('#bdxLoadMore');more.hidden=rows.length<=target;hydrateVisibleSocial();renderReels();
}

async function loadFeed(){
  if(state.loading)return;state.loading=true;const reload=$('#bdxReloadFeed');if(reload)reload.disabled=true;
  try{state.posts=await fetchPosts();state.visible=15;renderFeed(true)}catch(err){const host=$('#bdxPostList');host.replaceChildren();const e=D.createElement('div');e.className='bdx-card bdx-empty';e.textContent=err?.message||'নিউজফিড লোড করা যায়নি';host.appendChild(e)}finally{state.loading=false;if(reload)reload.disabled=false}
}

function reactionState(id){if(!state.reaction.has(id))state.reaction.set(id,{counts:{},mine:null,total:0,version:0});return state.reaction.get(id)}
function applyReactionView(card){const id=card.dataset.bdxPostId,r=reactionState(id),sum=card.querySelector('[data-bdx-reaction-summary]'),btn=card.querySelector('[data-bdx-react]');if(sum){const top=Object.entries(r.counts).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);sum.hidden=!r.total;if(r.total){sum.replaceChildren();const stack=D.createElement('span');stack.className='bdx-reaction-stack';for(const t of top){const sp=D.createElement('span');sp.textContent=REACTIONS[t]?.[1]||'👍';stack.appendChild(sp)}const tx=D.createElement('span');tx.textContent=bn(r.total)+' জন প্রতিক্রিয়া';sum.append(stack,tx)}}if(btn){btn.classList.toggle('is-selected',!!r.mine);btn.dataset.current=r.mine||'';btn.querySelector('.bdx-main-reaction').textContent=r.mine?(REACTIONS[r.mine]?.[1]||'👍'):'👍';btn.lastElementChild.textContent=r.mine?(REACTIONS[r.mine]?.[0]||'Like'):'লাইক'}}
function groupReactionRows(rows,id){const r=reactionState(id);r.counts={};r.total=0;r.mine=null;const me=uid();for(const x of rows){const t=String(x.reaction||x.reaction_type||'like').toLowerCase();r.counts[t]=(r.counts[t]||0)+1;r.total++;if(me&&String(x.user_id||x.author_id||'')===String(me))r.mine=t}}
async function hydrateVisibleSocial(){
  const cards=$$('.bdx-post[data-bdx-post-id]'),ids=cards.map(c=>c.dataset.bdxPostId);if(!ids.length)return;const c=client();if(!c)return;
  let rows=[];for(const table of ['post_reactions','reactions']){try{const q=await c.from(table).select('post_id,user_id,reaction').in('post_id',ids);if(!q.error){rows=q.data||[];break}}catch(_){}}
  const map=new Map(ids.map(id=>[id,[]]));for(const x of rows){const id=String(x.post_id||'');if(map.has(id))map.get(id).push(x)}for(const card of cards){const id=card.dataset.bdxPostId,r=reactionState(id);if(r.version===0){groupReactionRows(map.get(id)||[],id);applyReactionView(card)}}
}

function optimisticReaction(card,type){
  if(!state.session){goLogin();return}const id=card.dataset.bdxPostId,r=reactionState(id),prev=r.mine,next=prev===type?null:type;
  if(prev){r.counts[prev]=Math.max(0,(r.counts[prev]||0)-1);r.total=Math.max(0,r.total-1)}if(next){r.counts[next]=(r.counts[next]||0)+1;r.total++}r.mine=next;r.version++;applyReactionView(card);queueReactionSync(id,next,prev,card,r.version)
}
function queueReactionSync(id,desired,previous,card,version){clearTimeout(state.reactionTimers.get(id));state.reactionTimers.set(id,setTimeout(async()=>{const ok=await persistReaction(id,desired,previous);const r=reactionState(id);if(!ok&&r.version===version){await reconcileReaction(id,card)}},70))}
async function writeReactionTable(table,id,user,desired){const c=client();if(!c)return false;try{if(desired){let r=await c.from(table).upsert({post_id:id,user_id:user,reaction:desired},{onConflict:'post_id,user_id'});if(!r.error)return true;const cur=await c.from(table).select('post_id,user_id').eq('post_id',id).eq('user_id',user).maybeSingle();r=cur.data?await c.from(table).update({reaction:desired}).eq('post_id',id).eq('user_id',user):await c.from(table).insert({post_id:id,user_id:user,reaction:desired});return !r.error}else{const r=await c.from(table).delete().eq('post_id',id).eq('user_id',user);return !r.error}}catch(_){return false}}
async function persistReaction(id,desired,previous){const user=uid(),c=client();if(!c||!user)return false;for(const table of ['post_reactions','reactions'])if(await writeReactionTable(table,id,user,desired))return true;try{const chosen=desired||previous||'like',r=await c.rpc('toggle_post_reaction',{target_post:String(id),chosen_reaction:chosen});return !r.error}catch(_){return false}}
async function reconcileReaction(id,card){const c=client();if(!c)return;for(const table of ['post_reactions','reactions'])try{const q=await c.from(table).select('user_id,reaction').eq('post_id',id).limit(300);if(!q.error){groupReactionRows(q.data||[],id);applyReactionView(card);return}}catch(_){}}

let tray=null,trayCard=null;
function ensureTray(){if(tray)return tray;tray=D.createElement('div');tray.className='bdx-reaction-tray';tray.setAttribute('role','menu');for(const [key,val] of Object.entries(REACTIONS)){const b=D.createElement('button');b.type='button';b.dataset.bdxPick=key;b.title=val[0];b.setAttribute('aria-label',val[0]);b.textContent=val[1];b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const card=trayCard;closeTray();if(card)optimisticReaction(card,key)});tray.appendChild(b)}D.body.appendChild(tray);return tray}
function openTray(btn,card){const t=ensureTray(),r=btn.getBoundingClientRect();trayCard=card;t.classList.add('is-open');t.style.visibility='hidden';requestAnimationFrame(()=>{const w=t.offsetWidth||310,h=t.offsetHeight||52;let left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),top=r.top-h-8;if(top<8)top=Math.min(innerHeight-h-8,r.bottom+8);t.style.left=left+'px';t.style.top=top+'px';t.style.visibility='visible'})}
function closeTray(){if(tray){tray.classList.remove('is-open');tray.style.visibility='hidden'}trayCard=null}
function bindReactionButton(btn){let timer=0,held=false,suppress=false;const card=btn.closest('.bdx-post');btn.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;held=false;timer=setTimeout(()=>{held=true;suppress=true;openTray(btn,card)},330)});btn.addEventListener('pointerup',()=>{clearTimeout(timer);if(held)setTimeout(()=>suppress=false,0)});btn.addEventListener('pointercancel',()=>clearTimeout(timer));btn.addEventListener('contextmenu',e=>{e.preventDefault();openTray(btn,card)});btn.addEventListener('mouseenter',()=>{if(matchMedia('(hover:hover) and (pointer:fine)').matches)openTray(btn,card)});btn.addEventListener('click',e=>{e.preventDefault();if(suppress){suppress=false;return}optimisticReaction(card,'like')})}
D.addEventListener('pointerdown',e=>{if(tray?.classList.contains('is-open')&&!e.target.closest('.bdx-reaction-tray,[data-bdx-react]'))closeTray()},true);

async function fetchComments(postId){const c=client();if(!c)return[];try{let q=await c.from('comments').select('*').eq('post_id',postId).eq('status','published').order('created_at',{ascending:true}).limit(250);if(q.error)q=await c.from('comments').select('*').eq('post_id',postId).order('created_at',{ascending:true}).limit(250);if(!q.error)return q.data||[]}catch(_){}return[]}
function parentId(x){return String(x.parent_id||x.parent_comment_id||x.reply_to||'')}
function commentAuthor(x){return{id:x.author_id||x.user_id,username:x.author_username||x.username,display_name:x.author_name||x.display_name||'সদস্য',avatar_url:x.author_avatar||x.avatar_url||'',role:x.author_role||x.role||''}}
function commentState(postId){if(!state.comments.has(postId))state.comments.set(postId,{rows:[],loaded:false,visible:5,filter:'relevant'});return state.comments.get(postId)}
function sortedRoots(cs){let roots=cs.rows.filter(x=>!parentId(x));if(cs.filter==='newest')roots.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));else if(cs.filter==='all')roots.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));else roots.sort((a,b)=>{const ar=cs.rows.filter(x=>parentId(x)===String(a.id)).length,br=cs.rows.filter(x=>parentId(x)===String(b.id)).length;return br-ar||new Date(b.created_at)-new Date(a.created_at)});return roots}
function commentNode(row,postId,reply=false){
  const p=commentAuthor(row),node=D.createElement('div');node.className='bdx-comment'+(row.__pending?' bdx-pending':'');node.dataset.bdxCommentId=String(row.id);node.appendChild(avatarNode(p));const main=D.createElement('div');main.className='bdx-comment-main';
  const bubble=D.createElement('div');bubble.className='bdx-comment-bubble';const a=D.createElement('a');a.href=profileHref(p);a.textContent=p.display_name||'সদস্য';const txt=D.createElement('p');txt.textContent=row.body||'';bubble.append(a,txt);main.appendChild(bubble);
  const meta=D.createElement('div');meta.className='bdx-comment-meta';const like=D.createElement('button');like.type='button';like.dataset.bdxCommentLike='1';like.textContent='লাইক';const rep=D.createElement('button');rep.type='button';rep.dataset.bdxReply='1';rep.textContent='রিপ্লাই';meta.append(like,rep);main.appendChild(meta);
  const replies=D.createElement('div');replies.className='bdx-replies';main.appendChild(replies);
  if(!reply){const cs=commentState(postId);for(const r of cs.rows.filter(x=>parentId(x)===String(row.id)))replies.appendChild(commentNode(r,postId,true))}
  node.appendChild(main);return node
}
function renderComments(card,reset=true){const id=card.dataset.bdxPostId,cs=commentState(id),panel=card.querySelector('[data-bdx-comments-panel]'),list=panel.querySelector('.bdx-comments-list'),more=panel.querySelector('.bdx-comments-more'),roots=sortedRoots(cs),shown=roots.slice(0,cs.visible);if(reset){list.replaceChildren();for(const row of shown)list.appendChild(commentNode(row,id,false))}more.hidden=roots.length<=shown.length;const sum=card.querySelector('[data-bdx-comment-summary]');sum.hidden=!roots.length;sum.textContent=roots.length?bn(roots.length)+' মন্তব্য':''}
async function openComments(card){const panel=card.querySelector('[data-bdx-comments-panel]');panel.hidden=false;const id=card.dataset.bdxPostId,cs=commentState(id);if(!cs.loaded){cs.rows=await fetchComments(id);cs.loaded=true;renderComments(card,true)}const input=panel.querySelector('.bdx-comment-input');if(input&&!input.disabled)setTimeout(()=>{try{input.focus({preventScroll:true})}catch(_){input.focus()}},0)}
async function persistComment(row){const c=client();if(!c)return null;const variants=parentId(row)?[{...row,parent_id:parentId(row)},{...row,parent_comment_id:parentId(row)},{...row,reply_to:parentId(row)}]:[row];for(const v of variants){try{const r=await c.from('comments').insert(v).select('*').single();if(!r.error)return r.data}catch(_){}}return null}
function optimisticComment(card,body,parent=''){
  const me=currentProfile();if(!me){goLogin();return}const id=card.dataset.bdxPostId,cs=commentState(id),row={id:'temp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),post_id:id,author_id:me.id,author_username:me.username||'',author_name:me.display_name||'সদস্য',author_avatar:me.avatar_url||'',body,status:'published',created_at:new Date().toISOString(),__pending:true};if(parent)row.parent_id=parent;cs.rows.push(row);cs.loaded=true;
  if(parent){const parentNode=card.querySelector('[data-bdx-comment-id="'+CSS.escape(parent)+'"]');const replies=parentNode?.querySelector('.bdx-replies');if(replies)replies.appendChild(commentNode(row,id,true))}else{const list=card.querySelector('.bdx-comments-list');list.prepend(commentNode(row,id,false));const roots=cs.rows.filter(x=>!parentId(x));const sum=card.querySelector('[data-bdx-comment-summary]');sum.hidden=false;sum.textContent=bn(roots.length)+' মন্তব্য'}
  persistComment(row).then(saved=>{const n=card.querySelector('[data-bdx-comment-id="'+CSS.escape(row.id)+'"]');if(saved){const old=row.id;Object.assign(row,saved,{__pending:false});if(n){n.classList.remove('bdx-pending');n.dataset.bdxCommentId=String(saved.id||old)}}else if(n){n.classList.remove('bdx-pending');n.classList.add('bdx-sync-error');const note=D.createElement('span');note.className='bdx-sync-note';note.textContent='সিঙ্ক হয়নি';n.querySelector('.bdx-comment-meta')?.appendChild(note)}})
}
async function toggleCommentLike(btn){if(!state.session){goLogin();return}const node=btn.closest('[data-bdx-comment-id]'),id=node?.dataset.bdxCommentId;if(!id||id.startsWith('temp-'))return;const active=btn.classList.toggle('is-liked');btn.textContent=active?'লাইক · ১':'লাইক';const c=client(),user=uid();if(!c)return;try{if(active){let r=await c.from('comment_reactions').upsert({comment_id:id,user_id:user,reaction:'like'},{onConflict:'comment_id,user_id'});if(r.error)await c.from('comment_reactions').insert({comment_id:id,user_id:user,reaction:'like'})}else await c.from('comment_reactions').delete().eq('comment_id',id).eq('user_id',user)}catch(_){}}
function ensureReplyForm(comment,card){let f=comment.querySelector(':scope > .bdx-comment-main > .bdx-reply-form');if(f){f.classList.toggle('is-open');if(f.classList.contains('is-open'))f.querySelector('input')?.focus({preventScroll:true});return}f=D.createElement('form');f.className='bdx-reply-form is-open';f.dataset.bdxReplyForm='1';const input=D.createElement('input');input.maxLength=1200;input.placeholder='রিপ্লাই লিখুন…';input.autocomplete='off';const send=D.createElement('button');send.type='submit';send.className='bdx-reply-send';send.textContent='➤';f.append(input,send);comment.querySelector('.bdx-comment-main').appendChild(f);input.focus({preventScroll:true})}

async function sharePost(card){const id=card.dataset.bdxPostId,url=new URL(location.href);url.hash='';url.search='';url.searchParams.set('post',id);try{if(navigator.share)await navigator.share({title:'ভুবনডাঙ্গা',url:url.href});else{await navigator.clipboard.writeText(url.href);toast('পোস্টের লিংক কপি হয়েছে')}}catch(_){}}

function bindFeedEvents(){
  $('#bdxComposerOpen').addEventListener('click',async()=>{if(!state.session){goLogin();return}$('#bdxComposerEditor').hidden=false;setTimeout(()=>$('#bdxPostTitle').focus({preventScroll:true}),0)});
  $('#bdxComposerCancel').addEventListener('click',()=>{$('#bdxComposerEditor').hidden=true;clearComposerMedia()});
  $('#bdxCategoryFilter').addEventListener('change',e=>{state.filter=e.target.value;state.visible=15;renderFeed(true)});
  $('#bdxReloadFeed').addEventListener('click',loadFeed);
  $('#bdxLoadMore').addEventListener('click',()=>{state.visible+=10;renderFeed(false)});
  $('#bdxReelsToggle').addEventListener('click',()=>{const rail=$('#bdxReelsRail'),open=rail.hidden;rail.hidden=!open;$('#bdxReelsToggle').setAttribute('aria-expanded',open?'true':'false');$('#bdxReelsToggle').textContent=open?'রিলস বন্ধ করুন':'রিলস দেখুন';if(!open)pauseReels()});
  $('#bdxPostImage').addEventListener('change',e=>selectMedia(e.target.files?.[0]||null));
  $('#bdxPostVideo').addEventListener('change',e=>selectMedia(e.target.files?.[0]||null));
  $('#bdxMediaRemove').addEventListener('click',clearComposerMedia);
  $('#bdxComposerEditor').addEventListener('submit',publishComposer);

  root.addEventListener('click',async e=>{
    const card=e.target.closest('.bdx-post');if(!card)return;
    if(e.target.closest('[data-bdx-comments]')||e.target.closest('[data-bdx-comment-summary]')){e.preventDefault();const panel=card.querySelector('[data-bdx-comments-panel]');if(panel.hidden)await openComments(card);else panel.hidden=true;return}
    if(e.target.closest('[data-bdx-share]')){e.preventDefault();sharePost(card);return}
    const more=e.target.closest('.bdx-comments-more');if(more){const cs=commentState(card.dataset.bdxPostId);cs.visible+=5;renderComments(card,true);return}
    const cl=e.target.closest('[data-bdx-comment-like]');if(cl){e.preventDefault();toggleCommentLike(cl);return}
    const rp=e.target.closest('[data-bdx-reply]');if(rp){e.preventDefault();ensureReplyForm(rp.closest('.bdx-comment'),card);return}
  });
  root.addEventListener('change',e=>{if(e.target.matches('.bdx-comment-filter')){const card=e.target.closest('.bdx-post'),cs=commentState(card.dataset.bdxPostId);cs.filter=e.target.value;cs.visible=5;renderComments(card,true)}});
  root.addEventListener('submit',e=>{const form=e.target;if(form.matches('[data-bdx-comment-form]')){e.preventDefault();const input=form.querySelector('.bdx-comment-input'),body=input.value.trim(),card=form.closest('.bdx-post');if(!body||!card)return;optimisticComment(card,body);input.value='';input.focus({preventScroll:true});return}if(form.matches('[data-bdx-reply-form]')){e.preventDefault();const input=form.querySelector('input'),body=input.value.trim(),card=form.closest('.bdx-post'),comment=form.closest('.bdx-comment'),parent=comment?.dataset.bdxCommentId;if(!body||!card||!parent)return;optimisticComment(card,body,parent);input.value='';input.focus({preventScroll:true})}});
  root.addEventListener('keydown',e=>{if(!e.target.matches('.bdx-comment-input,.bdx-reply-form input'))return;if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();e.target.form?.requestSubmit()}});
}

function selectMedia(file){clearComposerMedia(false);if(!file)return;state.mediaFile=file;state.mediaURL=URL.createObjectURL(file);const box=$('#bdxMediaPreview');box.hidden=false;box.replaceChildren();if(file.type.startsWith('video/')){const v=D.createElement('video');v.src=state.mediaURL;v.controls=true;v.playsInline=true;box.appendChild(v)}else{const im=new Image();im.src=state.mediaURL;im.alt='নির্বাচিত ছবি';box.appendChild(im)}$('#bdxMediaRemove').hidden=false}
function clearComposerMedia(clearInput=true,revoke=true){if(revoke&&state.mediaURL)URL.revokeObjectURL(state.mediaURL);state.mediaURL='';state.mediaFile=null;const box=$('#bdxMediaPreview');box.hidden=true;box.replaceChildren();$('#bdxMediaRemove').hidden=true;if(clearInput){$('#bdxPostImage').value='';$('#bdxPostVideo').value=''}}
async function uploadMedia(file){if(!file)return'';const c=client(),user=uid();if(!c||!user)return'';try{const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'')||'bin',path=user+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext,up=await c.storage.from('post-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});if(up.error)throw up.error;return c.storage.from('post-media').getPublicUrl(path).data?.publicUrl||''}catch(_){return''}}
async function insertPost(row){const c=client();if(!c)return null;const full={id:row.id,author_id:row.author_id,author_username:row.author_username,author_name:row.author_name,author_avatar:row.author_avatar,author_role:row.author_role,type:row.type,category:row.category,title:row.title,body:row.body,media_url:row.media_url||'',media_type:row.media_type||'',visibility:'public',status:'published',created_at:row.created_at,updated_at:new Date().toISOString()};const variants=[full,((o)=>{const{x,...v}= {x:0,...o};delete v.author_role;delete v.media_type;delete v.visibility;delete v.updated_at;return v})(full),{id:full.id,author_id:full.author_id,author_username:full.author_username,author_name:full.author_name,author_avatar:full.author_avatar,type:full.type,title:full.title,body:full.body,media_url:full.media_url,status:'published',created_at:full.created_at}];for(const v of variants)try{const r=await c.from('posts').insert(v).select('*').single();if(!r.error)return r.data}catch(_){}return null}
async function publishComposer(e){
  e.preventDefault();if(!state.session){goLogin();return}const title=$('#bdxPostTitle').value.trim(),body=$('#bdxPostBody').value.trim(),type=$('#bdxPostType').value;if(!title||!body){toast('শিরোনাম ও লেখা পূরণ করুন');return}
  const terms=W.BhubondangaModerationScan?.(title+' '+body)||[];if(terms.length){toast(W.BhubondangaProfanity?.commentMessage||'লেখায় আপত্তিকর শব্দ পাওয়া গেছে।');return}
  const me=currentProfile(),file=state.mediaFile,localMedia=state.mediaURL,row={id:'post-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),author_id:me.id,author_username:me.username||'',author_name:me.display_name||'সদস্য',author_avatar:me.avatar_url||'',author_role:me.role||'user',type,category:TYPE_LABEL[type]||'সাহিত্যকর্ম',title,body,media_url:localMedia,media_type:file?.type||'',created_at:new Date().toISOString(),status:'published',__pending:true};
  state.posts.unshift(row);state.visible++;const host=$('#bdxPostList');const card=postNode(row);card.classList.add('bdx-pending');host.prepend(card);hydrateVisibleSocial();
  // Only after explicit Publish: reset values. No input/keydown/keyup handler ever replaces these fields.
  e.currentTarget.reset();$('#bdxComposerEditor').hidden=true;const preview=$('#bdxMediaPreview');preview.hidden=true;preview.replaceChildren();$('#bdxMediaRemove').hidden=true;$('#bdxPostImage').value='';$('#bdxPostVideo').value='';state.mediaFile=null;state.mediaURL='';
  const remote=await uploadMedia(file),persistRow={...row,media_url:remote||'',media_type:file?.type||''};const saved=await insertPost(persistRow);if(saved){Object.assign(row,saved,{__pending:false});card.classList.remove('bdx-pending');card.dataset.bdxPostId=String(saved.id||row.id);const media=card.querySelector('.bdx-post-media');if(media&&remote){media.src=remote;if(localMedia)URL.revokeObjectURL(localMedia)}else if(file&&!remote){card.classList.add('bdx-sync-error');toast('লেখা প্রকাশিত হয়েছে, কিন্তু মিডিয়া আপলোড হয়নি')}else toast('লেখাটি প্রকাশিত হয়েছে')}else{card.classList.remove('bdx-pending');card.classList.add('bdx-sync-error');toast('পোস্টটি স্ক্রিনে আছে, কিন্তু Supabase সিঙ্ক হয়নি')}
}

function pauseReels(){for(const v of $$('#bdxReelsRail video'))try{v.pause()}catch(_){}}
function renderReels(){const sec=$('#bdxReelsSection'),rail=$('#bdxReelsRail'),videos=filteredPosts().filter(isVideoPost).slice(0,12);sec.hidden=!videos.length;rail.replaceChildren();if(!videos.length)return;for(const p of videos){const item=D.createElement('article');item.className='bdx-reel';item.dataset.bdxReelId=String(p.id);const v=D.createElement('video');v.src=mediaURL(p);v.preload='metadata';v.playsInline=true;v.controls=true;item.appendChild(v);const meta=D.createElement('div');meta.className='bdx-reel-meta';const st=D.createElement('strong');st.textContent=p.author_name||'ভুবনডাঙ্গা';const sm=D.createElement('small');sm.textContent=p.title||typeLabel(p);meta.append(st,sm);item.appendChild(meta);rail.appendChild(item)}if(state.reelObserver)state.reelObserver.disconnect();state.reelObserver=new IntersectionObserver(entries=>{for(const en of entries){const v=en.target.querySelector('video');if(!v)continue;if(en.isIntersecting&&en.intersectionRatio>=.7){v.play().catch(()=>{})}else v.pause()}},{root:rail,threshold:[0,.7,1]});for(const item of $$('.bdx-reel',rail))state.reelObserver.observe(item)}
function openReelsAt(id){const sec=$('#bdxReelsSection'),rail=$('#bdxReelsRail');sec.hidden=false;rail.hidden=false;$('#bdxReelsToggle').setAttribute('aria-expanded','true');$('#bdxReelsToggle').textContent='রিলস বন্ধ করুন';requestAnimationFrame(()=>{const item=rail.querySelector('[data-bdx-reel-id="'+CSS.escape(id)+'"]');item?.scrollIntoView({block:'start',behavior:'smooth'})})}

async function boot(){
  bindFeedEvents();await refreshAuth();await loadFeed();
  D.addEventListener('bd:auth-ready',async()=>{await refreshAuth();for(const input of $$('.bdx-comment-input')){input.disabled=!state.session;input.placeholder=state.session?'মন্তব্য লিখুন…':'মন্তব্য করতে লগইন করুন';input.form?.querySelector('button[type="submit"]')?.toggleAttribute('disabled',!state.session)}});
  D.addEventListener('bd:supabase-sdk-ready',()=>{if(!state.posts.length)loadFeed()});
}
boot();
})();
</script>
</template>
