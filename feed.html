function safeJSON(v,f={}){try{return JSON.parse(v)||f}catch{return f}}
function stored(){return safeJSON(localStorage.getItem(STORE)||'{}',{})}
function infer(){
  const s=stored(); if(s && (s.countryCode||s.preset)) return normalize(s);
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  const langs=(navigator.languages||[navigator.language||'']).join(' ').toLowerCase();
  if(/dhaka/i.test(tz)||/\bbn-bd\b/.test(langs)) return {...PRESETS.BD};
  if(/kolkata|calcutta/i.test(tz)){
    if(/\bbn\b|bn-in/.test(langs)) return {...PRESETS.IN_WB};
    return {...PRESETS.IN_HI};
  }
  if(/dubai|riyadh|qatar|kuwait|muscat|bahrain|amman|baghdad|beirut/i.test(tz)||/\bar\b/.test(langs)) return {...PRESETS.AR};
  if(/\bhi\b|hi-in/.test(langs)) return {...PRESETS.IN_HI};
  return {...PRESETS.INTL};
}
function normalize(x={}){
  const code=String(x.countryCode||x.country_code||'').toUpperCase();
  const area=[x.region,x.state,x.adminArea1,x.admin_area1,x.city,x.countryName,x.country_name].filter(Boolean).join(' ');
  if(code==='BD') return {...PRESETS.BD,...x,key:'BD'};
  if(code==='IN'&&WB.test(area)) return {...PRESETS.IN_WB,...x,key:'IN_WB'};
  if(code==='IN'&&(HI_STATES.test(area)||x.preset==='IN_HI')) return {...PRESETS.IN_HI,...x,key:'IN_HI'};
  if(ME_CODES.has(code)||x.preset==='AR') return {...PRESETS.AR,...x,key:'AR',countryCode:code||'AE'};
  if(x.preset&&PRESETS[x.preset]) return {...PRESETS[x.preset],...x,key:x.preset};
  if(code==='IN') return {...PRESETS.IN_HI,...x,key:'IN_HI'};
  return {...PRESETS.INTL,...x,key:'INTL',countryCode:code};
}
let active=infer();

function tr(base){
  if(active.lang==='bn') return base;
  const lang=active.lang==='ar'?'ar':active.lang==='hi'?'hi':'en';
  return TEXT[base]?.[lang]||base;
}
function ph(base){
  if(active.lang==='bn') return base;
  const lang=active.lang==='ar'?'ar':active.lang==='hi'?'hi':'en';
  return PLACEHOLDERS[base]?.[lang]||base;
}
function isUserContent(el){
  return !!el.closest?.('.bd-post,.post,.post-card,.bd-live-post,.req,.chat-message,.message-bubble,.comment,.bd24-comment-bubble,[data-post-id],[data-comment-id]');
}
function translateElement(el){
  if(!el||el.nodeType!==1||isUserContent(el))return;
  if(el.matches('input,textarea')){
    const p=el.getAttribute('placeholder'); if(p&&PLACEHOLDERS[p]) el.setAttribute('placeholder',ph(p));
    const a=el.getAttribute('aria-label'); if(a&&TEXT[a]) el.setAttribute('aria-label',tr(a));
    return;
  }
  if(el.matches('option,button,a,label,h1,h2,h3,strong,small,span,.bdc-prompt')){
    const txt=(el.textContent||'').trim();
    if(txt&&TEXT[txt]){
      const v=tr(txt);
      if(el.children.length===0) el.textContent=v;
    }
  }
  const a=el.getAttribute?.('aria-label'); if(a&&TEXT[a])el.setAttribute('aria-label',tr(a));
  const title=el.getAttribute?.('title'); if(title&&TEXT[title])el.setAttribute('title',tr(title));
}
function translateTree(root=D){
  if(root.nodeType===1) translateElement(root);
  root.querySelectorAll?.('input,textarea,option,button,a,label,h1,h2,h3,strong,small,span,.bdc-prompt').forEach(translateElement);
}
function applyAlphabet(root=D){
  const letters=active.letters||PRESETS.INTL.letters;
  root.querySelectorAll?.('.bdc-letters').forEach(row=>{
    [...row.querySelectorAll('.bdc-letter')].slice(0,5).forEach((b,i)=>{
      b.textContent=letters[i]||'';
      b.dataset.regionLetter=letters[i]||'';
      b.lang=active.lang;
      b.dir=active.dir;
    });
  });
}
function brand(root=D){
  const title=root.querySelector?.('.bd-brand-copy h1');
  const sub=root.querySelector?.('.bd-brand-copy p');
  if(title){
    if(active.domestic){
      title.innerHTML='<b>ভুবনডাঙ্গার</b> <em>কবিতা</em>';

      if(sub)sub.textContent=active.lang==='ar'?'مجتمع إنساني وإبداعي عالمي':active.lang==='hi'?'एक वैश्विक रचनात्मक और मानवीय मंच':'A global creative & humanitarian community';
    }

  if(generic && !active.domestic && !/BongDang/i.test(generic.textContent)){
    generic.innerHTML='BongDang <sup class="bd-sos-miniword">sos</sup>';
  }
  if(D===root||root===D) D.title=active.domestic?'ভুবনডাঙ্গার কবিতা':'BongDang sos';
}
function historyCard(root=D){
  const a=root.querySelector?.('.bd-history'); if(!a)return;
  const b=a.querySelector('b'),sm=a.querySelector('small'),flag=a.querySelector('.bd-flag');
  if(active.domestic){
    const wb=active.key==='IN_WB';
    if(b)b.textContent=wb?'পশ্চিমবঙ্গ':'বাংলাদেশ';
    if(sm)sm.textContent=wb?'ইতিহাস · বাংলা সংস্কৃতি':'ইতিহাস · ১৭৫৭—আজ';
    a.href=wb?'west-bengal.html':'bangladesh.html';
    flag?.classList.remove('bd-flag-emoji');
    if(flag)flag.textContent='';
  }else{
    if(b)b.textContent=active.countryName||active.label||'BongDang';
    if(sm)sm.textContent=active.lang==='ar'?'الموقع التشغيلي':active.lang==='hi'?'सक्रिय क्षेत्र':'Active region · local time';
    a.href='#';
    if(flag){
      flag.classList.add('bd-flag-emoji');
      flag.textContent=flagEmoji(active.countryCode)||'🌐';
    }
  }
}
function flagEmoji(code){
  code=String(code||'').toUpperCase();
  if(!/^[A-Z]{2}$/.test(code))return'🌐';
  return String.fromCodePoint(...[...code].map(c=>127397+c.charCodeAt()));
}
function dateHTML(){
  const now=new Date();
  if(active.domestic){
    const tz=active.key==='IN_WB'?'Asia/Kolkata':'Asia/Dhaka';
    const greg=new Intl.DateTimeFormat(active.key==='IN_WB'?'bn-IN':'bn-BD',{day:'numeric',month:'long',year:'numeric',timeZone:tz}).format(now).replace(/,/g,'');
    const wd=new Intl.DateTimeFormat(active.key==='IN_WB'?'bn-IN':'bn-BD',{weekday:'long',timeZone:tz}).format(now);
    let hijri='';try{hijri=new Intl.DateTimeFormat('bn-BD-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric',timeZone:tz}).format(now).replace(/,/g,'')+' হিজরি'}catch(_){}
    let bangla='';try{bangla=W.BD_BANGLA_DATE?.(now)||''}catch(_){}
    const h=Number(new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:tz}).format(now));
    const greet=h<5?'শুভ রাত্রি—শব্দের সঙ্গে থাকুন':h<12?'শুভ সকাল—সবার দিন সুন্দর হোক':h<17?'শুভ দুপুর—পড়া ও লেখার সময়':h<20?'শুভ সন্ধ্যা—আপন ভুবনে স্বাগতম':'শুভ রাত্রি—শব্দের সঙ্গে থাকুন';
    const parts=[greg+' খ্রিস্টাব্দ',greet,wd,bangla,hijri].filter(Boolean);
    return parts.map((x,i)=>`${i?'<i>✦</i>':''}<span class="${i===1?'greet':''}">${x}</span>`).join('');
  }
  const locale=active.locale||'en';
  const date=new Intl.DateTimeFormat(locale,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
  const time=new Intl.DateTimeFormat(locale,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now);
  const place=[active.city,active.region,active.countryName].filter(Boolean).join(' · ')||active.label||'International';
  return `<span class="greg">${date}</span><i>✦</i><span class="greet">${time}</span><i>✦</i><span>${place}</span>`;
}
function renderDateTicker(){
  const groups=[...D.querySelectorAll('.bd-date-group')];if(!groups.length)return false;
  const seq=dateHTML(),long=seq+'<i>✦</i>'+seq+'<i>✦</i>'+seq+'<i>✦</i>';
  groups.forEach(g=>g.innerHTML=long);
  return true;
}

  if(code==='IN')return {title:'বাংলা ও পশ্চিমবঙ্গের ইতিহাস',href:'west-bengal.html',body:'বাংলার সাহিত্য, ভাষা, নবজাগরণ, উপমহাদেশের রাজনৈতিক পরিবর্তন এবং পশ্চিমবঙ্গের সাংস্কৃতিক উত্তরাধিকার—এই পরিচয়ের মূল ভিত্তি।'};
  return {title:(name||'Country')+' · History',href:'#',body:'Your home profile location remains unchanged. Operational location is separate and can be changed with a 2-second hold on the flag.'};
}

  m.classList.add('open');m.querySelector('[data-bd-close]').onclick=()=>m.classList.remove('open');m.onclick=e=>{if(e.target===m)m.classList.remove('open')};
}

  const m=modal('region');
  m.innerHTML=`<section class="bd-region-sheet" role="dialog" aria-modal="true"><div class="bd-region-head"><h3>Active operational location</h3><button class="bd-region-x" data-bd-close>×</button></div><p class="bd-region-note">Home profile: <b>${home}</b><br>This does not change your home district. It only changes BongDang's active operating region, language and emergency routing.</p><div class="bd-region-grid">

  <div class="bd-region-field"><label>Country code (ISO-2)</label><input data-op-code maxlength="2" value="${cur.countryCode||active.countryCode||''}"></div>

  </div><div class="bd-region-actions"><button type="button" data-op-gps-btn>Use GPS</button><button type="button" data-bd-close>Cancel</button><button type="button" class="save" data-op-save>Save active region</button></div></section>`;
  const preset=m.querySelector('[data-op-preset]');preset.value=cur.preset||active.key||'INTL';
  m.classList.add('open');
  m.querySelectorAll('[data-bd-close]').forEach(x=>x.onclick=()=>m.classList.remove('open'));

    try{const g=await gps();m.querySelector('[data-op-gps]').value=`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}`;m.dataset.lat=g.lat;m.dataset.lng=g.lng;m.dataset.acc=g.accuracy||''}catch(e){status('Location permission unavailable',m)}
  };
  m.querySelector('[data-op-save]').onclick=async()=>{
    const v={preset:preset.value,countryCode:m.querySelector('[data-op-code]').value.trim().toUpperCase(),countryName:m.querySelector('[data-op-country]').value.trim(),region:m.querySelector('[data-op-region]').value.trim(),city:m.querySelector('[data-op-city]').value.trim()};
    if(m.dataset.lat){v.lat=+m.dataset.lat;v.lng=+m.dataset.lng;v.accuracy=+m.dataset.acc||null}
    setOperational(v);m.classList.remove('open');await persistOperational(v);

function attachFlag(flag){
  if(!flag||flag.dataset.bdRegionBound)return;flag.dataset.bdRegionBound='1';
  let timer=0,long=false;
  const clear=()=>{if(timer)clearTimeout(timer);timer=0};
  flag.addEventListener('pointerdown',e=>{long=false;clear();timer=setTimeout(()=>{long=true;try{navigator.vibrate?.(35)}catch(_){};openRegionModal(flag)},2000)},{passive:true});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>flag.addEventListener(ev,clear,{passive:true}));
  flag.addEventListener('contextmenu',e=>e.preventDefault());
  flag.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(long){long=false;return}openHistory(flag)},true);
}
function attachFlags(root=D){root.querySelectorAll?.('#bd27CountryFlag,.bd27-country-flag').forEach(attachFlag)}

function setOperational(v){
  const x=normalize(v);x.preset=v.preset||x.key;
  localStorage.setItem(STORE,JSON.stringify(x));active=x;apply(D);
  W.dispatchEvent(new CustomEvent('bd:regionchange',{detail:{...active}}));
}
async function persistOperational(v){
  try{
    const c=getClient();if(!c?.auth)return;
    const u=(await c.auth.getUser()).data?.user;if(!u)return;
    await c.auth.updateUser({data:{...(u.user_metadata||{}),bd_operational_location:v}});
  }catch(_){}
}
function getClient(){return W.BD_SUPABASE||W.supabaseClient||W.bhubondangaSupabase||W.__BD_SUPABASE_CLIENT__||((W.supabase&&W.supabase.auth)?W.supabase:null)}
async function hydrateOperational(){
  if(localStorage.getItem(STORE))return;
  try{const c=getClient();const u=(await c?.auth?.getUser?.()).data?.user;const v=u?.user_metadata?.bd_operational_location;if(v)setOperational(v)}catch(_){}
}
function apply(root=D){
  active=normalize(stored().countryCode||stored().preset?stored():active);
  H.lang=active.lang;H.dir=active.dir;H.dataset.bdRegion=active.key;
  brand(root);historyCard(root);applyAlphabet(root);translateTree(root);attachFlags(root);renderDateTicker();
}
function observe(){
  const mo=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1){applyAlphabet(n);translateTree(n);attachFlags(n);brand(n);historyCard(n)}});
  mo.observe(D.documentElement,{subtree:true,childList:true});
}

/* ============================ SOS ============================ */
function capability(){
  const bridge=W.BongDangSOSBridge||{};
  return {
    bluetooth:!!(bridge.bluetooth||navigator.bluetooth),
    lora:!!bridge.lora,
    satellite:!!bridge.satellite,
    gps:!!navigator.geolocation,
    voice:!!(navigator.mediaDevices?.getUserMedia&&W.MediaRecorder)
  };
}
function status(msg,scope=D){
  const el=scope.querySelector?.('[data-bd-sos-status]')||D.querySelector('[data-bd-sos-status]')||D.querySelector('#bdSOSStatus');
  if(el)el.textContent=msg;
  try{W.BDToast?.(msg)}catch(_){}
}
function updateSOS(root=D){
  const c=capability();
  root.querySelectorAll?.('[data-sos-tier="bluetooth"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.bluetooth?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="lora"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.lora?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="satellite"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.satellite?'ready':'bridge'));
}
function gps(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('GPS unavailable'));
    navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude||null,heading:p.coords.heading||null}),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:15000});
  });
}
function openDB(){
  return new Promise((resolve,reject)=>{const r=indexedDB.open(VOICE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('voice'))r.result.createObjectStore('voice',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
}
async function saveVoice(blob){
  const id='voice-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),db=await openDB();
  await new Promise((resolve,reject)=>{const t=db.transaction('voice','readwrite');t.objectStore('voice').put({id,createdAt:Date.now(),type:blob.type,size:blob.size,blob});t.oncomplete=resolve;t.onerror=()=>reject(t.error)});
  return id;
}
async function recordVoice30(scope=D){
  if(!navigator.mediaDevices?.getUserMedia||!W.MediaRecorder)throw new Error('Voice recording unsupported');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const chunks=[],rec=new MediaRecorder(stream),start=Date.now();
  rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  const done=new Promise((resolve,reject)=>{rec.onerror=e=>reject(e.error||new Error('Recorder error'));rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const id=await saveVoice(blob);localStorage.setItem('bd-sos-last-voice',id);resolve({id,blob})}});
  rec.start(500);status('Voice recording started · 30 seconds max',scope);
  const tick=setInterval(()=>{const left=Math.max(0,30-Math.floor((Date.now()-start)/1000));status(`Voice recording · ${left}s`,scope)},1000);
  const stop=()=>{clearInterval(tick);if(rec.state!=='inactive')rec.stop()};
  setTimeout(stop,30000);
  const onHide=()=>{if(D.hidden)stop()};D.addEventListener('visibilitychange',onHide,{once:true});
  const x=await done;status('30-second voice note saved for SOS relay',scope);return x;
}
async function sendNetworkSOS(payload){
  const c=getClient();if(!c?.from)return {ok:false,reason:'No network client'};
  let user=null;try{user=(await c.auth?.getUser?.()).data?.user||null}catch(_){}
  const privateEvent={
    user_id:user?.id||null,
    event_type:'life_support',
    created_at:payload.createdAt,
    operational_region:payload.region,
    gps:payload.gps||null,
    voice_ref:payload.voiceId||null,
    routing_targets:payload.routingTargets||[],
    misuse_policy_version:'bd-sos-v1',
    status:'active'
  };
  try{
    const r=await c.from('sos_emergency_events').insert(privateEvent).select('id').single();
    if(!r.error)return {ok:true,id:r.data?.id||null,via:'private_sos_queue'};
  }catch(_){}
  const common={
    author_id:user?.id||null,
    category:'sos',
    urgency:'critical',
    status:'active',
    verification_status:'unverified',
    title:payload.title,
    description:'[BongDang sos]\n'+payload.description+'\nExact GPS/voice data is kept for private rescue relay when supported.',
    country_code:payload.region.countryCode||null,
    country_name:payload.region.countryName||null,
    admin_area1:payload.region.region||null,
    district:payload.region.region||payload.region.city||'SOS',
    city:payload.region.city||null,
    address_text:'BongDang sos · private emergency routing requested',
    expires_at:new Date(Date.now()+24*3600000).toISOString()
  };
  try{
    let r=await c.from('humanitarian_requests').insert(common).select('id').single();
    if(r.error){
      const fallback={...common,category:'urgent',title:'[BongDang sos] '+common.title};
      r=await c.from('humanitarian_requests').insert(fallback).select('id').single();
    }
    if(r.error)throw r.error;
    return {ok:true,id:r.data?.id||null,via:'humanitarian_queue'};
  }catch(e){return {ok:false,reason:e.message||'Network relay failed'}}
}
async function quickSOS(scope=D){
  const button=scope.closest?.('.bd-sos-panel,.bd-sos-mini')||scope;
  status('জরুরি জীবনরক্ষা বার্তা প্রস্তুত হচ্ছে · লোকেশন নেওয়া হচ্ছে…',button);
  let g=null;try{g=await gps();status('লোকেশন পাওয়া গেছে · জরুরি বার্তা পাঠানোর চেষ্টা হচ্ছে…',button)}catch(_){status('লাইভ লোকেশন পাওয়া যায়নি · সংরক্ষিত অপারেশনাল লোকেশন ব্যবহার করা হচ্ছে…',button)}
  const op=normalize(stored().countryCode||stored().preset?stored():active);
  const caps=capability(),voiceId=localStorage.getItem('bd-sos-last-voice')||null;
  const payload={kind:'bongdang_sos',createdAt:new Date().toISOString(),region:op,gps:g,voiceId,
  protocols:{nearby_device:caps.bluetooth,rescue_gateway:caps.lora,remote_hardware:caps.satellite},
  routingTargets:['BongDang sos emergency queue','verified local rescue/support team','approved nearby helpers','configured emergency contacts where integrated'],
  misusePolicy:'False/prank SOS or intentional misuse may trigger a 15-day SOS suspension; repeated/serious misuse may lead to permanent SOS restriction and Founder/Admin review.',
  title:'BongDang sos · Emergency Life Support Message',
  description:'Emergency Life Support Message with location and optional voice note. Route to verified rescue/support channels when available.'};
  localStorage.setItem('bd-sos-last-payload',JSON.stringify(payload));
  let nativeResult=null;
  try{if(W.BongDangSOSBridge?.send)nativeResult=await W.BongDangSOSBridge.send(payload)}catch(_){}
  const net=await sendNetworkSOS(payload);
  const ok=!!(nativeResult?.ok||net.ok);
  status(ok?`জরুরি বার্তা রিলে হয়েছে${net.id?' · '+net.id:''}`:'বার্তা লোকালি কিউ হয়েছে — সমর্থিত নেটওয়ার্ক/রেসকিউ গেটওয়ে পাওয়া গেলে পুনরায় রিলে চেষ্টা করা যাবে',button);
  if(!ok){const q=safeJSON(localStorage.getItem('bd-sos-queue')||'[]',[]);q.push(payload);localStorage.setItem('bd-sos-queue',JSON.stringify(q.slice(-20)))}
  W.dispatchEvent(new CustomEvent('bd:sos-dispatched',{detail:{payload,nativeResult,network:net}}));
  try{navigator.vibrate?.(ok?[80,50,80]:[120,80,120])}catch(_){}
  return {ok,payload,nativeResult,network:net};
}
D.addEventListener('click',async e=>{
  const el=e.target.closest?.('[data-bd-sos-action]');if(!el)return;
  const act=el.dataset.bdSosAction,scope=el.closest('.bd-sos-panel,.bd-sos-mini')||D;
  if(act==='send'){el.disabled=true;try{await quickSOS(scope)}finally{el.disabled=false}}
  if(act==='gps'){try{const g=await gps();localStorage.setItem('bd-sos-last-gps',JSON.stringify(g));status(`GPS ready · ${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} · ±${Math.round(g.accuracy||0)}m`,scope)}catch(err){status(err.message||'GPS unavailable',scope)}}
  if(act==='record'){el.disabled=true;try{await recordVoice30(scope)}catch(err){status(err.message||'Voice unavailable',scope)}finally{el.disabled=false}}
});

/* V110 canonical reaction bridge -------------------------------------------------
   One post/user reaction state is shared by Feed, Focused Post, Profile, Category,
   photo-related parent surfaces and other open tabs. Supabase remains canonical;
   localStorage is only an optimistic/offline mirror. */
const BD_REACTION_SYNC_KEY='bd-canonical-reaction-sync-v110';
let BD_REACTION_CHANNEL=null;try{BD_REACTION_CHANNEL=('BroadcastChannel'in W)?new BroadcastChannel('bhubondanga-canonical-social'):null}catch(_){}
function bdReactionRowType(x){return String(x?.reaction||x?.reaction_type||x?.type||'like').toLowerCase()}
function bdNormalizeReactionRow(x,postId){const t=bdReactionRowType(x);return {...x,post_id:String(postId||x?.post_id||''),reaction:RX.includes(t)?t:'like'}}
function bdReactionRowsMerge(rows){const m=new Map();for(const x0 of rows||[]){const x=bdNormalizeReactionRow(x0),uid=String(x.user_id||x.author_id||'');if(!uid)continue;m.set(uid,x)}return [...m.values()]}
async function bdFetchRemoteReactionRows(ids){
 const c=client(),clean=[...new Set((ids||[]).filter(x=>x&&!String(x).startsWith('sig:')).map(String))];if(!c||!clean.length)return[];
 const uuid=clean.filter(bdLooksUuid),queryIds=uuid.length?uuid:clean,attempts=[
  async()=>{const r=await c.from('post_reactions').select('post_id,user_id,reaction').in('post_id',queryIds);return r?.error?null:(r?.data||[])},
  async()=>{const r=await c.from('post_reactions').select('post_id,user_id,reaction_type').in('post_id',queryIds);return r?.error?null:(r?.data||[]).map(x=>({...x,reaction:x.reaction_type}))},
  async()=>{const r=await c.from('reactions').select('post_id,user_id,reaction').in('post_id',queryIds);return r?.error?null:(r?.data||[])}
 ];
 for(const fn of attempts){try{const rows=await fn();if(Array.isArray(rows))return rows.map(x=>bdNormalizeReactionRow(x))}catch(_){}}
 return[]
}
function bdCardMatchesReactionPayload(card,d){

 if(keys.has(socialPostId(card)))return true;for(const k of bdReactionLocalKeys(card))if(keys.has(String(k)))return true;return false
}

 if(!d?.userId)return;D.querySelectorAll('.bd-post[data-post-id]').forEach(card=>{if(!bdCardMatchesReactionPayload(card,d))return;const st=stateOf(card);if(!st)return;const id=socialPostId(card),uid=String(d.userId);let rows=(st.reactions.get(id)||[]).filter(x=>String(x.user_id)!==uid);if(d.reaction)rows.push({post_id:id,user_id:uid,reaction:String(d.reaction),updated_at:d.at||Date.now()});st.reactions.set(id,rows);if(!st.userId)st.userId=uid;syncRxCard(card)});

}

 const detail={postId:socialPostId(card),keys:bdReactionLocalKeys(card),userId:String(userId||''),reaction:String(reaction||''),at:Date.now()};
 try{localStorage.setItem(BD_REACTION_SYNC_KEY,JSON.stringify(detail))}catch(_){}try{W.dispatchEvent(new CustomEvent('bd:canonical-reaction-sync',{detail}))}catch(_){}try{BD_REACTION_CHANNEL?.postMessage(detail)}catch(_){}

function bdDeepNormalize(text){

}
function bdDeepBadTerms(text){
  const n=bdDeepNormalize(text), words=n.split(" ").filter(Boolean), compact=n.replace(/\s+/g,""), found=[];
  for(const raw of BD_DEEP_BAD_TERMS){
    const t=bdDeepNormalize(raw), tw=t.split(" ").filter(Boolean), tc=t.replace(/\s+/g,"");
    let hit=false;
    for(let i=0;i<=words.length-tw.length;i++){
      if(tw.every((w,j)=>words[i+j]===w)){hit=true;break}
    }
    if(!hit && tc.length>=5 && compact.includes(tc))hit=true;
    if(hit)found.push(raw);
  }
  return [...new Set(found)];
}

function digitalCard(){const posts=localPosts(),rx=reactionCount(posts),cm=commentsCount(posts);return `<section class="bd-side-card bd24-rail-digital" data-bd24-digital><div class="bd24-rail-title"><div><small>ভুবনের স্পন্দন</small><b>ডিজিটাল কার্যক্রম</b></div><span class="bd24-live-dot">LIVE</span></div><div class="bd24-rail-metrics"><div class="bd24-rail-metric"><svg viewBox="0 0 24 24"><path d="M4 20c0-4 2.5-7 6-7s6 3 6 7"/><circle cx="10" cy="8" r="3"/><path d="M18 8h3M19.5 6.5v3"/></svg><span><small>পোস্ট</small><b data-bd24-posts>${posts.length.toLocaleString('bn-BD')}</b></span></div><div class="bd24-rail-metric"><svg viewBox="0 0 24 24"><path d="M12 21s-8-4.7-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 6.3-8 11-8 11Z"/></svg><span><small>প্রতিক্রিয়া</small><b data-bd24-rx>${rx.toLocaleString('bn-BD')}</b></span></div><div class="bd24-rail-metric"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3Z"/><path d="M8 10h8M8 13h5"/></svg><span><small>মন্তব্য</small><b data-bd24-comments>${cm.toLocaleString('bn-BD')}</b></span></div><div class="bd24-rail-metric"><svg viewBox="0 0 24 24"><path d="M4 17 9 12l4 3 7-8"/><path d="M15 7h5v5"/></svg><span><small>আজকের গতি</small><b>+${Math.min(99,posts.filter(p=>Date.now()-Date.parse(p?.created_at||p?.createdAt||0)<86400000).length).toLocaleString('bn-BD')}</b></span></div></div><div class="bd24-rail-chart"><canvas data-bd24-chart width="560" height="160"></canvas></div><div class="bd24-rail-foot"><span>সাম্প্রতিক ২৪ ঘণ্টা</span><b>ভুবনডাঙ্গা Pulse</b></div></section>`}
function brand(root){root.querySelectorAll('.bd-side-leaf').forEach(x=>{if(x.dataset.bd24)return;x.dataset.bd24='1';x.innerHTML=svgBrand})}
function addDigital(root){const stack=root.matches?.('.bd-side-stack')?root:root.querySelector?.('.bd-side-stack');if(!stack||stack.querySelector('[data-bd24-digital]'))return;if(!/(আজকের নতুন সদস্য|সক্রিয় লেখক|সহায়তা)/.test(stack.textContent||''))return;const cards=[...stack.querySelectorAll(':scope>.bd-side-card')];const anchor=cards.find(c=>(c.textContent||'').includes('সক্রিয় লেখক'))||cards.at(-1);if(anchor)anchor.insertAdjacentHTML('afterend',digitalCard());else stack.insertAdjacentHTML('beforeend',digitalCard());drawCharts(stack)}
function drawCharts(root=D){root.querySelectorAll('[data-bd24-chart]').forEach(c=>{if(c.dataset.drawn)return;c.dataset.drawn='1';const ctx=c.getContext('2d'),cssW=c.clientWidth||260,cssH=c.clientHeight||80,dpr=Math.min(2,W.devicePixelRatio||1);c.width=Math.round(cssW*dpr);c.height=Math.round(cssH*dpr);ctx.scale(dpr,dpr);const w=cssW,h=cssH;ctx.clearRect(0,0,w,h);ctx.strokeStyle='rgba(50,96,91,.09)';ctx.lineWidth=1;for(let y=18;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}const pts=[];for(let i=0;i<18;i++){const x=i/(17)*w,y=h*.67-Math.sin(i*.72)*h*.16-Math.sin(i*.23)*h*.12-(i/17)*h*.12;pts.push([x,y])}const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'#0d8b63');g.addColorStop(.5,'#2e83d5');g.addColorStop(1,'#7758d9');ctx.strokeStyle=g;ctx.lineWidth=2.2;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();const fill=ctx.createLinearGradient(0,0,0,h);fill.addColorStop(0,'rgba(31,159,124,.13)');fill.addColorStop(1,'rgba(31,159,124,0)');ctx.fillStyle=fill;ctx.fill();const p=pts.at(-1);ctx.fillStyle='#fff';ctx.strokeStyle='#158c69';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],3.2,0,Math.PI*2);ctx.fill();ctx.stroke()})}
function run(root=D){brand(root);root.querySelectorAll('.bd-side-stack').forEach(s=>addDigital(s));drawCharts(root)}
D.addEventListener('DOMContentLoaded',()=>run(D),{once:true});if(D.readyState!=='loading')run(D);W.addEventListener('resize',()=>{D.querySelectorAll('[data-bd24-chart]').forEach(c=>c.removeAttribute('data-drawn'));drawCharts(D)},{passive:true});const mo=new MutationObserver(ms=>{let needed=false;for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1&&(n.matches?.('.bd-side-stack,.bd-side-card')||n.querySelector?.('.bd-side-stack,.bd-side-card')))needed=true;if(needed)requestAnimationFrame(()=>run(D))});mo.observe(D.documentElement,{subtree:true,childList:true});
})(document,window);

<script>
(()=>{'use strict';const D=document,W=window;let portal=null,viewer=null,storyList=[],viewerIndex=0,session=null,targetProfile=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const cli=()=>W.BD_SUPABASE||W.supabaseClient||W.bdSupabase||W.bdProductionSupabase||null;async function getSession(){if(session)return session;try{session=(await cli()?.auth?.getSession?.()).data?.session||null}catch(_){}return session}function roleOf(s){let r='';try{r=W.BD_ROLE||s?.user?.app_metadata?.role||s?.user?.user_metadata?.role||localStorage.getItem('bd-role')||''}catch(_){}return String(r||'user').toLowerCase()}function targetId(){return String(D.body?.dataset?.bdProfileId||'')}function isProfileVisitor(){return !!targetId()&&D.body?.dataset?.bdProfileOwner==='0'}function privacyKey(id){return 'bd-magic-privacy-v1:'+(id||'self')}function readPrivacy(id){const def={story:'public',friends:'public',authors:'public',saved:'private',archive:'private'};try{return Object.assign(def,JSON.parse(localStorage.getItem(privacyKey(id))||'{}'))}catch(_){return def}}async function savePrivacy(id,p){try{localStorage.setItem(privacyKey(id),JSON.stringify(p))}catch(_){}const c=cli();if(c&&id)try{await c.from('profiles').update({magic_visibility:p,story_visibility:p.story}).eq('id',id)}catch(_){}return p}function mediaOf(x){return x?.media_url||x?.image_url||x?.video_url||x?.url||x?.media||''}function authorId(x){return String(x?.user_id||x?.author_id||x?.owner_id||x?.profile_id||'')}function activeStory(x){const e=x?.expires_at||x?.expiresAt;if(!e)return true;return new Date(e).getTime()>Date.now()}function normalizeStory(x,profiles){const id=String(x?.id||x?.story_id||Math.random()),aid=authorId(x),p=profiles?.get(aid)||{};return{id,aid,raw:x,media:mediaOf(x),caption:x?.caption||x?.text||x?.body||'',created:x?.created_at||x?.createdAt||'',name:p.full_name||p.display_name||p.name||p.username||x?.author_name||'ভুবনডাঙ্গার বন্ধু',avatar:p.avatar_url||p.avatar||x?.author_avatar||'',views:Number(x?.views_count||x?.view_count||0)||0,reactions:Number(x?.reactions_count||x?.reaction_count||0)||0,replies:Number(x?.replies_count||x?.reply_count||0)||0,visibility:String(x?.visibility||x?.privacy||'public')}}async function queryProfiles(ids){const m=new Map(),c=cli();if(!c||!ids.length)return m;try{const r=await c.from('profiles').select('*').in('id',[...new Set(ids)].slice(0,100));(r.data||[]).forEach(p=>m.set(String(p.id||p.user_id),p))}catch(_){}return m}async function storyData(){const s=await getSession(),uid=String(s?.user?.id||''),c=cli();let rows=[];if(c)try{const r=await c.from('stories').select('*').order('created_at',{ascending:false}).limit(80);if(!r.error)rows=(r.data||[]).filter(activeStory)}catch(_){}if(!rows.length){for(const key of ['bd-active-stories','bd-stories'])try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a)&&a.length){rows=a;break}}catch(_){}}let ids=rows.map(authorId).filter(Boolean),profiles=await queryProfiles(ids),all=rows.map(x=>normalizeStory(x,profiles));let friendIds=new Set();if(c&&uid)try{const r=await c.from('follows').select('*').or(`follower_id.eq.${uid},following_id.eq.${uid}`);const out=new Set(),inn=new Set();(r.data||[]).forEach(x=>{const a=String(x.follower_id||x.user_id||''),b=String(x.following_id||x.target_id||'');if(a===uid&&b)out.add(b);if(b===uid&&a)inn.add(a)});[...out].forEach(id=>inn.has(id)&&friendIds.add(id))}catch(_){}let own=all.filter(x=>x.aid===uid),friends=all.filter(x=>x.aid!==uid&&(!friendIds.size||friendIds.has(x.aid))&&x.visibility!=='private');if(isProfileVisitor()){const tid=targetId();own=all.filter(x=>x.aid===tid&&x.visibility==='public');friends=[]}return{uid,own,friends,all,profiles}}async function storyInsights(st){const c=cli();if(!c||!st?.id)return st;for(const [table,key] of [['story_views','views'],['story_reactions','reactions'],['story_replies','replies']])try{const r=await c.from(table).select('*',{count:'exact',head:true}).eq('story_id',st.id);if(!r.error&&typeof r.count==='number')st[key]=r.count}catch(_){}return st}function makePortal(){if(portal)return portal;D.body.insertAdjacentHTML('beforeend',`<div class="bd125-portal" id="bd125Portal" aria-hidden="true"><div class="bd125-gate"><div class="bd125-door left"></div><div class="bd125-door right"></div><div class="bd125-keyhole">✦</div></div><div class="bd125-scene"><div class="bd125-shell" id="bd125Shell"></div></div></div><div class="bd125-viewer" id="bd125Viewer"><div class="bd125-viewer-head"><button type="button" data-bd125-vclose>×</button><div class="bd125-viewer-author" id="bd125VAuthor"></div><button type="button" data-bd125-react>♡</button></div><div class="bd125-viewer-stage" id="bd125VStage"><div class="bd125-viewer-nav"><button type="button" data-bd125-prev aria-label="Previous"></button><button type="button" data-bd125-next aria-label="Next"></button></div></div><form class="bd125-replybar" id="bd125Reply"><input id="bd125ReplyInput" autocomplete="off" placeholder="Story-তে reply দিন…"><button>➤</button></form><div class="bd125-viewer-own" id="bd125OwnFoot" hidden><button type="button" data-bd125-insight>Insight দেখুন</button><button type="button" data-bd125-archive>Archive</button></div></div>`);portal=D.getElementById('bd125Portal');viewer=D.getElementById('bd125Viewer');D.querySelector('[data-bd125-vclose]').onclick=closeViewer;D.querySelector('[data-bd125-prev]').onclick=()=>openViewer(viewerIndex-1);D.querySelector('[data-bd125-next]').onclick=()=>openViewer(viewerIndex+1);D.getElementById('bd125Reply').onsubmit=replyStory;D.querySelector('[data-bd125-react]').onclick=reactStory;D.querySelector('[data-bd125-archive]').onclick=()=>location.href='story-archive.html';return portal}function openGate(){makePortal();portal.classList.add('open');portal.setAttribute('aria-hidden','false');D.documentElement.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>portal.classList.add('ready')))}function closeGate(){if(!portal)return;portal.classList.remove('ready');setTimeout(()=>{portal.classList.remove('open');portal.setAttribute('aria-hidden','true');D.documentElement.style.overflow=''},420)}function topbar(mode,visitor){return `<div class="bd125-top"><button class="bd125-close" type="button" data-bd125-close>×</button><div><h2>${mode==='story'?'Story Touch':'Magic Touch'}</h2><p>${visitor?'Public view · নিরাপদ অংশগুলোই দেখা যাচ্ছে':'গোপন দরজা · আপনার নিজের নিয়ন্ত্রণ'}</p></div>${visitor?'':`<button class="bd125-switch" type="button" data-bd125-switch="${mode==='story'?'magic':'story'}">${mode==='story'?'✦ Magic Touch':'◉ Story Touch'}</button>`}</div>`}function storyCard(st,i){const m=st.media,video=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(m)||String(st.raw?.media_type||'').includes('video');return `<button class="bd125-story-card" type="button" data-bd125-story="${i}">${m?(video?`<video muted playsinline preload="metadata" src="${esc(m)}"></video>`:`<img loading="lazy" src="${esc(m)}" alt="">`):`<span class="bd125-story-fallback">${esc(st.caption||'Story')}</span>`}<span class="bd125-ring"><span>${st.avatar?`<img src="${esc(st.avatar)}" alt="">`:esc(st.name[0]||'ভ')}</span></span><span class="bd125-story-meta"><b>${esc(st.name)}</b><small>${esc(st.caption||'Story')}</small></span></button>`}async function renderStory(){openGate();const shell=D.getElementById('bd125Shell'),visitor=isProfileVisitor();shell.innerHTML=topbar('story',visitor)+`<section class="bd125-hero"><h1>গোপন Story দরজা</h1><p>দুই দরজা খুলে আপনার Story, Insight এবং বন্ধুদের Story ধীরে চলতে থাকবে। যেটি দেখতে চান, সেটিতে ট্যাপ করুন।</p><span class="bd125-privacy-chip">◉ Story privacy অনুসারে দৃশ্যমান</span></section><div class="bd125-empty"><b>Story প্রস্তুত হচ্ছে…</b>এক মুহূর্ত অপেক্ষা করুন</div>`;wireShell();const d=await storyData();let own=d.own[0]||null;if(own)own=await storyInsights(own);storyList=visitor?d.own:[...d.friends];const ownHtml=own?`<div class="bd125-own"><article class="bd125-own-card"><div class="bd125-own-media">${own.media?(`<img src="${esc(own.media)}" alt="">`):'আপনার Story'}</div><div class="bd125-own-copy"><b>${visitor?esc(own.name):'আপনার বর্তমান Story'}</b><p>${esc(own.caption||'২৪ ঘণ্টার Story')}</p><div class="bd125-own-actions">${visitor?'':`<button class="bd125-pill" type="button" data-bd125-own-open>Story খুলুন</button><button class="bd125-pill" type="button" onclick="location.href='story-archive.html'">Archive</button>`}</div></div></article>${visitor?'':`<aside class="bd125-insight"><div class="bd125-insight-grid"><div class="bd125-stat"><b>${own.views}</b><small>Views</small></div><div class="bd125-stat"><b>${own.reactions}</b><small>Reactions</small></div><div class="bd125-stat"><b>${own.replies}</b><small>Replies</small></div></div><a href="story-archive.html">Story Insight & Archive</a></aside>`}</div>`:`<div class="bd125-own-card"><div class="bd125-own-media">＋</div><div class="bd125-own-copy"><b>${visitor?'Public Story নেই':'এখন কোনো সক্রিয় Story নেই'}</b><p>${visitor?'এই সদস্য বর্তমানে কোনো public Story দেননি।':'নতুন Story দিলে এখানে নিজের Story ও Insight দেখা যাবে।'}</p>${visitor?'':`<div class="bd125-own-actions"><button class="bd125-pill" onclick="location.href='profile.html#story'">Story দিন</button><button class="bd125-pill" onclick="location.href='story-archive.html'">Archive</button></div>`}</div></div>`;const train=visitor?'':`<section class="bd125-section"><div class="bd125-head"><div><b>বন্ধুদের Story ট্রেন</b><small>Medium-slow · ট্যাপ করলে থামবে ও খুলবে</small></div><small>${storyList.length} Story</small></div><div class="bd125-story-window" id="bd125StoryWindow">${storyList.length?`<div class="bd125-story-track">${storyList.map(storyCard).join('')}${storyList.length>1?storyList.map(storyCard).join(''):''}</div>`:`<div class="bd125-empty"><b>বন্ধুদের সক্রিয় Story নেই</b>Story এলে এখানে ধীরে ধীরে চলবে।</div>`}</div></section>`;shell.innerHTML=topbar('story',visitor)+`<section class="bd125-hero"><h1>গোপন Story দরজা</h1><p>${visitor?'এই সদস্যের public Story এখানে দেখা যাবে।':'নিজের Story নিচে, Insight পাশে, আর বন্ধুদের Story ধীরে ধীরে এক দিক থেকে অন্য দিকে চলবে।'}</p><span class="bd125-privacy-chip">◉ ${visitor?'Public Story':'Story Touch'}</span></section><section class="bd125-section"><div class="bd125-head"><div><b>${visitor?'Story':'আপনার Story'}</b><small>${visitor?'Public view':'Views · Reaction · Reply Insight'}</small></div></div>${ownHtml}</section>${train}`;wireShell();if(own&&!visitor){const btn=shell.querySelector('[data-bd125-own-open]');if(btn)btn.onclick=()=>{storyList=[own,...d.friends];openViewer(0)}}shell.querySelectorAll('[data-bd125-story]').forEach(b=>b.onclick=()=>openViewer(Number(b.dataset.bd125Story)%Math.max(1,d.friends.length)))}function magicItems(role,visitor){if(visitor)return[{i:'◎',t:'Friend Circle',s:'Public বন্ধু ও পরিচিতি',h:'#friends-public'},{i:'★',t:'প্রিয় লেখক',s:'Public করা প্রিয় লেখক',h:'favorite-authors.html'},{i:'◉',t:'Story Touch',s:'Public Story',h:'#story-touch'},{i:'ⓘ',t:'About / কবি পরিচিতি',s:'পরিচিতি ও সাহিত্যিক তথ্য',h:'#about-public'}];const common=[{i:'◎',t:'Friend Circle',s:'বন্ধু ও পারস্পরিক সংযোগ',h:'profile.html?friends=1',pub:true},{i:'✎',t:'Edit Profile',s:'নাম, Bio ও পরিচিতি',h:'edit-profile.html',lock:true},{i:'▥',t:'My Dashboard',s:'নিজস্ব Activity overview',h:'profile.html#dashboard',lock:true},{i:'☷',t:'Activity Log',s:'আপনার সাম্প্রতিক কার্যক্রম',h:'activity-log.html',lock:true},{i:'⊘',t:'Block List',s:'ব্লক করা অ্যাকাউন্ট',h:'settings.html#blocked',lock:true},{i:'⌁',t:'Password Change',s:'পাসওয়ার্ড ও নিরাপত্তা',h:'settings.html#password',lock:true},{i:'◌',t:'Personal Details',s:'ব্যক্তিগত তথ্য',h:'edit-profile.html#details',lock:true},{i:'⚙',t:'Settings',s:'Privacy, notification, account',h:'settings.html',lock:true},{i:'★',t:'প্রিয় লেখক',s:'আপনার পছন্দের লেখক',h:'favorite-authors.html',pub:true},{i:'▣',t:'Saved',s:'সংরক্ষিত পোস্ট',h:'archive.html?tab=saved',pub:true},{i:'▤',t:'Archiv / Personal Details</b><small>কখনো public নয়</small></span><span class="bd125-private-fixed">ALWAYS PRIVATE</span></div></section>`}function feedbackPanel(){return `<section class="bd125-feedback"><div class="bd125-head"><div><b>কী উন্নত করা যায়?</b><small>আপনার review সরাসরি Founder-এর কাছে যাবে</small></div></div><textarea id="bd125Feedback" placeholder="ভুবনডাঙ্গাকে আরও ভালো করতে আপনার পরামর্শ লিখুন…"></textarea><button type="button" id="bd125FeedbackSend">Founder-কে পাঠান</button><span class="bd125-status" id="bd125FeedbackStatus"></span></section>`}function wirePrivacy(uid,p){D.querySelectorAll('[data-bd125-privacy]').forEach(sel=>sel.onchange=async()=>{p[sel.dataset.bd125Privacy]=sel.value;await savePrivacy(uid,p)});const b=D.getElementById('bd125FeedbackSend');if(b)b.onclick=sendFeedback}function wireShell(){D.querySelectorAll('[data-bd125-close]').forEach(b=>b.onclick=closeGate);D.querySelectorAll('[data-bd125-switch]').forEach(b=>b.onclick=()=>b.dataset.bd125Switch==='story'?renderStory():renderMagic())}async function openViewer(i){if(!storyList.length)return;makePortal();viewerIndex=(i+storyList.length)%storyList.length;const st=storyList[viewerIndex],stage=D.getElementById('bd125VStage'),m=st.media,video=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(m)||String(st.raw?.media_type||'').includes('video');D.getElementById('bd125VAuthor').innerHTML=`<b>${esc(st.name)}</b><small>${esc(st.caption||'Story')}</small>`;stage.querySelectorAll('img,video,.bd125-viewer-text').forEach(x=>x.remove());const nav=stage.querySelector('.bd125-viewer-nav');if(m)nav.insertAdjacentHTML('beforebegin',video?`<video src="${esc(m)}" autoplay muted playsinline controls></video>`:`<img src="${esc(m)}" alt="">`);else nav.insertAdjacentHTML('beforebegin',`<div class="bd125-viewer-text">${esc(st.caption||'Story')}</div>`);const s=await getSession(),own=String(s?.user?.id||'')===st.aid;D.getElementById('bd125Reply').hidden=own;D.getElementById('bd125OwnFoot').hidden=!own;viewer.classList.add('open');D.getElementById('bd125ReplyInput').value=''}function closeViewer(){viewer?.classList.remove('open')}async function replyStory(e){e.preventDefault();const st=storyList[viewerIndex],input=D.getElementById('bd125ReplyInput'),body=input.value.trim();if(!body)return;const s=await getSession(),c=cli(),sender=String(s?.user?.id||'');let ok=false;if(c&&sender&&st?.aid)for(const row of [{sender_id:sender,recipient_id:st.aid,body,story_id:st.id,type:'story_reply',created_at:new Date().toISOString()},{from_user_id:sender,to_user_id:st.aid,message:body,story_id:st.id},{sender_id:sender,receiver_id:st.aid,content:body,type:'story_reply'}])try{const r=await c.from('messages').insert(row);if(!r.error){ok=true;break}}catch(_){}if(!ok)try{localStorage.setItem('bd-pending-story-reply',JSON.stringify({to:st.aid,story:st.id,body,at:Date.now()}));ok=true}catch(_){}input.value='';input.placeholder=ok?'Reply পাঠানো হয়েছে ✓':'Messages-এ পাঠাতে খুলুন';if(!ok)location.href=`messages.html?to=${encodeURIComponent(st.aid)}&story=${encodeURIComponent(st.id)}`}async function reactStory(){const st=storyList[viewerIndex],s=await getSession(),c=cli(),uid=String(s?.user?.id||'');if(!uid||!st)return;const b=D.querySelector('[data-bd125-react]');b.textContent='♥';if(c)try{await c.from('story_reactions').upsert({story_id:st.id,user_id:uid,reaction:'love'},{onConflict:'story_id,user_id'})}catch(_){}}async function sendFeedback(){const t=D.getElementById('bd125Feedback'),st=D.getElementById('bd125FeedbackStatus'),body=t?.value.trim();if(!body)return;st.textContent='পাঠানো হচ্ছে…';const s=await getSession(),c=cli(),uid=String(s?.user?.id||''),name=s?.user?.user_metadata?.full_name||s?.user?.email||'একজন সদস্য';let founder='';if(c)try{const r=await c.from('user_roles').select('*').eq('role','founder').eq('active',true).limit(1);founder=String(r.data?.[0]?.user_id||'')}catch(_){}if(!founder&&c)try{const r=await c.from('profiles').select('*').eq('role','founder').limit(1);founder=String(r.data?.[0]?.id||'')}catch(_){}let ok=false;if(c&&founder)for(const row of [{sender_id:uid,recipient_id:founder,body:'[Magic Touch Review] '+body,type:'feedback',created_at:new Date().toISOString()},{from_user_id:uid,to_user_id:founder,message:'[Magic Touch Review] '+body}])try{const r=await c.from('messages').insert(row);if(!r.error){ok=true;break}}catch(_){}if(!ok&&c&&founder)try{const r=await c.from('notifications').insert({recipient_id:founder,actor_id:uid,type:'feedback',title:'Magic Touch Review',message:`${name}: ${body}`,url:'founder-dashboard.html#feedback',created_at:new Date().toISOString()});ok=!r.error}catch(_){}if(!ok)try{const q=JSON.parse(localStorage.getItem('bd-founder-feedback-queue')||'[]');q.push({uid,name,body,at:Date.now()});localStorage.setItem('bd-founder-feedback-queue',JSON.stringify(q.slice(-50)));ok=true}catch(_){}st.textContent=ok?'Founder-এর কাছে পাঠানো হয়েছে ✓':'পাঠানো যায়নি';if(ok)t.value=''}D.addEventListener('click',e=>{const a=e.target.closest?.('.bd-side-row[href="#story-touch"],.bd-side-row[href="#magic-touch"]');if(!a)return;e.preventDefault();try{W.BD_MODULES?.sidebars?.closeDrawers?.()}catch(_){}a.getAttribute('href')==='#story-touch'?renderStory():renderMagic()},true);D.addEventListener('keydown',e=>{if(e.key==='Escape'){if(viewer?.classList.contains('open'))closeViewer();else if(portal?.classList.contains('open'))closeGate()}});W.BD_SECRET_TOUCH={story:renderStory,magic:renderMagic,close:closeGate};})();

<script id="bd-feed-production-acceptance-20260821">
(function(D,W){'use strict';
 if(W.__BD_FEED_PRODUCTION_ACCEPTANCE__)return;W.__BD_FEED_PRODUCTION_ACCEPTANCE__=1;
 const q=(s,r=D)=>r.querySelector(s),qa=(s,r=D)=>[...r.querySelectorAll(s)];

 ownerRefresh();W.addEventListener('bd:auth-changed',ownerRefresh);setTimeout(ownerRefresh,450);setTimeout(ownerRefresh,1400);

 /* Owner archive + owner notification controls. */

 },true);

 /* Share system: one compact sheet, all canonical actions. */
 function ensureShare(){if(q('#bdNextShareSheet'))return;D.body.insertAdjacentHTML('beforeend','<div class="bd-next-share-back" id="bdNextShareBack"></div><section class="bd-next-share-sheet" id="bdNextShareSheet" aria-hidden="true"><h3>শেয়ার করুন</h3><button type="button" data-share-normal>সাধারণভাবে শেয়ার করুন</button><button type="button" data-share-message>মেসেজে পাঠান</button><button type="button" data-share-story>স্টোরিতে শেয়ার করুন</button><button type="button" data-share-copy>পোস্ট লিংক কপি করুন</button></section>');q('#bdNextShareBack').onclick=closeShare}
 let shareCard=null;

 function closeShare(){q('#bdNextShareBack')?.classList.remove('open');q('#bdNextShareSheet')?.classList.remove('open');q('#bdNextShareSheet')?.setAttribute('aria-hidden','true');shareCard=null}
 async function bumpShare(card){const id=canonical(card),el=q('[data-share-count]',card);let n=Number((el?.textContent.match(/[\d.]+/)||[])[0]||0);if(el)el.textContent=(n+1)+' shares';try{const c=getClient(),u=await me();await c?.from('post_shares').insert({post_id:id,user_id:u?.id||null,share_type:'external'})}catch(_){}W.dispatchEvent(new CustomEvent('bd:post-shared',{detail:{post_id:id}}))}
 D.addEventListener('click',e=>{const b=e.target.closest?.('[data-share],[data-menu-share],[data-photo-share]');if(!b)return;const card=b.closest('.bd-post')||q('#bdPhotoViewer')?.__bdSourceCard;if(!card)return;e.preventDefault();e.stopImmediatePropagation();openShare(card)},true);
 D.addEventListener('click',async e=>{const b=e.target.closest?.('#bdNextShareSheet button');if(!b||!shareCard)return;const card=shareCard,url=postUrl(card),id=canonical(card);if(b.matches('[data-share-normal]')){try{if(navigator.share)await navigator.share({title:'ভুবনডাঙ্গার কবিতা',url});else{await copyText(url);toast('শেয়ার লিংক কপি হয়েছে')}}catch(_){return}await bumpShare(card);closeShare()}else if(b.matches('[data-share-message]')){try{sessionStorage.setItem('bd-pending-message-share',JSON.stringify({post_id:id,url,at:Date.now()}))}catch(_){}location.href='messages.html?share='+encodeURIComponent(id)}else if(b.matches('[data-share-story]')){try{sessionStorage.setItem('bd-pending-story-share',JSON.stringify({post_id:id,url,at:Date.now()}))}catch(_){}const u=await me(),c=getClient();try{if(u)await c?.from('story_shares').insert({user_id:u.id,post_id:id,source:'feed'})}catch(_){}closeShare();if(W.BD_SECRET_TOUCH?.openStory)W.BD_SECRET_TOUCH.openStory();else if(W.BD_SECRET_TOUCH?.story)W.BD_SECRET_TOUCH.story();else W.dispatchEvent(new CustomEvent('bd:story-share-request',{detail:{post_id:id,url}}));toast('স্টোরি শেয়ার প্রস্তুত হয়েছে')}else if(b.matches('[data-share-copy]')){if(await copyText(url))toast('পোস্ট লিংক কপি হয়েছে');closeShare()}},true);

 /* Browser Back closes photo/focused surface first; direct close consumes its history entry. */
