function bdDeepNormalize(v){
  return String(v||"").normalize("NFKC")
    .replace(/[\u200B-\u200D\uFEFF\u2060]/g,"")
    .toLocaleLowerCase("bn-BD")
    .replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d))
    .replace(/[@4]/g,"a").replace(/[3]/g,"e").replace(/[1!|]/g,"i").replace(/[0]/g,"o").replace(/[5$]/g,"s").replace(/[7]/g,"t")
    .replace(/([a-z])\1{2,}/g,"$1$1")
    .replace(/([অ-হড়ঢ়য়])\1{2,}/g,"$1$1")
    .replace(/[^\p{L}\p{M}\p{N}]+/gu," ")
    .replace(/\s+/g," ").trim();
}
function bdDeepBadTerms(text){
  const n=bdDeepNormalize(text), words=n.split(" ").filter(Boolean), compact=n.replace(/\s+/g,""), found=[];
  for(const raw of BD_DEEP_BAD_TERMS){
    const t=bdDeepNormalize(raw), tw=t.split(" ").filter(Boolean), tc=t.replace(/\s+/g,"");
    let hit=false;
    for(let i=0;i<=words.length-tw.length;i++){
      if(tw.every((w,j)=>words[i+j]===w)){hit=true;break}
    }
    if(!hit && tc.length>=5 && compact.includes(tc))hit=true;
    if(hit)found.push(raw);
  }
  return [...new Set(found)];
}
