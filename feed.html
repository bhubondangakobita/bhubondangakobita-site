function bdDeepNormalize(v){
  return String(v||"").normalize("NFKC")
    .replace(/[\u200B-\u200D\uFEFF\u2060]/g,"")
    .toLocaleLowerCase("bn-BD")
    .replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d))
    .replace(/[@4]/g,"a").replace(/[3]/g,"e").replace(/[1!|]/g,"i").replace(/[0]/g,"o").replace(/[5$]/g,"s").replace(/[7]/g,"t")
    .replace(/([a-z])\1{2,}/g,"$1$1")
    .replace(/([অ-হড়ঢ়য়])\1{2,}/g,"$1$1")
    .replace(/[^\p{L}\p{M}\p{N}]+/gu," ")
    .replace(/\s+/g," ").trim();
}
function bdDeepBadTerms(text){
  const n=bdDeepNormalize(text), words=n.split(" ").filter(Boolean), compact=n.replace(/\s+/g,""), found=[];
  for(const raw of BD_DEEP_BAD_TERMS){
    const t=bdDeepNormalize(raw), tw=t.split(" ").filter(Boolean), tc=t.replace(/\s+/g,"");
    let hit=false;
    for(let i=0;i<=words.length-tw.length;i++){
      if(tw.every((w,j)=>words[i+j]===w)){hit=true;break}
    }
    if(!hit && tc.length>=5 && compact.includes(tc))hit=true;
    if(hit)found.push(raw);
  }
  return [...new Set(found)];
}

const PROFILE_CACHE=new Map();async function profileRowsFor(ids){ids=[...new Set((ids||[]).map(String).filter(Boolean))];const out=new Map();ids.forEach(id=>{if(PROFILE_CACHE.has(id))out.set(id,PROFILE_CACHE.get(id))});const need=ids.filter(id=>!PROFILE_CACHE.has(id)),c=client();if(!c||!need.length)return out;for(const col of ['id','user_id']){try{const r=await bdTimeout(c.from('profiles').select('*').in(col,need),1600);if(r?.__bdTimeout)continue;if(!r?.error&&Array.isArray(r?.data)){r.data.forEach(x=>{const k=String(x.id||x.user_id||'');if(k){PROFILE_CACHE.set(k,x);out.set(k,x)}});break}}catch(_){}}return out}

async function loadCommentReactions(card,cid,force=false){const s=stateOf(card),key=String(cid);if(!force&&s.commentReactions?.has(key))return s.commentReactions.get(key);let rows=[];const c=client();if(c){try{const r=await c.from('comment_reactions').select('*').eq('comment_id',cid).order('created_at',{ascending:true});if(!r.error&&Array.isArray(r.data))rows=r.data}catch(_){}}if(!rows.length){try{rows=JSON.parse(localStorage.getItem('bd-comment-rx-'+key)||'[]')||[]}catch(_){rows=[]}}const ids=[...new Set(rows.map(x=>String(x.user_id||'')).filter(Boolean))],profiles=await profileRowsFor(ids);rows=rows.map(x=>{const p=profiles.get(String(x.user_id||''))||{};return {...x,name:x.author_name||p.full_name||p.name||p.username||'সদস্য',avatar:x.avatar_url||p.avatar_url||'',username:p.username||''}});s.commentReactions ||= new Map();s.commentReactions.set(key,rows);return rows}

async function setCommentReaction(card,el,rx='like'){

   try{await c?.from('comment_reactions').delete().eq('comment_id',cid).eq('user_id',ss.user.id)}catch(_){}

 return `<section class="bd75-suggest" data-bd75-suggest><div class="bd75-suggest-head"><b>আপনার পরিচিত হতে পারেন</b><small>Mutual connections</small></div><div class="bd75-suggest-row">${items.map(x=>`<article class="bd75-person"><div class="bd75-person-photo">${x.avatar_url?`<img loading="lazy" src="${esc(x.avatar_url)}" alt="">`:''}</div><div class="bd75-person-body"><b>${esc(x.display_name||x.username||'ভুবনডাঙ্গার সদস্য')}</b><small>${Number(x.mutual)||0} mutual connections</small><div class="bd75-person-actions"><button type="button" data-bd75-follow="${esc(x.id)}">＋ Follow</button><a href="profile.html?user=${encodeURIComponent(x.username||x.id)}">দেখুন</a></div></div></article>`).join('')}</div></section>`
}
async function mount(){
 if(q('[data-bd75-suggest]'))return;
 const root=q('.bd-feed-root')||q('[data-feed-root]')||q('#feed')||q('.feed');if(!root)return;
 const posts=qa('.bd-post,.post,[data-post-id]',root);if(posts.length<2)return;
 const items=await data();if(!items.length)return;
 const holder=D.createElement('div');holder.innerHTML=html(items);const node=holder.firstElementChild;
 const anchor=posts[Math.min(2,posts.length-1)];anchor?.insertAdjacentElement('afterend',node);
}
D.addEventListener('click',async e=>{
 const b=e.target.closest('[data-bd75-follow]');if(!b)return;
 const c=window.BD_SUPABASE||window.supabaseClient||window.BhubondangaAuth?.client||null;
 try{const me=(await c?.auth?.getSession())?.data?.session?.user;if(!me)throw new Error('login');const id=b.dataset.bd75Follow;const r=await c.from('follows').upsert({follower_id:me.id,following_id:id},{onConflict:'follower_id,following_id'});if(r.error)throw r.error;b.textContent='✓ Following';b.disabled=true}catch(_){b.textContent='Login required'}
},true);
let timer;new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(mount,500)}).observe(D.documentElement,{childList:true,subtree:true});
setTimeout(mount,900);
})();
</script>
