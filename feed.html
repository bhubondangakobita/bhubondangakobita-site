/* BHUBONDANGA V68 — one transparent reaction family, lightweight motion only. */
:root{
  --bd-rx-green:#176b56;
  --bd-rx-green2:#35b98d;
  --bd-rx-black:#08110f;
}

/* Feed summary: small and static for performance. */
.bd-rx-mini{
  background-image:none!important;
  width:22px!important;height:22px!important;min-width:22px!important;max-width:22px!important;
  border:0!important;border-radius:0!important;background-color:transparent!important;
  background-repeat:no-repeat!important;background-position:center!important;background-size:contain!important;
  filter:drop-shadow(0 1px 2px rgba(10,20,18,.14))!important;
  box-shadow:none!important;
}
.bd-rx-mini[data-rx="like"]{background-image:url('rx-like.webp')!important}
.bd-rx-mini[data-rx="love"]{background-image:url('rx-love.webp')!important}
.bd-rx-mini[data-rx="care"]{background-image:url('rx-care.webp')!important}
.bd-rx-mini[data-rx="haha"]{background-image:url('rx-haha.webp')!important}
.bd-rx-mini[data-rx="wow"]{background-image:url('rx-wow.webp')!important}
.bd-rx-mini[data-rx="sad"]{background-image:url('rx-sad.webp')!important}
.bd-rx-mini[data-rx="angry"]{background-image:url('rx-angry.webp')!important}

/* Feed picker: compact white/light; Bhubondanga black-green in dark mode. */
.bd-rx-tray,.bd-rx-tray.bd-rx-floating{
  width:min(310px,calc(100vw - 20px))!important;
  max-width:310px!important;height:52px!important;min-height:52px!important;
  padding:5px 7px!important;border-radius:999px!important;
  border:1px solid rgba(23,107,86,.18)!important;
  background:rgba(255,255,255,.985)!important;
  box-shadow:0 10px 26px rgba(8,30,24,.18),0 2px 7px rgba(8,30,24,.07)!important;
  filter:none!important;overflow:visible!important;
  backdrop-filter:blur(14px)!important;-webkit-backdrop-filter:blur(14px)!important;
}
html[data-theme="dark"] .bd-rx-tray,
html[data-theme="dark"] .bd-rx-tray.bd-rx-floating{
  background:rgba(8,17,15,.985)!important;
  border-color:rgba(53,185,141,.30)!important;
  box-shadow:0 12px 30px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.03)!important;
}
.bd-rx-zones{height:100%!important;display:grid!important;grid-template-columns:repeat(7,1fr)!important;align-items:center!important;justify-items:center!important;gap:1px!important}
.bd-rx-zone,.bd-rx-pick{
  width:40px!important;height:40px!important;min-height:40px!important;max-width:40px!important;
  padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;
  opacity:1!important;display:grid!important;place-items:center!important;overflow:visible!important;
  touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;
}
.bd-rx-pick-img{
  width:36px!important;height:36px!important;max-width:36px!important;max-height:36px!important;
  object-fit:contain!important;background:transparent!important;border:0!important;border-radius:0!important;
  box-shadow:none!important;filter:drop-shadow(0 2px 3px rgba(5,18,14,.16))!important;
  transform-origin:50% 80%!important;will-change:transform,opacity!important;
}
/* Opening stagger. */
.bd-rx-tray.open .bd-rx-zone{
  animation:bd68Enter .32s cubic-bezier(.18,.9,.28,1.22) both!important;
  animation-delay:calc(var(--rx-order) * 24ms)!important;
}
@keyframes bd68Enter{
  0%{opacity:0;transform:translateY(9px) scale(.58)}
  68%{opacity:1;transform:translateY(-3px) scale(1.08)}
  100%{opacity:1;transform:none}
}
/* Individual personality motion — only while picker is open. */
.bd-rx-tray.open [data-rx-pick="like"] .bd-rx-pick-img{animation:bd68Like 1.65s ease-in-out .28s infinite}
.bd-rx-tray.open [data-rx-pick="love"] .bd-rx-pick-img{animation:bd68Love 1.45s ease-in-out .34s infinite}
.bd-rx-tray.open [data-rx-pick="care"] .bd-rx-pick-img{animation:bd68Care 1.8s ease-in-out .40s infinite}
.bd-rx-tray.open [data-rx-pick="haha"] .bd-rx-pick-img{animation:bd68Haha 1.25s ease-in-out .46s infinite}
.bd-rx-tray.open [data-rx-pick="wow"] .bd-rx-pick-img{animation:bd68Wow 1.55s ease-in-out .52s infinite}
.bd-rx-tray.open [data-rx-pick="sad"] .bd-rx-pick-img{animation:bd68Sad 1.9s ease-in-out .58s infinite}
.bd-rx-tray.open [data-rx-pick="angry"] .bd-rx-pick-img{animation:bd68Angry 1.35s ease-in-out .64s infinite}

@keyframes bd68Love{0%,100%{transform:scale(1)}45%{transform:scale(1.075)}65%{transform:scale(.985)}}
@keyframes bd68Care{0%,100%{transform:none}50%{transform:translateY(-2px) rotate(2.2deg)}}
@keyframes bd68Haha{0%,100%{transform:none}35%{transform:translateY(-3px) rotate(-2deg)}55%{transform:translateY(0) rotate(2deg)}}
@keyframes bd68Wow{0%,100%{transform:scale(1)}50%{transform:translateY(-1px) scale(1.065)}}
@keyframes bd68Sad{0%,100%{transform:none}55%{transform:translateY(2px) rotate(-1deg)}}
@keyframes bd68Angry{0%,100%{transform:none}38%{transform:translateX(-1.5px) rotate(-1.6deg)}48%{transform:translateX(1.5px) rotate(1.6deg)}58%{transform:none}}
@media(hover:hover) and (pointer:fine){
 .bd-rx-zone:hover .bd-rx-pick-img{animation:none!important;transform:translateY(-6px) scale(1.14)!important}
}
.bd-rx-zone:active .bd-rx-pick-img{animation:none!important;transform:translateY(-1px) scale(.92)!important}

function bdDeepBadTerms(text){
  const central=bdCentralBadTerms(text);if(central&&central.length)return [...new Set(central)];
  const n=bdDeepNormalize(text), words=n.split(" ").filter(Boolean), compact=n.replace(/\s+/g,""), found=[];
  for(const raw of BD_DEEP_BAD_TERMS){
    const t=bdDeepNormalize(raw), tw=t.split(" ").filter(Boolean), tc=t.replace(/\s+/g,"");
    let hit=false;
    for(let i=0;i<=words.length-tw.length;i++){
      if(tw.every((w,j)=>words[i+j]===w)){hit=true;break}
    }
    if(!hit && tc.length>=5 && compact.includes(tc))hit=true;
    if(hit)found.push(raw);
  }
  return [...new Set(found)];
}

(()=>{if(W.__BD_PHOTO_PINCH__)return;W.__BD_PHOTO_PINCH__=1;let scale=1,start=0,startScale=1,img=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);D.addEventListener('touchstart',e=>{const im=e.target.closest?.('#bdPhotoViewer [data-photo-view]');if(!im)return;if(e.touches.length===2){img=im;start=dist(e.touches);startScale=scale;e.preventDefault()}},{passive:false});D.addEventListener('touchmove',e=>{if(!img||e.touches.length!==2)return;e.preventDefault();scale=Math.max(1,Math.min(4,startScale*dist(e.touches)/Math.max(1,start)));img.style.transform=`scale(${scale})`;img.style.transformOrigin='center center'},{passive:false});D.addEventListener('touchend',e=>{if(img&&e.touches.length<2){if(scale<=1.02){scale=1;img.style.transform=''}img=null}},{passive:true});D.addEventListener('click',e=>{if(e.target.closest?.('[data-photo-close]')){scale=1;const im=D.querySelector('#bdPhotoViewer [data-photo-view]');if(im)im.style.transform=''}},true)})();
