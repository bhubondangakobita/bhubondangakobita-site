async function reactionRows(id){const c=client();if(c){try{const r=await c.rpc('get_post_social',{target_post:String(id)});if(!r.error){const d=Array.isArray(r.data)?r.data[0]:r.data;if(Array.isArray(d?.reactions))return dedupe(d.reactions)}}catch(_){ }for(const table of ['post_reactions','reactions'])try{const r=await c.from(table).select('user_id,reaction').eq('post_id',id).limit(250);if(!r.error)return dedupe(r.data||[])}catch(_){ }}return dedupe(localGet('bd31-react-'+id,[]))}
async function commentRows(id){let rows=[];const c=client();if(c)try{let r=await c.from('comments').select('*').eq('post_id',id).eq('status','published').order('created_at',{ascending:true}).limit(180);if(r.error)r=await c.from('comments').select('*').eq('post_id',id).order('created_at',{ascending:true}).limit(180);if(!r.error)rows=r.data||[]}catch(_){ }const loc=localGet('bd31-comments-'+id,[]),seen=new Set(rows.map(x=>String(x.id)));for(const x of loc)if(!seen.has(String(x.id)))rows.push(x);const pm=await profiles(rows.map(x=>x?.author_id||x?.user_id));rows=rows.map(x=>{const p=pm[String(x?.author_id||x?.user_id||'')]||{};const full=p.display_name||p.full_name||p.name||x.author_name||x.display_name||x.name||p.username||'সদস্য';return{...x,author_name:full,author_username:p.username||x.author_username||x.username||'',author_avatar:p.avatar_url||p.avatar||x.author_avatar||x.avatar_url||'',author_role:p.role||x.author_role||x.role||''}});return rows}

 if(!ok){let a=localGet('bd31-react-'+id,[]),old=a.find(x=>String(x.user_id)===String(s.user.id));a=a.filter(x=>String(x.user_id)!==String(s.user.id));if(!old||old.reaction!==type)a.push({user_id:s.user.id,reaction:type});localSet('bd31-react-'+id,a)}return true}
