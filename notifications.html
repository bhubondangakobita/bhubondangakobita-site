@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(150deg,#fbfdff,#eef3f9 58%,#f7f3fb);color:#17304e;font-family:'Noto Serif Bengali',serif}body{padding-bottom:env(safe-area-inset-bottom)}a{color:inherit;text-decoration:none}.bar{position:sticky;top:0;z-index:20;height:68px;padding:0 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;border-bottom:1px solid rgba(93,111,152,.15);background:rgba(255,255,255,.94);backdrop-filter:blur(18px)}.back,.all{min-height:40px;border:1px solid rgba(93,111,152,.16);border-radius:12px;background:#fff;color:#17304e;font:700 12px inherit;padding:0 13px}.bar h1{margin:0;font-size:20px}.wrap{width:min(760px,100%);margin:auto;padding:14px}.hero{padding:14px 16px;border:1px solid rgba(93,111,152,.16);border-radius:18px;background:rgba(255,255,255,.84);box-shadow:0 12px 30px rgba(60,74,126,.08)}.hero b{display:block;font-size:18px}.hero p{margin:4px 0 0;color:#718099;font-size:10px}.list{margin-top:12px;display:grid;gap:8px}.item{padding:12px;border:1px solid rgba(93,111,152,.16);border-radius:15px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:start;background:rgba(255,255,255,.94);box-shadow:0 7px 18px rgba(64,75,124,.05)}.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#eaf7f1,#f1edff);font-size:20px}.copy b,.copy span{display:block}.copy b{font-size:12px}.copy span{margin-top:3px;color:#65748e;font-size:10px;line-height:1.6}.time{white-space:nowrap;color:#8995a8;font:600 8px system-ui}.empty{padding:45px 15px;text-align:center;color:#738097}.unread{border-left:4px solid #cf5f91}@media(max-width:520px){.bar{height:60px}.bar h1{font-size:17px}.all{font-size:9px;padding:0 8px}.wrap{padding:10px}.item{grid-template-columns:37px minmax(0,1fr);}.ico{width:37px;height:37px}.time{grid-column:2}}</style></head><body><header class="bar"><button class="back" onclick="history.length>1?history.back():location.href='index.html'">‹</button><h1>নোটিফিকেশন</h1><button class="all" id="markAll">সব পড়া হয়েছে</button></header><main class="wrap"><section class="hero"><b>আপনার নোটিফিকেশন</b><p>লাইক, ভালোবাসা, মন্তব্য, অনুসরণ এবং প্রয়োজনীয় সাইট আপডেট এখানে থাকবে।</p></section><section class="list" id="list"><div class="empty">লোড হচ্ছে…</div></section></main><script>
(()=>{'use strict';const D=document,esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),ago=v=>{const t=Date.parse(v||0);if(!Number.isFinite(t))return'';const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return'এখন';if(s<3600)return Math.floor(s/60)+' মিনিট';if(s<86400)return Math.floor(s/3600)+' ঘণ্টা';return Math.floor(s/86400)+' দিন'};function icon(x){const t=String(x.type||'');if(t.includes('comment'))return'💬';if(t.includes('reaction'))return'❤';if(t.includes('follow'))return'👤';if(t.includes('message'))return'✉';if(t.includes('moderation'))return'⚠';return'🔔'}async function render(){const c=window.BD_SIGNAL_CENTER;if(!c){setTimeout(render,120);return}const rows=await c.getNotificationRows();D.getElementById('list').innerHTML=rows.length?rows.map(x=>`<a class="item ${x.read===false||x.is_read===false?'unread':''}" href="${esc(x.url||'index.html')}"><span class="ico">${icon(x)}</span><span class="copy"><b>${esc(x.title||x.message||'নোটিফিকেশন')}</b><span>${esc(x.message||x.body||'')}</span></span><span class="time">${esc(ago(x.created_at||x.createdAt))}</span></a>`).join(''):'<div class="empty">নতুন কোনো নোটিফিকেশন নেই।</div>';setTimeout(()=>c.markNotificationsRead(),350)}D.getElementById('markAll').onclick=async()=>{await window.BD_SIGNAL_CENTER?.markNotificationsRead?.();render()};window.addEventListener('bd:signals-ready',render,{once:true});window.addEventListener('bd:signal-count',e=>{if(e.detail?.kind==='notification')render()});if(document.readyState!=='loading')render();else D.addEventListener('DOMContentLoaded',render,{once:true})})();
</script></body></html>
