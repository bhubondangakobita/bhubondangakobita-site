<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173153"><title>নোটিফিকেশন | ভুবনডাঙ্গার কবিতা</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 5% 2%,rgba(126,187,230,.16),transparent 27%),linear-gradient(150deg,#fbfdff,#eef2f7 52%,#f7f6fb);color:#213754;font:400 14px/1.7 'Noto Serif Bengali',serif}.top{position:sticky;top:0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.95);border-bottom:1px solid rgba(112,126,170,.18);backdrop-filter:blur(20px)}.top a{color:inherit;text-decoration:none}main{width:min(760px,100%);margin:auto;padding:14px}h1{font-size:24px}.card{margin-bottom:8px;padding:12px;border:1px solid rgba(112,126,170,.18);border-radius:14px;background:rgba(255,255,255,.90);box-shadow:0 9px 22px rgba(70,78,142,.07)}.card strong{display:block}.card small{color:#8b96aa}.actions{display:flex;gap:7px;margin-top:8px}.actions button{height:36px;padding:0 11px;border:1px solid rgba(112,126,170,.18);border-radius:9px;background:#fff}.actions .accept{border:0;background:#4f8a78;color:#fff}</style></head><body><header class="top"><a href="index.html">🌿 ভুবনডাঙ্গার কবিতা</a><a href="messages.html">বার্তা</a></header><main><h1>নোটিফিকেশন</h1><div id="list"></div></main><script>const sb=window.supabase.createClient('https://ihjiisysrwgxxkuywuhc.supabase.co','sb_publishable_2ofR9FO078M1Eu-m0Q8FLg_WqN6iIxz',{auth:{persistSession:true}}),$=s=>document.querySelector(s);let me;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='login.html?next=notifications.html';me=s.user;const n=await sb.from('notifications').select('*').eq('recipient_id',me.id).order('created_at',{ascending:false}).limit(100);const c=await sb.from('call_requests').select('*').eq('recipient_id',me.id).eq('status','pending').order('created_at',{ascending:false});const calls=(c.data||[]).map(x=>`<article class="card"><strong>${x.call_type==='video'?'ভিডিও':'ভয়েস'} কলের অনুমতি</strong><small>অনুমোদন দিলে ২৪ ঘণ্টা কল করা যাবে।</small><div class="actions"><button class="accept" data-accept="${x.id}">২৪ ঘণ্টা অনুমোদন</button><button data-reject="${x.id}">বাতিল</button></div></article>`).join('');const notes=(n.data||[]).map(x=>`<article class="card"><strong>${esc(x.title)}</strong><small>${new Date(x.created_at).toLocaleString('bn-BD')}</small></article>`).join('');$('#list').innerHTML=calls+notes||'<p>নতুন কোনো নোটিফিকেশন নেই।</p>';await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',me.id).is('read_at',null)}document.addEventListener('click',async e=>{const a=e.target.closest('[data-accept]'),r=e.target.closest('[data-reject]');if(a){await sb.from('call_requests').update({status:'accepted',accepted_at:new Date().toISOString(),expires_at:new Date(Date.now()+86400000).toISOString()}).eq('id',a.dataset.accept).eq('recipient_id',me.id);load()}if(r){await sb.from('call_requests').update({status:'rejected'}).eq('id',r.dataset.reject).eq('recipient_id',me.id);load()}});load();</script></body></html>
