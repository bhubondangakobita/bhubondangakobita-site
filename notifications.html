<!doctype html><html lang="bn" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#173153"><title>নোটিফিকেশন | ভুবনডাঙ্গার কবিতা</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap');*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}:root{--text:#213754;--soft:#61708a;--muted:#8b96aa;--border:rgba(112,126,170,.18);--primary:#7a7fdc;--primary2:#9a82e4;--green:#4f8a78;--red:#c65f83;--strong:rgba(255,255,255,.94);--shadow:0 14px 34px rgba(70,78,142,.10),inset 0 1px 0 rgba(255,255,255,.96);--bg:radial-gradient(circle at 5% 2%,rgba(126,187,230,.16),transparent 27%),radial-gradient(circle at 96% 4%,rgba(193,178,229,.14),transparent 29%),linear-gradient(150deg,#fbfdff,#eef2f7 52%,#f7f6fb)}html[data-theme=dark]{--text:#f2f6ff;--soft:#cad4eb;--muted:#98a9c5;--border:rgba(165,183,255,.18);--primary:#98a8ff;--primary2:#b79eff;--green:#8bd1bc;--red:#ff9cbd;--strong:rgba(14,28,52,.95);--bg:linear-gradient(180deg,#06101d,#081525 58%,#09192b)}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:400 14px/1.7 'Noto Serif Bengali',serif}.top{position:sticky;top:0;z-index:20;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--strong);border-bottom:1px solid var(--border);backdrop-filter:blur(22px)}.top a,.top button{color:inherit;text-decoration:none}.top button{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:transparent}main{width:min(780px,100%);margin:auto;padding:14px}h1{font-size:24px;font-weight:600}.sub{color:var(--muted);font-size:9px;margin-bottom:12px}.list{display:grid;gap:8px}.note{width:100%;padding:11px;border:1px solid var(--border);border-radius:15px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--strong);box-shadow:var(--shadow);color:inherit;text-align:left}.note:hover{border-color:var(--primary);transform:translateY(-1px)}.note img,.ico{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:white;font-size:19px}.note strong{display:block;font-size:11px;font-weight:600}.note small{display:block;color:var(--muted);font-size:7.5px}.arrow{color:var(--primary);font-size:20px}.call-card{padding:12px;border:1px solid var(--border);border-radius:15px;background:var(--strong);box-shadow:var(--shadow)}.call-card strong{font-size:12px}.call-card small{display:block;color:var(--muted);font-size:8px}.actions{display:flex;gap:7px;margin-top:8px}.actions button{min-height:37px;padding:0 11px;border:1px solid var(--border);border-radius:10px;background:transparent}.actions .accept{border:0;background:linear-gradient(135deg,#58a78d,#347e68);color:#fff}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:520px){main{padding:10px}.note{grid-template-columns:40px minmax(0,1fr) auto;padding:9px}.note img,.ico{width:40px;height:40px}.top span{font-size:12px}}</style></head><body><header class="top"><a href="index.html">🌿 <span>ভুবনডাঙ্গার কবিতা</span></a><div><a href="messages.html">বার্তা</a> <button id="themeBtn" aria-label="থিম">◐</button></div></header><main><h1>নোটিফিকেশন</h1><p class="sub">প্রতিটি নোটিফিকেশন চাপলে সংশ্লিষ্ট বার্তা, প্রোফাইল বা লেখায় যাবে।</p><div class="list" id="list"></div></main><script>const sb=window.supabase.createClient('https://ihjiisysrwgxxkuywuhc.supabase.co','sb_publishable_2ofR9FO078M1Eu-m0Q8FLg_WqN6iIxz',{auth:{persistSession:true}}),$=s=>document.querySelector(s);let me,profiles=new Map();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pretty(v){try{return new Intl.DateTimeFormat('bn-BD',{timeZone:'Asia/Dhaka',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(v))}catch(_){return''}}function route(p){const r=String(p?.role||'').toLowerCase();if(r==='founder'||p?.username==='mahmud-sohel')return'founder-profile.html';if(r==='admin')return'admin-profile.html';if(r==='poet')return'poet-profile.html?user='+encodeURIComponent(p.id);if(r==='famous')return'famous-poet-profile.html?poet='+encodeURIComponent(p.username||p.id);return'profile.html?user='+encodeURIComponent(p?.id||p?.username||'me')}function noteURL(n,p){const pay=n.payload||{};if(['message','voice_message'].includes(n.type))return'messages.html?user='+encodeURIComponent(pay.sender_id||n.actor_id||'');if(['comment','like','reaction','follow','profile_update'].includes(n.type))return route(p||{id:n.actor_id});if(n.type==='post')return'index.html?post='+encodeURIComponent(pay.post_id||'');return route(p||{id:n.actor_id})}async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return location.href='login.html?next=notifications.html';me=s.user;const [n,c]=await Promise.all([sb.from('notifications').select('*').eq('recipient_id',me.id).order('created_at',{ascending:false}).limit(100),sb.from('call_requests').select('*').eq('recipient_id',me.id).eq('status','pending').order('created_at',{ascending:false})]);const notes=n.data||[],ids=[...new Set(notes.map(x=>x.actor_id).filter(Boolean))];if(ids.length){const pr=await sb.from('profiles').select('*').in('id',ids);(pr.data||[]).forEach(x=>profiles.set(String(x.id),x))}const calls=(c.data||[]).map(x=>`<article class="call-card"><strong>${x.call_type==='video'?'ভিডিও':'ভয়েস'} কলের অনুমতি</strong><small>অনুমোদন দিলে ২৪ ঘণ্টা কল করা যাবে। অনুমোদনের আগে ফোন বাজবে না।</small><div class="actions"><button class="accept" data-accept="${esc(x.id)}">২৪ ঘণ্টা অনুমোদন</button><button data-reject="${esc(x.id)}">বাতিল</button></div></article>`).join('');const html=notes.map(x=>{const p=profiles.get(String(x.actor_id)),url=noteURL(x,p),avatar=p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:`<span class="ico">${x.type==='message'?'✉':'🔔'}</span>`;return`<button class="note" type="button" data-note="${esc(x.id)}" data-href="${esc(url)}">${avatar}<span><strong>${esc(x.title||'নতুন নোটিফিকেশন')}</strong><small>${pretty(x.created_at)}</small></span><span class="arrow">›</span></button>`}).join('');$('#list').innerHTML=calls+html||'<div class="empty">নতুন কোনো নোটিফিকেশন নেই।</div>'}document.addEventListener('click',async e=>{const a=e.target.closest('[data-accept]'),r=e.target.closest('[data-reject]'),n=e.target.closest('[data-note]');if(a){e.stopPropagation();await sb.from('call_requests').update({status:'accepted',accepted_at:new Date().toISOString(),expires_at:new Date(Date.now()+86400000).toISOString()}).eq('id',a.dataset.accept).eq('recipient_id',me.id);load();return}if(r){e.stopPropagation();await sb.from('call_requests').update({status:'rejected'}).eq('id',r.dataset.reject).eq('recipient_id',me.id);load();return}if(n){await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.dataset.note).eq('recipient_id',me.id);location.href=n.dataset.href}});$('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('bhubondangaTheme',n)};document.documentElement.dataset.theme=localStorage.getItem('bhubondangaTheme')||'light';load();</script></body></html>
