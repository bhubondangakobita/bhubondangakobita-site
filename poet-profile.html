<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --header:66px;--ticker:29px;--quick:43px;
 --bg:#edf3fa;--surface:rgba(255,255,255,.78);--solid:rgba(255,255,255,.96);
 --text:#173153;--soft:#657895;--muted:#91a0b6;
 --line:rgba(98,121,167,.18);--primary:#668bf0;--violet:#9075e8;--green:#4e987d;
 --gold:#ae8750;--red:#d4556d;
 --shadow:0 13px 38px rgba(69,82,143,.10),inset 0 1px 0 rgba(255,255,255,.94);
 --wash:linear-gradient(135deg,rgba(102,139,240,.10),rgba(144,117,232,.09),rgba(78,152,125,.05));
 --background:radial-gradient(circle at 7% 0,rgba(128,193,232,.16),transparent 27%),radial-gradient(circle at 96% 7%,rgba(187,164,231,.14),transparent 29%),linear-gradient(155deg,#fcfeff,#edf2f8 56%,#f8f6fc);
}
html[data-mode="middle"]{
 --bg:#dce5f1;--surface:rgba(239,245,252,.84);--solid:rgba(248,251,255,.97);
 --text:#18304f;--soft:#5d708d;
 --background:linear-gradient(145deg,#e8eef7,#d7e2ef 56%,#eceaf5)
}
html[data-mode="dark"]{
 --bg:#071425;--surface:rgba(13,30,54,.86);--solid:rgba(16,35,62,.97);
 --text:#f3f7ff;--soft:#c7d2e8;--muted:#90a2bf;--line:rgba(160,182,238,.19);
 --primary:#9db1ff;--violet:#b69dff;--green:#8bd5bb;--gold:#e5bf7f;--red:#ff91ad;
 --shadow:0 17px 46px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);
 --wash:linear-gradient(135deg,rgba(92,122,215,.17),rgba(143,94,212,.15),rgba(74,145,134,.08));
 --background:radial-gradient(circle at 12% 7%,rgba(78,112,203,.12),transparent 24%),radial-gradient(circle at 87% 15%,rgba(145,93,211,.10),transparent 27%),linear-gradient(180deg,#06111f,#08182a 62%,#0a1b2f)
}
html[data-palette="moon"]{--primary:#4d9ce8;--violet:#6f72e4}
html[data-palette="lavender"]{--primary:#8372e3;--violet:#b07bd9}
html[data-palette="rose"]{--primary:#d274ae;--violet:#9a78e4}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg)}
body{min-height:100vh;overflow-x:hidden;background:var(--background);color:var(--text);font-family:'Noto Serif Bengali',Georgia,serif;line-height:1.58}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.glass{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%)}
svg.icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.site-header{position:sticky;top:0;z-index:1000;height:var(--header);border-bottom:1px solid var(--line);background:var(--solid);backdrop-filter:blur(18px)}
.header-inner{width:min(1500px,100%);height:100%;margin:auto;padding:0 14px;display:grid;grid-template-columns:325px minmax(220px,1fr) auto;gap:12px;align-items:center}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:40px;height:40px;flex:0 0 40px;border:1px solid rgba(78,152,125,.24);border-radius:13px;display:grid;place-items:center;background:var(--solid);box-shadow:var(--shadow);font:26px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"}
.brand-copy{min-width:0}.brand h1{font-size:21px;line-height:1.06;white-space:nowrap}.brand p{margin-top:2px;color:var(--green);font-size:8.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative}.search input{width:100%;height:37px;padding:0 42px 0 36px;border:1px solid var(--line);border-radius:999px;background:var(--solid);outline:none;font-size:16px}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}.search .magnify{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:system-ui;color:var(--soft)}.search button{position:absolute;right:4px;top:4px;width:29px;height:29px;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff}
.head-actions{display:flex;gap:6px}.round{position:relative;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--solid);color:var(--text)}.badge-count{position:absolute;right:-3px;top:-4px;min-width:17px;height:17px;padding:0 4px;border:2px solid var(--solid);border-radius:999px;display:grid;place-items:center;background:#e34f5b;color:#fff;font:700 8px/1 system-ui}

/* Date */
.datebar{position:sticky;top:var(--header);z-index:990;height:var(--ticker);overflow:hidden;border-bottom:1px solid var(--line);background:var(--solid)}
.date-track{width:max-content;height:100%;display:inline-flex;flex-wrap:nowrap;animation:dateFlow 48s linear infinite;will-change:transform;transform:translate3d(0,0,0)}
.date-group{flex:0 0 auto;height:100%;padding:0 24px;display:inline-flex;align-items:center;gap:18px;white-space:nowrap;color:var(--soft);font-size:8.7px;font-weight:700;direction:ltr;unicode-bidi:isolate}
.date-group .greeting{color:var(--green)}.sep{color:var(--primary)}
@keyframes dateFlow{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

/* Quick navigation */
.quickbar{position:sticky;top:calc(var(--header) + var(--ticker));z-index:980;height:var(--quick);border-bottom:1px solid var(--line);background:var(--solid)}
.quick-inner{width:min(1500px,100%);height:100%;margin:auto;padding:0 14px;display:flex;align-items:center;gap:4px}
.quick-link{flex:1 1 0;min-width:0;height:32px;border:1px solid transparent;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--soft);font-size:8.8px;font-weight:800;white-space:nowrap}.quick-link.active{border-color:var(--line);background:var(--surface);color:var(--primary)}.mini-count{min-width:16px;height:16px;padding:0 4px;border-radius:999px;display:grid;place-items:center;background:#e34f5b;color:white;font:700 8px/1 system-ui}

/* Main desktop */
.layout{width:min(1500px,100%);margin:auto;padding:12px;display:grid;grid-template-columns:230px minmax(0,1fr) 235px;gap:12px;align-items:start}
.sidebar{position:sticky;top:calc(var(--header) + var(--ticker) + var(--quick) + 12px);height:calc(100dvh - var(--header) - var(--ticker) - var(--quick) - 24px);overflow:auto;scrollbar-width:none}.sidebar::-webkit-scrollbar,.drawer::-webkit-scrollbar{display:none}
.center{min-width:0;display:grid;gap:10px}
.identity{padding:10px;text-align:center}.identity .big-logo{font:28px/1 "Apple Color Emoji","Segoe UI Emoji"}.identity h2{margin-top:3px;color:var(--primary);font-size:15px}.identity .quote{margin-top:6px;padding:6px;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--primary) 8%,transparent);color:var(--soft);font-size:7.7px}
.side-card,.right-card,.auth-card{margin-top:8px;padding:7px}
.side-list{display:grid;gap:3px}.side-item{min-height:35px;padding:5px 6px;border:1px solid var(--line);border-radius:9px;display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:6px;align-items:center;background:var(--solid);color:var(--soft);font-size:8.2px;font-weight:750}.side-item:hover,.side-item.active{color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}.side-ico{width:25px;height:25px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface)}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px}.auth-actions a,.auth-actions button{min-height:33px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--solid);color:var(--primary);font-size:8px;font-weight:800}.auth-actions .primary{border:0;background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff}.auth-actions .wide{grid-column:1/-1}
.right-card h3{margin-bottom:4px;font-size:11px}.right-row{padding:7px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--soft);font-size:8px}.right-row:last-child{border-bottom:0}.contact-note{margin-top:7px;padding:7px;border-left:3px solid var(--green);border-radius:0 8px 8px 0;background:color-mix(in srgb,var(--green) 8%,transparent);color:var(--soft);font-size:7.5px}

/* Poet hero */
.hero{position:relative}
.cover{position:relative;height:280px;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#dbeaff,#cedcf4 55%,#eae2f9);background-position:center;background-size:cover;box-shadow:var(--shadow)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,30,58,.03),rgba(12,30,58,.16)),radial-gradient(circle at 82% 14%,rgba(255,255,255,.58),transparent 27%)}
.poet-panel{position:relative;width:calc(100% - 34px);min-height:170px;margin:-84px auto 0;padding:18px 18px 16px 154px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(135deg,color-mix(in srgb,var(--solid) 96%,transparent),color-mix(in srgb,var(--solid) 79%,transparent));box-shadow:var(--shadow);backdrop-filter:blur(24px)}
.avatar-wrap{position:absolute;left:18px;top:-45px;width:118px;height:118px;border:5px solid var(--solid);border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--primary),var(--violet));box-shadow:var(--shadow)}.avatar{width:100%;height:100%;object-fit:cover}
.name-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name-line h2{font-size:27px;line-height:1.12}.poet-badge{padding:4px 9px;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--gold) 9%,var(--solid));color:var(--gold);font-size:8.4px;font-weight:800}.wiki{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--solid);color:var(--primary);font:bold 15px Georgia}
.life{margin-top:4px;color:var(--soft);font-size:9px}.bio{margin-top:8px;max-width:850px;font-size:10.6px}.source-line{margin-top:6px;color:var(--muted);font-size:7.7px}
.hero-actions{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}.action{min-height:38px;padding:0 16px;border:1px solid var(--line);border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--solid);font-size:9px;font-weight:800}.action.primary{border:0;background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff}.action.square{width:40px;padding:0}

/* Sticky tabs */
.tab-wrap{position:sticky;top:calc(var(--header) + var(--ticker) + var(--quick));z-index:970;margin-top:9px}
.tabs{height:48px;padding:0 7px;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1 1 0;min-width:88px;height:38px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--text);font-size:9px;font-weight:800;white-space:nowrap}.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Content */
.summary-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);gap:10px}
.card{padding:14px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card-head h2{font-size:18px}.card-head p{margin-top:2px;color:var(--muted);font-size:8px}.bio-text{margin-top:10px;color:var(--soft);font-size:10.4px;white-space:pre-wrap}.facts{margin-top:10px;display:grid;gap:6px}.fact{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--solid);display:grid;grid-template-columns:82px 1fr;gap:7px;font-size:8.5px}.fact b{color:var(--primary)}
.feature-list,.title-list,.edit-list{margin-top:10px;display:grid;gap:6px}.title-item{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--solid);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.title-item h3{font-size:12px}.title-item p{margin-top:2px;color:var(--soft);font-size:8px}.title-item .arrow{color:var(--primary);font-size:15px}.work-type{display:inline-flex;margin-top:4px;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);font-size:7px;font-weight:800}.editor{margin-top:4px;color:var(--muted);font-size:7.3px}.editor a{color:var(--primary);font-weight:800}
.edit-row{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--solid)}.edit-row h3{font-size:11px}.edit-row p{margin-top:3px;color:var(--soft);font-size:8px}.status{display:inline-flex;margin-top:5px;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--green) 10%,transparent);color:var(--green);font-size:7px;font-weight:800}
.empty{padding:28px;text-align:center;color:var(--soft);font-size:9px}.load-more{width:min(280px,90%);height:42px;margin:4px auto;border:1px solid var(--line);border-radius:999px;background:var(--solid);color:var(--primary);font-size:9px;font-weight:800}
.notice{padding:10px;border-left:3px solid var(--green);border-radius:0 10px 10px 0;background:color-mix(in srgb,var(--green) 8%,transparent);color:var(--soft);font-size:8px}
.footer{padding:16px;text-align:center;color:var(--soft);font-size:8px}.footer a{margin:0 5px}

/* Drawers / sheets */
.edge{position:fixed;top:58%;z-index:1100;width:32px;height:78px;border:1px solid var(--line);display:none;place-items:center;background:var(--solid);color:var(--primary);box-shadow:var(--shadow);font-size:16px}.edge.left{left:0;border-radius:0 12px 12px 0}.edge.right{right:0;border-radius:12px 0 0 12px}
.backdrop{position:fixed;inset:0;z-index:2000;background:rgba(8,19,39,.48);opacity:0;visibility:hidden;transition:.2s}.backdrop.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;z-index:2010;width:min(88vw,360px);padding:14px;overflow:auto;background:var(--bg);box-shadow:0 18px 65px rgba(0,0,0,.25);transition:transform .23s}.drawer.left{left:0;transform:translateX(-103%)}.drawer.right{right:0;transform:translateX(103%)}.drawer.open{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.drawer-head h2{font-size:16px}.close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--solid);font-size:20px}
.sheet{position:fixed;left:50%;bottom:0;z-index:2030;width:min(590px,100%);max-height:min(82dvh,760px);padding:12px 14px calc(15px + env(safe-area-inset-bottom));overflow:auto;border:1px solid var(--line);border-radius:23px 23px 0 0;background:var(--bg);box-shadow:0 -20px 60px rgba(15,29,58,.26);transform:translate(-50%,105%);transition:.24s}.sheet.open{transform:translate(-50%,0)}.grab{width:58px;height:5px;margin:0 auto 10px;border-radius:999px;background:var(--muted)}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h2{font-size:20px}.sheet-list{margin-top:10px;display:grid;gap:7px}.sheet-button{min-height:49px;padding:0 14px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;background:var(--solid);font-size:10px;font-weight:800}.sheet-button.danger{color:var(--red)}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.theme-choice{min-height:66px;border:1px solid var(--line);border-radius:12px;background:var(--solid);font-size:10px;font-weight:800}.theme-choice.active{outline:2px solid var(--primary);outline-offset:-2px}
.field{display:grid;gap:5px}.field+ .field{margin-top:8px}.field label{color:var(--soft);font-size:8.5px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--solid);outline:none;font-size:16px}.field input,.field select{height:43px;padding:0 11px}.field textarea{min-height:120px;padding:10px;resize:vertical}.check{margin-top:8px;display:flex;align-items:flex-start;gap:7px;color:var(--soft);font-size:8px}.submit{width:100%;min-height:45px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;font-size:10px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:3000;max-width:90vw;padding:10px 15px;border-radius:999px;background:#102440;color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.25);font:700 10px/1.4 system-ui;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}

/* Responsive */
@media(max-width:1120px){
 .layout{grid-template-columns:205px minmax(0,1fr) 210px;gap:10px;padding:10px}.side-item{font-size:7.8px}
}
@media(max-width:940px){
 .layout{display:block;max-width:860px;padding:8px}.sidebar{display:none}.edge{display:grid}
}
@media(max-width:700px){
 :root{--header:64px;--ticker:28px;--quick:46px}
 .header-inner{grid-template-columns:minmax(0,1fr) auto;padding:0 10px}.search{display:none}.brand h1{font-size:18px}.brand p{font-size:7.2px}.logo{width:38px;height:38px;flex-basis:38px;font-size:24px}.head-actions .desktop-only{display:none}.round{width:38px;height:38px}
 .date-group{gap:14px;padding:0 18px;font-size:8.1px}.quick-inner{padding:0 5px}.quick-link{height:36px;flex-direction:column;gap:1px;font-size:7.4px;line-height:1.05}
 .cover{height:230px;border-radius:15px}.poet-panel{width:calc(100% - 16px);min-height:196px;margin:-66px auto 0;padding:62px 12px 13px;border-radius:17px}.avatar-wrap{left:14px;top:-54px;width:104px;height:104px}
 .name-line{padding-left:112px;min-height:42px}.name-line h2{max-width:calc(100vw - 205px);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.poet-badge{font-size:7.2px}.wiki{width:27px;height:27px;font-size:13px}.life,.bio{font-size:8.8px}
 .hero-actions{display:grid;grid-template-columns:1fr 1fr 42px}.action{min-height:39px;padding:0 8px;font-size:8.5px}.action.square{width:42px}
 .tab-wrap{top:calc(var(--header) + var(--ticker) + var(--quick));margin-top:7px}.tabs{height:46px}.tab{flex:0 0 auto;min-width:86px;font-size:8.5px}
 .summary-grid{grid-template-columns:1fr}.card{padding:12px}.card-head h2{font-size:17px}.bio-text{font-size:9.7px}.fact{grid-template-columns:76px 1fr}.title-item h3{font-size:11px}
}
@media(max-width:390px){
 .brand h1{font-size:16.5px}.brand p{display:none}.name-line{padding-left:102px}.name-line h2{max-width:calc(100vw - 190px);font-size:18.5px}.poet-panel{padding-top:59px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.date-track{animation-duration:90s}}
</style>
<style id="bdx-universal-sidebar-theme-v14">
/* =========================================================
   BHUBONDANGA UNIVERSAL SIDEBAR + FOUR THEME SYSTEM v14
   - slim mobile edge arrows, never cover content
   - direct theme selection, no locking popup
   - same sidebar order and content on every page
   ========================================================= */
:root{
  --bdx-rail-width:clamp(185px,17vw,238px);
  --bdx-rail-top:150px;
  --bdx-primary:var(--primary,#688bf0);
  --bdx-violet:var(--violet,#8f75ec);
  --bdx-green:var(--green,#4f987d);
  --bdx-text:var(--text,#173052);
  --bdx-soft:var(--soft,#5b718f);
  --bdx-line:var(--line,rgba(102,126,170,.19));
  --bdx-surface:var(--surface2,rgba(255,255,255,.94));
  --bdx-page:var(--page,#eef3fa);
  --bdx-shadow:var(--shadow,0 12px 32px rgba(74,85,151,.10));
}

 const type=$('#contributionType').value,title=$('#contributionTitle').value.trim(),text=$('#contributionText').value.trim(),source=$('#contributionSource').value.trim(),rights=$('#rightsCheck').checked;
 if(!title||!text){toast('শিরোনাম ও মূল তথ্য লিখুন।');return}

 if(b.matches('[data-logout]')){logout();return}
}

const normalizeFile=h=>String(h).split('?')[0].split('#')[0].toLowerCase();

function navHtml(){
 return '<nav class="bdx-nav">'+NAV.map(([href,icon,label])=>'<a href="'+href+'" '+(normalizeFile(href)===currentFile?'aria-current="page"':'')+'><span class="bdx-icon">'+icon+'</span><span>'+label+'</span><span>›</span></a>').join('')+'</nav>';
}
function identityHtml(){return '<section class="bdx-card bdx-identity"><div class="bdx-logo">🌿</div><h2><a href="index.html">আপন ভুবন</a></h2><p>আপনার লেখা, পাঠ ও সাহিত্যিক পথচলার নিজস্ব জায়গা।</p><div class="bdx-quote">“আপনার ক্ষতগুলোকে জ্ঞানে পরিণত করুন।”</div></section>'}
function themeHtml(){
 const palette=localStorage.getItem('bhubondangaGlassTheme')||localStorage.getItem('bhubondangaStyle')||'pearl';
 const mode=localStorage.getItem('bhubondangaThemeMode')||localStorage.getItem('bhubondangaTheme')||H.dataset.theme||'light';
 const modeLabel=mode==='dark'?'ডার্ক':mode==='middle'?'মিডল':'লাইট';
 return '<section class="bdx-card"><div class="bdx-card-title"><h3>চারটি থিম</h3><small style="font-size:7px;color:var(--bdx-soft)">সরাসরি বদলাবে</small></div><div class="bdx-theme-grid">'+THEMES.map(([key,label])=>'<button class="bdx-theme" type="button" data-bdx-style="'+key+'" aria-pressed="'+(palette===key)+'"><span class="bdx-swatch"></span>'+label+'</button>').join('')+'</div><button class="bdx-mode" type="button" data-bdx-mode><span class="bdx-icon">◐</span><span>আলো: <b data-bdx-mode-label>'+modeLabel+'</b></span><span>›</span></button></section>';
}
function leftHtml(){return identityHtml()+'<section class="bdx-card">'+navHtml()+'</section>'+themeHtml()+'<section class="bdx-card"><a class="bdx-contact" href="founder-profile.html">জরুরি প্রয়োজনে মাহমুদ সোহেলের সঙ্গে যোগাযোগ করুন</a><p class="bdx-note">প্রতিষ্ঠাতার প্রোফাইল ও যোগাযোগের মাধ্যম দেখুন।</p></section>'}
function avatarMarkup(){const u=user?.avatar||user?.avatar_url||user?.profileImage||'';return u?'<img src="'+esc(u)+'" alt="">':'♙'}
function accountHtml(){
 if(!logged)return '<section class="bdx-card bdx-account"><div class="bdx-account-avatar">♙</div><strong>অতিথি পাঠক</strong><p>লেখা প্রকাশ ও প্রতিক্রিয়ার জন্য লগইন করুন</p><div class="bdx-account-buttons"><a class="primary" href="login.html">লগইন</a><a href="register.html">রেজিস্টার</a></div></section>';
 const name=user.name||user.displayName||user.username||user.email||'ভুবনডাঙ্গার সদস্য';
 let profile='profile.html';if(role==='founder')profile='founder-profile.html';else if(role==='admin')profile='admin-profile.html';
 const dashboard=role==='founder'?'founder-dashboard.html':role==='admin'?'admin-dashboard.html':'';
 return '<section class="bdx-card bdx-account"><div class="bdx-account-avatar">'+avatarMarkup()+'</div><strong>'+esc(name)+'</strong><p>আপনার ব্যক্তিগত ভুবন</p><div class="bdx-account-buttons"><a class="primary" href="'+profile+'">প্রোফাইল</a><a href="edit-profile.html">সম্পাদনা</a><a href="messages.html">ইনবক্স</a><a href="notifications.html">নোটিফিকেশন</a>'+(dashboard?'<a class="wide" href="'+dashboard+'">ড্যাশবোর্ড</a>':'')+'<button class="wide" type="button" data-bdx-logout>লগআউট</button></div></section>';
}
function profileLinks(){
 const links=[['profile.html','সাধারণ কবি/লেখক প্রোফাইল'],['founder-profile.html','Founder প্রোফাইল'],['admin-profile.html','Admin প্রোফাইল'],['poet-profile.html','খ্যাতিমান কবির প্রোফাইল'],['thinker-profile.html','মনীষীর প্রোফাইল']];
 return '<section class="bdx-card"><h3>প্রোফাইলসমূহ</h3><div class="bdx-nav">'+links.map(([h,t])=>'<a href="'+h+'"><span class="bdx-icon">♙</span><span>'+t+'</span><span>›</span></a>').join('')+'</div></section>';
}
function quickHtml(){
 const links=[['bhubondangar-lekhok.html','ভুবনডাঙ্গার লেখক'],['favorite-authors.html','প্রিয় লেখক'],['messages.html','ইনবক্স'],['notifications.html','নোটিফিকেশন'],['humanitarian-notice.html','যাচাইকৃত মানবিক নোটিস'],['about.html','আমাদের সম্পর্কে'],['contact.html','যোগাযোগ'],['complaint.html','অভিযোগ করুন'],['policy.html','নীতিমালা']];
 return '<section class="bdx-card"><h3>দ্রুত দেখুন</h3><div class="bdx-nav">'+links.map(([h,t])=>'<a href="'+h+'"><span class="bdx-icon">•</span><span>'+t+'</span><span>›</span></a>').join('')+'</div></section>';
}
function rightHtml(){return accountHtml()+profileLinks()+quickHtml()+themeHtml()+'<section class="bdx-card"><p class="bdx-note">সাহিত্যিক লেখা সংশ্লিষ্ট category newsfeed-এ প্রকাশিত হবে। মানবিক আবেদন যাচাইয়ের পর অগ্রাধিকার পাবে।</p></section>'}
function drawerHead(title){return '<div class="bdx-drawer-head"><strong>'+title+'</strong><button class="bdx-close" type="button" data-bdx-close>×</button></div>'}
function renderShell(){
 const left=leftHtml(),right=rightHtml();
 $('#bdxDesktopLeftV14').innerHTML=left;$('#bdxDesktopRightV14').innerHTML=right;
 $('#bdxMobileLeftV14').innerHTML=drawerHead('🌿 আপন ভুবন')+left;
 $('#bdxMobileRightV14').innerHTML=drawerHead(logged?'আপনার ভুবন':'অতিথি পাঠক')+right;
 syncThemeButtons();
}
function closeDrawers(){
 $('#bdxMobileLeftV14').classList.remove('open');$('#bdxMobileRightV14').classList.remove('open');
 $('#bdxOverlayV14').classList.remove('show');D.body.classList.remove('bdx-drawer-lock');
}
function openDrawer(side){
 closeDrawers();$('#bdxOverlayV14').classList.add('show');
 $(side==='left'?'#bdxMobileLeftV14':'#bdxMobileRightV14').classList.add('open');
 D.body.classList.add('bdx-drawer-lock');
}
function applyPalette(key){
 H.dataset.bdxPalette=key;localStorage.setItem('bhubondangaGlassTheme',key);localStorage.setItem('bhubondangaStyle',key);syncThemeButtons();
}
function applyMode(mode){
 H.dataset.theme=mode;H.dataset.mode=mode;localStorage.setItem('bhubondangaTheme',mode);localStorage.setItem('bhubondangaThemeMode',mode);
 D.querySelector('meta[name="theme-color"]')?.setAttribute('content',mode==='dark'?'#071426':'#f7f9ff');syncThemeButtons();
}
function syncThemeButtons(){
 const p=H.dataset.bdxPalette||'pearl';D.querySelectorAll('[data-bdx-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bdxStyle===p)));
 const m=H.dataset.theme||H.dataset.mode||'light',label=m==='dark'?'ডার্ক':m==='middle'?'মিডল':'লাইট';D.querySelectorAll('[data-bdx-mode-label]').forEach(x=>x.textContent=label);
}
function cycleMode(){const cur=H.dataset.theme||H.dataset.mode||'light',list=['light','middle','dark'];applyMode(list[(list.indexOf(cur)+1)%list.length])}
async function logout(){
 try{if(W.supabaseClient?.auth)await W.supabaseClient.auth.signOut({scope:'local'});else if(W.supabase?.auth)await W.supabase.auth.signOut()}catch(e){}
 localStorage.removeItem('bhubondangaCurrentUser');localStorage.removeItem('bhubondangaSessionUser');location.href='login.html';
}
const initialPalette=localStorage.getItem('bhubondangaGlassTheme')||localStorage.getItem('bhubondangaStyle')||'pearl';
const initialMode=localStorage.getItem('bhubondangaThemeMode')||localStorage.getItem('bhubondangaTheme')||H.dataset.theme||H.dataset.mode||'light';
applyPalette(initialPalette);applyMode(initialMode);renderShell();

$('#bdxOpenLeftV14').addEventListener('click',()=>openDrawer('left'));
$('#bdxOpenRightV14').addEventListener('click',()=>openDrawer('right'));
$('#bdxOverlayV14').addEventListener('click',closeDrawers);
$('#bdx-universal-shell-v14').addEventListener('click',function(e){
 const close=e.target.closest('[data-bdx-close]');if(close){closeDrawers();return}
 const style=e.target.closest('[data-bdx-style]');if(style){e.preventDefault();applyPalette(style.dataset.bdxStyle);return}
 const mode=e.target.closest('[data-bdx-mode]');if(mode){e.preventDefault();cycleMode();return}
 const logoutButton=e.target.closest('[data-bdx-logout]');if(logoutButton){e.preventDefault();logout()}
});
D.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()});
D.body.classList.remove('theme-open','unified-theme-open','locked');
})();
</script>






<script src="bhubondanga-core.js"></script>
</body>
