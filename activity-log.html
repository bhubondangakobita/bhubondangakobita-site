<!doctype html><html lang="bn" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef2f9"><title>Activity Log | ভুবনডাঙ্গার কবিতা</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="supabase-auth.js"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f0f2f5;color:#17324f;font-family:"Noto Sans Bengali",system-ui,sans-serif}.appbar{position:sticky;top:0;z-index:50;height:60px;padding:0 15px;border-bottom:1px solid rgba(90,108,156,.16);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px)}.back{width:40px;height:40px;border:0;border-radius:50%;background:#e4e6eb;font-size:23px}.appbar h1{margin:0;font-size:17px}.shell{width:min(760px,calc(100% - 24px));margin:16px auto 50px}.card{padding:14px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}.summary{margin-bottom:10px}.summary h2{margin:0 0 4px;font-size:21px}.summary p{margin:0;color:#667085;font-size:11px}.filters{display:flex;gap:7px;overflow:auto;margin:10px 0}.filters button{min-width:max-content;min-height:36px;padding:0 12px;border:0;border-radius:18px;background:#e4e6eb;font-weight:700}.filters button.active{background:#0866ff;color:#fff}.log{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:12px 2px;border-top:1px solid rgba(90,108,156,.14)}.log:first-child{border-top:0}.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#756ee6,#aa6ed8);color:#fff;font-size:18px}.log strong{display:block;font-size:12px}.log small{display:block;margin-top:3px;color:#7c8798;font-size:9px}.empty{padding:30px;text-align:center;color:#7c8798}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);opacity:0;padding:10px 14px;border-radius:999px;background:#17324f;color:#fff;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(min-width:901px){.shell{margin-left:calc(216px + 34px);margin-right:calc(236px + 34px);width:auto;max-width:none}.card{max-width:760px;margin:auto}}
</style><link rel="stylesheet" href="bhubondanga-master-v6.css"></head><body><header class="appbar"><button class="back" onclick="history.back()">‹</button><div><h1>Activity Log</h1><small>আপনার প্রোফাইল ও সাহিত্যিক কাজের ইতিহাস</small></div></header><main class="shell"><section class="card summary"><h2>আপনার কার্যক্রম</h2><p>প্রোফাইল সম্পাদনা, লেখা, মন্তব্য, Follow ও Story এখানে সংরক্ষিত থাকবে।</p><div class="filters" id="filters"><button class="active" data-filter="all">সব</button><button data-filter="post">লেখা</button><button data-filter="comment">মন্তব্য</button><button data-filter="profile">প্রোফাইল</button><button data-filter="story">Story</button></div><div id="logList"><div class="empty">লোড হচ্ছে…</div></div></section></main><div class="toast" id="toast"></div><script>
(async()=>{const c=window.BhubondangaAuth?.client||window.bdSupabase||window.supabaseClient;if(!c)return;const session=(await c.auth.getSession()).data.session;if(!session){location.replace('login.html?next='+encodeURIComponent('activity-log.html'));return}const host=document.querySelector('#logList'),fmt=v=>{try{return new Intl.DateTimeFormat('bn-BD',{timeZone:'Asia/Dhaka',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}catch{return''}},esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];const r=await c.from('activity_logs').select('*').eq('actor_id',session.user.id).order('created_at',{ascending:false}).limit(250);if(r.error){host.innerHTML='<div class="empty">Activity Log লোড করা যায়নি।</div>';return}rows=r.data||[];const icon=t=>({post:'✒',comment:'◌',profile:'◉',story:'◍'}[t]||'◴');function draw(filter='all'){const a=filter==='all'?rows:rows.filter(x=>x.target_type===filter);host.innerHTML=a.length?a.map(x=>`<article class="log"><span class="ico">${icon(x.target_type)}</span><div><strong>${esc(x.action)}</strong><small>${fmt(x.created_at)}</small></div></article>`).join(''):'<div class="empty">এই বিভাগে এখনো কোনো কার্যক্রম নেই।</div>'}draw();document.querySelector('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw(b.dataset.filter)})})()
</script><script src="bhubondanga-master-v6.js" defer></script></body></html>
