<style id="bd-frontend-fixed-v3-messenger-css">

async function boot(){let session=null;if(sb){try{session=(await sb.auth.getSession()).data?.session||null}catch(_){}}const legacy=get('bhubondangaCurrentUser',null)||get('bhubondangaSessionUser',null);if(session?.user)me=normalizeProfile({id:session.user.id,username:session.user.user_metadata?.username||session.user.email?.split('@')[0],display_name:session.user.user_metadata?.full_name||session.user.user_metadata?.name||'আপনি',avatar_url:session.user.user_metadata?.avatar_url});else if(legacy)me=normalizeProfile(legacy,'local-me');await loadList();const q=new URLSearchParams(location.search),targetValue=q.get('user')||q.get('id')||q.get('username')||q.get('profile');if(targetValue){const p=await profileBy(targetValue);if(p&&p.id!==me.id){await openConversation(await ensureConversation(p),p);toast('কথোপকথন প্রস্তুত')}else if(p?.id===me.id)toast('নিজের সঙ্গে কথোপকথন খোলা যাবে না')}else if(rows[0])await openConversation(rows[0].id,rows[0].profile);else{updateDetails();openLeft()}}
boot();
