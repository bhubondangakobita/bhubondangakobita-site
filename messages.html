<script>
const PROJECT_URL='https://ihjiisysrwgxxkuywuhc.supabase.co';
const PROJECT_KEY='sb_publishable_2ofR9FO078M1Eu-m0Q8FLg_WqN6iIxz';
const sb=window.supabase.createClient(PROJECT_URL,PROJECT_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let session,me,recipient=null,profiles=new Map(),mediaRecorder=null,chunks=[],voiceBlob=null,recordStart=0,channel=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)}
function pretty(v){try{return new Intl.DateTimeFormat('bn-BD',{timeZone:'Asia/Dhaka',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}).format(new Date(v))}catch(_){return''}}
function setAppHeight(){const h=window.visualViewport?.height||window.innerHeight;document.documentElement.style.setProperty('--app-h',h+'px')}
function scrollBottom(){requestAnimationFrame(()=>{const x=$('#messageList');x.scrollTop=x.scrollHeight})}
function profileRoute(p){const r=String(p?.role||'').toLowerCase();if(r==='founder'||p?.username==='mahmud-sohel')return'founder-profile.html';if(r==='admin')return'admin-profile.html';if(r==='poet')return'poet-profile.html?user='+encodeURIComponent(p.id);if(r==='famous')return'famous-poet-profile.html?poet='+encodeURIComponent(p.username);return'profile.html?user='+encodeURIComponent(p.id||p.username)}
async function ensureAuth(){session=(await sb.auth.getSession()).data.session;if(!session){location.href='login.html?next='+encodeURIComponent(location.href);return false}me=session.user;return true}
async function profileBy(value){if(!value)return null;let q=sb.from('profiles').select('*');q=/^[0-9a-f-]{36}$/i.test(value)?q.eq('id',value):q.eq('username',value.toLowerCase().replace(/^@/,''));const r=await q.maybeSingle();return r.data||{id:value,username:value,display_name:new URLSearchParams(location.search).get('name')||'ভুবনডাঙ্গার সদস্য',avatar_url:''}}
async function loadConversations(){const r=await sb.from('messages').select('*').or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(250);const rows=r.data||[],ids=[...new Set(rows.flatMap(x=>[x.sender_id,x.recipient_id]).filter(x=>x&&x!==me.id))];if(ids.length){const p=await sb.from('profiles').select('*').in('id',ids);(p.data||[]).forEach(x=>profiles.set(String(x.id),x))}const grouped=new Map();rows.forEach(m=>{const other=String(m.sender_id)===String(me.id)?String(m.recipient_id):String(m.sender_id);if(!grouped.has(other))grouped.set(other,{last:m,unread:0});if(String(m.recipient_id)===String(me.id)&&!m.seen_at)grouped.get(other).unread++});$('#conversationList').innerHTML=[...grouped.entries()].map(([id,g])=>{const p=profiles.get(id)||{id,display_name:'ভুবনডাঙ্গার সদস্য',avatar_url:''};return `<button class="conv ${recipient&&String(recipient.id)===id?'active':''}" data-user="${esc(id)}"><img src="${esc(p.avatar_url||'')}" alt=""><span><strong>${esc(p.display_name||p.username||'সদস্য')}</strong><small>${esc(g.last.kind==='voice'?'ভয়েস বার্তা':g.last.body||'')}</small></span>${g.unread?`<i class="unread">${g.unread}</i>`:''}</button>`}).join('')||'<div class="empty">এখনও কোনো কথোপকথন নেই।</div>'}
async function signedAudio(path){if(!path)return'';const r=await sb.storage.from('voice-messages').createSignedUrl(path,3600);return r.data?.signedUrl||''}
async function loadMessages(){if(!recipient)return;const r=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},recipient_id.eq.${recipient.id}),and(sender_id.eq.${recipient.id},recipient_id.eq.${me.id})`).order('created_at',{ascending:true}).limit(500);const rows=r.data||[],html=[];for(const m of rows){const mine=String(m.sender_id)===String(me.id);let content=esc(m.body||'');if(m.kind==='voice'||m.media_path){const u=await signedAudio(m.media_path);content='<span>🎙 ভয়েস বার্তা</span>'+(u?`<audio controls preload="metadata" src="${esc(u)}"></audio>`:'<small>অডিও লোড হয়নি</small>')}html.push(`<article class="bubble ${mine?'me':''}">${content}<small>${pretty(m.created_at)} · ${m.seen_at?'দেখেছেন':'পাঠানো হয়েছে'}</small></article>`)}$('#messageList').innerHTML=html.join('')||'<div class="empty">কথোপকথন শুরু করুন।</div>';await sb.from('messages').update({seen_at:new Date().toISOString()}).eq('recipient_id',me.id).eq('sender_id',recipient.id).is('seen_at',null);scrollBottom();loadConversations()}
async function selectUser(value){recipient=await profileBy(value);if(!recipient)return;$('#chatName').textContent=recipient.display_name||recipient.username||'সদস্য';$('#chatAvatar').src=recipient.avatar_url||'';$('#chatStatus').textContent='নিরাপদ সরাসরি বার্তা';$('#profileLink').href=profileRoute(recipient);$('#conversationDrawer').classList.remove('open');await loadMessages();subscribe()}
async function sendText(body){if(!recipient)return toast('প্রাপক নির্বাচন করুন।');const payload={sender_id:me.id,recipient_id:String(recipient.id),body,kind:'text',delivered_at:new Date().toISOString()};let r=await sb.from('messages').insert(payload);if(r.error){delete payload.kind;delete payload.delivered_at;r=await sb.from('messages').insert(payload)}if(r.error)return toast(r.error.message);await sb.from('notifications').insert({recipient_id:String(recipient.id),actor_id:me.id,type:'message',title:'আপনি একটি নতুন বার্তা পেয়েছেন',payload:{sender_id:me.id}});$('#messageInput').value='';$('#messageInput').style.height='44px';await loadMessages()}
async function startRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')return stopRecording();if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('এই ব্রাউজারে ভয়েস রেকর্ডিং সমর্থিত নয়।');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());voiceBlob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});$('#voiceAudio').src=URL.createObjectURL(voiceBlob);$('#voicePreview').hidden=false;$('#recordBtn').classList.remove('live');$('#recordBtn').setAttribute('aria-label','ভয়েস বার্তা রেকর্ড করুন')};mediaRecorder.start();recordStart=Date.now();$('#recordBtn').classList.add('live');$('#recordBtn').setAttribute('aria-label','রেকর্ডিং থামান');toast('রেকর্ডিং শুরু হয়েছে। আবার চাপলে থামবে।')}catch(e){toast('মাইক্রোফোন অনুমতি পাওয়া যায়নি।')}}
function stopRecording(){if(mediaRecorder?.state==='recording')mediaRecorder.stop()}
async function sendVoice(){if(!recipient||!voiceBlob)return;toast('ভয়েস বার্তা আপলোড হচ্ছে…');const ext=voiceBlob.type.includes('mp4')?'m4a':'webm',path=`${me.id}/${recipient.id}/${Date.now()}.${ext}`;const up=await sb.storage.from('voice-messages').upload(path,voiceBlob,{contentType:voiceBlob.type||'audio/webm',upsert:false});if(up.error)return toast(up.error.message);const r=await sb.from('messages').insert({sender_id:me.id,recipient_id:String(recipient.id),body:'ভয়েস বার্তা',kind:'voice',media_path:path,duration_seconds:Math.max(1,Math.round((Date.now()-recordStart)/1000)),delivered_at:new Date().toISOString()});if(r.error)return toast(r.error.message);await sb.from('notifications').insert({recipient_id:String(recipient.id),actor_id:me.id,type:'voice_message',title:'আপনি একটি ভয়েস বার্তা পেয়েছেন',payload:{sender_id:me.id}});voiceBlob=null;$('#voicePreview').hidden=true;await loadMessages()}
async function requestCall(mode){if(!recipient)return toast('প্রাপক নির্বাচন করুন।');const existing=await sb.from('call_requests').select('*').eq('requester_id',me.id).eq('recipient_id',String(recipient.id)).eq('call_type',mode).eq('status','accepted').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(1);if(existing.data?.length){toast('২৪ ঘণ্টার অনুমতি সক্রিয়। রিং অনুরোধ পাঠানো হচ্ছে…');const ch=sb.channel('bd-ring-'+recipient.id);ch.subscribe(async st=>{if(st==='SUBSCRIBED'){await ch.send({type:'broadcast',event:'ring',payload:{from:me.id,to:recipient.id,mode}});setTimeout(()=>sb.removeChannel(ch),1200)}});return}const r=await sb.from('call_requests').insert({requester_id:me.id,recipient_id:String(recipient.id),call_type:mode,status:'pending'}).select().single();if(r.error)return toast(r.error.message);await sb.from('notifications').insert({recipient_id:String(recipient.id),actor_id:me.id,type:'call_request',title:(mode==='video'?'ভিডিও':'ভয়েস')+' কলের অনুমতি চেয়েছেন',payload:{request_id:r.data.id,mode}});toast('কলের অনুমতির অনুরোধ পাঠানো হয়েছে। অনুমোদনের আগে ফোন বাজবে না।')}
function subscribe(){try{if(channel)sb.removeChannel(channel);channel=sb.channel('bd-messages-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'messages'},p=>{const n=p.new||p.old;if(recipient&&[String(n.sender_id),String(n.recipient_id)].includes(String(recipient.id)))loadMessages();else loadConversations()}).subscribe()}catch(_){}}
$('#composer').onsubmit=e=>{e.preventDefault();const v=$('#messageInput').value.trim();if(v)sendText(v)};$('#messageInput').addEventListener('input',e=>{e.target.style.height='44px';e.target.style.height=Math.min(118,e.target.scrollHeight)+'px'});$('#recordBtn').onclick=startRecording;$('#cancelVoice').onclick=()=>{voiceBlob=null;$('#voicePreview').hidden=true};$('#sendVoice').onclick=sendVoice;$('#voiceCall').onclick=()=>requestCall('voice');$('#videoCall').onclick=()=>requestCall('video');$('#openConversations').onclick=()=>$('#conversationDrawer').classList.add('open');$('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('bhubondangaTheme',n)};document.addEventListener('click',e=>{const b=e.target.closest('[data-user]');if(b)selectUser(b.dataset.user)});window.visualViewport?.addEventListener('resize',setAppHeight,{passive:true});window.visualViewport?.addEventListener('scroll',setAppHeight,{passive:true});window.addEventListener('resize',setAppHeight,{passive:true});
(async()=>{setAppHeight();document.documentElement.dataset.theme=localStorage.getItem('bhubondangaTheme')||'light';if(!await ensureAuth())return;await loadConversations();const q=new URLSearchParams(location.search).get('user');if(q)await selectUser(q);subscribe()})();
</script>
</body></html>
