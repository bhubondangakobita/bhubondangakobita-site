<template id="bdBodyStyles">
<style data-bd-runtime-order="40" id="bd22-sidebar-css">
:root{--bd22-card:rgba(255,255,255,.78);--bd22-card2:rgba(252,253,255,.94);--bd22-ink:#1f3550;--bd22-soft:#6d7c91;--bd22-line:rgba(94,111,151,.16);--bd22-green:#176d53;--bd22-red:#bd495a;--bd22-shadow:0 6px 16px rgba(48,63,101,.05),inset 0 1px 0 rgba(255,255,255,.78)}
html[data-theme="dark"]{--bd22-card:rgba(17,31,48,.92);--bd22-card2:rgba(20,36,55,.96);--bd22-ink:#f2f6fb;--bd22-soft:#bdc9d9;--bd22-line:rgba(196,210,231,.15);--bd22-green:#8fcdb2;--bd22-red:#ff9aa8;--bd22-shadow:0 8px 20px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.035)}
#leftSidebar,#rightSidebar,.bd22-drawer{font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;color:var(--bd22-ink)!important;font-weight:400!important}
#leftSidebar .bd22-sidebar-stack,#rightSidebar .bd22-sidebar-stack,.bd22-drawer .bd22-sidebar-stack{display:grid!important;gap:8px!important;padding:1px 1px 12px!important}
.bd22-card{border:1px solid var(--bd22-line)!important;border-radius:16px!important;background:var(--bd22-card)!important;box-shadow:var(--bd22-shadow)!important;padding:9px!important;overflow:hidden!important}
.bd22-title{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.bd22-title h3{font-size:11.5px!important;font-weight:650!important}.bd22-title small{font-size:7.8px;color:var(--bd22-soft)}
.bd22-identity{text-align:center}.bd22-logo{width:48px;height:48px;margin:0 auto 5px;border-radius:50%;display:block;overflow:hidden;animation:bd22Logo 5.8s ease-in-out infinite}.bd22-logo img{width:100%;height:100%;object-fit:cover;filter:none!important}.bd22-identity h3{font-size:14px!important;color:var(--bd22-green);font-weight:650!important}.bd22-identity p{margin-top:2px;color:var(--bd22-soft);font-size:8.3px;line-height:1.55}.bd22-quote{margin-top:7px;padding:6px 7px;border-left:2px solid #d25f99;border-radius:8px;background:rgba(210,95,153,.045);color:var(--bd22-soft);font:500 8.2px/1.55 'Noto Serif Bengali',serif;text-align:left}
@keyframes bd22Logo{0%,100%{transform:none}50%{transform:translateY(-1px) scale(1.018)}}@media(prefers-reduced-motion:reduce){.bd22-logo{animation:none!important}}

@media(min-width:900px){#leftSidebar,#rightSidebar{display:block!important;min-width:0!important;height:100%!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain!important;scrollbar-width:thin!important;padding:0 1px!important}.bd22-drawer,.drawer-backdrop{display:none!important}}

</style>
</template>

function render(){const u=identity(),l=left(u),r=right(u);$$('[data-bd22-left-desktop],[data-bd22-left-mobile]').forEach(h=>h.innerHTML=l);$$('[data-bd22-right-desktop],[data-bd22-right-mobile]').forEach(h=>h.innerHTML=r);syncTheme();stats()}
W.BD22RenderSidebars=render;
function setDrawer(side,on=true){const d=$(side==='right'?'#rightMobileDrawer':'#mobileDrawer'),b=$('#drawerBackdrop');if(!d)return;$$('.bd22-drawer.open').forEach(x=>{if(x!==d){x.classList.remove('open');x.setAttribute('aria-hidden','true')}});d.classList.toggle('open',on);d.setAttribute('aria-hidden',on?'false':'true');if(b)b.hidden=!on;D.body.classList.toggle('locked',on);if(on)requestAnimationFrame(()=>d.querySelector('a,button')?.focus?.({preventScroll:true}))}
W.BD22OpenDrawer=setDrawer;
function applyTheme(v){D.documentElement.dataset.theme=v;D.documentElement.dataset.bdTheme=v;syncTheme();D.dispatchEvent(new CustomEvent('bd:theme-changed',{detail:{theme:v}}))}
function syncTheme(){const saved=localStorage.getItem('bhubondangaTheme')||'system',cur=D.documentElement.dataset.theme||'light';$$('[data-bd22-theme]').forEach(b=>b.classList.toggle('active',b.dataset.bd22Theme===(saved==='system'?'system':cur)))}
async function logout(btn){if(btn){btn.disabled=true;btn.textContent='লগআউট হচ্ছে…'}try{await client()?.auth?.signOut?.()}catch(_){}try{localStorage.removeItem('bhubondangaCurrentUser');localStorage.removeItem('bd_session')}catch(_){}location.href='login.html'}
async function stats(){const vals={posts:0,members:0,comments:0,reactions:0};try{const c=client();if(c?.from){const count=async table=>{const r=await c.from(table).select('*',{count:'exact',head:true});return Number(r.count||0)};const a=await Promise.allSettled([count('posts'),count('profiles'),count('comments'),count('post_reactions')]);['posts','members','comments','reactions'].forEach((k,i)=>{if(a[i]?.status==='fulfilled')vals[k]=a[i].value})}}catch(_){}Object.keys(vals).forEach(k=>$$(`[data-bd22-stat="${k}"]`).forEach(x=>x.textContent=vals[k]?new Intl.NumberFormat('bn-BD').format(vals[k]):'—'))}
D.addEventListener('click',e=>{const o=e.target.closest?.('[data-bd22-open-drawer]');if(o){e.preventDefault();setDrawer(o.dataset.bd22OpenDrawer,true);return}if(e.target.closest?.('[data-bd9-close]')){e.preventDefault();setDrawer('left',false);setDrawer('right',false);return}if(e.target.id==='drawerBackdrop'){setDrawer('left',false);setDrawer('right',false);return}const t=e.target.closest?.('[data-bd22-theme]');if(t){const v=t.dataset.bd22Theme;if(v==='system'){localStorage.removeItem('bhubondangaTheme');applyTheme(matchMedia?.('(prefers-color-scheme: dark)')?.matches?'dark':'light')}else{localStorage.setItem('bhubondangaTheme',v);applyTheme(v)}return}const lo=e.target.closest?.('[data-bd22-logout]');if(lo){e.preventDefault();logout(lo)}},true);
D.addEventListener('keydown',e=>{if(e.key==='Escape'){setDrawer('left',false);setDrawer('right',false)}});D.addEventListener('bd:auth-ready',()=>setTimeout(render,0));D.addEventListener('bd:three-part-ready',()=>setTimeout(render,0));W.addEventListener('pageshow',()=>setTimeout(render,20),{passive:true});setTimeout(render,50);setTimeout(render,900);
