<template id="bdSidebarScripts"><script data-bd-runtime-order="53" id="bd-sidebars-locked-v1-js">
(()=>{'use strict';if(window.__BD_SIDEBARS_LOCKED__)return;window.__BD_SIDEBARS_LOCKED__=true;const D=document,W=window,$=(s,r=D)=>r?.querySelector?.(s)||null,$$=(s,r=D)=>Array.from(r?.querySelectorAll?.(s)||[]);
function ident(){const i=W.__BD_IDENTITY||{},u=W.__BD_LIVE_SESSION?.user||null,m=u?.user_metadata||{};return{id:i.author_id||u?.id||'',name:i.author_name||m.full_name||m.name||u?.email?.split('@')[0]||'',username:i.author_username||m.username||'',avatar:i.author_avatar||m.avatar_url||'',logged:!!(i.author_id||u?.id)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function authHTML(){
  const x=ident();

  const av=x.avatar?`<img src="${esc(x.avatar)}" alt="">`:'🌿';

  return `<div class="bd-side-profile-shell"><a class="bd-side-profile-black" href="profile.html?user=${encodeURIComponent(x.id||x.username)}"><span class="bd-side-user-avatar">${av}</span><span><strong>${esc(x.name||'আপনার প্রোফাইল')}</strong><small>${esc(userLabel)}</small></span></a><div class="bd-side-user-links"><a href="profile.html?user=${encodeURIComponent(x.id||x.username)}">প্রোফাইল</a><a href="notifications.html">নোটিফিকেশন</a><a href="messages.html">ইনবক্স</a></div><button class="bd-side-logout" type="button" data-bd-logout>লগ আউট</button></div>`
}
async function logout(btn){
  if(btn)btn.disabled=true;
  try{
    if(W.BhubondangaAuth?.signOut) await W.BhubondangaAuth.signOut();
    else {
      const c=W.bdProductionSupabase||W.bdSupabase||W.supabaseClient||W.bhubondangaSupabase||null;
      if(c?.auth?.signOut)await c.auth.signOut();
    }
  }catch(_){}
  ['bhubondangaCurrentUser','bhubondangaSessionUser','bhubondangaAuthSession','sb-access-token'].forEach(k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(_){}});
  try{W.__BD_IDENTITY={};W.__BD_LIVE_SESSION=null}catch(_){}

}
function render(){$$('[data-r6-auth]').forEach(card=>{card.innerHTML=authHTML();card.dataset.r6State=ident().logged?'user':'guest'});$$('[data-bd9-role-label]').forEach(x=>x.textContent=ident().logged?'আপনার জন্য':'উন্মুক্ত')}
function open(which){if(innerWidth>=900)return;const l=$('#mobileDrawer'),r=$('#rightMobileDrawer'),b=$('#drawerBackdrop');l?.classList.toggle('open',which==='left');r?.classList.toggle('open',which==='right');b?.classList.add('show');D.body.classList.add('locked')}

D.addEventListener('bd:auth-ready',render);W.addEventListener('resize',()=>{if(innerWidth>=900)close()},{passive:true});render();
})();</script></template>
