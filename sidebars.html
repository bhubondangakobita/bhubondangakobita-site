function userAuth(u){const md=u?.user_metadata||{},name=md.full_name||md.name||u?.email?.split('@')[0]||'আপনার প্রোফাইল',av=md.avatar_url||md.picture||'';return `<section class="bd-side-card"><div class="bd-auth-box"><a class="bd-auth-profile" href="${profileHref(u)}"><span class="bd-auth-avatar">${av?`<img src="${esc(av)}" alt="">`:'🌿'}</span><span><b>${esc(name)}</b><small>আপনার ব্যক্তিগত ভুবন</small></span></a><div class="bd-user-actions"><a href="${profileHref(u)}">প্রোফাইল</a><a href="messages.html">ইনবক্স</a><a href="notifications.html">নোটিফিকেশন</a><button class="bd-logout bd-press" data-bd-logout>লগ আউট</button></div></div></section>`}
function profileCTA(){return `<section class="bd-side-card"><div class="bd-profile-cta"><h3>আপনার প্রোফাইল তৈরি করুন</h3><p>নিজের সাহিত্যিক পরিচয়, লেখা, পাঠ ও সংযোগের জন্য একটি ব্যক্তিগত ভুবন তৈরি করুন।</p><div class="bd-profile-actions"><a href="register.html">প্রোফাইল তৈরি করুন</a><a href="login.html">লগইন</a></div></div></section>`}
function themes(){return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সরাসরি পরিবর্তন</small><h3>গ্লাস থিম</h3></div></div><div class="bd-theme-grid"><button data-theme="light">লাইট</button><button data-theme="system" class="active">মিড</button><button data-theme="dark">ডার্ক</button></div></section>`}
function help(){return section('সহায়তা ও আস্থা','গুরুত্বপূর্ণ',[['＋','যাচাইকৃত মানবিক নোটিশ','জরুরি সাহায্যের বিশ্বস্ত বিভাগ','humanitarian-notice.html'],['!','অভিযোগ ও সহায়তা','সমস্যা জানাতে সরাসরি যোগাযোগ','complaint.html'],['▣','নিরাপত্তা নীতি','গোপনীয়তা, রিপোর্ট ও সুরক্ষা','privacy-security-policy.html']])}
function accountSettings(logged){if(!logged)return '';return `<section class="bd-side-card"><div class="bd-side-head"><div><small>ব্যক্তিগত নিয়ন্ত্রণ</small><h3>সেটিংস</h3></div></div><div class="bd-side-list">${[['⚙','উন্নত সেটিংস','গোপনীয়তা ও নোটিফিকেশন','settings.html'],['⊘','ব্লক লিস্ট','ব্লক করা অ্যাকাউন্ট','block-list.html']].map(row).join('')}</div></section>`}
async function getSession(){try{const c=W.BD_SUPABASE||W.supabaseClient;if(c)return (await c.auth.getSession()).data?.session||null}catch(_){}return null}
function profileRow(p,sub='সাহিত্যিক সদস্য'){const id=p.id||p.user_id||'',name=p.full_name||p.name||p.display_name||p.username||'সদস্য',av=p.avatar_url||p.avatar||'';return `<a class="bd-member" href="profile.html?user=${encodeURIComponent(id||p.username||'')}"><span class="bd-member-avatar">${av?`<img src="${esc(av)}" alt="">`:esc(name[0]||'ভ')}</span><span><b>${esc(name)}</b><small>${esc(sub)}</small></span><i>›</i></a>`}
async function getProfiles(){const c=W.BD_SUPABASE||W.supabaseClient;if(!c)return [];const attempts=[()=>c.from('profiles').select('*').order('created_at',{ascending:false}).limit(12),()=>c.from('profiles').select('*').limit(12)];for(const fn of attempts){try{const r=await fn();if(!r.error&&Array.isArray(r.data))return r.data}catch(_){}}return []}
function recentMembers(rows){if(!rows.length)return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সক্রিয় লেখক ও সহায়তা</small><h3>আজকের নতুন সদস্য</h3></div></div><div class="bd-side-empty">নিবন্ধিত নতুন সদস্য পাওয়া গেলে এখানে দেখাবে।</div></section>`;const track=rows.slice(0,8).map(p=>`<span>🌿 ${esc(p.full_name||p.name||p.username||'নতুন সদস্য')} — স্বাগতম</span>`).join('');const cards=rows.slice(0,6).map(p=>profileRow(p,'স্বাগতম আপন ভুবনে')).join('');return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সক্রিয় লেখক ও সহায়তা</small><h3>আজকের নতুন সদস্য</h3></div><small>${rows.length}</small></div><div class="bd-welcome-strip"><div class="bd-welcome-track">${track}${track}</div></div><div class="bd-side-list" style="margin-top:7px">${cards}</div></section>`}
function activeMembers(rows){const now=Date.now();const active=rows.filter(p=>{const t=Date.parse(p.last_seen||p.last_active_at||p.updated_at||'');return Number.isFinite(t)&&now-t<20*60*1000}).slice(0,5);return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সবুজ বাতি</small><h3>সক্রিয় লেখক</h3></div></div>${active.length?`<div class="bd-side-list">${active.map(p=>profileRow(p,'এখন সক্রিয়')).join('')}</div>`:`<div class="bd-side-empty">এখন কোনো সক্রিয় লেখক দেখা যাচ্ছে না।</div>`}</section>`}
function suggestions(rows){const arr=rows.slice(3,7);return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সাহিত্যিক সংযোগ</small><h3>আপনার পরিচিত হতে পারে</h3></div></div>${arr.length?`<div class="bd-side-list">${arr.map(p=>profileRow(p,'সাহিত্যিক সংযোগ')).join('')}</div>`:`<div class="bd-side-empty">নতুন সাহিত্যিক পরিচিতি এখানে দেখাবে।</div>`}</section>`}

function closeDrawers(){D.getElementById('bdSideDrawerL')?.classList.remove('open');D.getElementById('bdSideDrawerR')?.classList.remove('open');D.getElementById('bdSideDrawerBack')?.classList.remove('open');D.body.classList.remove('bd-drawer-open')}

async function mount({left,right}={}){const b=await build();if(left){left.innerHTML=`<div class="bd-side-stack">${b.left}</div>`;bind(left)}if(right){right.innerHTML=`<div class="bd-side-stack">${b.right}</div>`;bind(right)}mobile(b.left,b.right);return b}
W.BD_MODULES.sidebars={mount,refresh:mount,closeDrawers};if(location.pathname.endsWith('sidebars.html')||!D.querySelector('main')){const host=D.getElementById('bdSidebarDemo');if(host)mount({left:host.querySelector('[data-l]'),right:host.querySelector('[data-r]')})}
})();
