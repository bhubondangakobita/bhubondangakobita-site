function recentMembers(rows){if(!rows.length)return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সক্রিয় লেখক ও সহায়তা</small><h3>আজকের নতুন সদস্য</h3></div></div><div class="bd-side-empty">নিবন্ধিত নতুন সদস্য পাওয়া গেলে এখানে দেখাবে।</div></section>`;const track=rows.slice(0,8).map(p=>`<span>🌿 ${esc(p.full_name||p.name||p.username||'নতুন সদস্য')} — স্বাগতম</span>`).join('');const cards=rows.slice(0,6).map(p=>profileRow(p,'স্বাগতম আপন ভুবনে')).join('');return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সক্রিয় লেখক ও সহায়তা</small><h3>আজকের নতুন সদস্য</h3></div><small>${rows.length}</small></div><div class="bd-welcome-strip"><div class="bd-welcome-track">${track}${track}</div></div><div class="bd-side-list" style="margin-top:7px">${cards}</div></section>`}
function activeMembers(rows){const now=Date.now();const active=rows.filter(p=>{const t=Date.parse(p.last_seen||p.last_active_at||p.updated_at||'');return Number.isFinite(t)&&now-t<20*60*1000}).slice(0,5);return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সবুজ বাতি</small><h3>সক্রিয় লেখক</h3></div></div>${active.length?`<div class="bd-side-list">${active.map(p=>profileRow(p,'এখন সক্রিয়')).join('')}</div>`:`<div class="bd-side-empty">এখন কোনো সক্রিয় লেখক দেখা যাচ্ছে না।</div>`}</section>`}
function suggestions(rows){const arr=rows.slice(3,7);return `<section class="bd-side-card"><div class="bd-side-head"><div><small>সাহিত্যিক সংযোগ</small><h3>আপনার পরিচিত হতে পারে</h3></div></div>${arr.length?`<div class="bd-side-list">${arr.map(p=>profileRow(p,'সাহিত্যিক সংযোগ')).join('')}</div>`:`<div class="bd-side-empty">নতুন সাহিত্যিক পরিচিতি এখানে দেখাবে।</div>`}</section>`}
async function build(){const [session,profiles]=await Promise.all([getSession(),getProfiles()]);const left=identity()+(session?userAuth(session.user):guestAuth())+section('আজকের সাহিত্যপথ','নির্বাচিত',menuA)+section('ভুবনের দরজা','উন্মুক্ত',menuB)+themes();const right=recentMembers(profiles)+(session?'':profileCTA())+suggestions(profiles)+activeMembers(profiles)+help()+accountSettings(!!session);return {left,right,session}}
function bind(root){if(!root)return;root.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.theme;const mode=v==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):v;D.documentElement.dataset.theme=mode;try{localStorage.setItem('bd-theme',v)}catch(_){}root.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b))}));root.querySelectorAll('[data-bd-logout]').forEach(b=>b.addEventListener('click',async()=>{try{const c=W.BD_SUPABASE||W.supabaseClient;await c?.auth?.signOut?.()}catch(_){}try{localStorage.removeItem('bd-premium-access')}catch(_){}location.href='index.html'}))}
function closeDrawers(){D.getElementById('bdSideDrawerL')?.classList.remove('open');D.getElementById('bdSideDrawerR')?.classList.remove('open');D.getElementById('bdSideDrawerBack')?.classList.remove('open');D.body.classList.remove('bd-drawer-open')}
function mobile(leftHTML,rightHTML){let back=D.getElementById('bdSideDrawerBack'),L=D.getElementById('bdSideDrawerL'),R=D.getElementById('bdSideDrawerR');if(!back){D.body.insertAdjacentHTML('beforeend',`<button class="bd-edge left" data-bd-edge="left" aria-label="বাম সাইডবার">›</button><button class="bd-edge right" data-bd-edge="right" aria-label="ডান সাইডবার">‹</button><div class="bd-drawer-back" id="bdSideDrawerBack"></div><aside class="bd-drawer left" id="bdSideDrawerL"><div class="bd-drawer-head"><b>আপন ভুবন</b><button data-bd-close aria-label="বন্ধ করুন">×</button></div><div class="bd-side-stack" data-drawer-stack></div></aside><aside class="bd-drawer right" id="bdSideDrawerR"><div class="bd-drawer-head"><b>সক্রিয় লেখক ও সহায়তা</b><button data-bd-close aria-label="বন্ধ করুন">×</button></div><div class="bd-side-stack" data-drawer-stack></div></aside>`);back=D.getElementById('bdSideDrawerBack');L=D.getElementById('bdSideDrawerL');R=D.getElementById('bdSideDrawerR');D.querySelectorAll('[data-bd-edge]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();const side=b.dataset.bdEdge;const target=side==='left'?L:R,other=side==='left'?R:L;other.classList.remove('open');target.classList.toggle('open');back.classList.toggle('open',target.classList.contains('open'));D.body.classList.toggle('bd-drawer-open',target.classList.contains('open'))}));back.addEventListener('click',closeDrawers);D.querySelectorAll('[data-bd-close]').forEach(b=>b.addEventListener('click',closeDrawers));D.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawers()})}L.querySelector('[data-drawer-stack]').innerHTML=leftHTML;R.querySelector('[data-drawer-stack]').innerHTML=rightHTML;bind(L);bind(R)}
async function mount({left,right}={}){const b=await build();if(left){left.innerHTML=`<div class="bd-side-stack">${b.left}</div>`;bind(left)}if(right){right.innerHTML=`<div class="bd-side-stack">${b.right}</div>`;bind(right)}mobile(b.left,b.right);return b}
W.BD_MODULES.sidebars={mount,refresh:mount,closeDrawers};if(location.pathname.endsWith('sidebars.html')||!D.querySelector('main')){const host=D.getElementById('bdSidebarDemo');if(host)mount({left:host.querySelector('[data-l]'),right:host.querySelector('[data-r]')})}
})();
</script>

<script id="bd-runtime-overlap-audit-20260817">
(()=>{if(window.BDOverlapAudit)return;window.BDOverlapAudit=function(root=document){const nodes=[...root.querySelectorAll('button,a,input,select,textarea,[role="button"]')].filter(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>8&&r.height>8});const overlaps=[];for(let i=0;i<nodes.length;i++){const a=nodes[i],ra=a.getBoundingClientRect();for(let j=i+1;j<nodes.length;j++){const b=nodes[j];if(a.contains(b)||b.contains(a))continue;const rb=b.getBoundingClientRect(),x=Math.max(0,Math.min(ra.right,rb.right)-Math.max(ra.left,rb.left)),y=Math.max(0,Math.min(ra.bottom,rb.bottom)-Math.max(ra.top,rb.top));if(x*y>64)overlaps.push({a:a.getAttribute('aria-label')||a.textContent.trim().slice(0,28)||a.tagName,b:b.getAttribute('aria-label')||b.textContent.trim().slice(0,28)||b.tagName,area:Math.round(x*y)});}}return overlaps;};})();
</script>
