<title>ভুবনডাঙ্গা — নেক্সট লেভেল সাইডবার V36</title>
<style>
:root{
 --bg:#eef4fb;--panel:rgba(255,255,255,.88);--panel2:rgba(255,255,255,.97);
 --text:#102d3b;--muted:#65788b;--line:rgba(40,75,108,.13);
 --green:#087a55;--green2:#17a777;--red:#d9324d;--blue:#376dc8;--violet:#7656db;--gold:#c9932f;
 --shadow:0 18px 48px rgba(48,74,112,.10),0 4px 14px rgba(43,70,110,.06),inset 0 1px 0 rgba(255,255,255,.88);
 --texture:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><defs><radialGradient id='a' cx='15%25%'><stop stop-color='%23dff7ec' stop-opacity='.9'/><stop offset='1' stop-color='%23ffffff' stop-opacity='0'/></radialGradient><radialGradient id='b' cx='85%20%'><stop stop-color='%23e6e8ff' stop-opacity='.8'/><stop offset='1' stop-color='%23ffffff' stop-opacity='0'/></radialGradient><radialGradient id='c' cx='85%90%'><stop stop-color='%23ffe5ea' stop-opacity='.65'/><stop offset='1' stop-color='%23ffffff' stop-opacity='0'/></radialGradient></defs><rect width='240' height='240' fill='%23f8fbff'/><rect width='240' height='240' fill='url(%23a)'/><rect width='240' height='240' fill='url(%23b)'/><rect width='240' height='240' fill='url(%23c)'/></svg>");
}
html[data-theme="mid"]{--bg:#e9f1f6;--panel:rgba(250,253,255,.91);--panel2:#fff;--text:#12394a;--muted:#667b8e}
html[data-theme="dark"]{
 --bg:#09151f;--panel:rgba(14,27,38,.94);--panel2:rgba(18,34,47,.98);
 --text:#eff7fb;--muted:#a9bac7;--line:rgba(194,219,233,.13);
 --shadow:0 24px 48px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.04)
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
.bd36-stack{display:grid;gap:14px;min-width:0}
.bd36-card{
 position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:14px;
 background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:var(--shadow);
 backdrop-filter:blur(18px) saturate(118%);-webkit-backdrop-filter:blur(18px) saturate(118%);
}
.bd36-card::before{content:"";position:absolute;inset:0;background:var(--texture) center/cover no-repeat;opacity:.055;pointer-events:none}
html[data-theme="dark"] .bd36-card::before{opacity:.025;filter:invert(.7)}
.bd36-rail{height:2px;border-radius:999px;background:linear-gradient(90deg,transparent,#0c8a60 13%,#53c89d 31%,rgba(255,255,255,.7) 45%,#dc3551 61%,#8b2234 73%,#0c8a60 89%,transparent);box-shadow:0 0 8px rgba(15,140,98,.10);position:relative;z-index:2}
.bd36-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 1px 12px;position:relative;z-index:2}
.bd36-title strong{font-size:15px;font-weight:900;letter-spacing:.05px} .bd36-title small{font-size:10px;color:var(--muted)}
.bd36-band{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:7px 11px;background:#0b1914;color:#fff;font-size:12px;font-weight:900;box-shadow:0 5px 14px rgba(4,33,23,.12)}
html[data-theme="dark"] .bd36-band{background:#12261d}
.bd36-brand{padding:16px}
.bd36-brandline{display:grid;grid-template-columns:64px minmax(0,1fr);gap:13px;align-items:center}
.bd36-book{width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,#0b704f,#0c211a);display:grid;place-items:center;box-shadow:0 14px 26px rgba(5,85,58,.20)}
.bd36-book svg{width:43px;height:43px}
.bd36-brand h2{margin:0;color:#0b654b;font-size:27px;line-height:1.05;font-family:"Noto Serif Bengali","Noto Sans Bengali",serif}
html[data-theme="dark"] .bd36-brand h2{color:#bdf4df}
.bd36-brand p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
.bd36-quote{position:relative;z-index:2;margin-top:12px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,#0b1914,#12241d);color:#fff;font-size:10px;line-height:1.55}
.bd36-letter-shell{position:relative;z-index:2;margin-top:12px;padding:9px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.55)}
html[data-theme="dark"] .bd36-letter-shell{background:rgba(255,255,255,.03)}
.bd36-letter-row{display:flex;justify-content:space-between;gap:6px}
.bd36-letter{border:0;width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:900;box-shadow:0 8px 18px rgba(50,72,111,.10),inset 0 1px 0 rgba(255,255,255,.8);transition:.16s ease}
.bd36-letter:hover{transform:translateY(-3px) scale(1.04)} .bd36-letter:nth-child(1){background:#daf5e9;color:#0f8662} .bd36-letter:nth-child(2){background:#ffe0e6;color:#d1455a} .bd36-letter:nth-child(3){background:#eae3ff;color:#7451cc} .bd36-letter:nth-child(4){background:#dff1ff;color:#347bb4} .bd36-letter:nth-child(5){background:#fff0cf;color:#ad711e}
.bd36-list{display:grid;gap:8px;position:relative;z-index:2}
.bd36-row{
 min-height:64px;border:1px solid var(--line);border-radius:19px;padding:8px 10px;
 display:grid;grid-template-columns:48px minmax(0,1fr) 28px;gap:11px;align-items:center;
 background:rgba(255,255,255,.80);box-shadow:0 8px 20px rgba(62,83,119,.055);
 transition:.17s ease;
}
html[data-theme="dark"] .bd36-row{background:rgba(255,255,255,.038)}
.bd36-row:hover,.bd36-row.active{transform:translateY(-2px);box-shadow:0 12px 26px rgba(40,69,112,.12);border-color:rgba(18,137,96,.30)}
.bd36-ico{width:48px;height:48px;border-radius:15px;overflow:hidden;box-shadow:0 6px 15px rgba(44,66,102,.14)}
.bd36-ico img{width:100%;height:100%;display:block;object-fit:cover}
.bd36-row b{display:block;font-size:13px;font-weight:900;line-height:1.22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.bd36-row small{display:block;margin-top:3px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd36-go{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(9,122,85,.07);color:var(--green);font-size:18px}
.bd36-row.danger{border-color:rgba(204,51,70,.18)} .bd36-row.danger b{color:#b72f42} .bd36-row.danger .bd36-go{background:rgba(204,51,70,.08);color:#c73146}
.bd36-homeland{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.65)}
html[data-theme="dark"] .bd36-homeland{background:rgba(255,255,255,.035)}
.bd36-flag{width:58px;height:58px;border-radius:50%;background:#006a4e;position:relative;box-shadow:0 0 0 4px #fff,0 9px 20px rgba(0,0,0,.13)}
.bd36-flag::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#f42a41;left:16px;top:17px}
.bd36-homeland b{font-size:14px} .bd36-homeland span{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.bd36-member-viewport{overflow:hidden;position:relative;z-index:2}
.bd36-member-track{display:flex;gap:10px;width:max-content;animation:bd36flow 24s linear infinite}
.bd36-member{min-width:180px;border:1px solid var(--line);border-radius:18px;padding:10px;background:rgba(255,255,255,.80);display:flex;gap:10px;align-items:center}
html[data-theme="dark"] .bd36-member{background:rgba(255,255,255,.04)}
.bd36-member .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7e5ce0,#2f7fd2);color:#fff;font-weight:900}
.bd36-member b{font-size:10px} .bd36-member small{display:block;font-size:8px;color:var(--muted);margin-top:2px}
@keyframes bd36flow{to{transform:translateX(-50%)}}
.bd36-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:2}
.bd36-kpi div{padding:10px 8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.62);text-align:center}
html[data-theme="dark"] .bd36-kpi div{background:rgba(255,255,255,.03)} .bd36-kpi b{font-size:16px;color:#0b7755} html[data-theme="dark"] .bd36-kpi b{color:#87e3be} .bd36-kpi small{display:block;margin-top:2px;color:var(--muted);font-size:8px}
.bd36-chart{height:112px;margin-top:12px;padding:8px 9px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.55);display:flex;align-items:end;gap:6px;position:relative;z-index:2}
html[data-theme="dark"] .bd36-chart{background:rgba(255,255,255,.025)}
.bd36-chart i{flex:1;min-width:3px;max-width:12px;height:var(--h);border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 2px 7px rgba(54,74,113,.10)}
.bd36-pulse{display:grid;gap:9px;position:relative;z-index:2}
.bd36-pulse-line{display:grid;grid-template-columns:74px 1fr 34px;align-items:center;gap:8px}
.bd36-pulse-line span{font-size:9px;color:var(--muted);font-weight:800} .bd36-pulse-line b{font-size:9px;text-align:right}
.bd36-track{height:8px;border-radius:999px;background:rgba(86,106,130,.10);overflow:hidden} .bd36-track i{display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(90deg,var(--a),var(--b))}
.bd36-helpcard{display:grid;gap:8px;position:relative;z-index:2} .bd36-help{border:1px solid var(--line);border-radius:17px;padding:10px;background:rgba(255,255,255,.66);display:grid;grid-template-columns:42px 1fr 24px;gap:9px;align-items:center} html[data-theme="dark"] .bd36-help{background:rgba(255,255,255,.03)} .bd36-help .mini{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#e4f8ef,#edf2ff);display:grid;place-items:center;color:#14835d;font-weight:900} .bd36-help b{font-size:11px} .bd36-help small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.bd36-theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:2}
.bd36-theme{height:44px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.74);font-weight:900;font-size:10px} html[data-theme="dark"] .bd36-theme{background:rgba(255,255,255,.04)} .bd36-theme.active{background:#0c2119;color:white;border-color:#0c2119}
.bd36-edge{display:none;position:fixed;top:50%;transform:translateY(-50%);z-index:26000;width:32px;height:96px;border:1px solid rgba(113,91,214,.22);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(226,219,255,.95));color:#7057d8;box-shadow:0 10px 24px rgba(58,54,112,.18)} .bd36-edge.left{left:0;border-radius:0 18px 18px 0} .bd36-edge.right{right:0;border-radius:18px 0 0 18px}
.bd36-back{position:fixed;inset:0;z-index:27000;background:rgba(7,15,22,.36);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.18s} .bd36-back.open{opacity:1;pointer-events:auto}
.bd36-drawer{position:fixed;top:0;bottom:0;z-index:28000;width:min(430px,88vw);padding:14px;background:var(--bg);overflow:auto;transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 50px rgba(0,0,0,.20)} .bd36-drawer.left{left:0;transform:translateX(-103%)} .bd36-drawer.right{right:0;transform:translateX(103%)} .bd36-drawer.open{transform:none}
.bd36-drawer-head{position:sticky;top:-14px;z-index:5;margin:-14px -14px 12px;padding:16px;background:rgba(247,251,255,.94);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)} html[data-theme="dark"] .bd36-drawer-head{background:rgba(9,21,31,.94)} .bd36-close{width:44px;height:44px;border:0;border-radius:50%;background:#0d1713;color:#fff;font-size:23px}
@media(max-width:980px){.bd36-edge{display:block}}
@media(max-width:420px){.bd36-card{border-radius:23px;padding:12px} .bd36-brandline{grid-template-columns:56px 1fr} .bd36-book{width:56px;height:56px;border-radius:18px} .bd36-brand h2{font-size:24px} .bd36-row{min-height:60px;grid-template-columns:44px minmax(0,1fr) 26px} .bd36-ico{width:44px;height:44px}}
</style>
