async function saveRemoteLocation(l){const c=client(),u=await sessionUser();if(!c||!u?.id)return;const row={user_id:u.id,alerts_enabled:l.alerts!==false,country_code:String(l.country_code||'BD').toUpperCase(),district:l.district||'',city:l.city||'',location_accuracy_m:l.accuracy??null,updated_at:nowISO()};if(l.lat!=null&&l.lng!=null)row.location=`POINT(${l.lng} ${l.lat})`;try{let r=await c.from('humanitarian_notification_preferences').upsert(row,{onConflict:'user_id'});if(r?.error&&row.location){delete row.location;await c.from('humanitarian_notification_preferences').upsert(row,{onConflict:'user_id'})}}catch(_){}}
function syncLocation(root,l){const label=[l.city,l.district,l.country_code].filter(Boolean).join(' · ')||'লোকেশন ঠিক করা হয়নি';$$('[data-loc-label]',root).forEach(x=>x.textContent=label);$$('[data-loc-district]',root).forEach(x=>x.value=l.district||'');$$('[data-loc-city]',root).forEach(x=>x.value=l.city||'');$$('[data-loc-country]',root).forEach(x=>x.value=l.country_code||'BD');$$('[data-human-alerts]',root).forEach(x=>x.checked=l.alerts!==false);$$('[data-local-news]',root).forEach(x=>x.checked=l.localNews!==false)}
function wireLocation(root){syncLocation(root,savedLoc());$$('[data-edit-loc]',root).forEach(b=>b.addEventListener('click',()=>{const f=b.closest('.bd83-location')?.querySelector('[data-loc-form]');if(f)f.hidden=!f.hidden}));$$('[data-save-loc]',root).forEach(b=>b.addEventListener('click',async()=>{const h=b.closest('.bd83-location'),old=savedLoc(),l={...old,district:$('[data-loc-district]',h)?.value.trim()||'',city:$('[data-loc-city]',h)?.value.trim()||'',country_code:($('[data-loc-country]',h)?.value.trim()||'BD').toUpperCase(),alerts:$('[data-human-alerts]',h)?.checked!==false,localNews:$('[data-local-news]',h)?.checked!==false};const x=saveLocLocal(l);syncLocation(D,x);const f=$('[data-loc-form]',h);if(f)f.hidden=true;const st=$('[data-loc-status]',h);if(st)st.textContent='লোকেশন সংরক্ষিত হয়েছে।';saveRemoteLocation(x);W.dispatchEvent(new CustomEvent('bd:location-updated',{detail:x}));toast('লোকেশন সংরক্ষিত হয়েছে')}));$$('[data-use-gps]',root).forEach(b=>b.addEventListener('click',()=>{const h=b.closest('.bd83-location'),st=$('[data-loc-status]',h);if(!navigator.geolocation){if(st)st.textContent='GPS পাওয়া যায়নি।';return}if(st)st.textContent='বর্তমান লোকেশন নেওয়া হচ্ছে…';navigator.geolocation.getCurrentPosition(p=>{const old=savedLoc(),x=saveLocLocal({...old,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,district:$('[data-loc-district]',h)?.value.trim()||old.district,city:$('[data-loc-city]',h)?.value.trim()||old.city,country_code:($('[data-loc-country]',h)?.value.trim()||old.country_code||'BD').toUpperCase(),alerts:$('[data-human-alerts]',h)?.checked!==false,localNews:$('[data-local-news]',h)?.checked!==false});syncLocation(D,x);if(st)st.textContent=`GPS ঠিক হয়েছে · ±${Math.round(p.coords.accuracy||0)}m`;saveRemoteLocation(x);W.dispatchEvent(new CustomEvent('bd:location-updated',{detail:x}));toast('GPS লোকেশন ঠিক হয়েছে')},e=>{if(st)st.textContent=e.code===1?'লোকেশন অনুমতি বন্ধ আছে।':'লোকেশন পাওয়া যায়নি।'},{enableHighAccuracy:true,timeout:9000,maximumAge:120000})}));$$('[data-human-alerts]',root).forEach(sw=>sw.addEventListener('change',()=>{const x=saveLocLocal({...savedLoc(),alerts:sw.checked});syncLocation(D,x);saveRemoteLocation(x)}));$$('[data-local-news]',root).forEach(sw=>sw.addEventListener('change',()=>{const x=saveLocLocal({...savedLoc(),localNews:sw.checked});syncLocation(D,x);W.dispatchEvent(new CustomEvent('bd:location-updated',{detail:x}))}))}
function wireTabs(root){root.addEventListener('click',e=>{const b=e.target.closest('[data-cat-tab]');if(!b)return;const card=b.closest('.bd83-card'),key=b.dataset.catTab;$$('[data-cat-tab]',card).forEach(x=>x.classList.toggle('active',x===b));$$('[data-cat-pane]',card).forEach(x=>x.hidden=x.dataset.catPane!==key)})}
function wirePrefs(root){$$('[data-pref]',root).forEach(sw=>sw.addEventListener('change',()=>{setPref(sw.dataset.pref,sw.checked);W.dispatchEvent(new CustomEvent('bd:sidebar-pref',{detail:{key:sw.dataset.pref,value:sw.checked}}))}))}
async function loadProfile(root){const c=client(),u=await sessionUser();if(!c||!u?.id)return;try{const r=await c.from('profiles').select('full_name,display_name,username,avatar_url').eq('id',u.id).maybeSingle(),p=r.data||{};const name=p.display_name||p.full_name||p.username||u.user_metadata?.full_name||'আমার প্রোফাইল';$$('[data-own-name]',root).forEach(x=>x.textContent=name);$$('[data-own-avatar]',root).forEach(x=>{if(p.avatar_url)x.innerHTML=`<img alt="" src="${esc(p.avatar_url)}" loading="lazy">`;else x.textContent=(name||'ভ').trim().charAt(0)||'ভ'});const f=await c.from('follows').select('follower_id,following_id',{count:'exact'}).or(`follower_id.eq.${u.id},following_id.eq.${u.id}`).limit(600);if(!f.error){const rows=f.data||[],followers=rows.filter(x=>x.following_id===u.id).length,following=rows.filter(x=>x.follower_id===u.id).length;$$('[data-followers]',root).forEach(x=>x.textContent=followers);$$('[data-following]',root).forEach(x=>x.textContent=following)}}catch(_){}}
async function loadStats(root){const c=client();if(!c)return;try{let x=null;const r=await c.rpc('humanitarian_stats_v80');if(!r.error)x=Array.isArray(r.data)?r.data[0]:r.data;if(!x){const a=await c.from('humanitarian_requests').select('status,priority').limit(800);if(!a.error){const rows=a.data||[];x={active_now:rows.filter(z=>z.status==='active').length,urgent_now:rows.filter(z=>z.status==='active'&&['urgent','critical'].includes(z.priority)).length,completed_total:rows.filter(z=>z.status==='completed').length}}}if(x){$$('[data-stat-active]',root).forEach(e=>e.textContent=x.active_now??x.active??0);$$('[data-stat-urgent]',root).forEach(e=>e.textContent=x.urgent_now??x.urgent??0);$$('[data-stat-done]',root).forEach(e=>e.textContent=x.completed_total??x.completed??0)}}catch(_){}}
async function loadActivePeople(root){const c=client();if(!c)return;const host=$('[data-active-people]',root);if(!host)return;try{const r=await c.from('profiles').select('id,full_name,display_name,username,avatar_url,bio').limit(4);if(r.error||!r.data?.length)return;host.innerHTML=r.data.slice(0,4).map(p=>{const n=p.display_name||p.full_name||p.username||'লেখক',letter=n.trim().charAt(0)||'ল',url=`profile.html?id=${encodeURIComponent(p.id)}`;return `<a class="bd83-person" href="${url}"><span class="bd83-person-avatar">${p.avatar_url?`<img alt="" src="${esc(p.avatar_url)}" loading="lazy">`:esc(letter)}</span><span class="bd83-person-copy"><b>${esc(n)}</b><small>${esc(p.bio||'সাহিত্যিক সংযোগ')}</small></span><span class="bd83-person-go">${icon('chevron')}</span></a>`}).join('')}catch(_){}}
function idle(fn){if('requestIdleCallback'in W)requestIdleCallback(fn,{timeout:1200});else setTimeout(fn,220)}
function mobile(context){let host=$('#bd83Mobile');if(host){host.dataset.context=context;return host}host=D.createElement('div');host.id='bd83Mobile';host.className='bd83-mobile-root';host.dataset.context=context;host.innerHTML=`<button class="bd83-edge left" data-open-left aria-label="আপন ভুবন খুলুন">${icon('chevron')}</button><button class="bd83-edge right" data-open-right aria-label="সহায়তা খুলুন"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><div class="bd83-backdrop" data-backdrop></div><aside class="bd83-drawer left" data-left-drawer><header class="bd83-drawerbar"><span class="bd83-drawer-logo">${logo()}</span><b>আপন ভুবন</b><button type="button" data-close-drawer>×</button></header><div class="bd83-drawer-content" data-left-content>${leftHTML(context)}</div></aside><aside class="bd83-drawer right" data-right-drawer><header class="bd83-drawerbar"><button type="button" data-close-drawer>×</button><b>লোকাল ও সহায়তা</b><span class="bd83-drawer-logo">${logo()}</span></header><div class="bd83-drawer-content" data-right-content>${rightHTML(context)}</div></aside>`;D.body.appendChild(host);const back=$('[data-backdrop]',host),left=$('[data-left-drawer]',host),right=$('[data-right-drawer]',host);let beforeOpen=0;const close=()=>{left.classList.remove('open');right.classList.remove('open');back.classList.remove('open');D.documentElement.classList.remove('bd83-drawer-open');if(Math.abs(scrollY-beforeOpen)>2)scrollTo(0,beforeOpen)};const open=drawer=>{beforeOpen=scrollY;close();beforeOpen=scrollY;drawer.classList.add('open');back.classList.add('open');D.documentElement.classList.add('bd83-drawer-open');if(drawer===right)idle(()=>{loadStats(host);loadActivePeople(host)})};$('[data-open-left]',host).addEventListener('click',()=>open(left));$('[data-open-right]',host).addEventListener('click',()=>open(right));$$('[data-close-drawer]',host).forEach(x=>x.addEventListener('click',close));back.addEventListener('click',close);D.addEventListener('keydown',e=>{if(e.key==='Escape'&&(left.classList.contains('open')||right.classList.contains('open')))close()});wireLocation(host);wireTabs(host);wirePrefs(host);idle(()=>loadProfile(host));return host}
function refreshMobile(context){const old=$('#bd83Mobile');if(old)old.remove();return mobile(context)}
function hydrate(root,side){wireTabs(root);wirePrefs(root);if(side==='right')wireLocation(root);idle(()=>loadProfile(root));if(side==='right')idle(()=>{loadStats(root);loadActivePeople(root)})}
async function mount({left,right,context='index'}={}){context=String(context||'index').toLowerCase();if(!CONTEXT_SETS[context])context='index';if(left){left.innerHTML=leftHTML(context);hydrate(left,'left')}if(right){right.innerHTML=rightHTML(context);hydrate(right,'right')}refreshMobile(context);return{left,right,context,version:'v83-premium'}}
W.addEventListener('bd:location-updated',e=>{if(e?.detail)syncLocation(D,e.detail)});
W.BD_MODULES.sidebars={mount,leftHTML,rightHTML,refreshMobile,version:'v83-premium-200k'};
})(window,document);
</script>
