(()=>{'use strict';
const URL='https://ihjiisysrwgxxkuywuhc.supabase.co',KEY='sb_publishable_2ofR9FO078M1Eu-m0Q8FLg_WqN6iIxz';let c=null;try{c=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(_){}

const founderLike=u=>{const m=u?.user_metadata||{},raw=[m.username,m.slug,m.full_name,m.name,u?.email?.split('@')[0]].filter(Boolean).join(' ').toLowerCase().replace(/[._ -]/g,'');return raw.includes('mahmudsohel')||raw.includes('মাহমুদসোহেল')};
async function role(u){let r=String(u?.app_metadata?.role||u?.user_metadata?.role||'').toLowerCase();if(c&&u?.id){try{const x=await c.from('user_roles').select('role,active').eq('user_id',u.id).eq('active',true).limit(1);if(x.data?.[0]?.role)r=String(x.data[0].role).toLowerCase()}catch(_){}try{const x=await c.from('profiles').select('role,username,display_name').eq('id',u.id).limit(1);const p=x.data?.[0];if(p?.role)r=String(p.role).toLowerCase();if(!r&&p&&founderLike({...u,user_metadata:{...u.user_metadata,username:p.username,full_name:p.display_name}}))r='founder'}catch(_){}}if(!r&&founderLike(u))r='founder';return r||'user'}
