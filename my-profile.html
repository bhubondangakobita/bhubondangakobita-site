<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>আপনার প্রোফাইল | ভুবনডাঙ্গার কবিতা</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Noto Serif Bengali',serif;color:#172b48}body{min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 15%,rgba(115,216,188,.26),transparent 30%),radial-gradient(circle at 85% 18%,rgba(152,110,229,.24),transparent 31%),linear-gradient(145deg,#f8fbff,#edf2fb)}.card{width:min(430px,100%);padding:26px 22px;border-radius:24px;background:rgba(255,255,255,.78);border:1px solid rgba(120,135,190,.2);box-shadow:0 22px 58px rgba(39,55,96,.18);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);text-align:center}.leaf{font-size:44px}.title{margin:8px 0 5px;font-size:22px}.status{margin:0 auto;max-width:330px;color:#65758f;font-size:13px;line-height:1.7}.bar{height:7px;margin:18px 0 14px;border-radius:999px;overflow:hidden;background:#e7ebf7}.bar:before{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#64d5c2,#7c72e5,#d676c0);animation:move 1.1s ease-in-out infinite alternate}.actions{display:none;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}.actions.show{display:flex}.btn{min-height:42px;padding:11px 17px;border:1px solid rgba(110,122,175,.18);border-radius:13px;background:rgba(255,255,255,.82);color:#172b48;text-decoration:none;font-weight:700}.btn.primary{border-color:transparent;background:linear-gradient(135deg,#68d6c3,#7b6de5 60%,#c96fbf);color:white}.hint{font-size:11px;color:#7b879b;margin-top:14px}@keyframes move{from{transform:translateX(-20%)}to{transform:translateX(160%)}}@media(prefers-color-scheme:dark){html{color-scheme:dark}body{color:#f4f7ff;background:radial-gradient(circle at 15% 15%,rgba(66,208,188,.16),transparent 30%),radial-gradient(circle at 85% 18%,rgba(148,91,231,.2),transparent 31%),#071426}.card{background:rgba(15,29,51,.82);border-color:rgba(255,255,255,.09);box-shadow:0 24px 70px rgba(0,0,0,.38)}.status,.hint{color:#aeb9cb}.bar{background:#1e3150}.btn{color:#f4f7ff;background:#132744;border-color:rgba(255,255,255,.1)}}
</style>
</head>
<body>
<main class="card" aria-live="polite">
<div class="leaf">🌿</div>
<h1 class="title">আপনার প্রোফাইল খোলা হচ্ছে</h1>
<p class="status" id="status">লগইন করা অ্যাকাউন্ট যাচাই করছি…</p>
<div class="bar" id="bar"></div>
<div class="actions" id="actions"><a class="btn primary" id="login" href="login.html?next=my-profile.html">লগইন করুন</a><a class="btn" href="index.html">হোমে ফিরুন</a></div>
<p class="hint">এই পেজটি কখনো ফাঁকা থাকবে না। সমস্যা হলে নিচের বাটন দেখা যাবে।</p>
</main>
<script>
(()=>{'use strict';
const URL='https://ihjiisysrwgxxkuywuhc.supabase.co',KEY='sb_publishable_2ofR9FO078M1Eu-m0Q8FLg_WqN6iIxz';
const $=s=>document.querySelector(s);let client=null;
try{client=window.supabase?.createClient?.(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(_){ }
const timeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
function cached(){try{return JSON.parse(localStorage.getItem('bhubondangaCurrentUser')||'null')}catch(_){return null}}
function route(role){role=String(role||'').toLowerCase();if(role==='founder')return'founder-profile.html?owner=1&from=my-profile';if(role==='admin')return'admin-profile.html?owner=1&from=my-profile';return'profile.html?owner=1&from=my-profile'}
function showFallback(msg,guest=false){$('#status').textContent=msg;$('#bar').hidden=true;$('#actions').classList.add('show');if(!guest){$('#login').textContent='প্রোফাইল খুলুন';$('#login').href=route(cached()?.role)}}
async function resolve(){
 let session=null;
 try{session=(await timeout(client.auth.getSession(),5000)).data.session}catch(_){ }
 if(!session){const c=cached();if(c?.loggedIn&&c?.id){$('#status').textContent='সংরক্ষিত অ্যাকাউন্ট থেকে প্রোফাইল খোলা হচ্ছে…';setTimeout(()=>location.replace(route(c.role)),120);return}showFallback('আপনি এখন লগইন করা নেই।',true);return}
 const u=session.user;let p=null,role=String(u.app_metadata?.role||u.user_metadata?.role||'').toLowerCase();
 try{p=(await timeout(client.from('profiles').select('*').eq('id',u.id).maybeSingle(),4000)).data||null}catch(_){ }
 try{const x=(await timeout(client.from('user_roles').select('role,active').eq('user_id',u.id).eq('active',true).maybeSingle(),4000)).data;if(x?.role)role=String(x.role).toLowerCase()}catch(_){ }
 if(p?.role)role=String(p.role).toLowerCase();
 const raw=[p?.username,p?.display_name,u.email,u.user_metadata?.username,u.user_metadata?.full_name].filter(Boolean).join(' ').toLowerCase().replace(/[._ @-]/g,'');
 if(!role&&raw.includes('mahmudsohel'))role='founder';
 const info={id:u.id,email:u.email,name:p?.display_name||u.user_metadata?.full_name||u.email?.split('@')[0]||'সদস্য',username:p?.username||u.user_metadata?.username||'',avatar:p?.avatar_url||u.user_metadata?.avatar_url||'',cover:p?.cover_url||'',role:role||'user',loggedIn:true};
 try{localStorage.setItem('bhubondangaCurrentUser',JSON.stringify(info))}catch(_){ }
 $('#status').textContent='আপনার নিজস্ব প্রোফাইলে নেওয়া হচ্ছে…';
 setTimeout(()=>location.replace(route(info.role)),100);
}
resolve().catch(()=>showFallback('প্রোফাইল খোলার সময় সংযোগ সমস্যা হয়েছে। আবার চেষ্টা করুন।',false));
setTimeout(()=>{if(document.visibilityState==='visible'&&!$('#actions').classList.contains('show'))showFallback('প্রোফাইল খুলতে দেরি হচ্ছে। নিচের বাটনে চাপুন।',false)},9000);
})();
</script>
</body></html>
