<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Admin Dashboard</title><style>:root{--page:#f3f7fb;--surface:#fff;--ink:#18334f;--muted:#718199;--line:rgba(65,88,138,.16);--primary:#7b72e2;--primary2:#b875d1;--shadow:0 12px 30px rgba(42,57,105,.10)}*{box-sizing:border-box}body{margin:0;font-family:"Noto Serif Bengali","Noto Sans Bengali",serif;background:var(--page);color:var(--ink)}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:10;height:64px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.wrap{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 360px;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:15px}.queue{display:grid;gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:13px}.item h3{margin:4px 0}.item p{color:var(--muted);line-height:1.7}.actions{display:flex;gap:8px}.actions button{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 13px}.actions .ok{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}.rank{display:grid;gap:8px}.rank-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:11px;background:#f8f9fd}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:850px){.wrap{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="index.html">🌿 ভুবনডাঙ্গার কবিতা</a><strong>Admin Dashboard</strong><a href="index.html">হোম</a></header><main class="wrap"><section class="card"><h1>পর্যালোচনাধীন লেখা</h1><div class="queue" id="queue"></div></section><aside class="card"><h2>অবদান পুরস্কার তালিকা</h2><p style="color:var(--muted)">খ্যাতিমান কবিদের কবিতা সর্বোচ্চ ৫ পয়েন্ট, মনীষীদের বাণী ৩ পয়েন্ট। প্রতি মাসের ১ তারিখে শীর্ষ অবদানকারী Index-এর উপরে ২৪ ঘণ্টা সম্মানিত হবেন।</p><div class="rank" id="rank"></div></aside></main><script>(function(){const K='bhubondangaAdminModerationQueue',D=document,mem={};function g(k,f=[]){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(_){return mem[k]||f}}function s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){mem[k]=v}}function put(k,x){const a=g(k,[]).filter(v=>String(v.id)!==String(x.id));a.unshift(x);s(k,a)}function keys(t){return{poem:['bhubondangaPublishedPoems'],prolap:['bhubondangaPublishedProlaps'],midnight:['bhubondangaPublishedMidnightProlaps'],letter:['bhubondangaLetterPosts','bhubondangaPublishedLetters'],recitation:['bhubondangaPublishedRecitations'],environment:['bhubondangaPublishedEnvironmentPosts','bhubondangaPublishedEnvironment'],quotes:['bhubondangaPublishedQuotes']}[t]||[]}function publish(p){p.status='published';put('bhubondangaHomeUserPosts',p);put('bhubondangaProfilePosts',p);keys(p.type).forEach(k=>put(k,p))}function notify(n,msg){put('bhubondangaNotifications',{id:'notice-'+Date.now(),postId:n.postId,userId:n.userId,userName:n.userName,type:'moderation_result',message:msg,read:false,createdAt:new Date().toISOString()})}function render(){const q=g(K,[]).filter(x=>x.status==='pending'),box=D.querySelector('#queue');box.innerHTML=q.length?q.map(x=>`<article class="item" data-id="${x.id}"><small>${new Date(x.createdAt).toLocaleString('bn-BD')}</small><h3>${x.post?.title||'শিরোনামহীন লেখা'}</h3><p>${String(x.post?.body||x.text||'').slice(0,420)}</p><div>ধরা পড়া শব্দ: ${(x.matchedTerms||x.terms||[]).join(', ')||'পর্যালোচনা প্রয়োজন'}</div><div class="actions"><button class="ok" data-act="approve">অনুমোদন</button><button data-act="reject">প্রত্যাখ্যান</button></div></article>`).join(''):'<div class="empty">এখন কোনো pending লেখা নেই।</div>';const ledger=g('bhubondangaContributionLedger',[]),m={};ledger.forEach(x=>{const k=x.username||x.name||'member';m[k]=m[k]||{name:x.name||k,points:0,count:0};m[k].points+=Number(x.points||1);m[k].count++});D.querySelector('#rank').innerHTML=Object.values(m).sort((a,b)=>b.points-a.points).slice(0,20).map((x,i)=>`<div class="rank-row"><b>${i+1}</b><span>${x.name}<small style="display:block;color:#718199">${x.count}টি অবদান</small></span><strong>${x.points}</strong></div>`).join('')||'<div class="empty">অবদান তথ্য নেই।</div>'}D.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('[data-id]').dataset.id,q=g(K,[]),n=q.find(x=>String(x.id)===String(id));if(!n)return;if(b.dataset.act==='approve'){publish(n.post);n.status='approved';notify(n,'আপনার লেখাটি অনুমোদিত হয়েছে এবং নিউজফিড ও প্রোফাইলে প্রকাশিত হয়েছে।')}else{n.status='rejected';notify(n,'আপনার লেখাটি পর্যালোচনার পর প্রকাশ করা হয়নি।')}s(K,q);for(const other of ['bhubondangaAdminModerationQueue','bhubondangaFounderModerationQueue']){const a=g(other,[]),z=a.find(x=>String(x.id)===String(id));if(z)z.status=n.status;s(other,a)}render()});render()})();</script></body></html>
