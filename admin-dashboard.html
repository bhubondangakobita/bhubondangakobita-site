</head><body><header class="top"><a href="index.html">🌿 ভুবনডাঙ্গার কবিতা</a><strong>Admin Dashboard</strong><a href="index.html">হোম</a></header><main class="wrap"><section class="card" id="moderation"><h1>পর্যালোচনাধীন লেখা</h1><div class="queue" id="queue"></div></section><aside class="card"><h2>অবদান পুরস্কার তালিকা</h2><p style="color:var(--muted)">খ্যাতিমান কবিদের কবিতা সর্বোচ্চ ৫ পয়েন্ট, মনীষীদের বাণী ৩ পয়েন্ট। প্রতি মাসের ১ তারিখে শীর্ষ অবদানকারী Index-এর উপরে ২৪ ঘণ্টা সম্মানিত হবেন।</p><div class="rank" id="rank"></div></aside></main><script>
(function(){'use strict';

async function auth(){if(!W.supabase?.createClient){renderLocal();return false}sb=W.bdSupabase||W.supabaseClient||W.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});W.bdSupabase=W.bdSupabase||sb;W.supabaseClient=W.supabaseClient||sb;session=(await sb.auth.getSession()).data?.session||null;if(!session){D.querySelector('#queue').innerHTML='<div class="empty">Admin queue দেখতে লগইন করুন।</div>';return false}try{const r=await sb.from('user_roles').select('role,active').eq('user_id',session.user.id).eq('active',true);role=(r.data||[]).some(x=>x.role==='founder')?'founder':(r.data||[]).some(x=>x.role==='admin')?'admin':''}catch{}if(!['admin','founder'].includes(role)){D.querySelector('#queue').innerHTML='<div class="empty">এই Dashboard-এর অনুমতি আপনার নেই।</div>';return false}return true}

D.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const item=b.closest('[data-id]');if(!item)return;b.disabled=true;(item.dataset.source==='remote'?reviewRemote(item.dataset.id,b.dataset.act):Promise.resolve(reviewLocal(item.dataset.id,b.dataset.act))).finally(()=>b.disabled=false)},true);
