<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" name="viewport"/><title>নোটিস যাচাই | ভুবনডাঙ্গার কবিতা</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#eef2f7;--card:#fff;--text:#213754;--soft:#61708a;--border:#dfe4ef;--green:#39836d;--primary:#7279d8}html[data-theme=dark]{--bg:#071120;--card:#0d1c32;--text:#f2f6ff;--soft:#cad4eb;--border:#263a5a;--green:#8bd1bc;--primary:#98a8ff}body{font-family:"Noto Serif Bengali",serif;background:var(--bg);color:var(--text);min-height:100vh}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);z-index:20}.head{min-height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.logo{font-size:30px}.layout{display:grid;grid-template-columns:220px 1fr 220px;gap:14px;padding:16px 0}.glass{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}.side a{display:block;padding:9px;border-bottom:1px solid var(--border)}h1{font-size:25px}.sub{color:var(--soft);margin-top:4px}.list{margin-top:12px;display:grid;gap:10px}.item{border:1px solid var(--border);border-radius:13px;padding:12px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.btn{border:1px solid var(--border);border-radius:9px;padding:8px 11px;background:var(--card);color:var(--text)}.btn.ok{background:var(--green);color:#fff}.btn.danger{color:#b74462}.empty{text-align:center;padding:28px;color:var(--soft)}@media(max-width:860px){.layout{display:block}.side{display:none}.wrap{width:min(100% - 16px,760px)}input,textarea,select{font-size:16px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>


</head><body data-bd-family="admin" data-page="admin-notice-review"><header><div class="wrap head"><a class="brand" href="index.html"><span class="logo">🌿</span><strong>ভুবনডাঙ্গার কবিতা</strong></a><button class="btn" id="themeButton">থিম</button></div></header><main class="wrap layout"><aside class="glass side"><a href="admin-dashboard.html">Admin Dashboard</a><a href="admin-notice-review.html">নোটিস যাচাই</a><a href="admin-humanitarian-review.html">মানবিক আবেদন</a><a href="admin-reports.html">রিপোর্ট</a></aside><section class="glass"><h1>নোটিস যাচাই</h1><p class="sub">শুধু অনুমোদিত Admin ও Founder নোটিস review করবেন। UI guard নিরাপত্তা নয়; Supabase RLS/RPC প্রয়োজন।</p><div class="list" id="noticeList"></div></section><aside class="glass side"><strong>গোপনীয়তা</strong><p class="sub">Private inbox বা password এই প্যানেল থেকে দেখা যাবে না।</p></aside></main><script>const $=s=>document.querySelector(s),read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function render(){const a=read('bhubondangaNoticeReviewQueue');$('#noticeList').innerHTML=a.length?a.map(x=>`<article class="item" data-id="${x.id||''}"><strong>${x.title||'শিরোনামহীন নোটিস'}</strong><p class="sub">${x.body||x.message||''}</p><div class="actions"><button class="btn ok" data-a="approve">অনুমোদন</button><button class="btn" data-a="edit">সম্পাদনা চাওয়া</button><button class="btn danger" data-a="reject">বাতিল</button></div></article>`).join(''):'<div class="empty">কোনো নোটিস review queue-তে নেই।</div>'}document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const card=b.closest('[data-id]'),id=card.dataset.id,a=read('bhubondangaNoticeReviewQueue'),x=a.find(v=>String(v.id)===String(id));if(!x)return;if(b.dataset.a==='approve'){const p=read('bhubondangaApprovedNotices');p.unshift({...x,status:'approved',approvedAt:new Date().toISOString()});save('bhubondangaApprovedNotices',p)}save('bhubondangaNoticeReviewQueue',a.filter(v=>String(v.id)!==String(id)));render()});$('#themeButton').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.setItem('bhubondangaTheme',n)};document.documentElement.dataset.theme=localStorage.getItem('bhubondangaTheme')||'light';render();</script>
