/* Deterministic Dhaka date runtime: same civil result on supported devices. */
const bn='০১২৩৪৫৬৭৮৯',toBn=n=>String(n).replace(/\d/g,d=>bn[d]);

const bMonths=['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
function dhakaParts(date=new Date()){const ps=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit',weekday:'long',hour:'2-digit',hour12:false}).formatToParts(date),o={};ps.forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});return{y:+o.year,m:+o.month,d:+o.day,h:+o.hour,weekday:o.weekday}}
function leap(y){return y%400===0||(y%4===0&&y%100!==0)}
function bangla(y,m,d){const cur=Date.UTC(y,m-1,d),apr=Date.UTC(y,3,14),sy=cur>=apr?y:y-1,by=cur>=apr?y-593:y-594;let days=Math.floor((cur-Date.UTC(sy,3,14))/86400000),lens=[31,31,31,31,31,31,30,30,30,30,leap(sy+1)?30:29,30],i=0;while(i<11&&days>=lens[i]){days-=lens[i++]}return`${toBn(days+1)} ${bMonths[i]} ${toBn(by)} বঙ্গাব্দ`}
function gregorianJD(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function islamicToJD(y,m,d){return d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+1948439-1}
function hijri(y,m,d){const jd=gregorianJD(y,m,d),hy=Math.floor((30*(jd-1948439)+10646)/10631);let hm=Math.min(12,Math.ceil((jd-(29+islamicToJD(hy,1,1)))/29.5)+1);hm=Math.max(1,hm);let hd=jd-islamicToJD(hy,hm,1)+1;if(hd<1){hm=Math.max(1,hm-1);hd=jd-islamicToJD(hy,hm,1)+1}return`${toBn(hd)} ${hMonths[hm-1]} ${toBn(hy)} হিজরি`}
function greet(h){return h<5?'শুভ রাত্রি—আপন ভুবনে স্বাগতম':h<12?'শুভ সকাল—আপনার দিনটি ভালো কাটুক':h<17?'শুভ দুপুর—আপনার দিনটি সুন্দর কাটুক':h<20?'শুভ সন্ধ্যা—আপন ভুবনে স্বাগতম':'শুভ রাত্রি—আপন ভুবনে স্বাগতম'}

function accountHtml(u){if(!u)return `<section class="bd10-card bd10-account"><div class="bd10-avatar">○</div><strong>অতিথি পাঠক</strong><small>লিখতে ও প্রতিক্রিয়া জানাতে প্রবেশ করুন</small><div class="bd10-grid2"><a class="bd10-btn primary" href="login.html">লগইন</a><a class="bd10-btn" href="register.html">নিবন্ধন</a></div></section>`;const name=u.name||u.display_name||u.username||'আপনার প্রোফাইল',av=u.avatar||u.avatar_url||u.photo||'';return `<section class="bd10-card bd10-account"><div class="bd10-avatar">${av?`<img src="${esc(av)}" alt="">`:'○'}</div><strong>${esc(name)}</strong><small>আপনি লগইন করেছেন</small><div class="bd10-grid2"><a class="bd10-btn primary" href="${profileUrl(u)}">প্রোফাইল</a><button class="bd10-btn" type="button" data-bd10-logout>লগআউট</button></div></section>`}
function personalMenu(u){let items=u?[[profileUrl(u),'○','প্রোফাইল'],['edit-profile.html','✎','সম্পাদনা'],['messages.html','✉','ইনবক্স'],['notifications.html','♢','নোটিফিকেশন'],['archive.html','▣','আর্কাইভ'],['memories.html','☆','মেমোরিজ'],['settings.html','⚙','সেটিংস']]:[['login.html','○','লগইন'],['register.html','＋','রেজিস্টার']];const role=String(u?.role||'').toLowerCase();if(u&&role==='founder')items.push(['founder-dashboard.html','◇','Founder Dashboard']);if(u&&role==='admin')items.push(['admin-dashboard.html','◇','Admin Dashboard']);return `<section class="bd10-card"><div class="bd10-section-title"><h3>ব্যক্তিগত কেন্দ্র</h3><small>${u?(role==='founder'?'প্রতিষ্ঠাতা':role==='admin'?'অ্যাডমিন':'সদস্য'):'অতিথি'}</small></div><nav class="bd10-menu">${items.map(x=>`<a href="${x[0]}">${icon(x[1],x[2])}</a>`).join('')}${u?`<button type="button" data-bd10-logout>${icon('×','লগআউট')}</button>`:''}</nav></section>`}
function themeHtml(){const mode=H.getAttribute('data-theme')||'light',pal=H.getAttribute('data-glass-theme')||'pearl';return `<section class="bd10-card"><div class="bd10-section-title"><h3>গ্লাস থিম</h3><small>সরাসরি পরিবর্তন</small></div><div class="bd10-themes"><button aria-pressed="${pal==='pearl'}" data-bd10-palette="pearl">মুক্তা গ্লাস</button><button aria-pressed="${pal==='moon'}" data-bd10-palette="moon">নীল জ্যোৎস্না</button><button aria-pressed="${pal==='lavender'}" data-bd10-palette="lavender">ল্যাভেন্ডার</button><button aria-pressed="${pal==='rose'}" data-bd10-palette="rose">অরোরা গোলাপি</button></div><div class="bd10-modes"><button aria-pressed="${mode==='light'}" data-bd10-mode="light">লাইট</button><button aria-pressed="${mode==='middle'}" data-bd10-mode="middle">মিডল</button><button aria-pressed="${mode==='dark'}" data-bd10-mode="dark">ডার্ক</button></div></section>`}
function writersHtml(){const a=realActive();return `<section class="bd10-card"><div class="bd10-section-title"><h3>সক্রিয় লেখক</h3><small>সবুজ বাতি</small></div><div class="bd10-writers">${a.length?a.map(x=>{const n=x.name||x.displayName||x.username||'লেখক',av=x.avatar||x.avatar_url||x.photo||'',role=String(x.role||'user').toLowerCase()==='founder'?'প্রতিষ্ঠাতা':String(x.role||'user').toLowerCase()==='admin'?'অ্যাডমিন':'লেখক';return `<a class="bd10-writer" href="${profileUrl(x)}"><span class="bd10-writer-avatar">${av?`<img src="${esc(av)}" alt="">`:esc(n).slice(0,1)}</span><span><strong>${esc(n)}</strong><small>${role}</small></span><i class="bd10-online"></i></a>`}).join(''):'<div class="bd10-empty">এই মুহূর্তে কোনো বাস্তব সক্রিয় লেখক দেখা যাচ্ছে না।</div>'}</div></section>`}
function leftContent(){const u=getUser();return `<div class="bd10-stack"><section class="bd10-card bd10-identity"><a class="bd10-logo" href="index.html" aria-label="হোম">🌿</a><h3>আপন ভুবন</h3><p>আপনার লেখা, পাঠ ও সাহিত্যিক পথচলার নিজস্ব জায়গা।</p><div class="bd10-quote">“আপনার ক্ষতগুলোকে জ্ঞানে পরিণত করুন।”</div></section>${accountHtml(u)}${personalMenu(u)}${themeHtml()}<section class="bd10-card bd10-contact"><a href="founder-profile.html">জরুরি প্রয়োজনে মাহমুদ সোহেলের সঙ্গে যোগাযোগ করুন</a><p class="bd10-small">প্রতিষ্ঠাতার প্রোফাইল ও যোগাযোগের মাধ্যম দেখুন।</p></section></div>`}
function rightContent(){const u=getUser();return `<div class="bd10-stack">${accountHtml(u)}${writersHtml()}<section class="bd10-card"><div class="bd10-section-title"><h3>সহায়তা ও আস্থা</h3><small>গুরুত্বপূর্ণ</small></div><nav class="bd10-menu"><a href="humanitarian-notice.html">${icon('♡','যাচাইকৃত মানবিক নোটিস')}</a><a href="about.html">${icon('⌂','আমাদের সম্পর্কে')}</a><a href="contact.html">${icon('□','যোগাযোগ')}</a><a href="complaint.html">${icon('⚑','অভিযোগ ও রিপোর্ট')}</a><a href="privacy-security-policy.html">${icon('♢','গোপনীয়তা ও নিরাপত্তা')}</a><a href="policy.html">${icon('≡','নীতিমালা')}</a><a href="policy.html#writing-protection">${icon('▱','লেখার সুরক্ষা')}</a></nav></section><section class="bd10-card bd10-note">সাধারণ সাহিত্যিক লেখা সরাসরি প্রকাশিত হয়। মানবিক আবেদন যাচাইয়ের পর অগ্রাধিকার পায়।</section></div>`}
function build(){if(D.getElementById('bd10LeftDrawer'))return;const back=D.createElement('div');back.id='bd10Backdrop';back.className='bd10-backdrop';back.setAttribute('aria-hidden','true');const left=D.createElement('aside');left.id='bd10LeftDrawer';left.className='bd10-drawer bd10-drawer-left';left.setAttribute('aria-label','বাম সাইডবার');left.innerHTML=`<div class="bd10-drawer-head"><span class="bd10-drawer-title"><span class="leaf">🌿</span>আপন ভুবন</span><button class="bd10-close" type="button" data-bd10-close aria-label="বন্ধ করুন">×</button></div>${leftContent()}`;const right=D.createElement('aside');right.id='bd10RightDrawer';right.className='bd10-drawer bd10-drawer-right';right.setAttribute('aria-label','ডান সাইডবার');right.innerHTML=`<div class="bd10-drawer-head"><span class="bd10-drawer-title">সহায়তা ও সক্রিয় লেখক</span><button class="bd10-close" type="button" data-bd10-close aria-label="বন্ধ করুন">×</button></div>${rightContent()}`;const lh=D.createElement('button');lh.id='bd10LeftHandle';lh.className='bd10-handle bd10-handle-left';lh.type='button';lh.textContent='›';lh.setAttribute('aria-label','বাম সাইডবার খুলুন');lh.dataset.bd10Open='left';const rh=D.createElement('button');rh.id='bd10RightHandle';rh.className='bd10-handle bd10-handle-right';rh.type='button';rh.textContent='‹';rh.setAttribute('aria-label','ডান সাইডবার খুলুন');rh.dataset.bd10Open='right';B.append(back,left,right,lh,rh)}
function close(){D.getElementById('bd10LeftDrawer')?.classList.remove('is-open');D.getElementById('bd10RightDrawer')?.classList.remove('is-open');D.getElementById('bd10Backdrop')?.classList.remove('is-open');B.classList.remove('bd10-lock')}
function open(side){close();D.getElementById(side==='right'?'bd10RightDrawer':'bd10LeftDrawer')?.classList.add('is-open');D.getElementById('bd10Backdrop')?.classList.add('is-open');B.classList.add('bd10-lock')}
function sync(){const mode=H.getAttribute('data-theme')||'light',pal=H.getAttribute('data-glass-theme')||'pearl';D.querySelectorAll('[data-bd10-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.bd10Mode===mode)));D.querySelectorAll('[data-bd10-palette]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.bd10Palette===pal)))}
function hidePrivate(){const logged=!!getUser(),privateFiles=new Set(['notifications.html','messages.html','settings.html','archive.html','memories.html']);D.querySelectorAll('.header-actions a[href],.quickbar a[href],.topnav a[href]').forEach(a=>{const f=(a.getAttribute('href')||'').split('?')[0].replace(/^\.\//,'');if(privateFiles.has(f))a.style.display=logged?'':'none'});if(!logged)D.querySelectorAll('.unread-badge,.notification-count,.message-count,[data-unread]').forEach(x=>x.remove())}
function refresh(){D.getElementById('bd10LeftDrawer')?.querySelector('.bd10-drawer-head')?.insertAdjacentHTML('afterend','');const l=D.getElementById('bd10LeftDrawer'),r=D.getElementById('bd10RightDrawer');if(l){const head=l.querySelector('.bd10-drawer-head');l.querySelectorAll(':scope > .bd10-stack').forEach(x=>x.remove());head.insertAdjacentHTML('afterend',leftContent())}if(r){const head=r.querySelector('.bd10-drawer-head');r.querySelectorAll(':scope > .bd10-stack').forEach(x=>x.remove());head.insertAdjacentHTML('afterend',rightContent())}sync();hidePrivate()}
function init(){build();sync();hidePrivate();if(location.pathname.endsWith('madhyorater-prolap.html'))H.setAttribute('data-page','midnight')}
D.addEventListener('click',async e=>{const h=e.target.closest('[data-bd10-open]');if(h){e.preventDefault();e.stopPropagation();open(h.dataset.bd10Open);return}if(e.target.closest('[data-bd10-close]')||e.target.id==='bd10Backdrop'){e.preventDefault();e.stopPropagation();close();return}const m=e.target.closest('[data-bd10-mode]');if(m){e.preventDefault();e.stopPropagation();H.setAttribute('data-theme',m.dataset.bd10Mode);localStorage.setItem('bhubondangaTheme',m.dataset.bd10Mode);sync();return}const p=e.target.closest('[data-bd10-palette]');if(p){e.preventDefault();e.stopPropagation();H.setAttribute('data-glass-theme',p.dataset.bd10Palette);localStorage.setItem('bhubondangaGlassTheme',p.dataset.bd10Palette);sync();return}if(e.target.closest('[data-bd10-logout]')){e.preventDefault();e.stopPropagation();try{await window.BhubondangaAuth?.signOut?.()}catch(_){}['bhubondangaCurrentUser','bhubondangaSessionUser','bhubondangaAuthSession'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='login.html';return}if(e.target.closest('.bd10-drawer a'))close()},true);
D.addEventListener('keydown',e=>{if(e.key==='Escape')close()});D.addEventListener('contextmenu',e=>e.preventDefault(),{capture:true});D.addEventListener('dragstart',e=>{if(e.target instanceof HTMLImageElement)e.preventDefault()},{capture:true});
H.setAttribute('data-theme',localStorage.getItem('bhubondangaTheme')||H.getAttribute('data-theme')||'light');H.setAttribute('data-glass-theme',localStorage.getItem('bhubondangaGlassTheme')||H.getAttribute('data-glass-theme')||'pearl');init();
D.addEventListener('DOMContentLoaded',()=>{init();setTimeout(refresh,0);setTimeout(refresh,350)},{once:true});window.addEventListener('pageshow',()=>setTimeout(refresh,50));
window.BhubondangaMobileShellV10={open,close,refresh};
try{window.BhubondangaAuth?.current?.().then(info=>{if(info?.legacyUser)refresh()}).catch(()=>{})}catch(_){ }
})();
</script>
</body></html>
