<style>

}

.rail,.center{min-height:0}.rail{overflow:auto;scrollbar-width:none}.rail::-webkit-scrollbar,.center::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.center{overflow-y:auto;scrollbar-width:none;padding:0 2px 80px;overscroll-behavior:contain}
.card{border:1px solid rgba(128,109,187,.16);border-radius:var(--r);background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(250,248,255,.90));box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(125%);-webkit-backdrop-filter:blur(22px) saturate(125%)}

/* CENTER HEADER */
.profile-bar{height:56px;margin-bottom:0;padding:0 15px;display:flex;align-items:center;gap:12px;border-radius:18px 18px 0 0;border-bottom:0;position:relative;z-index:5}.bar-home{width:38px;height:38px;border:0;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow2)}.profile-bar h1{font-size:21px;margin:0}.bar-actions{margin-left:auto;display:flex;gap:8px}.circle{width:38px;height:38px;border:0;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow2);position:relative}.circle:hover,.btn:hover,.post-btn:hover{transform:translateY(-2px)}

.hero-info{background:#fff;padding:0 20px 16px;position:relative}.identity-row{display:grid;grid-template-columns:190px 1fr;gap:12px;min-height:150px}.avatar-slot{position:relative}.avatar-main{position:absolute;top:-82px;left:0;width:174px;height:174px;border:6px solid #fff;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#6732ef,#a75be7);box-shadow:0 10px 26px rgba(61,38,117,.18);display:grid;place-items:center;color:#fff;font-size:54px;font-weight:800;cursor:pointer;z-index:3}.avatar-main img{width:100%;height:100%;object-fit:cover}.role-badge{position:absolute;top:75px;left:51px;z-index:4;padding:5px 13px;border-radius:99px;background:linear-gradient(135deg,#7b3fff,#a34ce3);color:#fff;font-size:12px;font-weight:700;box-shadow:0 4px 12px rgba(97,55,190,.22)}.role-badge.admin{background:linear-gradient(135deg,#247bea,#29a2e9)}.identity{padding-top:16px;min-width:0}.name-place{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.name-place h2{font-family:"Anek Bangla","Noto Sans Bengali",sans-serif;margin:0;font-size:32px;line-height:1.15;font-weight:800;color:#1b3152}.place{font-size:12px;color:#718096;white-space:nowrap}.bio{margin:10px 0 0;font-size:15px;line-height:1.6;color:#3b4b64;min-height:24px;cursor:default}.bio.owner{cursor:text}.bio[contenteditable="true"]{outline:2px solid rgba(116,64,239,.22);border-radius:8px;padding:5px 8px;background:#faf8ff}.bio-hint{display:none;font-size:10px;color:#a19aac;margin-top:2px}.identity:hover .bio-hint.owner{display:block}.primary-actions{display:flex;gap:10px;align-items:center;margin-top:12px}.btn{min-height:44px;padding:0 18px;border:1px solid #e4deef;border-radius:10px;background:#fff;font-weight:700;font-size:14px;transition:.16s;box-shadow:0 4px 10px rgba(61,43,119,.04)}.btn.primary{border-color:transparent;background:linear-gradient(135deg,#6637e5,#9c55ee);color:#fff}.btn.blue{border-color:transparent;background:linear-gradient(135deg,#3978ea,#225ff0);color:#fff}.btn.icon-only{width:50px;padding:0;font-size:20px}.quick-counts{display:none}.menu-pop{position:absolute;right:16px;top:100%;z-index:50;width:230px;padding:8px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 18px 45px rgba(37,30,81,.16)}.menu-pop a,.menu-pop button{width:100%;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:transparent;text-align:left}.menu-pop a:hover,.menu-pop button:hover{background:#f5f1ff}.menu-pop .danger{color:#d54554}
/* tabs */
.tabs{margin:12px 0;padding:0 8px;height:58px;display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap}.tabs button{height:100%;padding:0 18px;border:0;background:transparent;font-weight:800;color:#263b5c;position:relative}.tabs button.active{color:#7142e9}.tabs button.active:after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:99px;background:#7a43f0}

.feed{display:grid;gap:12px}.post{padding:14px;overflow:visible}.post.poem.template-cream{background:linear-gradient(145deg,#fffdf5,#fffaf0 55%,#fff)}.post.poem.template-pearl{background:linear-gradient(145deg,#fff,#fbfaff 55%,#fff)}.post.poem.template-lavender{background:linear-gradient(145deg,#fff,#f6f0ff 68%,#fff)}.post.poem.template-mint{background:linear-gradient(145deg,#fff,#effbf4 68%,#fff)}.post.poem.template-rose{background:linear-gradient(145deg,#fff,#fff0f7 68%,#fff)}.post.poem.template-aqua{background:linear-gradient(145deg,#fff,#eefaff 68%,#fff)}.post.poem.template-aurora{background:linear-gradient(145deg,#fff,#f0f6ff 30%,#fff1fa 70%,#fff)}

er;border-bottom:1px solid #eee9f5}.social-actions button{height:36px;border:0;border-radius:8px;background:transparent;color:#53627a;font-weight:700;font-size:12px}.social-actions button:hover{background:#f6f3fb}.react-wrap{position:relative}.reaction-tray{position:absolute;left:0;bottom:43px;z-index:80;padding:6px 7px;display:flex;gap:4px;border:1px solid #e2dcec;border-radius:99px;background:#fff;box-shadow:0 14px 35px rgba(41,29,86,.19)}.reaction-choice{width:38px!important;height:38px!important;padding:0!important;border-radius:50%!important;background:#fff!important;display:grid;place-items:center;transition:.15s}.reaction-choice:hover{transform:translateY(-7px) scale(1.12)}.reaction-choice svg{width:32px;height:32px}.reaction-people{margin:7px 0;padding:8px;border-radius:10px;background:#f8f6fc;display:flex;flex-wrap:wrap;gap:6px}.reaction-people a{padding:4px 7px;border-radius:99px;background:#fff;font-size:10px;color:#3f5270}.comments-preview{padding-top:8px;display:grid;gap:7px}.comment{display:flex;gap:7px;align-items:flex-start}.comment-avatar{width:28px;height:28px;border-radius:50%;background:#e9e4f5;display:grid;place-items:center;flex:0 0 auto;font-size:10px}.comment-bubble{padding:6px 9px;border-radius:12px;background:#f3f1f7;min-width:0;font-size:11px;line-height:1.4}.comment-bubble a{font-weight:800}.comment-form{display:flex;gap:6px;margin-top:8px}.comment-form input{flex:1;height:36px;border:1px solid #e5e0ef;border-radius:999px;padding:0 12px;background:#fff}.comment-form button{width:36px;height:36px;border:0;border-radius:50%;background:#7a46ed;color:#fff}.empty-feed{padding:60px 20px;text-align:center;color:#8b94a5}.archive-list{display:grid;gap:8px;padding:14px}.archive-item{padding:10px 12px;border:1px solid #e9e3f4;border-radius:10px;background:#fff}.archive-item a{font-weight:800;color:#1d6f58}.archive-item small{display:block;color:#9097a6;margin-top:2px}
/* RIGHT */
.right-stack{display:grid;gap:12px}.right-card{padding:14px}.right-title{font-size:16px;font-weight:800;color:#30446b;margin:0 0 10px}.greeting{display:flex;align-items:center;gap:8px}.greeting strong{font-size:14px}.greeting small{display:block;color:#8991a2;font-size:10px}.leaf-box{margin-left:auto;width:42px;height:42px;border-radius:12px;background:#effcf2;display:grid;place-items:center;font-size:25px}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{padding:8px 3px;text-align:center;border-radius:10px;background:linear-gradient(145deg,#faf8ff,#fff);border:1px solid #eee9f6}.stat .sicon{font-size:20px;color:#7d56dd}.stat small{display:block;font-size:8px;color:#8c93a3}.stat strong{display:block;margin-top:2px;font-size:13px}.friends{display:flex;align-items:center}.friend-avatars{display:flex}.friend-avatars a{width:37px;height:37px;margin-right:-6px;border:3px solid #fff;border-radius:50%;overflow:hidden;background:#e8e4f2;display:grid;place-items:center;font-size:10px}.friend-avatars img{width:100%;height:100%;object-fit:cover}.more-circle{width:37px;height:37px;border:1px solid #e4dff0;border-radius:50%;display:grid;place-items:center;background:#fff;color:#6843be;font-size:10px}.view-all{width:100%;height:34px;border:1px solid #e6e1ef;border-radius:8px;background:#fff;margin-top:9px;font-weight:700}.bars{display:grid;gap:7px}.bar-row{display:grid;grid-template-columns:60px 1fr 28px;gap:6px;align-items:center;font-size:9px;color:#7f8798}.bar-bg{height:7px;border-radius:99px;background:#ece9f3;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#a876ed,#54c5bd)}.donut-wrap{display:flex;align-items:center;gap:10px;margin-top:10px}.donut{width:64px;height:64px;border-radius:50%;background:conic-gradient(#70c8bf 0 27%,#d95a91 27% 47%,#8c62ef 47% 76%,#f0bd59 76%);position:relative}.donut:after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}.story-mini{display:flex;gap:9px;al .edge-handle,.drawer-backdrop,.drawer{display:none}.toast{position:fixed;left:50%;bottom:24px;z-index:3000;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:999px;background:#173a60;color:#fff;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}

async function setReaction(id,type){if(!state.session){location.href='login.html?next='+encodeURIComponent(location.href);return}const post=$(`[data-post="${CSS.escape(String(id))}"]`),mine=(post._reactions||[]).find(x=>x.user_id===state.session.user.id);if(mine?.reaction===type){const {error}=await client.from('reactions').delete().eq('post_id',id).eq('user_id',state.session.user.id);if(error)return toast(error.message);post._reactions=post._reactions.filter(x=>x.user_id!==state.session.user.id)}else{const row={post_id:id,user_id:state.session.user.id,reaction:type};const {data,error}=await client.from('reactions').upsert(row,{onConflict:'post_id,user_id'}).select('*').single();if(error)return toast(error.message);post._reactions=[...(post._reactions||[]).filter(x=>x.user_id!==state.session.user.id),data]}post.querySelector('[data-reaction-tray]').hidden=true;renderSocial(post)}

function showPostMenu(post){const menu=post.querySelector('[data-post-menu]');$$('[data-post-menu]').forEach(x=>{if(x!==menu)x.hidden=true});menu.hidden=!menu.hidden;if(menu.hidden)return;const p=state.posts.find(x=>String(x.id)===String(post.dataset.post)),own=state.owner&&p?.author_id===state.session?.user?.id;menu.innerHTML=own?`<button data-pin>${p?.pinned?'📌 পিন সরান':'📌 পিন পোস্ট'}</button><a href="post-details.html?id=${encodeURIComponent(p?.id||'')}">↗ পোস্ট খুলুন</a><button data-delete style="color:#d34b57">🗑 পোস্ট মুছুন</button>`:`<a href="post-details.html?id=${encodeURIComponent(p?.id||'')}">↗ পোস্ট খুলুন</a><button>⚑ রিপোর্ট করুন</button>`;menu.querySelector('[data-pin]')?.addEventListener('click',async()=>{const {error}=await client.from('posts').update({pinned:!p.pinned}).eq('id',p.id).eq('author_id',state.session.user.id);if(error)return toast(error.message);p.pinned=!p.pinned;state.posts.sort((a,b)=>Number(b.pinned)-Number(a.pinned)||new Date(b.created_at)-new Date(a.created_at));renderFeed();toast(p.pinned?'পোস্ট পিন হয়েছে':'পিন সরানো হয়েছে')});menu.querySelector('[data-delete]')?.addEventListener('click',async()=>{if(!confirm('পোস্টটি মুছবেন?'))return;const {error}=await client.from('posts').update({status:'deleted'}).eq('id',p.id).eq('author_id',state.session.user.id);if(error)return toast(error.message);state.posts=state.posts.filter(x=>x.id!==p.id);renderFeed();toast('পোস্ট মুছে ফেলা হয়েছে')})}
function bindRealtime(){if(!client||!state.target?.id)return;try{state.channel=client.channel('profile-'+state.target.id).on('postgres_changes',{event:'*',schema:'public',table:'posts',filter:'author_id=eq.'+state.target.id},()=>loadPosts()).on('postgres_changes',{event:'*',schema:'public',table:'profiles',filter:'id=eq.'+state.target.id},async()=>{state.target=await getProfile(state.target.id);renderShell()}).subscribe()}catch(_){}}
function openLeftDrawer(){$('#rightDrawer').classList.remove('open');$('#leftDrawer').classList.add('open');$('#drawerBackdrop').classList.add('open')}function openRightDrawer(){$('#leftDrawer').classList.remove('open');$('#rightDrawer').classList.add('open');$('#drawerBackdrop').classList.add('open')}function closeDrawers(){$('#leftDrawer').classList.remove('open');$('#rightDrawer').classList.remove('open');$('#drawerBackdrop').classList.remove('open')}
$('#mobileMore').onclick=toggleMore;$('#mobileBack').onclick=()=>{if($('#leftDrawer').classList.contains('open')||$('#rightDrawer').classList.contains('open'))return closeDrawers();if(history.length>1)history.back();else location.href='index.html'};$('#leftHandle').onclick=openLeftDrawer;$('#rightHandle').onclick=openRightDrawer;$('#drawerBackdrop').onclick=closeDrawers;$$('[data-close-drawer]').forEach(x=>x.onclick=closeDrawers);addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawers();$('#moreMenu').hidden=true}});addEventListener('popstate',()=>{if($('#leftDrawer').classList.contains('open')||$('#rightDrawer').classList.contains('open'))closeDrawers()});
