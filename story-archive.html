<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08110f"><title>Story Archive · ভুবনডাঙ্গার কবিতা</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7fbf9,#edf5f1);color:#15251f;font-family:"Noto Sans Bengali",system-ui,sans-serif}.app{min-height:100dvh}.top{position:sticky;top:0;z-index:5;height:64px;padding:0 12px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;border-bottom:1px solid rgba(23,107,86,.12);background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.top a,.top button{width:39px;height:39px;border:1px solid rgba(23,107,86,.13);border-radius:12px;background:#fff;display:grid;place-items:center;color:#14261f;text-decoration:none;font-size:23px}.top b{text-align:center;font-size:15px}.main{width:min(760px,100%);margin:auto;padding:13px}.hero{padding:16px;border-radius:20px;background:linear-gradient(135deg,#08110f,#123b2f);color:#fff;box-shadow:0 16px 36px rgba(10,45,35,.13)}.hero h1{margin:0;font-size:20px}.hero p{margin:5px 0 0;color:#a9c8bb;font-size:9px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.story{aspect-ratio:9/14;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(145deg,#173b31,#5a7c6d);box-shadow:0 8px 24px rgba(20,57,45,.08)}.story img{width:100%;height:100%;object-fit:cover}.story span{position:absolute;left:0;right:0;bottom:0;padding:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:8px}.empty{margin-top:12px;padding:30px 15px;border:1px dashed rgba(23,107,86,.17);border-radius:17px;text-align:center;background:#fff;color:#7a8b83;font-size:9px}.empty b{display:block;color:#1e382f;font-size:14px;margin-bottom:4px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><header class="top"><a href="javascript:history.back()">‹</a><b>Story Archive</b><button type="button" id="clear">•••</button></header><main class="main"><section class="hero"><h1>আপনার পুরোনো Story</h1><p>২৪ ঘণ্টা শেষে archive হওয়া Story এখানে থাকবে। Backend bind হওয়ার আগে এই page local archive-ও দেখাতে পারবে।</p></section><section class="grid" id="grid"></section><section class="empty" id="empty"><b>এখনও archive খালি</b>Story archive হলে এখানে দেখা যাবে।</section></main></div>
<script>
(()=>{const g=document.getElementById('grid'),e=document.getElementById('empty');let a=[];try{a=JSON.parse(localStorage.getItem('bd-story-archive')||'[]');if(!Array.isArray(a))a=[]}catch(_){};function render(){g.innerHTML=a.map(x=>'<article class="story">'+(x.url?'<img src="'+String(x.url).replace(/"/g,'&quot;')+'" alt="">':'')+'<span>'+(x.caption||x.createdAt||'Archived story')+'</span></article>').join('');e.hidden=!!a.length}render();document.getElementById('clear').onclick=()=>{if(confirm('Local story archive পরিষ্কার করবেন?')){a=[];localStorage.setItem('bd-story-archive','[]');render()}}})();
</script></body></html>
