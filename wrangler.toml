name = "bhubondanga-media-ai"
main = "cloudflare-worker.js"
compatibility_date = "2026-08-20"

[vars]
ALLOWED_ORIGINS = "https://bhubondangakobita.com,https://www.bhubondangakobita.com"
ALLOW_LOCALHOST = "0"
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"
CLOUDFLARE_ACCOUNT_ID = "YOUR_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET = "bhubondanga-media"
R2_PUBLIC_BASE_URL = "https://media.bhubondangakobita.com"
CF_STREAM_CUSTOMER_CODE = "YOUR_STREAM_CUSTOMER_CODE"
OPENAI_TEXT_MODEL = "gpt-5.6"
OPENAI_IMAGE_MODEL = "gpt-image-1-mini"
OPENAI_IMAGE_QUALITY = "low"

# Encrypted secrets — never commit values:
# npx wrangler secret put OPENAI_API_KEY
# npx wrangler secret put CLOUDFLARE_API_TOKEN
# npx wrangler secret put R2_ACCESS_KEY_ID
# npx wrangler secret put R2_SECRET_ACCESS_KEY
