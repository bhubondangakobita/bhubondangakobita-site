*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Sans Bengali',sans-serif}
:root{--bg:#edf4f0;--card:#fff;--card2:#f6faf8;--ink:#102b20;--soft:#65796f;--line:rgba(18,82,57,.15);--green:#087654;--green2:#16a879;--red:#df3552;--blue:#377cda;--violet:#765be0;--amber:#c8892a;--black:#0e1411;--shadow:0 18px 48px rgba(23,61,47,.10),inset 0 1px 0 rgba(255,255,255,.8)}

body{background:radial-gradient(circle at 8% 2%,rgba(29,159,102,.10),transparent 30%),radial-gradient(circle at 92% 2%,rgba(119,82,222,.08),transparent 31%),var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a{touch-action:manipulation}
.wrap{width:min(1260px,100%);margin:auto;padding:12px 14px 50px}
.top{position:sticky;top:0;z-index:50;height:66px;display:flex;align-items:center;gap:10px;padding:0 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.logo{width:42px;height:42px;border-radius:14px;background:#075f47;color:#fff;border:2px solid rgba(255,255,255,.9);display:grid;place-items:center;font:900 11px Georgia}
.top b{font:800 17px 'Noto Serif Bengali',serif}.top small{display:block;color:var(--soft);font-size:8px;margin-top:2px}
.spacer{flex:1}.iconbtn,.btn{border:1px solid var(--line);border-radius:11px;background:var(--card2);color:var(--ink);min-height:38px;padding:0 11px;font-size:8px;font-weight:900}
.iconbtn{width:39px;padding:0;display:grid;place-items:center;font-size:17px}.btn.green{background:var(--green);color:#fff;border-color:transparent}.btn.black{background:var(--black);color:#fff;border-color:transparent}.btn.red{color:var(--red)}.btn.blue{color:var(--blue)}
.hero,.card{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.hero{padding:20px;margin-bottom:12px;background:linear-gradient(130deg,var(--card),color-mix(in srgb,var(--green) 8%,var(--card)))}
.hero h1{font:800 24px 'Noto Serif Bengali',serif;margin:0}.hero p{color:var(--soft);font-size:9px;line-height:1.7;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.card{padding:14px}.card h2,.card h3{font:800 14px 'Noto Serif Bengali',serif;margin:0 0 8px}.card p.note{color:var(--soft);font-size:8px;line-height:1.6;margin:0 0 10px}
.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:8px;font-weight:900}.input{width:100%;height:43px;border:1px solid var(--line);border-radius:11px;background:var(--card2);color:var(--ink);outline:0;padding:0 11px;font-size:9px}.input:focus,.textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 13%,transparent)}
.textarea{width:100%;min-height:95px;border:1px solid var(--line);border-radius:11px;background:var(--card2);color:var(--ink);outline:0;padding:10px 11px;font-size:9px;resize:vertical}
.plan-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.plan{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--ink);font-size:8px;font-weight:900}.plan.active{background:var(--black);color:#fff;border-color:transparent}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{min-width:90px}
.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:15px;background:var(--card2);padding:11px;min-width:0}.item-top{display:flex;gap:9px;align-items:flex-start}.brand{width:45px;height:45px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#075f47;color:#fff;font-weight:900;flex:0 0 auto}.brand img{width:100%;height:100%;object-fit:cover}
.item b{font-size:10px}.item small{display:block;color:var(--soft);font-size:7px;margin-top:3px}.item p{color:var(--soft);font-size:8px;line-height:1.55;margin:7px 0}.badge{display:inline-flex;align-items:center;min-height:23px;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--green) 12%,var(--card));color:var(--green);font-size:6.8px;font-weight:900;margin:4px 4px 0 0}.badge.red{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red)}.badge.amber{background:color-mix(in srgb,var(--amber) 13%,var(--card));color:var(--amber)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:8px 11px;font-size:8px;font-weight:900}.tab.active{background:var(--black);color:#fff;border-color:transparent}
.msg{display:grid;gap:7px}.bubble{border:1px solid var(--line);border-radius:14px;background:var(--card2);padding:10px}.bubble.me{border-left:3px solid var(--green)}.bubble.admin{border-left:3px solid var(--violet)}.bubble p{font-size:8px;line-height:1.6;margin:0}.bubble small{display:block;color:var(--soft);font-size:6.8px;margin-top:5px}.bubble img{display:block;width:min(230px,100%);max-height:240px;object-fit:contain;border-radius:10px;margin-top:7px;background:#fff}
.preview{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--card),var(--card2));padding:14px;display:flex;gap:11px;align-items:center}.preview .brand{width:62px;height:62px;border-radius:16px}.preview h3{margin:0;font-size:15px}.preview p{margin:4px 0 0;color:var(--soft);font-size:8px}
.empty{padding:26px 10px;text-align:center;color:var(--soft);font-size:9px}
.modal{position:fixed;inset:0;z-index:500;background:rgba(3,9,7,.60);display:grid;place-items:center;padding:16px;backdrop-filter:blur(5px)}.modal[hidden]{display:none}.modalbox{width:min(560px,100%);border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 28px 90px rgba(0,0,0,.38);padding:14px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h3{margin:0;font-size:13px}
.codebox{font:900 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.8px;border:1px dashed var(--green);background:color-mix(in srgb,var(--green) 8%,var(--card2));border-radius:13px;padding:14px;text-align:center;margin:10px 0;overflow-wrap:anywhere}
.toast{position:fixed;z-index:900;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;background:var(--black);color:#fff;border-radius:999px;padding:10px 14px;font-size:8px;font-weight:900;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.file-preview{min-height:46px;border:1px dashed var(--line);border-radius:11px;background:var(--card2);padding:8px;display:flex;align-items:center;gap:8px;color:var(--soft);font-size:8px}.file-preview img{width:42px;height:42px;object-fit:cover;border-radius:9px}
@media(max-width:760px){.wrap{padding:8px 8px 40px}.top{border-radius:16px;height:62px}.top b{font-size:14px}.top small{display:none}.grid,.grid3{grid-template-columns:1fr}.hero{padding:15px}.hero h1{font-size:19px}.plan-row{grid-template-columns:repeat(2,1fr)}.top .btn.link-hide{display:none}}

.pagehero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center}.pagehero .brand{width:76px;height:76px;border-radius:20px}.pagehero h1{margin:0;font:800 24px 'Noto Serif Bengali',serif}.pagehero p{margin:4px 0;color:var(--soft);font-size:9px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{border:1px solid var(--line);border-radius:13px;background:var(--card2);padding:10px}.stat span{display:block;color:var(--soft);font-size:7px}.stat b{display:block;margin-top:4px;font-size:14px}@media(max-width:700px){.pagehero{grid-template-columns:auto 1fr}.pagehero>.actions{grid-column:1/-1}.statgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<header class="top"><span class="logo">BDK</span><div><b>Verified Page Dashboard</b><small>Original brand · News publishing</small></div><span class="spacer"></span><button class="iconbtn" id="theme">◐</button><button class="btn red" id="exitPage">Page থেকে বের হন</button></header>
<section class="hero pagehero"><div class="brand" id="logo">N</div><div><h1 id="name">Page যাচাই হচ্ছে…</h1><p id="meta"></p></div><div class="actions"><a class="btn green" href="compose-box.html?category=news&as=page">নিউজ তৈরি করুন</a><a class="btn" href="index.html">News Feed</a></div></section>
<div class="grid">
<article class="card"><h2>Page Access</h2><div class="statgrid" id="stats"></div><div style="margin-top:12px" class="actions"><a class="btn" id="portal" target="_blank" rel="noopener">Official Portal</a><a class="btn" href="page-request.html">Renew / Request</a></div></article>
<article class="card"><h2>Founder / Admin Messages</h2><div class="msg" id="messages"></div></article>
</div></div><div class="toast" id="toast"></div>
<script>
(()=>{const D=document,H=D.documentElement,$=s=>D.querySelector(s),sb=window.supabase.createClient(window.BD_SUPABASE_URL,window.BD_SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});let ctx=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)};function theme(t){H.dataset.theme=t;localStorage.setItem('bd-theme',t)}theme(localStorage.getItem('bd-theme')||'dark');$('#theme').onclick=()=>{const a=['light','mid','dark'];theme(a[(a.indexOf(H.dataset.theme)+1)%3])};
$('#exitPage').onclick=()=>{sessionStorage.removeItem('bd-page-session');location.href='login.html'};
async function load(){try{const ss=(await sb.auth.getSession()).data.session;if(!ss)throw Error('Account login নেই');ctx=JSON.parse(sessionStorage.getItem('bd-page-session')||'null');if(!ctx?.page_id)throw Error('Page access session নেই');const r=await sb.rpc('get_my_page_context',{p_page_id:ctx.page_id});if(r.error)throw r.error;const x=Array.isArray(r.data)?r.data[0]:r.data;if(!x?.page_id)throw Error('Page access expired বা বন্ধ');ctx={...ctx,...x,checked_at:Date.now()};sessionStorage.setItem('bd-page-session',JSON.stringify(ctx));$('#name').textContent=x.page_name;$('#meta').textContent='@'+x.username+' · Verified News Page · '+(x.status||'active');$('#logo').innerHTML=x.logo_url?`<img src="${x.logo_url}" alt="">`:'N';$('#portal').href=x.portal_url||'#';const left=Math.max(0,Math.ceil((new Date(x.expires_at)-Date.now())/86400000));$('#stats').innerHTML=`<div class="stat"><span>Status</span><b>${x.status}</b></div><div class="stat"><span>Subscription</span><b>${left} দিন</b></div><div class="stat"><span>Username</span><b>@${x.username}</b></div><div class="stat"><span>Branding</span><b>Locked ✓</b></div>`;const m=await sb.from('access_messages').select('*').eq('recipient_user_id',ss.user.id).order('created_at',{ascending:false}).limit(25);const ms=m.error?[]:m.data||[];$('#messages').innerHTML=ms.length?ms.map(y=>`<div class="bubble admin"><p>${String(y.body||'').replace(/[<>&]/g,'')}</p>${y.media_url?`<img src="${y.media_url}" alt="">`:''}<small>${new Date(y.created_at).toLocaleString('bn-BD')}</small></div>`).join(''):'<div class="empty">কোনো নতুন message নেই।</div>'}catch(err){sessionStorage.removeItem('bd-page-session');toast(err.message||'Page access নেই');setTimeout(()=>location.href='login.html',1000)}}
load();
})();
</script></body></html>
