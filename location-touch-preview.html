function safeJSON(v,f={}){try{return JSON.parse(v)||f}catch{return f}}
function readStore(key){return safeJSON(localStorage.getItem(key)||'{}',{})}
function writeStore(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch(_){}}
function langList(){return (navigator.languages||[navigator.language||'']).join(' ').toLowerCase()}
function timezone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(_){return''}}
function countryPreset(code,area='',hint=''){
  code=String(code||'').toUpperCase();area=String(area||'');hint=String(hint||'');
  if(hint==='IN_WB'||(code==='IN'&&WB.test(area)))return {...PRESETS.IN_WB};
  if(code==='BD')return {...PRESETS.BD};
  if(code==='IN')return {...PRESETS.IN_HI};
  if(PRESETS[code])return {...PRESETS[code]};
  if(ME_CODES.has(code))return {...(PRESETS[code]||PRESETS.AE),countryCode:code,key:code};
  return {...PRESETS.INTL,countryCode:code,key:code||'INTL'};
}
function normalizeRegion(x={}){
  const code=String(x.countryCode||x.country_code||x.home_country_code||'').toUpperCase();
  const area=[x.region,x.state,x.adminArea1,x.admin_area1,x.district,x.city,x.countryName,x.country_name].filter(Boolean).join(' ');
  const hint=String(x.preset||x.key||'');
  const base=countryPreset(code,area,hint);
  return {...base,...x,key:hint==='IN_WB'?'IN_WB':(base.key||code||'INTL'),countryCode:code||base.countryCode||'',countryName:x.countryName||x.country_name||base.countryName||base.label,region:x.region||x.state||x.adminArea1||x.admin_area1||base.region||'',city:x.city||''};
}
function inferRescue(){
  const saved=readStore(RESCUE_STORE);if(saved.countryCode||saved.preset||saved.key)return normalizeRegion(saved);
  const legacy=readStore(LEGACY_OPERATIONAL_STORE);if(legacy.countryCode||legacy.preset||legacy.key)return normalizeRegion(legacy);
  const tz=timezone(),langs=langList();
  const map=[[/dubai/i,'AE'],[/riyadh/i,'SA'],[/qatar/i,'QA'],[/kuwait/i,'KW'],[/muscat/i,'OM'],[/bahrain/i,'BH'],[/dhaka/i,'BD'],[/karachi|islamabad/i,'PK'],[/jakarta/i,'ID'],[/manila/i,'PH'],[/kolkata|calcutta/i,'IN']];
  for(const [rx,code] of map)if(rx.test(tz))return normalizeRegion({countryCode:code,region:code==='IN'?'West Bengal':''});
  if(/\bur\b/.test(langs))return normalizeRegion({countryCode:'PK'});
  if(/\bid\b/.test(langs))return normalizeRegion({countryCode:'ID'});
  if(/\bfil\b|\btl\b/.test(langs))return normalizeRegion({countryCode:'PH'});
  if(/\bar\b/.test(langs))return normalizeRegion({countryCode:'AE'});
  if(/\bhi\b/.test(langs))return normalizeRegion({countryCode:'IN'});
  if(/\bbn\b/.test(langs))return normalizeRegion({countryCode:'BD'});
  return normalizeRegion({});
}
function inferHome(){
  const saved=readStore(HOME_STORE);if(saved.countryCode||saved.preset||saved.key)return normalizeRegion(saved);
  const langs=langList(),docLang=String(H.lang||'').toLowerCase();
  if(/\bbn\b/.test(langs)||docLang.startsWith('bn'))return normalizeRegion({countryCode:'BD'});
  if(/\bur\b/.test(langs))return normalizeRegion({countryCode:'PK'});
  if(/\bid\b/.test(langs))return normalizeRegion({countryCode:'ID'});
  if(/\bfil\b|\btl\b/.test(langs))return normalizeRegion({countryCode:'PH'});
  if(/\bhi\b/.test(langs))return normalizeRegion({countryCode:'IN'});
  return inferRescue();
}

function capability(){
  const bridge=W.BongDangSOSBridge||{};
  return {
    bluetooth:!!(bridge.bluetooth||navigator.bluetooth),
    lora:!!bridge.lora,
    satellite:!!bridge.satellite,
    gps:!!navigator.geolocation,
    voice:!!(navigator.mediaDevices?.getUserMedia&&W.MediaRecorder)
  };
}
function status(msg,scope=D){
  const el=scope.querySelector?.('[data-bd-sos-status]')||D.querySelector('[data-bd-sos-status]')||D.querySelector('#bdSOSStatus');
  if(el)el.textContent=msg;
  try{W.BDToast?.(msg)}catch(_){}
}
function updateSOS(root=D){
  const c=capability();
  root.querySelectorAll?.('[data-sos-tier="bluetooth"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.bluetooth?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="lora"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.lora?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="satellite"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.satellite?'ready':'bridge'));

function gps(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('GPS unavailable'));
    navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude||null,heading:p.coords.heading||null}),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:15000});
  });
}
function openDB(){
  return new Promise((resolve,reject)=>{const r=indexedDB.open(VOICE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('voice'))r.result.createObjectStore('voice',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
}
async function saveVoice(blob){
  const id='voice-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),db=await openDB();
  await new Promise((resolve,reject)=>{const t=db.transaction('voice','readwrite');t.objectStore('voice').put({id,createdAt:Date.now(),type:blob.type,size:blob.size,blob});t.oncomplete=resolve;t.onerror=()=>reject(t.error)});
  return id;
}
async function recordVoice30(scope=D){
  if(!navigator.mediaDevices?.getUserMedia||!W.MediaRecorder)throw new Error('Voice recording unsupported');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const chunks=[],rec=new MediaRecorder(stream),start=Date.now();
  rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  const done=new Promise((resolve,reject)=>{rec.onerror=e=>reject(e.error||new Error('Recorder error'));rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const id=await saveVoice(blob);localStorage.setItem('bd-sos-last-voice',id);resolve({id,blob})}});
  rec.start(500);status('Voice recording started · 30 seconds max',scope);
  const tick=setInterval(()=>{const left=Math.max(0,30-Math.floor((Date.now()-start)/1000));status(`Voice recording · ${left}s`,scope)},1000);
  const stop=()=>{clearInterval(tick);if(rec.state!=='inactive')rec.stop()};
  setTimeout(stop,30000);
  const onHide=()=>{if(D.hidden)stop()};D.addEventListener('visibilitychange',onHide,{once:true});
  const x=await done;status('30-second voice note saved for SOS relay',scope);return x;
}
async function sendNetworkSOS(payload){
  const c=getClient();if(!c?.from)return {ok:false,reason:'No network client'};
  let user=null;try{user=(await c.auth?.getUser?.()).data?.user||null}catch(_){}
  const privateEvent={
    user_id:user?.id||null,
    event_type:'life_support',
    created_at:payload.createdAt,
    operational_region:payload.region,
    gps:payload.gps||null,
    voice_ref:payload.voiceId||null,
    routing_targets:payload.routingTargets||[],
    misuse_policy_version:'bd-sos-v1',
    status:'active'
  };
  try{
    const r=await c.from('sos_emergency_events').insert(privateEvent).select('id').single();
    if(!r.error)return {ok:true,id:r.data?.id||null,via:'private_sos_queue'};
  }catch(_){}
  const common={
    author_id:user?.id||null,
    category:'sos',
    urgency:'critical',
    status:'active',
    verification_status:'unverified',
    title:payload.title,
    description:'[BongDang sos]\n'+payload.description+'\nExact GPS/voice data is kept for private rescue relay when supported.',
    country_code:payload.region.countryCode||null,
    country_name:payload.region.countryName||null,
    admin_area1:payload.region.region||null,
    district:payload.region.region||payload.region.city||'SOS',
    city:payload.region.city||null,
    address_text:'BongDang sos · private emergency routing requested',
    expires_at:new Date(Date.now()+24*3600000).toISOString()
  };
  try{
    let r=await c.from('humanitarian_requests').insert(common).select('id').single();
    if(r.error){
      const fallback={...common,category:'urgent',title:'[BongDang sos] '+common.title};
      r=await c.from('humanitarian_requests').insert(fallback).select('id').single();
    }
    if(r.error)throw r.error;
    return {ok:true,id:r.data?.id||null,via:'humanitarian_queue'};
  }catch(e){return {ok:false,reason:e.message||'Network relay failed'}}
}
async function quickSOS(scope=D){
  const button=scope.closest?.('.bd-sos-panel,.bd-sos-mini')||scope;
  status('জরুরি জীবনরক্ষা বার্তা প্রস্তুত হচ্ছে · লোকেশন নেওয়া হচ্ছে…',button);
  let g=null;try{g=await gps();status('লোকেশন পাওয়া গেছে · জরুরি বার্তা পাঠানোর চেষ্টা হচ্ছে…',button)}catch(_){status('লাইভ লোকেশন পাওয়া যায়নি · সংরক্ষিত অপারেশনাল লোকেশন ব্যবহার করা হচ্ছে…',button)}
  const op={...rescue};
  const caps=capability(),voiceId=localStorage.getItem('bd-sos-last-voice')||null;
  const payload={kind:'bongdang_sos',createdAt:new Date().toISOString(),region:op,gps:g,voiceId,
  protocols:{nearby_device:caps.bluetooth,rescue_gateway:caps.lora,remote_hardware:caps.satellite},
  routingTargets:['BongDang sos emergency queue','verified local rescue/support team','approved nearby helpers','configured emergency contacts where integrated'],
  misusePolicy:'False/prank SOS or intentional misuse may trigger a 15-day SOS suspension; repeated/serious misuse may lead to permanent SOS restriction and Founder/Admin review.',
  title:'BongDang sos · Emergency Life Support Message',
  description:'Emergency Life Support Message with location and optional voice note. Route to verified rescue/support channels when available.'};
  localStorage.setItem('bd-sos-last-payload',JSON.stringify(payload));
  let nativeResult=null;
  try{if(W.BongDangSOSBridge?.send)nativeResult=await W.BongDangSOSBridge.send(payload)}catch(_){}
  const net=await sendNetworkSOS(payload);
  const ok=!!(nativeResult?.ok||net.ok);
  status(ok?`জরুরি বার্তা রিলে হয়েছে${net.id?' · '+net.id:''}`:'বার্তা লোকালি কিউ হয়েছে — সমর্থিত নেটওয়ার্ক/রেসকিউ গেটওয়ে পাওয়া গেলে পুনরায় রিলে চেষ্টা করা যাবে',button);
  if(!ok){const q=safeJSON(localStorage.getItem('bd-sos-queue')||'[]',[]);q.push(payload);localStorage.setItem('bd-sos-queue',JSON.stringify(q.slice(-20)))}
  W.dispatchEvent(new CustomEvent('bd:sos-dispatched',{detail:{payload,nativeResult,network:net}}));
  try{navigator.vibrate?.(ok?[80,50,80]:[120,80,120])}catch(_){}
  return {ok,payload,nativeResult,network:net};
}

atar:p.avatar_url||p.avatar||x?.author_avatar||'',views:Number(x?.views_count||x?.view_count||0)||0,reactions:Number(x?.reactions_count||x?.reaction_count||0)||0,replies:Number(x?.replies_count||x?.reply_count||0)||0,visibility:String(x?.visibility||x?.privacy||'public')}}async function queryProfiles(ids){const m=new Map(),c=cli();if(!c||!ids.length)return m;try{const r=await c.from('profiles').select('*').in('id',[...new Set(ids)].slice(0,100));(r.data||[]).forEach(p=>m.set(String(p.id||p.user_id),p))}catch(_){}return m}async function storyData(){const s=await getSession(),uid=String(s?.user?.id||''),c=cli();let rows=[];if(c)try{const r=await c.from('stories').select('*').order('created_at',{ascending:false}).limit(80);if(!r.error)rows=(r.data||[]).filter(activeStory)}catch(_){}if(!rows.length){for(const key of ['bd-active-stories','bd-stories'])try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a)&&a.length){rows=a;break}}catch(_){}}let ids=rows.map(authorId).filter(Boolean),profiles=await queryProfiles(ids),all=rows.map(x=>normalizeStory(x,profiles));let friendIds=new Set();if(c&&uid)try{const r=await c.from('follows').select('*').or(`follower_id.eq.${uid},following_id.eq.${uid}`);const out=new Set(),inn=new Set();(r.data||[]).forEach(x=>{const a=String(x.follower_id||x.user_id||''),b=String(x.following_id||x.target_id||'');if(a===uid&&b)out.add(b);if(b===uid&&a)inn.add(a)});[...out].forEach(id=>inn.has(id)&&friendIds.add(id))}catch(_){}let own=all.filter(x=>x.aid===uid),friends=all.filter(x=>x.aid!==uid&&(!friendIds.size||friendIds.has(x.aid))&&x.visibility!=='private');if(isProfileVisitor()){const tid=targetId();own=all.filter(x=>x.aid===tid&&x.visibility==='public');friends=[]}return{uid,own,friends,all,profiles}}async function storyInsights(st){const c=cli();if(!c||!st?.id)return st;for(const [table,key] of [['story_views','views'],['story_reactions','reactions'],['story_replies','replies']])try{const r=await c.from(table).select('*',{count:'exact',head:true}).eq('story_id',st.id);if(!r.error&&typeof r.count==='number')st[key]=r.count}catch(_){}return st}function makePortal(){if(portal)return portal;D.body.insertAdjacentHTML('beforeend',`<div class="bd125-portal" id="bd125Portal" aria-hidden="true"><div class="bd125-gate"><div class="bd125-door left"></div><div class="bd125-door right"></div><div class="bd125-keyhole">✦</div></div><div class="bd125-scene"><div class="bd125-shell" id="bd125Shell"></div></div></div><div class="bd125-viewer" id="bd125Viewer"><div class="bd125-viewer-head"><button type="button" data-bd125-vclose>×</button><div class="bd125-viewer-author" id="bd125VAuthor"></div><button type="button" data-bd125-react>♡</button></div><div class="bd125-viewer-stage" id="bd125VStage"><div class="bd125-viewer-nav"><button type="button" data-bd125-prev aria-label="Previous"></button><button type="button" data-bd125-next aria-label="Next"></button></div></div><form class="bd125-replybar" id="bd125Reply"><input id="bd125ReplyInput" autocomplete="off" placeholder="Story-তে reply দিন…"><button>➤</button></form><div class="bd125-viewer-own" id="bd125OwnFoot" hidden><button type="button" data-bd125-insight>Insight দেখুন</button><button type="button" data-bd125-archive>Archive</button></div></div>`);portal=D.getElementById('bd125Portal');viewer=D.getElementById('bd125Viewer');D.querySelector('[data-bd125-vclose]').onclick=closeViewer;D.querySelector('[data-bd125-prev]').onclick=()=>openViewer(viewerIndex-1);D.querySelector('[data-bd125-next]').onclick=()=>openViewer(viewerIndex+1);D.getElementById('bd125Reply').onsubmit=replyStory;D.querySelector('[data-bd125-react]').onclick=reactStory;D.querySelector('[data-bd125-archive]').onclick=()=>location.href='story-archive.html';return portal}function openGate(){makePortal();portal.classList.add('open');portal.setAttribute('aria-hidden','false');D.documentElement.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>portal.classList.add('ready')))}function closeGate(){if(!portal)return;portal.classList.remove('ready');setTimeout(()=>{portal.classList.remove('open');portal.setAttribute('aria-hidden','true');D.documentElement.style.overflow=''},420)}function topbar(mode,visitor){return `<div class="bd125-top"><button class="bd125-close" type="button" data-bd125-close>×</button><div><h2>${mode==='story'?'Story Touch':'Magic Touch'}</h2><p>${visitor?'Public view · নিরাপদ অংশগুলোই দেখা যাচ্ছে':'গোপন দরজা · আপনার নিজের নিয়ন্ত্রণ'}</p></div>${visitor?'':`<button class="bd125-switch" type="button" data-bd125-switch="${mode==='story'?'magic':'story'}">${mode==='story'?'✦ Magic Touch':'◉ Story Touch'}</button>`}</div>`}function storyCard(st,i){const m=st.media,video=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(m)||String(st.raw?.media_type||'').includes('video');return `<button class="bd125-story-card" type="button" data-bd125-story="${i}">${m?(video?`<video muted playsinline preload="metadata" src="${esc(m)}"></video>`:`<img loading="lazy" src="${esc(m)}" alt="">`):`<span class="bd125-story-fallback">${esc(st.caption||'Story')}</span>`}<span class="bd125-ring"><span>${st.avatar?`<img src="${esc(st.avatar)}" alt="">`:esc(st.name[0]||'ভ')}</span></span><span class="bd125-story-meta"><b>${esc(st.name)}</b><small>${esc(st.caption||'Story')}</small></span></button>`}async function renderStory(){openGate();const shell=D.getElementById('bd125Shell'),visitor=isProfileVisitor();shell.innerHTML=topbar('story',visitor)+`<section class="bd125-hero"><h1>গোপন Story দরজা</h1><p>দুই দরজা খুলে আপনার Story, Insight এবং বন্ধুদের Story ধীরে চলতে থাকবে। যেটি দেখতে চান, সেটিতে ট্যাপ করুন।</p><span class="bd125-privacy-chip">◉ Story privacy অনুসারে দৃশ্যমান</span></section><div class="bd125-empty"><b>Story প্রস্তুত হচ্ছে…</b>এক মুহূর্ত অপেক্ষা করুন</div>`;wireShell();const d=await storyData();let own=d.own[0]||null;if(own)own=await storyInsights(own);storyList=visitor?d.own:[...d.friends];const ownHtml=own?`<div class="bd125-own"><article class="bd125-own-card"><div class="bd125-own-media">${own.media?(`<img src="${esc(own.media)}" alt="">`):'আপনার Story'}</div><div class="bd125-own-copy"><b>${visitor?esc(own.name):'আপনার বর্তমান Story'}</b><p>${esc(own.caption||'২৪ ঘণ্টার Story')}</p><div class="bd125-own-actions">${visitor?'':`<button class="bd125-pill" type="button" data-bd125-own-open>Story খুলুন</button><button class="bd125-pill" type="button" onclick="location.href='story-archive.html'">Archive</button>`}</div></div></article>${visitor?'':`<aside class="bd125-insight"><div class="bd125-insight-grid"><div class="bd125-stat"><b>${own.views}</b><small>Views</small></div><div class="bd125-stat"><b>${own.reactions}</b><small>Reactions</small></div><div class="bd125-stat"><b>${own.replies}</b><small>Replies</small></div></div><a href="story-archive.html">Story Insight & Archive</a></aside>`}</div>`:`<div class="bd125-own-card"><div class="bd125-own-media">＋</div><div class="bd125-own-copy"><b>${visitor?'Public Story নেই':'এখন কোনো সক্রিয় Story নেই'}</b><p>${visitor?'এই সদস্য বর্তমানে কোনো public Story দেননি।':'নতুন Story দিলে এখানে নিজের Story ও Insight দেখা যাবে।'}</p>${visitor?'':`<div class="bd125-own-actions"><button class="bd125-pill" onclick="location.href='profile.html#story'">Story দিন</button><button class="bd125-pill" onclick="location.href='story-archive.html'">Archive</button></div>`}</div></div>`;const train=visitor?'':`<section class="bd125-section"><div class="bd125-head"><div><b>বন্ধুদের Story ট্রেন</b><small>Medium-slow · ট্যাপ করলে থামবে ও খুলবে</small></div><small>${storyList.length} Story</small></div><div class="bd125-story-window" id="bd125StoryWindow">${storyList.length?`<div class="bd125-story-track">${storyList.map(storyCard).join('')}${storyList.length>1?storyList.map(storyCard).join(''):''}</div>`:`<div class="bd125-empty"><b>বন্ধুদের সক্রিয় Story নেই</b>Story এলে এখানে ধীরে ধীরে চলবে।</div>`}</div></section>`;shell.innerHTML=topbar('story',visitor)+`<section class="bd125-hero"><h1>গোপন Story দরজা</h1><p>${visitor?'এই সদস্যের public Story এখানে দেখা যাবে।':'নিজের Story নিচে, Insight পাশে, আর বন্ধুদের Story ধীরে ধীরে এক দিক থেকে অন্য দিকে চলবে।'}</p><span class="bd125-privacy-chip">◉ ${visitor?'Public Story':'Story Touch'}</span></section><section class="bd125-section"><div class="bd125-head"><div><b>${visitor?'Story':'আপনার Story'}</b><small>${visitor?'Public view':'Views · Reaction · Reply Insight'}</small></div></div>${ownHtml}</section>${train}`;wireShell();if(own&&!visitor){const btn=shell.querySelector('[data-bd125-own-open]');if(btn)btn.onclick=()=>{storyList=[own,...d.friends];openViewer(0)}}shell.querySelectorAll('[data-bd125-story]').forEach(b=>b.onclick=()=>openViewer(Number(b.dataset.bd125Story)%Math.max(1,d.friends.length)))}function magicItems(role,visitor){if(visitor)return[{i:'◎',t:'Friend Circle',s:'Public বন্ধু ও পরিচিতি',h:'#friends-public'},{i:'★',t:'প্রিয় লেখক',s:'Public করা প্রিয় লেখক',h:'favorite-authors.html'},{i:'◉',t:'Story Touch',s:'Public Story',h:'#story-touch'},{i:'ⓘ',t:'About / কবি পরিচিতি',s:'পরিচিতি ও সাহিত্যিক তথ্য',h:'#about-public'}];const common=[{i:'◎',t:'Friend Circle',s:'বন্ধু ও পারস্পরিক সংযোগ',h:'profile.html?friends=1',pub:true},{i:'✎',t:'Edit Profile',s:'নাম, Bio ও পরিচিতি',h:'edit-profile.html',lock:true},{i:'▥',t:'My Dashboard',s:'নিজস্ব Activity overview',h:'profile.html#dashboard',lock:true},{i:'☷',t:'Activity Log',s:'আপনার সাম্প্রতিক কার্যক্রম',h:'activity-log.html',lock:true},{i:'⊘',t:'Block List',s:'ব্লক করা অ্যাকাউন্ট',h:'settings.html#blocked',lock:true},{i:'⌁',t:'Password Change',s:'পাসওয়ার্ড ও নিরাপত্তা',h:'settings.html#password',lock:true},{i:'◌',t:'Personal Details',s:'ব্যক্তিগত তথ্য',h:'edit-profile.html#details',lock:true},{i:'⚙',t:'Settings',s:'Privacy, notification, account',h:'settings.html',lock:true},{i:'★',t:'প্রিয় লেখক',s:'আপনার পছন্দের লেখক',h:'favorite-authors.html',pub:true},{i:'▣',t:'Saved',s:'সংরক্ষিত পোস্ট',h:'archive.html?tab=saved',pub:true},{i:'▤',t:'Archive',s:'পুরোনো পোস্ট ও archive',h:'archive.html',pub:true},{i:'◷',t:'Memories',s:'পুরোনো স্মৃতি',h:'memories.html',pub:true},{i:'ⓘ',t:'About / কবি পরিচিতি',s:'সাহিত্যিক পরিচয়',h:'profile.html?tab=about',pub:true}];if(role==='founder')common.splice(3,0,{i:'◆',t:'Founder Dashboard',s:'Founder control center',h:'founder-dashboard.html',lock:true},{i:'▣',t:'Page Access',s:'Page ও publication access',h:'page.html?page=bhubondangar-barta',lock:true},{i:'✦',t:'Creator Center',s:'Creator ও Page tools',h:'creator-command-center.html',lock:true});if(role==='admin')common.splice(3,0,{i:'◆',t:'Admin Dashboard',s:'Admin control center',h:'admin-dashboard.html',lock:true},{i:'⚑',t:'Moderation Review',s:'Report ও review queue',h:'admin-dashboard.html#moderation',lock:true},{i:'⚙',t:'Access Control',s:'Role ও নিরাপত্তা',h:'access-control.html',lock:true});return common}async function renderMagic(){openGate();const s=await getSession(),role=roleOf(s),visitor=isProfileVisitor(),uid=visitor?targetId():String(s?.user?.id||'');let p=readPrivacy(uid);if(visitor){const c=cli();try{const r=await c?.from('profiles').select('*').eq('id',uid).maybeSingle();if(r?.data?.magic_visibility)p=Object.assign(p,r.data.magic_visibility)}catch(_){}}const items=magicItems(role,visitor).filter(x=>!visitor||((x.t==='Friend Circle'&&p.friends==='public')||(x.t==='প্রিয় লেখক'&&p.authors==='public')||x.t==='Story Touch'||x.t.startsWith('About')));const shell=D.getElementById('bd125Shell');shell.innerHTML=topbar('magic',visitor)+`<section class="bd125-hero"><h1>${visitor?'Public Magic Touch':'Magic Touch · আপনার গোপন দরজা'}</h1><p>${visitor?'এই সদস্য যেগুলো public রেখেছেন শুধু সেগুলোই দেখা যাবে।':'Role অনুযায়ী দরকারি টুল, সংগ্রহ, Privacy এবং ব্যক্তিগত নিয়ন্ত্রণ এক দরজায়। Password, settings ও personal details কখনো public হবে না।'}</p><span class="bd125-privacy-chip">✦ ${visitor?'Public-safe view':esc(role.toUpperCase())+' role access'}</span></section><section class="bd125-section"><div class="bd125-head"><div><b>Magic Tools</b><small>${items.length}টি প্রয়োজনীয় পথ</small></div></div><div class="bd125-magic-grid">${items.map((x,i)=>`<a class="bd125-magic-card" href="${x.h}" data-bd125-magic-link><span class="bd125-magic-ico">${x.i}</span><span><b>${x.t}</b><small>${x.s}</small></span>${x.lock?'<span class="bd125-lock">PRIVATE</span>':x.pub?'<span class="bd125-lock">OPTIONAL PUBLIC</span>':''}</a>`).join('')}</div></section>${visitor?'':privacyPanel(p)+feedbackPanel()}</div>`;wireShell();if(!visitor)wirePrivacy(uid,p);shell.querySelectorAll('a[href="#story-touch"]').forEach(a=>a.onclick=e=>{e.preventDefault();renderStory()})}function privacyPanel(p){return `<section class="bd125-private-card"><div class="bd125-head"><div><b>কি দেখাবেন</b><small>Public / Friends / Private</small></div></div><div class="bd125-privacy-row"><span><b>Story</b><small>Story Touch-এ কারা দেখবে</small></span><select data-bd125-privacy="story"><option value="public" ${p.story==='public'?'selected':''}>Public</option><option value="friends" ${p.story==='friends'?'selected':''}>Friends</option><option value="private" ${p.story==='private'?'selected':''}>Private</option></select></div><div class="bd125-privacy-row"><span><b>Friend Circle</b><small>Magic Touch public view</small></span><select data-bd125-privacy="friends"><option value="public" ${p.friends==='public'?'selected':''}>Public</option><option value="private" ${p.friends!=='public'?'selected':''}>Private</option></select></div><div class="bd125-privacy-row"><span><b>প্রিয় লেখক</b><small>পছন্দের লেখক দেখাবেন কি না</small></span><select data-bd125-privacy="authors"><option value="public" ${p.authors==='public'?'selected':''}>Public</option><option value="private" ${p.authors!=='public'?'selected':''}>Private</option></select></div><div class="bd125-privacy-row"><span><b>Saved / Archive</b><small>ব্যক্তিগত সংগ্রহ</small></span><span class="bd125-private-fixed">PRIVATE DEFAULT</span></div><div class="bd125-privacy-row"><span><b>Password / Settings / Personal Details</b><small>কখনো public নয়</small></span><span class="bd125-private-fixed">ALWAYS PRIVATE</span></div></section>`}function feedbackPanel(){return `<section class="bd125-feedback"><div class="bd125-head"><div><b>কী উন্নত করা যায়?</b><small>আপনার review সরাসরি Founder-এর কাছে যাবে</small></div></div><textarea id="bd125Feedback" placeholder="ভুবনডাঙ্গাকে আরও ভালো করতে আপনার পরামর্শ লিখুন…"></textarea><button type="button" id="bd125FeedbackSend">Founder-কে পাঠান</button><span class="bd125-status" id="bd125FeedbackStatus"></span></section>`}function wirePrivacy(uid,p){D.querySelectorAll('[data-bd125-privacy]').forEach(sel=>sel.onchange=async()=>{p[sel.dataset.bd125Privacy]=sel.value;await savePrivacy(uid,p)});const b=D.getElementById('bd125FeedbackSend');if(b)b.onclick=sendFeedback}function wireShell(){D.querySelectorAll('[data-bd125-close]').forEach(b=>b.onclick=closeGate);D.querySelectorAll('[data-bd125-switch]').forEach(b=>b.onclick=()=>b.dataset.bd125Switch==='story'?renderStory():renderMagic())}async function openViewer(i){if(!storyList.length)return;makePortal();viewerIndex=(i+storyList.length)%storyList.length;const st=storyList[viewerIndex],stage=D.getElementById('bd125VStage'),m=st.media,video=/\.(mp4|webm|mov|m4v)(\?|$)/i.test(m)||String(st.raw?.media_type||'').includes('video');D.getElementById('bd125VAuthor').innerHTML=`<b>${esc(st.name)}</b><small>${esc(st.caption||'Story')}</small>`;stage.querySelectorAll('img,video,.bd125-viewer-text').forEach(x=>x.remove());const nav=stage.querySelector('.bd125-viewer-nav');if(m)nav.insertAdjacentHTML('beforebegin',video?`<video src="${esc(m)}" autoplay muted playsinline controls></video>`:`<img src="${esc(m)}" alt="">`);else nav.insertAdjacentHTML('beforebegin',`<div class="bd125-viewer-text">${esc(st.caption||'Story')}</div>`);const s=await getSession(),own=String(s?.user?.id||'')===st.aid;D.getElementById('bd125Reply').hidden=own;D.getElementById('bd125OwnFoot').hidden=!own;viewer.classList.add('open');D.getElementById('bd125ReplyInput').value=''}function closeViewer(){viewer?.classList.remove('open')}async function replyStory(e){e.preventDefault();const st=storyList[viewerIndex],input=D.getElementById('bd125ReplyInput'),body=input.value.trim();if(!body)return;const s=await getSession(),c=cli(),sender=String(s?.user?.id||'');let ok=false;if(c&&sender&&st?.aid)for(const row of [{sender_id:sender,recipient_id:st.aid,body,story_id:st.id,type:'story_reply',created_at:new Date().toISOString()},{from_user_id:sender,to_user_id:st.aid,message:body,story_id:st.id},{sender_id:sender,receiver_id:st.aid,content:body,type:'story_reply'}])try{const r=await c.from('messages').insert(row);if(!r.error){ok=true;break}}catch(_){}if(!ok)try{localStorage.setItem('bd-pending-story-reply',JSON.stringify({to:st.aid,story:st.id,body,at:Date.now()}));ok=true}catch(_){}input.value='';input.placeholder=ok?'Reply পাঠানো হয়েছে ✓':'Messages-এ পাঠাতে খুলুন';if(!ok)location.href=`messages.html?to=${encodeURIComponent(st.aid)}&story=${encodeURIComponent(st.id)}`}async function reactStory(){const st=storyList[viewerIndex],s=await getSession(),c=cli(),uid=String(s?.user?.id||'');if(!uid||!st)return;const b=D.querySelector('[data-bd125-react]');b.textContent='♥';if(c)try{await c.from('story_reactions').upsert({story_id:st.id,user_id:uid,reaction:'love'},{onConflict:'story_id,user_id'})}catch(_){}}async function sendFeedback(){const t=D.getElementById('bd125Feedback'),st=D.getElementById('bd125FeedbackStatus'),body=t?.value.trim();if(!body)return;st.textContent='পাঠানো হচ্ছে…';const s=await getSession(),c=cli(),uid=String(s?.user?.id||''),name=s?.user?.user_metadata?.full_name||s?.user?.email||'একজন সদস্য';let founder='';if(c)try{const r=await c.from('user_roles').select('*').eq('role','founder').eq('active',true).limit(1);founder=String(r.data?.[0]?.user_id||'')}catch(_){}if(!founder&&c)try{const r=await c.from('profiles').select('*').eq('role','founder').limit(1);founder=String(r.data?.[0]?.id||'')}catch(_){}let ok=false;if(c&&founder)for(const row of [{sender_id:uid,recipient_id:founder,body:'[Magic Touch Review] '+body,type:'feedback',created_at:new Date().toISOString()},{from_user_id:uid,to_user_id:founder,message:'[Magic Touch Review] '+body}])try{const r=await c.from('messages').insert(row);if(!r.error){ok=true;break}}catch(_){}if(!ok&&c&&founder)try{const r=await c.from('notifications').insert({recipient_id:founder,actor_id:uid,type:'feedback',title:'Magic Touch Review',message:`${name}: ${body}`,url:'founder-dashboard.html#feedback',created_at:new Date().toISOString()});ok=!r.error}catch(_){}if(!ok)try{const q=JSON.parse(localStorage.getItem('bd-founder-feedback-queue')||'[]');q.push({uid,name,body,at:Date.now()});localStorage.setItem('bd-founder-feedback-queue',JSON.stringify(q.slice(-50)));ok=true}catch(_){}st.textContent=ok?'Founder-এর কাছে পাঠানো হয়েছে ✓':'পাঠানো যায়নি';if(ok)t.value=''}D.addEventListener('click',e=>{const a=e.target.closest?.('.bd-side-row[href="#story-touch"],.bd-side-row[href="#magic-touch"]');if(!a)return;e.preventDefault();try{W.BD_MODULES?.sidebars?.closeDrawers?.()}catch(_){}a.getAttribute('href')==='#story-touch'?renderStory():renderMagic()},true);D.addEventListener('keydown',e=>{if(e.key==='Escape'){if(viewer?.classList.contains('open'))closeViewer();else if(portal?.classList.contains('open'))closeGate()}});W.BD_SECRET_TOUCH={story:renderStory,magic:renderMagic,close:closeGate};})();

const en={title:'Your Location Touch',eyebrow:'BONGDANG EMERGENCY RELAY',where:'Where you are now',gps:'GPS / Current position',map:'Nearby rescue & route',voice:'GPS-style voice direction',voiceSub:'Hear route guidance in My Language',received:'Phones received',approved:'Approved',rescue:'Rescue ACK',nearest:'Nearest help',targets:'Send to',nearUsers:'Nearby BongDang users',nearUsersSub:'BongDang app/account active with emergency relay permission',rescueTeam:'Local Rescue Team',rescueTeamSub:'Verified rescue/support routing',actions:'Emergency message',voiceMsg:'30 sec voice',locationMsg:'Send location',textMsg:'Text message',credits:'Remaining Emergency Balance',send:'Send Emergency Alert',scan:'Scanning available supported transports automatically',free:'Free emergency allowance',statusReady:'Emergency relay ready',noRoute:'Live safe-route data is unavailable; the system will not guess that a road is safe.',route:'Latest verified rescue route',noBridge:'App RF/LoRa/Satellite bridge is not connected',gpsOk:'GPS acquired',gpsFail:'GPS unavailable; saved rescue location will be used',voiceOn:'Voice guidance on',voiceOff:'Voice guidance off',recording:'Recording emergency voice',recorded:'Voice clip ready (max 30 sec)',textLimit:'This plan has no text allowance',sent:'Emergency relay started',ack:'Help acknowledged—your alert has been received'};return (lang()==='en'?en:bn)[key]||key}
function region(){return W.BDRegion?.getRescueLocation?.()||read('bd-humanitarian-location',{})||{}}

function syncSidebar(){const q=quota();$$('[data-bd-location-plan]').forEach(x=>x.textContent=q.label);$$('[data-bd-location-received]').forEach(x=>x.textContent=relay.received||0);$$('[data-bd-location-approved]').forEach(x=>x.textContent=relay.approved||0);$$('[data-bd-location-rescue-ack]').forEach(x=>x.textContent=relay.rescueAck?'YES':'—');$$('[data-bd-location-touch-label]').forEach(x=>x.textContent=regionLabel())}

function voiceDirectionText(){if(relay.direction)return relay.direction;if(relay.nearest)return `${t('nearest')} ${relay.nearest}`;return t('noRoute')}
function speak(msg){if(!voiceGuideOn||!msg||!('speechSynthesis'in W))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(msg);u.lang=locale();u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}catch(_){}}
function portalHTML(){const q=quota(),r=region(),coords=(Number.isFinite(lastGPS?.lat)?`${lastGPS.lat.toFixed(5)}, ${lastGPS.lng.toFixed(5)}${lastGPS.accuracy?` · ±${Math.round(lastGPS.accuracy)}m`:''}`:(Number.isFinite(r.lat)&&Number.isFinite(r.lng)?`${(+r.lat).toFixed(5)}, ${(+r.lng).toFixed(5)}`:'GPS not captured'));
return `<section class="bd-lt-door" role="dialog" aria-modal="true" aria-label="${esc(t('title'))}">
<header class="bd-lt-head"><button class="bd-lt-back" type="button" data-bd-lt-close>‹</button><div class="bd-lt-head-copy"><small>${t('eyebrow')}</small><b>${t('title')}</b></div><span class="bd-lt-head-chip">${q.label}</span><button class="bd-lt-close" type="button" data-bd-lt-close>×</button></header>

<section class="bd-lt-card"><div class="bd-lt-card-title"><div><small>AUTOMATIC FALLBACK</small><b>${supportedTransportLabel()}</b></div><span class="state">AUTO</span></div><div class="bd-lt-transport" data-bd-lt-transports>${transportRows()}</div><div class="bd-lt-disclaimer">Supported radios are used through the BongDang native emergency bridge / approved hardware. A normal webpage cannot turn a phone into an arbitrary RF transmitter. Satellite is reserved as a paid fallback after lower-cost paths fail.</div></section>
<section class="bd-lt-card"><div class="bd-lt-card-title"><div><small>LIVE ACKNOWLEDGEMENT</small><b>${t('ack')}</b></div><span class="state ${relay.approved||relay.rescueAck?'':'red'}">${relay.approved||relay.rescueAck?'ACKNOWLEDGED':'WAITING'}</span></div><div class="bd-lt-approval-grid"><span><b data-bd-lt-received>${relay.received||0}</b><small>${t('received')}</small></span><span class="approved"><b data-bd-lt-approved>${relay.approved||0}</b><small>${t('approved')}</small></span><span class="rescue"><b data-bd-lt-rescue>${relay.rescueAck?'1':'0'}</b><small>${t('rescue')}</small></span><span><b data-bd-lt-nearest>${relay.nearest||'—'}</b><small>${t('nearest')}</small></span></div><div class="bd-lt-ack-message ${relay.approved||relay.rescueAck?'':'red'}" data-bd-lt-ack-msg>${relay.approved||relay.rescueAck?t('ack'):'No approval yet. Nearby relay can continue while RF/LoRa fallback is prepared.'}</div></section>
<section class="bd-lt-card"><div class="bd-lt-card-title"><div><small>DESTINATION</small><b>${t('targets')}</b></div><span class="state">SELECT 1–2</span></div><div class="bd-lt-targets"><label class="bd-lt-target"><input type="checkbox" data-bd-lt-target="nearby" checked><span><b>${t('nearUsers')}</b><small>${t('nearUsersSub')}</small></span></label><label class="bd-lt-target"><input type="checkbox" data-bd-lt-target="rescue" checked><span><b>${t('rescueTeam')}</b><small>${t('rescueTeamSub')}</small></span></label></div></section>
<section class="bd-lt-card"><div class="bd-lt-card-title"><div><small>VOICE · LOCATION · TEXT</small><b>${t('actions')}</b></div><span class="state">30s VOICE</span></div><div class="bd-lt-actions"><button class="bd-lt-action voice" type="button" data-bd-lt-record><span>●</span><b>${t('voiceMsg')}</b></button><button class="bd-lt-action location" type="button" data-bd-lt-send-location><span>⌖</span><b>${t('locationMsg')}</b></button><button class="bd-lt-action" type="button" data-bd-lt-text-toggle><span>✎</span><b>${t('textMsg')}</b></button></div><div class="bd-lt-textbox" data-bd-lt-textbox hidden><textarea data-bd-lt-text placeholder="Emergency message"></textarea><div class="bd-lt-text-foot"><small data-bd-lt-text-limit>${q.text.left} messages · ${q.lines||0} lines each</small><button class="bd-lt-text-send" type="button" data-bd-lt-send-text>${t('send')}</button></div></div></section>
<section class="bd-lt-card"><div class="bd-lt-card-title"><div><small>${q.label}</small><b>${t('credits')}</b></div><span class="state">NO EXPIRY UI</span></div><div class="bd-lt-quota-grid" data-bd-lt-quota>${quotaHTML()}</div><div class="bd-lt-planline"><span>${q.plan==='free'?t('free'):`${q.label} emergency allowance`} · Voice ${q.voice.max}×30s · Location ${q.location.max} · Text ${q.text.max}${q.lines?` × ${q.lines} lines`:''}</span><b>${q.label}</b></div><button class="bd-lt-send-master" type="button" data-bd-lt-send-master>${t('send')}</button><div class="bd-lt-statuslog" data-bd-lt-log>${t('statusReady')}</div></section>
</section>`}
function ensurePortal(){if(portal)return portal;portal=D.createElement('div');portal.className='bd-lt-portal';portal.id='bdLocationTouchPortal';D.body.appendChild(portal);portal.addEventListener('click',e=>{if(e.target===portal)close()});return portal}
function close(){if(!portal)return;portal.classList.remove('open');try{speechSynthesis.cancel()}catch(_){}voiceGuideOn=false;if(voiceTimer){clearInterval(voiceTimer);voiceTimer=null}}
function open(){try{W.BD_MODULES?.sidebars?.closeDrawers?.()}catch(_){}ensurePortal();portal.innerHTML=portalHTML();bindPortal();portal.classList.add('open');syncSidebar();acquireGPS();scanTransports()}
function renderDynamic(){if(!portal?.classList.contains('open'))return;const trans=$('[data-bd-lt-transports]',portal);if(trans)trans.innerHTML=transportRows();const set=(s,v)=>{const el=$(s,portal);if(el)el.textContent=v};set('[data-bd-lt-received]',relay.received||0);set('[data-bd-lt-approved]',relay.approved||0);set('[data-bd-lt-rescue]',relay.rescueAck?'1':'0');set('[data-bd-lt-nearest]',relay.nearest||'—');set('[data-bd-lt-distance]',relay.nearest||'—');set('[data-bd-lt-direction]',relay.direction||'—');set('[data-bd-lt-route]',relay.routeStatus==='verified'?t('route'):'—');const ack=$('[data-bd-lt-ack-msg]',portal);if(ack){ack.textContent=relay.approved||relay.rescueAck?t('ack'):'No approval yet. Nearby relay can continue while RF/LoRa fallback is prepared.';ack.classList.toggle('red',!(relay.approved||relay.rescueAck))}const q=$('[data-bd-lt-quota]',portal);if(q)q.innerHTML=quotaHTML();syncSidebar()}
async function acquireGPS(){const line=$('[data-bd-lt-gps-line]',portal);const b=bridge();try{let g=null;if(b?.getLocation)g=await Promise.resolve(b.getLocation());if(!g&&navigator.geolocation)g=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),reject,{enableHighAccuracy:true,timeout:5000,maximumAge:15000}));if(g&&Number.isFinite(+g.lat)){lastGPS={lat:+g.lat,lng:+g.lng,accuracy:+g.accuracy||0};if(line)line.textContent=t('gpsOk')+` · ${lastGPS.lat.toFixed(5)}, ${lastGPS.lng.toFixed(5)} · ±${Math.round(lastGPS.accuracy||0)}m`;log(t('gpsOk'));return lastGPS}}catch(_){ }if(line)line.textContent=t('gpsFail');log(t('gpsFail'));return null}
async function scanTransports(){relay.transport.internet=navigator.onLine?'ready':'failed';relay.transport.bluetooth='searching';relay.transport.rf='idle';relay.transport.lora='idle';relay.transport.satellite='idle';renderDynamic();log(t('scan'));const b=bridge();if(!b){setTimeout(()=>{relay.transport.bluetooth='failed';relay.transport.rf='failed';relay.transport.lora='failed';relay.transport.satellite='paid';renderDynamic();log(t('noBridge'))},650);return}
try{const s=await Promise.resolve(b.scanTransports?.({order:['internet','bluetooth','rf','lora','satellite'],nearbyRadiusMeters:1000,preferFree:true}));if(s?.transport)relay.transport={...relay.transport,...s.transport};if(Number.isFinite(+s?.received))relay.received=+s.received;if(Number.isFinite(+s?.approved))relay.approved=+s.approved;if(s?.rescueAck!=null)relay.rescueAck=!!s.rescueAck;if(s?.nearest)relay.nearest=String(s.nearest);if(s?.direction)relay.direction=String(s.direction);if(s?.routeStatus)relay.routeStatus=String(s.routeStatus);renderDynamic();log('Transport scan updated')}catch(e){log('Transport scan unavailable')}}
function targets(){return $$('[data-bd-lt-target]:checked',portal).map(x=>x.dataset.bdLtTarget)}
function payload(extra={}){return {id:'bd-sos-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),createdAt:new Date().toISOString(),location:lastGPS||region(),language:lang(),targets:targets(),priority:'life_support',...extra}}
async function sendThroughBridge(extra={}){const b=bridge(),p=payload(extra);log(t('sent'));relay.transport.bluetooth=relay.transport.bluetooth==='failed'?'failed':'searching';renderDynamic();if(!b?.sendEmergency){log('Native emergency bridge required for RF / LoRa / satellite transmission');return {ok:false,preview:true,payload:p}}try{const r=await Promise.resolve(b.sendEmergency(p,{fallbackOrder:['internet','bluetooth','rf','lora','satellite'],nearbyWindowMs:120000,maxLocalWindowMs:300000,satelliteOnlyAfterFallback:true}));if(r)applyProgress(r);return r}catch(e){log(e?.message||'Emergency send failed');return {ok:false,error:e}}}
function applyProgress(d={}){if(Number.isFinite(+d.received))relay.received=+d.received;if(Number.isFinite(+d.approved))relay.approved=+d.approved;if(d.rescueAck!=null)relay.rescueAck=!!d.rescueAck;if(d.nearest)relay.nearest=String(d.nearest);if(d.direction)relay.direction=String(d.direction);if(d.routeStatus)relay.routeStatus=String(d.routeStatus);if(d.transport)relay.transport={...relay.transport,...d.transport};if(d.message)log(d.message);renderDynamic();if(d.voiceDirection)speak(String(d.voiceDirection))}
async function startRecording(){const q=quota();if(q.voice.left<=0){log('No voice credit remaining');return}const btn=$('[data-bd-lt-record]',portal);if(recording){try{recorder?.stop()}catch(_){}return}const b=bridge();if(b?.recordEmergencyVoice){recording=true;btn?.classList.add('active');log(t('recording'));try{const r=await Promise.resolve(b.recordEmergencyVoice({maxSeconds:30,language:lang()}));lastVoiceBlob=r?.blob||r?.ref||null;if(r?.ok!==false&&spend('voice'))log(t('recorded'))}catch(e){log(e?.message||'Voice unavailable')}finally{recording=false;btn?.classList.remove('active');renderDynamic()}return}
if(!navigator.mediaDevices?.getUserMedia||!W.MediaRecorder){log('Voice recording requires app/native support on this device');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});recordChunks=[];recorder=new MediaRecorder(stream);recording=true;btn?.classList.add('active');log(t('recording')+' · 30s max');recorder.ondataavailable=e=>{if(e.data?.size)recordChunks.push(e.data)};recorder.onstop=()=>{stream.getTracks().forEach(x=>x.stop());lastVoiceBlob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});recording=false;btn?.classList.remove('active');if(spend('voice'))log(t('recorded'));renderDynamic()};recorder.start(500);setTimeout(()=>{if(recorder?.state!=='inactive')recorder.stop()},30000)}catch(e){recording=false;log('Microphone permission unavailable')}}
async function sendLocation(){const q=quota();if(q.location.left<=0){log('No location credit remaining');return}await acquireGPS();const r=await sendThroughBridge({kind:'location'});if(r?.ok&&spend('location'))log('Location credit used after confirmed relay');else if(!r?.ok)log('Location credit not deducted until a supported relay confirms send');renderDynamic()}
async function sendText(){const q=quota();if(q.text.left<=0){log(t('textLimit'));return}const ta=$('[data-bd-lt-text]',portal),text=String(ta?.value||'').trim();if(!text){log('Write an emergency message first');return}const lines=text.split(/\r?\n/).length;if(q.lines&&lines>q.lines){log(`Maximum ${q.lines} lines for this plan`);return}const r=await sendThroughBridge({kind:'text',text});if(r?.ok&&spend('text')){ta.value='';log('Text emergency credit used after confirmed relay')}else if(!r?.ok)log('Text credit not deducted until confirmed relay');renderDynamic()}
function toggleVoiceGuide(){voiceGuideOn=!voiceGuideOn;const b=$('[data-bd-lt-voice-guide]',portal);if(b){b.classList.toggle('on',voiceGuideOn);const i=$('i',b);if(i)i.textContent=voiceGuideOn?'ON':'OFF'}log(voiceGuideOn?t('voiceOn'):t('voiceOff'));if(voiceGuideOn){speak(voiceDirectionText());const br=bridge();try{br?.startVoiceGuidance?.({language:lang(),location:lastGPS||region(),preferSafestVerifiedRoute:true})}catch(_){}}else{try{speechSynthesis.cancel();bridge()?.stopVoiceGuidance?.()}catch(_){}}}
async function sendMaster(){const q=quota();const text=String($('[data-bd-lt-text]',portal)?.value||'').trim();const p={kind:'sos',voice:lastVoiceBlob?'attached':null,text:text||null,quota:q};await sendThroughBridge(p)}
function bindPortal(){$$('[data-bd-lt-close]',portal).forEach(b=>b.onclick=close);const vg=$('[data-bd-lt-voice-guide]',portal);if(vg)vg.onclick=toggleVoiceGuide;const rec=$('[data-bd-lt-record]',portal);if(rec)rec.onclick=startRecording;const loc=$('[data-bd-lt-send-location]',portal);if(loc)loc.onclick=sendLocation;const tt=$('[data-bd-lt-text-toggle]',portal);if(tt)tt.onclick=()=>{const box=$('[data-bd-lt-textbox]',portal);box.hidden=!box.hidden};const st=$('[data-bd-lt-send-text]',portal);if(st)st.onclick=sendText;const sm=$('[data-bd-lt-send-master]',portal);if(sm)sm.onclick=sendMaster}
D.addEventListener('click',e=>{const x=e.target.closest?.('[data-bd-open-location-touch]');if(!x)return;e.preventDefault();e.stopPropagation();open()},true);
D.addEventListener('keydown',e=>{if(e.key==='Escape'&&portal?.classList.contains('open'))close()});
W.addEventListener('bd:emergency-relay-progress',e=>applyProgress(e.detail||{}));W.addEventListener('bd:rescuechange',()=>syncSidebar());W.addEventListener('bd:sidebars-hydrated',()=>syncSidebar());
setTimeout(syncSidebar,80);
W.BongDangLocationTouch={open,close,scanTransports,sendEmergency:sendThroughBridge,applyProgress,getQuota:quota,getState:()=>JSON.parse(JSON.stringify(relay))};
})();
</script>

<script>setTimeout(()=>window.BongDangLocationTouch?.open?.(),650);</script></body></html>
