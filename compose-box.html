function safeJSON(v,f={}){try{return JSON.parse(v)||f}catch{return f}}
function readStore(key){return safeJSON(localStorage.getItem(key)||'{}',{})}
function writeStore(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch(_){}}
function langList(){return (navigator.languages||[navigator.language||'']).join(' ').toLowerCase()}
function timezone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(_){return''}}
function countryPreset(code,area='',hint=''){
  code=String(code||'').toUpperCase();area=String(area||'');hint=String(hint||'');
  if(hint==='IN_WB'||(code==='IN'&&WB.test(area)))return {...PRESETS.IN_WB};
  if(code==='BD')return {...PRESETS.BD};
  if(code==='IN')return {...PRESETS.IN_HI};
  if(PRESETS[code])return {...PRESETS[code]};
  if(ME_CODES.has(code))return {...(PRESETS[code]||PRESETS.AE),countryCode:code,key:code};
  return {...PRESETS.INTL,countryCode:code,key:code||'INTL'};
}
function normalizeRegion(x={}){
  const code=String(x.countryCode||x.country_code||x.home_country_code||'').toUpperCase();
  const area=[x.region,x.state,x.adminArea1,x.admin_area1,x.district,x.city,x.countryName,x.country_name].filter(Boolean).join(' ');
  const hint=String(x.preset||x.key||'');
  const base=countryPreset(code,area,hint);
  return {...base,...x,key:hint==='IN_WB'?'IN_WB':(base.key||code||'INTL'),countryCode:code||base.countryCode||'',countryName:x.countryName||x.country_name||base.countryName||base.label,region:x.region||x.state||x.adminArea1||x.admin_area1||base.region||'',city:x.city||''};
}
function inferRescue(){
  const saved=readStore(RESCUE_STORE);if(saved.countryCode||saved.preset||saved.key)return normalizeRegion(saved);
  const legacy=readStore(LEGACY_OPERATIONAL_STORE);if(legacy.countryCode||legacy.preset||legacy.key)return normalizeRegion(legacy);
  const tz=timezone(),langs=langList();
  const map=[[/dubai/i,'AE'],[/riyadh/i,'SA'],[/qatar/i,'QA'],[/kuwait/i,'KW'],[/muscat/i,'OM'],[/bahrain/i,'BH'],[/dhaka/i,'BD'],[/karachi|islamabad/i,'PK'],[/jakarta/i,'ID'],[/manila/i,'PH'],[/kolkata|calcutta/i,'IN']];
  for(const [rx,code] of map)if(rx.test(tz))return normalizeRegion({countryCode:code,region:code==='IN'?'West Bengal':''});
  if(/\bur\b/.test(langs))return normalizeRegion({countryCode:'PK'});
  if(/\bid\b/.test(langs))return normalizeRegion({countryCode:'ID'});
  if(/\bfil\b|\btl\b/.test(langs))return normalizeRegion({countryCode:'PH'});
  if(/\bar\b/.test(langs))return normalizeRegion({countryCode:'AE'});
  if(/\bhi\b/.test(langs))return normalizeRegion({countryCode:'IN'});
  if(/\bbn\b/.test(langs))return normalizeRegion({countryCode:'BD'});
  return normalizeRegion({});
}
function inferHome(){
  const saved=readStore(HOME_STORE);if(saved.countryCode||saved.preset||saved.key)return normalizeRegion(saved);
  const langs=langList(),docLang=String(H.lang||'').toLowerCase();
  if(/\bbn\b/.test(langs)||docLang.startsWith('bn'))return normalizeRegion({countryCode:'BD'});
  if(/\bur\b/.test(langs))return normalizeRegion({countryCode:'PK'});
  if(/\bid\b/.test(langs))return normalizeRegion({countryCode:'ID'});
  if(/\bfil\b|\btl\b/.test(langs))return normalizeRegion({countryCode:'PH'});
  if(/\bhi\b/.test(langs))return normalizeRegion({countryCode:'IN'});
  return inferRescue();
}

function translateElement(el){
  if(!el||el.nodeType!==1||isUserContent(el))return;
  if(el.matches('input,textarea')){
    let p=el.dataset.bdI18nPlaceholder;
    if(!p){const now=el.getAttribute('placeholder')||'';if(PLACEHOLDERS[now]){p=now;el.dataset.bdI18nPlaceholder=now}}

    if(!a){const now=el.getAttribute('aria-label')||'';if(TEXT[now]||TEXT_EXTRA[now]){a=now;el.dataset.bdI18nAria=now}}
    if(a)el.setAttribute('aria-label',tr(a));
    return;
  }
  if(el.matches('option,button,a,label,h1,h2,h3,strong,small,span,.bdc-prompt')&&el.children.length===0){
    let base=el.dataset.bdI18nSource;
    if(!base){const now=(el.textContent||'').trim();if(TEXT[now]||TEXT_EXTRA[now]){base=now;el.dataset.bdI18nSource=now}}
    if(base)el.textContent=tr(base);

  if(!a){const now=el.getAttribute?.('aria-label')||'';if(TEXT[now]||TEXT_EXTRA[now]){a=now;el.dataset.bdI18nAria=now}}

function capability(){
  const bridge=W.BongDangSOSBridge||{};
  return {
    bluetooth:!!(bridge.bluetooth||navigator.bluetooth),
    lora:!!bridge.lora,
    satellite:!!bridge.satellite,
    gps:!!navigator.geolocation,
    voice:!!(navigator.mediaDevices?.getUserMedia&&W.MediaRecorder)
  };
}
function status(msg,scope=D){
  const el=scope.querySelector?.('[data-bd-sos-status]')||D.querySelector('[data-bd-sos-status]')||D.querySelector('#bdSOSStatus');
  if(el)el.textContent=msg;
  try{W.BDToast?.(msg)}catch(_){}
}
function updateSOS(root=D){
  const c=capability();
  root.querySelectorAll?.('[data-sos-tier="bluetooth"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.bluetooth?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="lora"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.lora?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="satellite"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.satellite?'ready':'bridge'));
}
function gps(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('GPS unavailable'));
    navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude||null,heading:p.coords.heading||null}),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:15000});
  });
}
function openDB(){
  return new Promise((resolve,reject)=>{const r=indexedDB.open(VOICE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('voice'))r.result.createObjectStore('voice',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
}
async function saveVoice(blob){
  const id='voice-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),db=await openDB();
  await new Promise((resolve,reject)=>{const t=db.transaction('voice','readwrite');t.objectStore('voice').put({id,createdAt:Date.now(),type:blob.type,size:blob.size,blob});t.oncomplete=resolve;t.onerror=()=>reject(t.error)});
  return id;
}
async function recordVoice30(scope=D){
  if(!navigator.mediaDevices?.getUserMedia||!W.MediaRecorder)throw new Error('Voice recording unsupported');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const chunks=[],rec=new MediaRecorder(stream),start=Date.now();
  rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  const done=new Promise((resolve,reject)=>{rec.onerror=e=>reject(e.error||new Error('Recorder error'));rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const id=await saveVoice(blob);localStorage.setItem('bd-sos-last-voice',id);resolve({id,blob})}});
  rec.start(500);status('Voice recording started · 30 seconds max',scope);
  const tick=setInterval(()=>{const left=Math.max(0,30-Math.floor((Date.now()-start)/1000));status(`Voice recording · ${left}s`,scope)},1000);
  const stop=()=>{clearInterval(tick);if(rec.state!=='inactive')rec.stop()};
  setTimeout(stop,30000);
  const onHide=()=>{if(D.hidden)stop()};D.addEventListener('visibilitychange',onHide,{once:true});
  const x=await done;status('30-second voice note saved for SOS relay',scope);return x;
}
async function sendNetworkSOS(payload){
  const c=getClient();if(!c?.from)return {ok:false,reason:'No network client'};
  let user=null;try{user=(await c.auth?.getUser?.()).data?.user||null}catch(_){}
  const privateEvent={
    user_id:user?.id||null,
    event_type:'life_support',
    created_at:payload.createdAt,
    operational_region:payload.region,
    gps:payload.gps||null,
    voice_ref:payload.voiceId||null,
    routing_targets:payload.routingTargets||[],
    misuse_policy_version:'bd-sos-v1',
    status:'active'
  };
  try{
    const r=await c.from('sos_emergency_events').insert(privateEvent).select('id').single();
    if(!r.error)return {ok:true,id:r.data?.id||null,via:'private_sos_queue'};
  }catch(_){}
  const common={
    author_id:user?.id||null,
    category:'sos',
    urgency:'critical',
    status:'active',
    verification_status:'unverified',
    title:payload.title,
    description:'[BongDang sos]\n'+payload.description+'\nExact GPS/voice data is kept for private rescue relay when supported.',
    country_code:payload.region.countryCode||null,
    country_name:payload.region.countryName||null,
    admin_area1:payload.region.region||null,
    district:payload.region.region||payload.region.city||'SOS',
    city:payload.region.city||null,
    address_text:'BongDang sos · private emergency routing requested',
    expires_at:new Date(Date.now()+24*3600000).toISOString()
  };
  try{
    let r=await c.from('humanitarian_requests').insert(common).select('id').single();
    if(r.error){
      const fallback={...common,category:'urgent',title:'[BongDang sos] '+common.title};
      r=await c.from('humanitarian_requests').insert(fallback).select('id').single();
    }
    if(r.error)throw r.error;
    return {ok:true,id:r.data?.id||null,via:'humanitarian_queue'};
  }catch(e){return {ok:false,reason:e.message||'Network relay failed'}}
}
async function quickSOS(scope=D){
  const button=scope.closest?.('.bd-sos-panel,.bd-sos-mini')||scope;
  status('জরুরি জীবনরক্ষা বার্তা প্রস্তুত হচ্ছে · লোকেশন নেওয়া হচ্ছে…',button);
  let g=null;try{g=await gps();status('লোকেশন পাওয়া গেছে · জরুরি বার্তা পাঠানোর চেষ্টা হচ্ছে…',button)}catch(_){status('লাইভ লোকেশন পাওয়া যায়নি · সংরক্ষিত অপারেশনাল লোকেশন ব্যবহার করা হচ্ছে…',button)}
  const op={...rescue};
  const caps=capability(),voiceId=localStorage.getItem('bd-sos-last-voice')||null;
  const payload={kind:'bongdang_sos',createdAt:new Date().toISOString(),region:op,gps:g,voiceId,
  protocols:{nearby_device:caps.bluetooth,rescue_gateway:caps.lora,remote_hardware:caps.satellite},
  routingTargets:['BongDang sos emergency queue','verified local rescue/support team','approved nearby helpers','configured emergency contacts where integrated'],
  misusePolicy:'False/prank SOS or intentional misuse may trigger a 15-day SOS suspension; repeated/serious misuse may lead to permanent SOS restriction and Founder/Admin review.',
  title:'BongDang sos · Emergency Life Support Message',
  description:'Emergency Life Support Message with location and optional voice note. Route to verified rescue/support channels when available.'};
  localStorage.setItem('bd-sos-last-payload',JSON.stringify(payload));
  let nativeResult=null;
  try{if(W.BongDangSOSBridge?.send)nativeResult=await W.BongDangSOSBridge.send(payload)}catch(_){}
  const net=await sendNetworkSOS(payload);
  const ok=!!(nativeResult?.ok||net.ok);
  status(ok?`জরুরি বার্তা রিলে হয়েছে${net.id?' · '+net.id:''}`:'বার্তা লোকালি কিউ হয়েছে — সমর্থিত নেটওয়ার্ক/রেসকিউ গেটওয়ে পাওয়া গেলে পুনরায় রিলে চেষ্টা করা যাবে',button);
  if(!ok){const q=safeJSON(localStorage.getItem('bd-sos-queue')||'[]',[]);q.push(payload);localStorage.setItem('bd-sos-queue',JSON.stringify(q.slice(-20)))}
  W.dispatchEvent(new CustomEvent('bd:sos-dispatched',{detail:{payload,nativeResult,network:net}}));
  try{navigator.vibrate?.(ok?[80,50,80]:[120,80,120])}catch(_){}
  return {ok,payload,nativeResult,network:net};
}
D.addEventListener('click',async e=>{
  const el=e.target.closest?.('[data-bd-sos-action]');if(!el)return;
  const act=el.dataset.bdSosAction,scope=el.closest('.bd-sos-panel,.bd-sos-mini')||D;
  if(act==='send'){el.disabled=true;try{await quickSOS(scope)}finally{el.disabled=false}}
  if(act==='gps'){try{const g=await gps();localStorage.setItem('bd-sos-last-gps',JSON.stringify(g));status(`GPS ready · ${g.lat.toFixed(5)}, ${g.lng.toFixed(5)} · ±${Math.round(g.accuracy||0)}m`,scope)}catch(err){status(err.message||'GPS unavailable',scope)}}
  if(act==='record'){el.disabled=true;try{await recordVoice30(scope)}catch(err){status(err.message||'Voice unavailable',scope)}finally{el.disabled=false}}
});

function bdDeepNormalize(v){
  return String(v||"").normalize("NFKC")
    .replace(/[\u200B-\u200D\uFEFF\u2060]/g,"")
    .toLocaleLowerCase("bn-BD")
    .replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d))
    .replace(/[@4]/g,"a").replace(/[3]/g,"e").replace(/[1!|]/g,"i").replace(/[0]/g,"o").replace(/[5$]/g,"s").replace(/[7]/g,"t")
    .replace(/([a-z])\1{2,}/g,"$1$1")
    .replace(/([অ-হড়ঢ়য়])\1{2,}/g,"$1$1")
    .replace(/[^\p{L}\p{M}\p{N}]+/gu," ")
    .replace(/\s+/g," ").trim();
}
function bdDeepBadTerms(text){
  const n=bdDeepNormalize(text), words=n.split(" ").filter(Boolean), compact=n.replace(/\s+/g,""), found=[];
  for(const raw of BD_DEEP_BAD_TERMS){
    const t=bdDeepNormalize(raw), tw=t.split(" ").filter(Boolean), tc=t.replace(/\s+/g,"");
    let hit=false;
    for(let i=0;i<=words.length-tw.length;i++){
      if(tw.every((w,j)=>words[i+j]===w)){hit=true;break}
    }
    if(!hit && tc.length>=5 && compact.includes(tc))hit=true;
    if(hit)found.push(raw);
  }
  return [...new Set(found)];
}

        <div class="bdc-spectrum-dots" data-spectrum-visual="dots" hidden>${Array.from({length:22},()=>'<i></i>').join('')}</div>
        <div class="bdc-spectrum-vinyl" data-spectrum-visual="vinyl" hidden></div>
      </div></div>
      <div class="bdc-spectrum-footer">রেকর্ড করলে বা অডিও আপলোড করলে এই ভিজ্যুয়াল বুঝিয়ে দেবে যে অডিওটি সক্রিয় আছে।</div>
    </div>`;
  }
  function ensureOverlay(editor){
    const preview=$('[data-rec-preview]', editor); if(!preview) return;
    let live=$('[data-live-spectrum]', preview);
    if(!live){ preview.insertAdjacentHTML('beforeend', liveOverlayHTML()); live=$('[data-live-spectrum]', preview); }
    updateSpectrumVisual(editor);
    const hasMedia=!!$('audio,video', preview);
    editor.classList.toggle('has-recorded', hasMedia);
  }
  function selectedSpectrum(editor){ return editor.dataset.spectrumStyle || 'bars-pink'; }
  function updateSpectrumVisual(editor){
    const preview=$('[data-rec-preview]', editor); if(!preview) return;
    const live=$('[data-live-spectrum]', preview); if(!live) return;
    const id=selectedSpectrum(editor);
    const sp=SPECTRUMS.find(x=>x.id===id) || SPECTRUMS[0];
    const label=$('[data-spectrum-label]', live); if(label) label.textContent=sp.name;
    const recText=$('[data-live-rec-text]', live); if(recText) recText.textContent=editor.classList.contains('is-recording')?'LIVE · Recording':($('audio,video',preview)?'Audio Ready':'Recording Ready');
    $$('[data-spectrum-visual]', live).forEach(el=>el.hidden=true);
    const wanted=$(`[data-spectrum-visual="${sp.type}"]`, live); if(wanted) wanted.hidden=false;
    editor.dataset.spectrumVisual = sp.type;
    $$('[data-spectrum-card]', editor).forEach(btn=>btn.classList.toggle('active', btn.dataset.spectrumId===id));
  }
  function isPremium(editor){
    return premiumFromStorage() || !!($('[data-premium-strip] [data-template]', editor));
  }
  function openGate(editor, msg){
    $('[data-gate]', editor)?.classList.add('open');
    if(msg) flashToast(editor, msg);
  }
  function enhanceNews(editor){
    $$('[data-news-layout]', editor).forEach(btn=>{
      const id=btn.dataset.newsLayout; if(!id) return;
      btn.dataset.layoutType = LAYOUT_NAMES[id] || ('Layout '+id);
    });
    const arrangeBtn=$('[data-news-arrange]', editor);
    if(arrangeBtn && !arrangeBtn.parentElement.querySelector('[data-news-freehand-toggle]')){
      const b=D.createElement('button');
      b.type='button'; b.className='bdc-news-freehand-toggle'; b.setAttribute('data-news-freehand-toggle','');
      b.textContent='✥ টেক্সট & ছবি ফ্রি এডজাস্ট';
      arrangeBtn.insertAdjacentElement('afterend', b);
      b.addEventListener('click',()=>{
        const card=$('[data-news-card]', editor); if(!card) return;
        const on = card.dataset.freeNews === '1';
        card.dataset.freeNews = on ? '0' : '1';
        b.classList.toggle('active', !on);
        flashToast(editor, !on ? 'নিউজ Title/লেখা/ছবি adjust mode চালু' : 'নিউজ adjust mode বন্ধ');
      });
    }
    $$('[data-news-slot]', editor).forEach(slot=>{
      const img=$('img', slot);
      slot.classList.toggle('has-image', !!img);
      if(img && !$('[data-slot-adjust-badge]', slot)){
        const badge=D.createElement('span'); badge.className='bdc-slot-adjust-badge'; badge.setAttribute('data-slot-adjust-badge',''); badge.textContent='Drag'; slot.appendChild(badge);
      }
      if(slot.dataset.dragWired==='1') return; slot.dataset.dragWired='1';
      let dragging=false,startX=0,startY=0,ox=50,oy=50;
      slot.addEventListener('pointerdown',e=>{
        const image=$('img',slot); if(!image || !slot.closest('[data-news-card]')) return;
        dragging=true; slot.classList.add('dragging'); startX=e.clientX; startY=e.clientY;
        ox=parseFloat(slot.dataset.ox||'50'); oy=parseFloat(slot.dataset.oy||'50');
        slot.setPointerCapture?.(e.pointerId); e.preventDefault();
      }, {passive:false});
      slot.addEventListener('pointermove',e=>{
        if(!dragging) return; const image=$('img',slot); if(!image) return;
        const r=slot.getBoundingClientRect();
        const nx=Math.max(0,Math.min(100,ox + ((e.clientX-startX)/Math.max(1,r.width))*100));
        const ny=Math.max(0,Math.min(100,oy + ((e.clientY-startY)/Math.max(1,r.height))*100));
        slot.dataset.ox=nx.toFixed(2); slot.dataset.oy=ny.toFixed(2); image.style.objectPosition=`${nx}% ${ny}%`;
      }, {passive:true});
      const end=()=>{ dragging=false; slot.classList.remove('dragging'); };
      slot.addEventListener('pointerup',end); slot.addEventListener('pointercancel',end); slot.addEventListener('lostpointercapture',end);
    });
    const designer=$('.bdc-news-designer', editor);
    if(designer && !$('[data-news-quickhint]', designer)) designer.insertAdjacentHTML('beforeend','<div class="bdc-news-quickhint" data-news-quickhint>After adding a News image, drag it to adjust the position. Premium / Super Premium unlocks custom templates, free placement and additional newsroom visual controls.</div>');
  }
  function enhancePremium(editor){
    const premStage=$('.bdc-premium-stage', editor);
    if(premStage && !$('[data-photo-quickhint]', premStage)) premStage.insertAdjacentHTML('afterend','<div class="bdc-photo-quickhint" data-photo-quickhint>Premium users: Title, লেখা, template background এবং যোগ করা ছবি হাতে ধরে সরানো/বড়-ছোট করা যাবে। ছবি ভিত্তিক টেমপ্লেটেও একই কাজ করা যাবে।</div>');
    const gateCard=$('.bdc-gate-card', editor);
    if(gateCard && !$('[data-superpremium-panel]', gateCard)) gateCard.insertAdjacentHTML('beforeend', superPremiumHTML());
  }
  function enhanceMedia(editor){
    const hero=$('[data-record-hero]', editor); if(hero && !$('[data-spectrum-pack]', editor)) hero.insertAdjacentHTML('afterend', packHTML());
    ensureOverlay(editor);
    const pack=$('[data-spectrum-pack]', editor); if(pack && !pack.dataset.bound){
      pack.dataset.bound='1';
      pack.addEventListener('click',e=>{
        const btn=e.target.closest('[data-spectrum-card]'); if(!btn) return;
        const id=btn.dataset.spectrumId; const sp=SPECTRUMS.find(x=>x.id===id); if(!sp) return;
        if(sp.premium && !isPremium(editor)) return openGate(editor,'Music spectrum template শুধু Premium সদস্যরা ব্যবহার করতে পারবেন');
        editor.dataset.spectrumStyle=id; updateSpectrumVisual(editor);
        flashToast(editor, `${sp.name} নির্বাচন করা হয়েছে`);
      });
    }
    const recBtn=$('[data-rec-record]', editor);
    if(recBtn && !recBtn.dataset.boundRecWatch){
      recBtn.dataset.boundRecWatch='1';
      const mo=new MutationObserver(()=>{
        const active=recBtn.classList.contains('recording');
        editor.classList.toggle('is-recording', active);
        ensureOverlay(editor);
      });
      mo.observe(recBtn,{attributes:true,attributeFilter:['class']});
      recBtn.addEventListener('click',()=>setTimeout(()=>{editor.classList.toggle('is-recording', recBtn.classList.contains('recording')); ensureOverlay(editor);},40));
    }
    const preview=$('[data-rec-preview]', editor);
    if(preview && !preview.dataset.boundPreviewWatch){
      preview.dataset.boundPreviewWatch='1';
      const mo=new MutationObserver(()=>ensureOverlay(editor));
      mo.observe(preview,{childList:true,subtree:false});
    }
    const premiumBox=$('.bdc-media-premium', editor);
    if(premiumBox && !$('[data-superpremium-audio]', premiumBox)) premiumBox.insertAdjacentHTML('beforeend','<div class="bdc-superpremium-panel" data-superpremium-audio><h4>Audio Template Access</h4><p>Free user basic audio/video post করতে পারবে। Premium user music spectrum template, BG music mix, denoise, mastering ব্যবহার করতে পারবে। Super Premium user extra creator-ready spectrum pack, saved audio cover style এবং pro presentation pack পাবে।</p></div>');
  }
  function enhanceEditor(editor){
    if(!editor || editor.dataset.v70Enhanced==='1') return; editor.dataset.v70Enhanced='1';
    editor.dataset.spectrumStyle='bars-pink';
    enhanceMedia(editor); enhancePremium(editor); enhanceNews(editor); updateSpectrumVisual(editor);
    const mo=new MutationObserver(()=>{ensureOverlay(editor); enhanceNews(editor); updateSpectrumVisual(editor);});
    mo.observe(editor,{childList:true,subtree:true});
  }
  function scan(){ $$('[data-editor]').forEach(enhanceEditor); }
  new MutationObserver(scan).observe(D.documentElement,{childList:true,subtree:true});
  if(D.readyState==='loading') D.addEventListener('DOMContentLoaded', scan, {once:true}); else scan();
})();
</script>

<script id="bd-compose-english-lock-v163">
(()=>{
  if(window.__BD_COMPOSE_ENGLISH_V163__)return;
  window.__BD_COMPOSE_ENGLISH_V163__=1;
  const exact=new Map([
    ['কবিতা','Poetry'],['আবৃত্তি','Recitation'],['রিলস','Reels'],['প্রলাপ','Prose'],
    ['চিঠিপত্র','Letters'],['চিঠি','Letter'],['পরিবেশ','Environment'],['শিশুতোষ','Children'],['নিউজ','News'],
    ['কবিতা + ছবি','Poetry + Image'],['পরিবেশ + ছবি','Environment + Image'],

    ['ফিল্টার','Filter'],['ইফেক্ট','Effect'],['এডিটিং','Editing'],['শিরোনাম','Title'],['মূল লেখা','Body'],
    ['প্রকাশ','Publish'],['সম্পাদনা','Edit'],['ফিরুন','Back'],['বাতিল','Cancel'],['সংরক্ষণ','Save'],
    ['বন্ধ করুন','Close'],['সাধারণ পোস্ট','Normal Post'],['অডিও/ভিডিও','Audio/Video'],
    ['স্বাভাবিক','Normal'],['স্বচ্ছ','Clear'],['গ্লসি','Glossy'],['উষ্ণ','Warm'],['শীতল','Cool'],['ম্যাট','Matte'],['নাটকীয়','Dramatic'],
    ['Premium সুবিধা','Premium Features'],['রিকোয়েস্ট','Request'],['PIN দিন','Enter PIN'],
    ['অডিও প্রস্তুত','Audio Ready'],['রেকর্ড প্রস্তুত','Recording Ready']
  ]);
  const placeholders=new Map([
    ['আজ আপনার ভেতরে কী কথা জমে আছে?',"What's on your mind today?"],
    ['শিরোনাম লিখুন — এটি বাধ্যতামূলক','Write a title — required'],
    ['ক্যাপশন বা মূল লেখা লিখুন…','Write a caption or main text…']
  ]);
  function lockMidnight(root){
    root.querySelectorAll?.('[data-category-choice="midnight"] span').forEach(x=>x.textContent='মধ্যরাতের প্রলাপ');
  }
  function apply(root=document){
    root.querySelectorAll?.('input,textarea').forEach(el=>{
      const p=el.getAttribute('placeholder');
      if(placeholders.has(p))el.setAttribute('placeholder',placeholders.get(p));
    });
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    for(const n of nodes){
      const p=n.parentElement;if(!p||p.closest('script,style'))continue;
      if(p.closest('[data-category-choice="midnight"]')){n.nodeValue='মধ্যরাতের প্রলাপ';continue}
      const t=(n.nodeValue||'').trim();
      if(exact.has(t))n.nodeValue=n.nodeValue.replace(t,exact.get(t));
    }
    lockMidnight(root);
  }
  apply(document);
  new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1)apply(n)}).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener('bd:languagechange',()=>setTimeout(()=>apply(document),0));
})();
</script>

  ['অডিও নিন','Upload Audio'],['ভিডিও নিন','Upload Video'],['সরাসরি রেকর্ড','Record'],['নিজের মতো Adjust','Free Position'],

 ]);
