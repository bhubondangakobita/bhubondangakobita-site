function bindEditor(s){const e=s.editor;e.querySelector('[data-close]').onclick=()=>closeEditor(s);e.querySelector('[data-gate-close]').onclick=()=>e.querySelector('[data-gate]').classList.remove('open');e.querySelector('[data-title]').addEventListener('input',x=>{s.title=x.target.value;update(s);x.target.classList.toggle('bd-flagged',bad(s.title).length>0)});e.querySelector('[data-body]').addEventListener('input',x=>{s.body=x.target.value;update(s);x.target.classList.toggle('bd-flagged',bad(s.body).length>0)});e.querySelector('[data-publish]').onclick=()=>publish(s);e.querySelector('[data-premium]').onclick=()=>{if(s.premium){toast(s,'Premium ইতিমধ্যে সক্রিয়');return}e.querySelector('[data-gate]').classList.add('open')};e.querySelector('[data-pin-submit]').onclick=()=>redeem(s);e.querySelector('[data-request]').onclick=async()=>{if(!s.session){toast(s,'রিকোয়েস্ট করতে লগইন করুন');return}try{await client()?.from('premium_requests').insert({user_id:s.session.user.id,status:'requested',amount_bdt:50,source:'composer'})}catch(_){}e.querySelector('[data-gate]').classList.remove('open');toast(s,'Premium রিকোয়েস্ট পাঠানো হয়েছে')};e.addEventListener('click',ev=>{const t=ev.target.closest('[data-template]');if(t){applyTemplate(s,t.dataset.template);return}const f=ev.target.closest('[data-font]');if(f){setFont(s,f.dataset.font);return}const tool=ev.target.closest('[data-tool]');if(tool){if(tool.dataset.tier==='premium'&&!s.premium){e.querySelector('[data-gate]').classList.add('open');return}e.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===tool));context(s,tool.dataset.tool);return}if(ev.target.closest('[data-import-font]')){e.querySelector('[data-font-file]').click();return}if(ev.target.closest('[data-image]')){e.querySelector('[data-image-file]').click();return}if(ev.target.closest('[data-custom-template]')){if(!s.premium){e.querySelector('[data-gate]').classList.add('open');return}e.querySelector('[data-template-file]').click();return}const c=ev.target.closest('[data-color]');if(c){const p=e.querySelector('[data-preview]');p.style.setProperty('--title-color',c.dataset.color);p.style.setProperty('--body-color',c.dataset.color);return}const fi=ev.target.closest('[data-filter]');if(fi){s.filter=fi.dataset.filter;e.querySelector('[data-photo]').style.filter=filters[s.filter];return}const al=ev.target.closest('[data-align]');if(al){s.align=al.dataset.align;e.querySelector('[data-preview-body]').style.textAlign=s.align;return}const sh=ev.target.closest('[data-shade]');if(sh){e.querySelector('.bd-preview-shade').style.background=sh.dataset.shade==='1'?'rgba(14,24,45,.18)':'transparent';return}const sd=ev.target.closest('[data-shadow]');if(sd)e.querySelector('[data-preview]').style.setProperty('--title-shadow',sd.dataset.shadow==='on'?'0 3px 10px rgba(0,0,0,.28)':'none')});e.querySelector('[data-font-file]').onchange=x=>{const f=x.target.files?.[0];if(f)importFont(s,f);x.target.value=''};e.querySelector('[data-image-file]').onchange=x=>{const f=x.target.files?.[0];if(!f)return;if(s.photo?.startsWith('blob:'))try{URL.revokeObjectURL(s.photo)}catch(_){}s.photo=URL.createObjectURL(f);s.photoFile=f;const im=e.querySelector('[data-photo]');im.src=s.photo;im.hidden=false;x.target.value=''};e.querySelector('[data-template-file]').onchange=x=>{const f=x.target.files?.[0];if(!f)return;if(s.photo?.startsWith('blob:'))try{URL.revokeObjectURL(s.photo)}catch(_){}s.photo=URL.createObjectURL(f);s.photoFile=f;s.customTemplate=s.photo;const im=e.querySelector('[data-photo]');im.src=s.photo;im.hidden=false;toast(s,'নিজস্ব টেমপ্লেট যোগ হয়েছে');x.target.value=''}}
