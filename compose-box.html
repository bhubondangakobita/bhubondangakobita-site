function fontFamily(s,key){const base={book:"'Hind Siliguri',sans-serif",serif:"'Noto Serif Bengali',serif",tiro:"'Tiro Bangla',serif"};const c=s.customFonts.find(x=>x.key===key);return c?.family||base[key]||base.serif}
function updateCanvas(s){const c=s.editor.querySelector('[data-canvas]');c.dataset.template=s.template;const pc=PREMIUM_LIBRARY_MAP[s.template];if(pc){c.style.background=pc.background;c.style.border=pc.border||'none';c.style.boxShadow=pc.cardShadow||'';s.premium&&(s.color=pc.text||s.color)}else{c.style.background='';c.style.border='';c.style.boxShadow=''}c.style.setProperty('--font',fontFamily(s,s.font));c.style.setProperty('--align',s.align);c.style.setProperty('--text-color',s.premium?s.color:'#132a46');c.style.opacity=String(s.opacity||1);c.style.outline=s.border==='none'?'none':s.border;c.style.filter=(s.glow&&s.glow!=='none')?`drop-shadow(${s.glow.replace(/^0 0 /,'0 0 ')})`:'';const tt=c.querySelector('[data-canvas-title]'),bb=c.querySelector('[data-canvas-body]');tt.textContent=s.title||'শিরোনাম';tt.style.fontWeight='800';tt.style.textShadow=s.shadow==='none'?'none':s.shadow;bb.style.fontWeight='400';bb.style.textShadow=s.shadow==='none'?'none':s.shadow;bb.textContent=s.body||'এখানে আপনার লেখা দেখা যাবে…';const ln=lines(s.body);c.style.setProperty('--card-h',Math.max(360,Math.min(545,355+Math.min(10,ln)*16))+'px');const ph=c.querySelector('[data-photo]');if(s.photo){ph.hidden=false;ph.src=s.photo;ph.style.setProperty('--photo-filter',FILTERS[s.filter]||'none');ph.style.filter=FILTERS[s.filter]||'none'}else ph.hidden=true;renderStrip(s)}
function openTemplate(s,askPremium=false){restoreDraft(s);s.mode='template';s.template=s.category==='news'?'news1':'plain';s.font='serif';const w=D.createElement('div');w.innerHTML=templateHTML(s);s.editor=w.firstElementChild;D.body.appendChild(s.editor);s.editor.classList.add('open');s.editor.classList.toggle('premium',s.premium);D.body.style.overflow='hidden';renderStrip(s);const ti=s.editor.querySelector('[data-title]'),bo=s.editor.querySelector('[data-body]');ti.value=s.title;bo.value=s.body;const sync=()=>{s.title=ti.value;s.body=bo.value;saveDraft(s);if(!s.premium&&lines(s.body)>10){toast(s,'১০ লাইনের বেশি লেখা সাধারণ লেখায় নেওয়া হচ্ছে…');setTimeout(()=>{const title=s.title,body=s.body;closeEditor(s,false);s.title=title;s.body=body;openOrdinary(s)},520);return}updateCanvas(s)};ti.oninput=sync;bo.oninput=sync;ti.onfocus=bo.onfocus=()=>s.editor.classList.add('typing');ti.onblur=bo.onblur=()=>s.editor.classList.remove('typing');s.editor.querySelector('[data-back]').onclick=()=>closeEditor(s);s.editor.querySelector('[data-publish]').onclick=()=>publish(s);s.editor.querySelector('[data-gate-close]').onclick=()=>s.editor.querySelector('[data-gate]').classList.remove('open');s.editor.querySelector('[data-redeem]').onclick=()=>redeem(s);s.editor.querySelector('[data-request]').onclick=()=>requestPremium(s);s.editor.querySelector('[data-image-file]').onchange=e=>useImage(s,e.target.files?.[0]);s.editor.querySelector('[data-template-file]').onchange=e=>useImage(s,e.target.files?.[0],true);s.editor.querySelector('[data-font-file]').onchange=e=>importFont(s,e.target.files?.[0]);s.editor.addEventListener('click',e=>templateClick(s,e));sync();if(askPremium&&!s.premium)setTimeout(()=>gate(s),80);setTimeout(()=>ti.focus({preventScroll:true}),50)}
function closeEditor(s,purge=true){if(purge){for(const f of s.customFonts){try{D.fonts.delete(f.face);URL.revokeObjectURL(f.url)}catch(_){}}s.customFonts=[]}if(s.photo?.startsWith('blob:')&&purge){try{URL.revokeObjectURL(s.photo)}catch(_){}s.photo=''}s.editor?.remove();s.editor=null;D.body.style.overflow=''}
function showContext(s,html){const p=s.editor.querySelector('[data-context]');p.innerHTML=html;p.classList.add('open');s.context=p}
function templateClick(s,e){const t=e.target.closest('[data-template]');if(t){s.template=t.dataset.template;updateCanvas(s);return}if(e.target.closest('[data-custom-template]')){if(!s.premium)return gate(s);s.editor.querySelector('[data-template-file]').click();return}const tool=e.target.closest('[data-tool]');if(tool){if(tool.hasAttribute('data-premium')&&!s.premium)return gate(s);qa('[data-tool]',s.editor).forEach(x=>x.classList.toggle('active',x===tool));toolContext(s,tool.dataset.tool);return}const f=e.target.closest('[data-font]');if(f){if(!s.premium&&f.dataset.font!=='serif')return;s.font=f.dataset.font;updateCanvas(s);return}const col=e.target.closest('[data-color]');if(col){s.color=col.dataset.color;updateCanvas(s);return}const fil=e.target.closest('[data-filter]');if(fil){s.filter=fil.dataset.filter;updateCanvas(s);return}const al=e.target.closest('[data-align]');if(al){s.align=al.dataset.align;updateCanvas(s);return}const br=e.target.closest('[data-border]');if(br){s.border=br.dataset.border;updateCanvas(s);return}const sh=e.target.closest('[data-shadow]');if(sh){s.shadow=sh.dataset.shadow;updateCanvas(s);return}const gl=e.target.closest('[data-glow]');if(gl){s.glow=gl.dataset.glow;updateCanvas(s);return}const op=e.target.closest('[data-opacity]');if(op){s.opacity=Number(op.dataset.opacity||1);updateCanvas(s);return}if(e.target.closest('[data-import-font]'))s.editor.querySelector('[data-font-file]').click();if(e.target.closest('[data-image]'))s.editor.querySelector('[data-image-file]').click()}
function toolContext(s,tool){if(tool==='template')return showContext(s,'<div class="bd2-chip-row"><span class="bd2-chip">উপরের টেমপ্লেট স্ট্রিপ থেকে বেছে নিন</span></div>');if(tool==='font'){let h='<div class="bd2-chip-row"><button class="bd2-chip" data-font="serif" style="font-family:Noto Serif Bengali">Noto Serif Bengali</button>';if(s.premium){h+='<button class="bd2-chip" data-font="book" style="font-family:Hind Siliguri">Hind Siliguri</button><button class="bd2-chip" data-font="tiro" style="font-family:Tiro Bangla">Tiro Bangla</button>';for(const f of s.customFonts)h+=`<button class="bd2-chip" data-font="${f.key}" style="font-family:${f.family}">${esc(f.label)}</button>`;h+='<button class="bd2-chip" data-import-font>＋ ফন্ট ইমপোর্ট</button>'}return showContext(s,h+'</div>')}if(tool==='color')return showContext(s,'<div class="bd2-chip-row">'+['#18314e','#ffffff','#c53f53','#166c55','#6b4bc7','#c15b9a','#b47a28'].map(x=>`<button class="bd2-color" style="--x:${x}" data-color="${x}" aria-label="রঙ"></button>`).join('')+'</div>');if(tool==='image')return showContext(s,'<div class="bd2-chip-row"><button class="bd2-chip" data-image>＋ ছবি যোগ করুন</button><button class="bd2-chip" data-custom-template>＋ নিজস্ব টেমপ্লেট</button></div>');if(tool==='filter')return showContext(s,'<div class="bd2-chip-row">'+Object.keys(FILTERS).map(x=>`<button class="bd2-chip" data-filter="${x}">${x}</button>`).join('')+'</div>');if(tool==='adjust')return showContext(s,'<div class="bd2-chip-row"><button class="bd2-chip" data-align="left">বাম</button><button class="bd2-chip" data-align="center">মাঝখান</button><button class="bd2-chip" data-align="right">ডান</button></div>');if(tool==='border')return showContext(s,'<div class="bd2-chip-row"><button class="bd2-chip" data-border="none">কোনো বর্ডার নয়</button>'+PREMIUM_STYLE_BANKS.borders.map(x=>`<button class="bd2-chip" data-border="${x.value}">${x.name}</button>`).join('')+'</div>');if(tool==='shadow')return showContext(s,'<div class="bd2-chip-row"><button class="bd2-chip" data-shadow="none">বন্ধ</button>'+PREMIUM_STYLE_BANKS.shadows.map(x=>`<button class="bd2-chip" data-shadow="${x.value}">${x.name}</button>`).join('')+'</div>');if(tool==='glow')return showContext(s,'<div class="bd2-chip-row"><button class="bd2-chip" data-glow="none">বন্ধ</button>'+PREMIUM_STYLE_BANKS.glows.map(x=>`<button class="bd2-chip" data-glow="${x.value}">${x.name}</button>`).join('')+'</div>');if(tool==='opacity')return showContext(s,'<div class="bd2-chip-row">'+[1,.9,.8,.7,.6].map(v=>`<button class="bd2-chip" data-opacity="${v}">${Math.round(v*100)}%</button>`).join('')+'</div>')}
function gate(s){if(s.privileged){s.premium=true;s.editor.classList.add('premium');qa('[data-premium]',s.editor).forEach(x=>x.classList.remove('locked'));renderStrip(s);return}s.editor.querySelector('[data-gate]').classList.add('open')}
async function redeem(s){if(s.privileged){gate(s);return}if(!s.session)s.session=await session();if(!s.session){toast(s,'Premium চালু করতে লগইন করুন');return}const pin=s.editor.querySelector('[data-pin]').value.trim();if(pin.length<4){toast(s,'সঠিক PIN দিন');return}try{const c=await supa();const r=await c.rpc('redeem_premium_pin',{p_pin:pin});if(r.error)throw r.error;const d=Array.isArray(r.data)?r.data[0]:r.data,ok=d===true||d?.ok===true||d?.active===true;if(!ok){toast(s,'PIN সক্রিয় নয় বা অন্য অ্যাকাউন্টে ব্যবহৃত');return}let until=Date.now()+30*864e5;if(d?.expires_at){const z=Date.parse(d.expires_at);if(Number.isFinite(z))until=z}localStorage.setItem('bd-premium-access',JSON.stringify({until,user_id:s.session.user.id}));s.premium=true;s.editor.classList.add('premium');qa('[data-premium]',s.editor).forEach(x=>x.classList.remove('locked'));s.editor.querySelector('[data-gate]').classList.remove('open');renderStrip(s);toast(s,'Premium সক্রিয় হয়েছে')}catch(e){toast(s,'PIN যাচাই করা যায়নি')}}
async function requestPremium(s){if(!s.session)s.session=await session();if(!s.session){toast(s,'রিকোয়েস্ট করতে লগইন করুন');return}try{const c=await supa();await c.from('premium_requests').insert({user_id:s.session.user.id,status:'requested',amount_bdt:50,source:'composer'});toast(s,'Premium রিকোয়েস্ট পাঠানো হয়েছে');s.editor.querySelector('[data-gate]').classList.remove('open')}catch(_){toast(s,'রিকোয়েস্ট পাঠানো যায়নি')}}
async function importFont(s,file){if(!file||!s.premium)return;const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['ttf','otf','woff','woff2'].includes(ext)){toast(s,'TTF, OTF, WOFF বা WOFF2 দিন');return}const url=URL.createObjectURL(file),family='BDCustom'+Date.now();try{const face=new FontFace(family,`url(${url})`);await face.load();D.fonts.add(face);const x={key:'custom-'+Date.now(),family,label:file.name.replace(/\.[^.]+$/,''),face,url};s.customFonts.push(x);s.font=x.key;updateCanvas(s);toolContext(s,'font');toast(s,'ফন্ট শুধু এই সেশনে যোগ হয়েছে')}catch(_){URL.revokeObjectURL(url);toast(s,'ফন্ট লোড করা যায়নি')}}
function useImage(s,file,custom=false){if(!file||!s.premium)return;const url=URL.createObjectURL(file);if(s.photo?.startsWith('blob:'))try{URL.revokeObjectURL(s.photo)}catch(_){}s.photo=url;s.photoFile=file;if(custom)s.template='custom';updateCanvas(s)}
async function uploadMedia(s){if(!s.photoFile||!s.session)return s.photo||'';try{const c=await supa();const ext=(s.photoFile.name.split('.').pop()||'jpg').toLowerCase(),path=`${s.session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const r=await c.storage.from('post-media').upload(path,s.photoFile,{upsert:false,cacheControl:'3600'});if(r.error)return'';return c.storage.from('post-media').getPublicUrl(path).data?.publicUrl||''}catch{return''}}
function localSave(post){const keys=['bhubondangaPublishedPosts','bhubondangaIndexFeedPosts','bhubondangaNewsfeedPosts','bhubondangaHomeFeedPosts'];for(const k of keys)try{const a=JSON.parse(localStorage.getItem(k)||'[]');const arr=Array.isArray(a)?a:[];arr.unshift(post);localStorage.setItem(k,JSON.stringify(arr.slice(0,1200)))}catch(_){}}
async function dbInsert(s,p){try{const c=await supa();if(!c||!s.session)return null;const uid=s.session.user.id;const attempts=[{author_id:uid,title:p.title,body:p.body,type:p.type,status:p.status,template:p.template,font:p.font,photo:p.photo||null},{user_id:uid,title:p.title,content:p.body,category:p.type,status:p.status,template:p.template,font:p.font,image_url:p.photo||null},{author_id:uid,title:p.title,content:p.body,category:p.type,status:p.status}];for(const x of attempts){try{const r=await c.from('posts').insert(x).select('*').single();if(!r.error)return r.data}catch(_){}}}catch(_){}return null}
async function publish(s){s.title=(s.editor.querySelector('[data-title]')?.value||s.title).trim();s.body=(s.editor.querySelector('[data-body]')?.value||s.body).trim();if(!s.title){toast(s,'শিরোনাম ছাড়া পোস্ট করা যাবে না');s.editor.querySelector('[data-title]')?.focus({preventScroll:true});return}if(!s.body){toast(s,'লেখা লিখুন');return}if(s.mode==='template'&&!s.premium&&lines(s.body)>10){const a=s.title,b=s.body;toast(s,'দীর্ঘ লেখা সাধারণ পোস্টে নেওয়া হচ্ছে…');setTimeout(()=>{closeEditor(s,false);s.title=a;s.body=b;openOrdinary(s)},500);return}const hit=bad(s.title+' '+s.body),status=hit.length?'pending_review':'published';if(!s.session)s.session=await session();if(!s.session){toast(s,'পোস্ট করতে লগইন করুন');return}const role=await resolveRole(s.session);s.role=role;s.privileged=privileged(role);if(s.category==='news'&&!newsAllowed(role)){toast(s,'নিউজ প্রকাশের অনুমতি নেই');return}const photo=await uploadMedia(s);const post={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),author_id:s.session.user.id,title:s.title,body:s.body,type:s.category,status,template:s.mode==='ordinary'?'none':s.template,font:s.mode==='ordinary'?'Noto Serif Bengali':s.font,photo:photo||'',created_at:new Date().toISOString(),composer_mode:s.mode};const db=await dbInsert(s,post);const final={...post,...(db||{})};localSave(final);clearDraft();W.dispatchEvent(new CustomEvent('bd:post-published',{detail:final}));toast(s,status==='pending_review'?'লেখা Review Queue-তে পাঠানো হয়েছে':'পোস্ট প্রকাশিত হয়েছে');setTimeout(()=>closeEditor(s),450)}
async function mount(target,opt={}){const wrap=D.createElement('div');wrap.innerHTML=shell();const root=wrap.firstElementChild;target.appendChild(root);const s=state(root);STATES.add(s);await access(s);root.querySelector('[data-avatar]').innerHTML=avatar(s.session);root.querySelector('[data-prompt]').onclick=()=>root.querySelector('[data-cats]').classList.toggle('open');qa('[data-letter]',root).forEach(b=>b.onclick=()=>openMode(s,b.dataset.letter));qa('[data-cat]',root).forEach(b=>b.onclick=()=>openMode(s,b.dataset.cat));return s}
W.addEventListener('pagehide',()=>{STATES.forEach(s=>{for(const f of s.customFonts)try{D.fonts.delete(f.face);URL.revokeObjectURL(f.url)}catch(_){}s.customFonts=[]})});
W.BD_MODULES.compose={mount};if(location.pathname.endsWith('compose-box.html')||!D.querySelector('main:not(#bdComposeDemo)')){const h=q('#bdComposeDemo');if(h)mount(h,{context:'standalone'})}
})();
</script>
