  const meta=u.user_metadata||{},raw=meta.premium_until||meta.premium_expires_at||meta.premium_expiry||'';const mt=raw?Date.parse(raw):0;if(mt>Date.now())return {active:true,until:mt};

  for(const table of ['premium_entitlements','premium_memberships']){

function activate(until){premiumUntil=Number(until)||Date.now()+31*864e5;W.__BD_PREMIUM_ACTIVE=true;W.__BD_PREMIUM_UNTIL=premiumUntil;$('#bdPremiumOffer')?.setAttribute('hidden','');$('#bdPremiumPinBox')?.setAttribute('hidden','');openMode('premium')}
async function premiumChoice(){

function pinConflict(data,err){const s=JSON.stringify(data||err||{}).toLowerCase();return /already|bound|used|redeem|claim|conflict|duplicate/.test(s)}
async function redeemPin(){
  const pin=$('#bdPremiumPin')?.value?.trim();if(!pin){setStatus('PIN লিখুন।',true);return}
  const u=await session();if(!u){setStatus('আগে লগইন করুন।',true);return}

}

function wireInlineTemplate(){const input=$('[data-bdp-template-inline]');const real=$('#bdpTemplateImport');if(!input||input.dataset.bound)return;input.dataset.bound='1';input.addEventListener('change',()=>{if(!input.files?.length)return;try{const dt=new DataTransfer();[...input.files].forEach(f=>dt.items.add(f));real.files=dt.files;real.dispatchEvent(new Event('change',{bubbles:true}))}catch(_){real?.dispatchEvent?.(new Event('change',{bubbles:true}))}})}
D.addEventListener('bd:composer-access',e=>{if(e.detail?.mode==='premium')setTimeout(()=>{open();wireInlineTemplate()},0)},false);
D.addEventListener('click',e=>{if(e.target.closest?.('[data-bdp-close]')){e.preventDefault();e.stopPropagation();close();return}if(e.target.closest?.('[data-bdp-done]')){e.preventDefault();e.stopPropagation();commit();return}},true);
D.addEventListener('focusin',e=>{if(!e.target.closest?.('#bdPremiumStudio'))return;if(e.target.matches?.('#bdpTitleInput,#bdpBodyInput')){composer()?.classList.add('bdp-keyboard');viewport()}},true);
D.addEventListener('focusout',e=>{if(!e.target.closest?.('#bdPremiumStudio'))return;setTimeout(()=>{const a=D.activeElement;if(!a?.matches?.('#bdpTitleInput,#bdpBodyInput'))composer()?.classList.remove('bdp-keyboard');viewport()},50)},true);
D.addEventListener('input',e=>{if(e.target.matches?.('#bdpTitleInput,#bdpBodyInput'))requestAnimationFrame(enforceTitle)},true);
const mo=new MutationObserver(()=>{if(premiumOpen()){open();wireInlineTemplate();enforceTitle()}});function boot(){const c=composer();if(c)mo.observe(c,{subtree:true,childList:true,attributes:true,attributeFilter:['data-bd-access']});setTimeout(()=>{if(premiumOpen())open()},120)}if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})(window,document);
</script>
