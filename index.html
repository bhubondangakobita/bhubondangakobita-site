}

<template id="bdComposeBoxScripts"><script data-bd-runtime-order="46" id="bd-compose-access-v1-js">
(()=>{'use strict';
if(window.BDComposerAccess)return;
const D=document,W=window,$=(s,r=D)=>r?.querySelector?.(s)||null;
let pendingType='poem',premiumUntil=0,activeMode='user';
const TYPE_LABEL={poem:'কবিতা',prolap:'প্রলাপ',midnight:'মধ্যরাতের প্রলাপ',letter:'চিঠিপত্র',recitation:'আবৃত্তি',environment:'পরিবেশ',children:'শিশুতোষ',news:'নিউজ',discussion:'সাহিত্য আলোচনা'};
const client=()=>W.bdProductionSupabase||W.bdSupabase||W.supabaseClient||W.bhubondangaSupabase||W.BhubondangaAuth?.client||null;
const liveUser=()=>W.__BD_LIVE_SESSION?.user||null;
async function session(){
  if(liveUser())return liveUser();
  try{const a=await W.BhubondangaAuth?.current?.();if(a?.session?.user)return a.session.user}catch(_){}
  try{const c=client();const r=await c?.auth?.getSession?.();return r?.data?.session?.user||null}catch(_){return null}
}
function founder(){return String(W.__BD_LIVE_ROLE||W.__BD_IDENTITY?.role||'').toLowerCase()==='founder'}
function setStatus(msg,isError=false){const p=$('#bdPremiumPinStatus');if(!p)return;p.hidden=!msg;p.textContent=msg||'';p.style.color=isError?'var(--red)':'var(--green)'}
function gate(show=true){const g=$('#bdComposerAccessGate'),c=$('#composerChoices'),f=$('#composerForm');if(!g)return;if(show){g.hidden=false;if(c)c.hidden=true;if(f)f.hidden=true;$('#composer')?.setAttribute('data-bd71-stage','access')}else g.hidden=true}
function chooseType(type){pendingType=type||'poem';const radio=$(`input[name="postType"][value="${CSS.escape(pendingType)}"]`);if(radio){radio.checked=true;radio.dispatchEvent(new Event('change',{bubbles:true}))}const label=$('#bdAccessTypeLabel');if(label)label.textContent=(TYPE_LABEL[pendingType]||'লেখা')+' নির্বাচিত';$('#bdPremiumPinBox')?.setAttribute('hidden','');$('#bdPremiumPinDisputeOpen')?.setAttribute('hidden','');$('#bdPremiumPinDispute')?.setAttribute('hidden','');setStatus('');gate(true);return true}
function refreshTemplateEngine(){try{W.BhubondangaTemplateLibrary?.mount?.()}catch(_){};try{D.dispatchEvent(new CustomEvent('bd:composer-access',{detail:{mode:activeMode,premium:activeMode==='premium'}}))}catch(_){}}
function openMode(mode){activeMode=mode==='premium'?'premium':'user';const comp=$('#composer');if(comp)comp.dataset.bdAccess=activeMode;D.body.classList.toggle('is-premium',activeMode==='premium');gate(false);W.BDComposerOpenType?.(pendingType);refreshTemplateEngine()}
async function remoteEntitlement(){
  if(founder())return {active:true,until:Date.now()+3650*864e5};
  const u=await session();if(!u)return {active:false,needLogin:true};
  const meta=u.user_metadata||{},raw=meta.premium_until||meta.premium_expires_at||meta.premium_expiry||'';const mt=raw?Date.parse(raw):0;if(mt>Date.now())return {active:true,until:mt};
  const c=client();if(!c)return {active:false};
  for(const table of ['premium_entitlements','premium_memberships']){
    try{const r=await c.from(table).select('status,expires_at,premium_until,user_id').eq('user_id',u.id).maybeSingle();if(!r.error&&r.data){const until=Date.parse(r.data.expires_at||r.data.premium_until||0)||0;if(String(r.data.status||'active').toLowerCase()==='active'&&(!until||until>Date.now()))return {active:true,until:until||Date.now()+31*864e5}}}catch(_){}
  }
  return {active:false};
}
function activate(until){premiumUntil=Number(until)||Date.now()+31*864e5;W.__BD_PREMIUM_ACTIVE=true;W.__BD_PREMIUM_UNTIL=premiumUntil;openMode('premium')}
async function premiumChoice(){
  const st=await remoteEntitlement();if(st.needLogin){setStatus('Premium চালু করতে আগে লগইন করুন।',true);$('#bdPremiumPinBox')?.removeAttribute('hidden');return}if(st.active){activate(st.until);return}
  $('#bdPremiumPinBox')?.removeAttribute('hidden');setStatus('এই অ্যাকাউন্টে সক্রিয় Premium পাওয়া যায়নি। মাসিক PIN দিন।');$('#bdPremiumPin')?.focus({preventScroll:true});
}
function pinConflict(data,err){const s=JSON.stringify(data||err||{}).toLowerCase();return /already|bound|used|redeem|claim|conflict|duplicate/.test(s)}
async function redeemPin(){
  const pin=$('#bdPremiumPin')?.value?.trim();if(!pin){setStatus('PIN লিখুন।',true);return}
  const u=await session();if(!u){setStatus('আগে লগইন করুন।',true);return}
  const c=client();if(!c){setStatus('Premium সার্ভিসের সাথে সংযোগ পাওয়া যায়নি।',true);return}
  setStatus('PIN যাচাই হচ্ছে…');let last=null;
  for(const [name,args] of [['redeem_premium_pin',{p_pin:pin}],['claim_premium_pin',{p_pin:pin}]]){
    try{const r=await c.rpc(name,args);if(!r.error){const d=r.data||{};const ok=d===true||d?.ok===true||d?.active===true||d?.status==='active'||d?.status==='redeemed';if(ok){const until=Date.parse(d.expires_at||d.premium_until||0)||Date.now()+31*864e5;setStatus('Premium চালু হয়েছে।');activate(until);return}last=d}else last=r.error}catch(e){last=e}
  }
  if(pinConflict(last)){setStatus('এই PIN ইতিমধ্যে অন্য একটি অ্যাকাউন্টে ব্যবহৃত/বাঁধা আছে।',true);$('#bdPremiumPinDisputeOpen')?.removeAttribute('hidden');$('#bdPinClaimPin')&&( $('#bdPinClaimPin').value=pin );return}
  setStatus('PIN যাচাই করা যায়নি। Dashboard/Backend Premium PIN RPC সংযুক্ত আছে কি না দেখুন।',true)
}
async function submitDispute(e){e.preventDefault();const u=await session();const name=$('#bdPinClaimName')?.value?.trim(),uid=$('#bdPinClaimUser')?.value?.trim(),pin=$('#bdPinClaimPin')?.value?.trim();if(!name||!uid||!pin){setStatus('নাম, User ID ও PIN—তিনটিই দিন।',true);return}const c=client();if(!c){setStatus('সার্ভার সংযোগ নেই।',true);return}const payload={p_name:name,p_user_id:uid,p_pin:pin};for(const [kind,fn] of [['rpc',async()=>c.rpc('submit_premium_pin_dispute',payload)],['table',async()=>c.from('premium_pin_disputes').insert({claimant_name:name,claimant_user_id:uid,claimant_account_id:u?.id||null,pin_claim:pin,status:'pending',created_at:new Date().toISOString()})]]){try{const r=await fn();if(!r?.error){setStatus('রিপোর্ট Founder Dashboard-এ পাঠানো হয়েছে।');$('#bdPremiumPinDispute')?.setAttribute('hidden','');return}}catch(_){}}setStatus('রিপোর্ট পাঠানো যায়নি।',true)}

/* Custom font files stay in this document only: never Storage, never database. */
const fontFaces=new Set();
W.BDClientFontLifecycle={
 register(face){if(face)fontFaces.add(face)},
 purge(){for(const face of fontFaces){try{D.fonts.delete(face)}catch(_){}}fontFaces.clear();try{W.BhubondangaTemplateLibrary?.purgeCustomFonts?.()}catch(_){}},
 count:()=>fontFaces.size
};
function disablePremium(reason){premiumUntil=0;W.__BD_PREMIUM_ACTIVE=false;W.__BD_PREMIUM_UNTIL=0;D.body.classList.remove('is-premium');W.BDClientFontLifecycle.purge();if(activeMode==='premium'){activeMode='user';$('#composer')?.setAttribute('data-bd-access','user')}if(reason)setStatus(reason,true);refreshTemplateEngine()}
setInterval(()=>{if(premiumUntil&&Date.now()>=premiumUntil)disablePremium('Premium মেয়াদ শেষ হয়েছে। ডিফল্ট ফন্টে ফিরে যাওয়া হয়েছে।')},60000);
try{const c=client();c?.auth?.onAuthStateChange?.((event)=>{if(event==='SIGNED_OUT'||event==='USER_DELETED')disablePremium('সেশন শেষ হয়েছে। Custom font মুছে দেওয়া হয়েছে।')})}catch(_){}

D.addEventListener('click',e=>{const access=e.target.closest?.('[data-bd-access]');if(access&&access.closest('#bdComposerAccessGate')){e.preventDefault();e.stopPropagation();if(access.dataset.bdAccess==='premium')premiumChoice();else openMode('user');return}if(e.target.closest?.('#bdAccessBack')){e.preventDefault();gate(false);W.BDComposerShowChoices?.();return}if(e.target.closest?.('#bdPremiumPinSubmit')){e.preventDefault();redeemPin();return}if(e.target.closest?.('#bdPremiumPinDisputeOpen')){e.preventDefault();$('#bdPremiumPinDispute')?.removeAttribute('hidden');const u=liveUser();if(u&&$('#bdPinClaimUser')&&!$('#bdPinClaimUser').value)$('#bdPinClaimUser').value=u.id||'';return}},true);
D.addEventListener('submit',e=>{if(e.target?.id==='bdPremiumPinDispute'){e.stopPropagation();submitDispute(e);return}if(e.target?.id==='composerForm'){const t=$('#postTitle')?.value?.trim();if(!t){e.preventDefault();e.stopImmediatePropagation();W.toast?.('প্রতিটি পোস্টের শিরোনাম আবশ্যক। শিরোনাম ছাড়া প্রকাশ করা যাবে না।');try{$('#postTitle')?.focus({preventScroll:true})}catch(_){}return}}},true);
W.BDComposerAccess={chooseType,openMode,premiumChoice,disablePremium,isPremium:()=>D.body.classList.contains('is-premium')};
})();
</script></template>
