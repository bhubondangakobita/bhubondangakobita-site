function banglaCalendarDate(now){

  const starts=[[4,14,'বৈশাখ'],[5,15,'জ্যৈষ্ঠ'],[6,15,'আষাঢ়'],[7,16,'শ্রাবণ'],[8,16,'ভাদ্র'],[9,16,'আশ্বিন'],[10,17,'কার্তিক'],[11,16,'অগ্রহায়ণ'],[12,16,'পৌষ'],[1,15,'মাঘ'],[2,14,'ফাল্গুন'],[3,15,'চৈত্র']];
  const afterNewYear=m>4||(m===4&&day>=14),by=afterNewYear?y-593:y-594,gyStart=afterNewYear?y:y-1;
  const points=starts.map(([mo,da,name])=>({t:new Date(Date.UTC(mo>=4?gyStart:gyStart+1,mo-1,da)),name}));
  let chosen=points[0];for(const pt of points){if(pt.t<=current)chosen=pt;else break}

}
