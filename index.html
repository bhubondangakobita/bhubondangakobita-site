async function bdCompressPublisherImage(file,max=1800,q=.86){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const scale=Math.min(1,max/Math.max(im.width,im.height)),c=D.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

async function loadFeed(){

  const host=targetFor(f);
  if(!host)return;

    if(f==='index.html')D.dispatchEvent(new CustomEvent('bd:supabase-posts',{detail:{rows:[],status:'error',error:'Supabase সংযোগ পাওয়া যায়নি'}}));

  }

  if(f==='index.html'&&!Array.isArray(W.__BD_SUPABASE_POSTS))D.dispatchEvent(new CustomEvent('bd:supabase-posts',{detail:{rows:[],status:'loading'}}));
  try{
    let q=client.from('posts').select('*').order('created_at',{ascending:false}).limit(opt.limit||1000);
    if(opt.authorId)q=q.eq('author_id',opt.authorId);else if(opt.authorUsername)q=q.eq('author_username',opt.authorUsername);
    if(opt.type)q=q.eq('type',opt.type);

    if(f==='index.html'){const pageId=new URLSearchParams(location.search).get('news_page');if(pageId)rows=rows.filter(x=>String(x.type||'').toLowerCase()==='news'&&String(x.original_author||'')==='news-page:'+pageId);
      W.__BD_SUPABASE_POSTS=rows;
      D.dispatchEvent(new CustomEvent('bd:supabase-posts',{detail:{rows,status:'ready'}}));
      const count=$('#feedCount');if(count)count.textContent=bnNum(rows.length)+'টি লেখা';
      return;
    }
    let html=rows.map(x=>card(x,opt.midnight)).join('');
    if(!html)html='<section class="bd-realtime-note">এখনও কোনো প্রকাশিত লেখা নেই।</section>';
    if(['founder-profile.html','admin-profile.html','profile.html'].includes(f))host.innerHTML='<section class="glass section-head"><div><h2>প্রকাশিত লেখা</h2><small>Supabase থেকে সরাসরি হালনাগাদ</small></div></section><section class="post-list">'+html+'</section>';
    else host.innerHTML=html;
    const count=$('#feedCount');if(count)count.textContent=bnNum(rows.length)+'টি লেখা';
  }catch(e){
    console.warn('Bhubondanga feed:',e?.message||e);
    if(f==='index.html'){
      const rows=Array.isArray(W.__BD_SUPABASE_POSTS)?W.__BD_SUPABASE_POSTS:[];
      D.dispatchEvent(new CustomEvent('bd:supabase-posts',{detail:{rows,status:rows.length?'stale':'error',error:e?.message||String(e)}}));
    }
  }finally{state.feedBusy=false}
}

const D=document;
const copyAttrs=(from,to)=>{for(const a of [...from.attributes])if(a.name!=='data-bd-runtime-order')to.setAttribute(a.name,a.value)};
const cloneFromTemplate=(doc,id)=>doc.querySelector(id)?.content?.cloneNode(true)||null;
const BD_COMPONENT_BUILD='20260816-v11-premium-folders-post-menu';const loadText=async url=>{const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'v='+encodeURIComponent(BD_COMPONENT_BUILD),{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return r.text()};
const parser=new DOMParser();
// Only historical social/reaction/comment presentation layers are skipped at Index runtime.
// sidebars.html itself remains untouched; its layout/theme/sidebar styles still load normally.
const BD_SUPERSEDED_RUNTIME_STYLES=new Set([
  'bd-v814-facebook-social','bd-v829-index-social-fix-css','bd-v831-final-social-css',
  'bd-v833-facebook-social-final-lock','bd-v835-responsive-social-final','bd-v838-final-profile-reaction-comment-fix',
  'bd-v845-modern-social-stable','bd-v847-master-lock-reaction-aurora','bd-v849-reaction-dark-visibility-master-lock',
  'bd-v850-exact-user-reaction-reference','bd-v862-final-interaction-css','bd-v863-final-interaction-lock',
  'bd-v864-reaction-stability-lock','bd-v864-index-exact-compact-tray','bd-v8139-reaction-news-canonical-css',
  'bd-v8142-approved-reaction-visual-lock','bd-v8152-reaction-visual-stability-fix','bd-cobalt-final-social-hardlock',
  'bd-cobalt-comment-write-no-shake-v2','bd-cobalt-comment-final-contrast-lock','bd-v8164-fb-reactions-reels-darkfix-css'
]);
async function boot(){
  D.body.classList.add('bd-components-loading');
  try{
    const [sideText,feedText]=await Promise.all([loadText('./sidebars.html'),loadText('./feed.html')]);
    const sideDoc=parser.parseFromString(sideText,'text/html'),feedDoc=parser.parseFromString(feedText,'text/html');
    const sideTpl=sideDoc.querySelector('#bdSidebarsComponent'),feedTpl=feedDoc.querySelector('#bdFeedComponent');
    if(!sideTpl||!feedTpl)throw new Error('component template missing');
    const sideFrag=sideTpl.content.cloneNode(true),feedFrag=feedTpl.content.cloneNode(true);

    // Mobile drawer/edge controls keep their original pre-layout DOM position.
    const preAnchor=D.getElementById('bdPreLayoutAnchor');
    for(const id of ['drawerBackdrop','mobileDrawer','rightMobileDrawer','leftEdgeMenu','rightEdgeMenu']){
      const n=sideFrag.querySelector('#'+id); if(n)preAnchor.before(n);
    }
    preAnchor.remove();

    // Desktop left / center feed / right restore the exact original grid-child structure.
    const l=sideFrag.querySelector('#leftSidebar'),r=sideFrag.querySelector('#rightSidebar');
    const c=feedFrag.querySelector('.center-col');
    if(!l||!r||!c)throw new Error('layout component missing');
    D.getElementById('bdLeftSidebarSlot').replaceWith(l);
    D.getElementById('bdFeedSlot').replaceWith(c);
    D.getElementById('bdRightSidebarSlot').replaceWith(r);

    // Feed-owned global UI nodes keep their original order after the footer.
    const globalAnchor=D.getElementById('bdFeedGlobalsAnchor');
    for(const id of ['toTop','masterPostShell','toast','postActionBoard']){
      const n=feedFrag.querySelector('#'+id); if(n)globalAnchor.before(n);
    }
    globalAnchor.remove();

    // Recreate original BODY style/script cascade and execution order exactly.
    const runtime=[];
    for(const tpl of [sideDoc.querySelector('#bdBodyStyles'),feedDoc.querySelector('#bdBodyScripts')]){
      if(!tpl)continue;
      for(const n of [...tpl.content.children]){
        const ord=Number(n.getAttribute('data-bd-runtime-order')||0);
        if(ord)runtime.push([ord,n]);
      }
    }
    runtime.sort((a,b)=>a[0]-b[0]);
    for(const [,node] of runtime){
      if(node.tagName==='STYLE'){
        if(BD_SUPERSEDED_RUNTIME_STYLES.has(node.id||''))continue;
        const s=D.createElement('style');copyAttrs(node,s);s.textContent=node.textContent;D.head.appendChild(s);
      }else if(node.tagName==='SCRIPT'){
        const s=D.createElement('script');copyAttrs(node,s);
        if(node.getAttribute('src')){
          s.src=node.getAttribute('src');
          await new Promise(resolve=>{s.onload=resolve;s.onerror=resolve;D.body.appendChild(s)});
        }else{s.textContent=node.textContent;D.body.appendChild(s)}
      }
    }
    D.body.classList.remove('bd-components-loading');
    D.documentElement.dataset.bdThreePart='ready';
    D.dispatchEvent(new CustomEvent('bd:three-part-ready'));
  }catch(err){
    console.error('Bhubondanga component boot failed',err);
    D.body.classList.remove('bd-components-loading');D.body.classList.add('bd-components-failed');
    const box=D.createElement('div');box.className='bd-component-error';
    box.textContent='ভুবনডাঙ্গার অংশগুলো লোড করা যায়নি। index.html, sidebars.html এবং feed.html একই ফোল্ডারে আছে কি না যাচাই করুন।';
    D.querySelector('.layout')?.replaceWith(box);
  }
}
await boot();
</script>

 function sync(){const yes=isFounderNow();D.body?.classList.toggle('bd-founder-view',yes);D.querySelectorAll('[data-bd-founder-only]').forEach(el=>el.hidden=!yes)}
