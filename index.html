function banglaCalendarDate(now){

  const afterNewYear=m>4||(m===4&&day>=14),by=afterNewYear?y-593:y-594,gyStart=afterNewYear?y:y-1;
  const points=starts.map(([mo,da,name])=>({t:new Date(Date.UTC(mo>=4?gyStart:gyStart+1,mo-1,da)),name}));
  let chosen=points[0];for(const pt of points){if(pt.t<=current)chosen=pt;else break}

}

/* ========================================================================
   INDEX V129 — adaptive interaction details
   These rules target canonical feed/sidebar/composer class families so the
   dynamic modules inherit the same physical button language without copies.
   ======================================================================== */

/* Physical button sheen / click ink. JS only changes custom properties; size never changes. */
.bd129-ink-host{position:relative!important;overflow:hidden!important;isolation:isolate}
.bd129-ink-host:after{content:"";position:absolute;left:var(--bd129-ink-x,50%);top:var(--bd129-ink-y,50%);width:12px;height:12px;border-radius:50%;pointer-events:none;background:currentColor;opacity:0;transform:translate(-50%,-50%) scale(.1);z-index:0}
.bd129-ink-host.bd129-ink:after{animation:bd129Ink .42s ease-out}
@keyframes bd129Ink{0%{opacity:.085;transform:translate(-50%,-50%) scale(.2)}72%{opacity:.025}100%{opacity:0;transform:translate(-50%,-50%) scale(11)}}
.bd129-ink-host>*{position:relative;z-index:1}

/* Tooltips for icon-only controls on real mouse/trackpad; never shown on touch. */
@media(hover:hover) and (pointer:fine){
 [data-bd129-tip]{position:relative}
 [data-bd129-tip]:before{content:attr(data-bd129-tip);position:absolute;z-index:22000;left:50%;top:calc(100% + 7px);transform:translate(-50%,-3px);opacity:0;visibility:hidden;pointer-events:none;white-space:nowrap;min-height:25px;padding:5px 8px;border-radius:7px;background:rgba(20,38,58,.94);color:#fff;font-size:9px;font-weight:750;box-shadow:0 7px 18px rgba(23,33,49,.16);transition:.14s ease}
 [data-bd129-tip]:hover:before,[data-bd129-tip]:focus-visible:before{opacity:.96;visibility:visible;transform:translate(-50%,0)}
}

/* Load-state feedback is a progress cue, not a skeleton. */
button.bd129-busy,[role="button"].bd129-busy{pointer-events:none!important;opacity:.76!important;cursor:wait!important}
button.bd129-busy:before,[role="button"].bd129-busy:before{content:"";width:13px;height:13px;min-width:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:bd129Spin .72s linear infinite;display:inline-block;margin-right:6px;vertical-align:-2px}
@keyframes bd129Spin{to{transform:rotate(360deg)}}

/* Header action buttons get fixed hit targets; icons never cause shifts. */
.bd-head-actions button,.bd-head-actions a,.bd-search button{position:relative;contain:layout style;overflow:hidden}
.bd-head-actions svg,.bd-search button svg,.bd-quick-button svg{pointer-events:none;flex:none}
.bd-head-actions button:after,.bd-head-actions a:after{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid transparent;transition:border-color .15s ease}
@media(hover:hover){.bd-head-actions button:hover:after,.bd-head-actions a:hover:after{border-color:rgba(77,98,137,.11)}}

/* Search active state. */
body.bd129-search-focus .bd-site-header{box-shadow:0 8px 24px rgba(54,74,111,.075)}
body.bd129-search-focus .bd-search{z-index:12001}
body.bd129-search-focus .bd-search input{border-color:rgba(118,86,216,.35)!important}

/* Long text fallback: if a feed version provides collapsible text without wiring, make tap reversible. */
D.addEventListener('click',e=>{const text=e.target.closest?.('.bd-collapsible,[data-expand]');if(!text||isInteractive(e.target)&&e.target!==text)return;if(text.closest('.bd-full-post-viewer,.bd-photo-viewer'))return;if(text.hasAttribute('data-expand')||text.classList.contains('bd-collapsible')){const expanded=text.classList.toggle('bd-expanded');text.setAttribute('aria-expanded',expanded?'true':'false');const more=text.parentElement?.querySelector?.('.bd-see-more');if(more)more.textContent=expanded?'কম দেখুন':'আরও দেখুন'}});

/* Image quality/performance normalization. */
function normalizeImages(root=D){qa('img',root).forEach(img=>{if(!img.hasAttribute('decoding'))img.decoding='async';if(!img.hasAttribute('loading')&&!img.closest('.bd-photo-viewer,.bd-full-post-viewer,.bd-site-header'))img.loading='lazy';img.addEventListener('error',()=>{img.classList.add('bd129-image-error');img.setAttribute('data-bd-image-error','1')},{once:true})})}

/* Button semantics: make button-like divs keyboard operable only when the component forgot semantics. */
function normalizeControls(root=D){qa('[data-bd-action]:not(button):not(a),[data-bd-edge]:not(button):not(a)',root).forEach(el=>{if(!el.hasAttribute('role'))el.setAttribute('role','button');if(!el.hasAttribute('tabindex'))el.tabIndex=0});}
D.addEventListener('keydown',e=>{const el=e.target.closest?.('[role="button"]');if(!el||isEditable(el))return;if(e.key==='Enter'||e.key===' '){if(el.tagName!=='BUTTON'&&el.tagName!=='A'){e.preventDefault();el.click()}}});

/* Network indicator. */
let net=q('#bd129NetState');if(!net){net=D.createElement('div');net.id='bd129NetState';net.innerHTML='<span class="dot"></span><span class="text"></span>';D.body.appendChild(net)}
let netTimer=0;
function showNet(text,offline=false,hold=1800){clearTimeout(netTimer);net.querySelector('.text').textContent=text;net.classList.toggle('offline',offline);net.classList.add('show');netTimer=setTimeout(()=>net.classList.remove('show'),hold)}
W.addEventListener('offline',()=>showNet('ইন্টারনেট সংযোগ নেই',true,5000));W.addEventListener('online',()=>showNet('আবার সংযুক্ত হয়েছে',false,1800));

/* Visibility + BFCache scroll restoration. */
const scrollKey='bd:index:scroll:v129';
function saveScroll(){try{const sc=getScroller();const top=sc===D.scrollingElement?W.scrollY:sc.scrollTop;sessionStorage.setItem(scrollKey,String(Math.round(top)))}catch{}}
function restoreScroll(){try{const raw=sessionStorage.getItem(scrollKey);if(raw==null)return;const y=Number(raw)||0;const sc=getScroller();raf(()=>{if(sc===D.scrollingElement)W.scrollTo(0,y);else sc.scrollTop=y;updateScrollUI()})}catch{}}
W.addEventListener('pagehide',saveScroll);D.addEventListener('visibilitychange',()=>{if(D.visibilityState==='hidden')saveScroll()});W.addEventListener('pageshow',e=>{bindScroller();if(e.persisted)restoreScroll()});

/* Module readiness audit and resilient retry buttons without rendering a skeleton. */
function enhanceErrors(){qa('.bd-slot-error').forEach(box=>{box.setAttribute('role','status');const btn=box.querySelector('button');if(btn){btn.classList.add('bd-press');btn.addEventListener('click',()=>{btn.disabled=true;const old=btn.textContent;btn.textContent='লোড হচ্ছে…';setTimeout(()=>{btn.disabled=false;btn.textContent=old},3200)},{once:true})}})}

/* User motion preferences and coarse-pointer states. */
const mqHover=matchMedia('(hover:hover) and (pointer:fine)');const mqReduce=matchMedia('(prefers-reduced-motion:reduce)');
function syncMediaClasses(){D.body.classList.toggle('bd129-fine-pointer',mqHover.matches);D.body.classList.toggle('bd129-reduced-motion',mqReduce.matches)}
try{mqHover.addEventListener('change',syncMediaClasses);mqReduce.addEventListener('change',syncMediaClasses)}catch{mqHover.addListener?.(syncMediaClasses);mqReduce.addListener?.(syncMediaClasses)}syncMediaClasses();

/* Touch gesture arbitration: prevent accidental navigation after a vertical swipe on card controls. */
let touchStart=null;
D.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];touchStart={x:t.clientX,y:t.clientY,time:now(),target:e.target}},{passive:true,capture:true});
D.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches?.[0];if(!t){touchStart=null;return}const dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.hypot(dx,dy)>14&&now()-touchStart.time<700){const a=touchStart.target?.closest?.('a[href]');if(a&&Math.abs(dy)>Math.abs(dx)*1.15)a.dataset.bd129Swipe='1'}touchStart=null},{passive:true,capture:true});
D.addEventListener('click',e=>{const a=e.target.closest?.('a[data-bd129-swipe="1"]');if(a){delete a.dataset.bd129Swipe;e.preventDefault();e.stopPropagation()}},{capture:true});

/* Three-dot / reaction picker layering helper: only z-index, no content mutation. */
D.addEventListener('click',e=>{const trigger=e.target.closest?.('.bd-post-menu,.bd-more,[data-post-menu],.bd-rx-pick,.bd40-pick,.bd-reaction-option');if(!trigger)return;const card=trigger.closest('.bd-post,.post-card,.post');if(card){qa('.bd-post.bd129-front,.post-card.bd129-front,.post.bd129-front').forEach(x=>{if(x!==card)x.classList.remove('bd129-front')});card.classList.add('bd129-front');setTimeout(()=>card.classList.remove('bd129-front'),1600)}});

/* Scroll intent guard around iOS keyboard. Font-size 16 avoids browser zoom; visualViewport keeps top bars stable. */
let vvRaf=0;if(W.visualViewport){const vv=W.visualViewport;const syncVV=()=>{vvRaf=0;H.style.setProperty('--bd129-vv-height',vv.height+'px');H.style.setProperty('--bd129-vv-top',vv.offsetTop+'px');D.body.classList.toggle('bd129-keyboard',vv.height<W.innerHeight*.78)};const queueVV=()=>{if(!vvRaf)vvRaf=raf(syncVV)};vv.addEventListener('resize',queueVV,{passive:true});vv.addEventListener('scroll',queueVV,{passive:true});syncVV()}

/* Internal diagnostics are opt-in and do not run loops. */
W.BDIndexV129={
  version:'129',
  getScroller,
  top(){topBtn.click()},
  normalize(root=D){normalizeImages(root);normalizeControls(root);enhanceErrors()},
  audit(){const sc=getScroller();return{online:navigator.onLine,role:W.BD_ROLE||H.dataset.role||'user',scrollTop:sc===D.scrollingElement?W.scrollY:sc.scrollTop,center:!!q('#centerHost'),left:!!q('#leftHost'),right:!!q('#rightHost'),modules:Object.keys(W.BD_MODULES||{})}},
  announce
};

/* One-time post-mount normalization. No MutationObserver/interval is used. */
function finalize(){bindScroller();normalizeImages();normalizeControls();enhanceErrors();D.body.classList.add('bd129-ready');updateScrollUI();}
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',()=>{finalize();setTimeout(finalize,700)},{once:true});else{finalize();setTimeout(finalize,700)}
W.addEventListener('bd:index-ready',()=>{finalize();setTimeout(finalize,500)},{once:true});
/* -------------------- V129 extended experience runtime -------------------- */
const v129State={inkTimer:new WeakMap(),tooltipReady:false,prefetchQueue:new Set(),lastActionAt:0,lastActionType:'',searchHistory:[],moduleReadyAt:0};

/* Click ink: the press indication is visible but transform-only and does not alter box size. */
function installInk(){
  D.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const el=e.target.closest?.('button,a,[role="button"],.bd-feed-filter,.bd-side-row,.bd-action,.bd40-action,.bd-human-create,.bd-human-view,.bd-human-report,.bd-post-menu,.bd-more,.bd-reactor-follow');
    if(!el||el.matches(':disabled,[aria-disabled="true"]'))return;
    const r=el.getBoundingClientRect();if(!r.width||!r.height)return;
    el.classList.add('bd129-ink-host');
    el.style.setProperty('--bd129-ink-x',clamp(e.clientX-r.left,0,r.width)+'px');
    el.style.setProperty('--bd129-ink-y',clamp(e.clientY-r.top,0,r.height)+'px');
    el.classList.remove('bd129-ink');void el.offsetWidth;el.classList.add('bd129-ink');
    clearTimeout(v129State.inkTimer.get(el));
    const t=setTimeout(()=>el.classList.remove('bd129-ink'),470);v129State.inkTimer.set(el,t);
  },{capture:true,passive:true});
}

/* Helpful tooltip labels are derived only for icon-only controls that lack visible text. */
function decorateIconControls(root=D){
  const map=[
    ['.bd-post-menu,.bd-more,[data-post-menu]','পোস্ট অপশন'],
    ['.bd-search button','খুঁজুন'],
    ['.bd-head-actions [data-theme],.bd-head-actions button[data-theme]','থিম'],
    ['.bd-photo-prev','আগের ছবি'],['.bd-photo-next','পরের ছবি'],['.bd-photo-more','ছবির অপশন'],
    ['.bd-dock-camera','ছবি যোগ করুন'],['.bd-dock-plus','আরও'],['.bd-dock-send','পাঠান']
  ];
  map.forEach(([sel,label])=>qa(sel,root).forEach(el=>{if(!el.dataset.bd129Tip)el.dataset.bd129Tip=el.getAttribute('aria-label')||label;if(!el.getAttribute('aria-label'))el.setAttribute('aria-label',label)}));
}

/* Preserve search history locally for fast keyboard recall; it does not change visible design. */
const searchHistoryKey='bd:index:search-history:v129';
function loadSearchHistory(){try{const x=JSON.parse(localStorage.getItem(searchHistoryKey)||'[]');v129State.searchHistory=Array.isArray(x)?x.slice(0,8):[]}catch{v129State.searchHistory=[]}}
function saveSearchTerm(term){term=String(term||'').trim();if(term.length<2)return;v129State.searchHistory=[term,...v129State.searchHistory.filter(x=>x!==term)].slice(0,8);try{localStorage.setItem(searchHistoryKey,JSON.stringify(v129State.searchHistory))}catch{}}
function installSearchHistory(){
  loadSearchHistory();const form=q('#bdSearch'),input=q('#bdSearchInput');if(!form||!input)return;
  form.addEventListener('submit',()=>saveSearchTerm(input.value),{capture:true});
  input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&input.value.trim()===''&&v129State.searchHistory.length){e.preventDefault();input.value=v129State.searchHistory[0];input.dispatchEvent(new Event('input',{bubbles:true}))}});
}

/* Module lifecycle observation uses explicit custom event only: no MutationObserver loop. */
function onModuleReady(){
  v129State.moduleReadyAt=Date.now();
  normalizeImages();normalizeControls();decorateIconControls();enhanceErrors();bindScroller();
  const c=getScroller();if(c&&c!==D.scrollingElement)c.setAttribute?.('tabindex','-1');
  qa('.bd-post,.post-card,.post').forEach(card=>{card.setAttribute('data-bd129-card','1');const menu=card.querySelector('.bd-post-menu,.bd-more,[data-post-menu]');if(menu&&!menu.getAttribute('aria-haspopup'))menu.setAttribute('aria-haspopup','menu')});
  qa('.bd-rx-tray,.bd40-tray').forEach(tray=>{tray.setAttribute('role','menu');tray.querySelectorAll('button').forEach(b=>b.setAttribute('role','menuitemradio'))});
  qa('.bd-comment-menu,.bd-post-menu-panel,.bd-photo-more-menu').forEach(m=>m.setAttribute('role','menu'));
  updateScrollUI();
}
W.addEventListener('bd:index-ready',onModuleReady);

/* Busy feedback for async buttons that expose aria-busy or data-busy. */
function syncBusyControls(root=D){qa('[aria-busy="true"],[data-busy="true"],.is-busy',root).forEach(el=>el.classList.add('bd129-busy'));qa('[aria-busy="false"]',root).forEach(el=>el.classList.remove('bd129-busy'))}

/* Reaction keyboard flow: arrow keys move within the open tray. */
D.addEventListener('keydown',e=>{
  const pick=e.target.closest?.('.bd-rx-pick,.bd40-pick,.bd-reaction-option,.bd-comment-rx-picker button,.bd-photo-rx-picker button');if(!pick)return;
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
  const row=pick.parentElement;if(!row)return;const items=qa('button:not(:disabled)',row).filter(isVisible);if(!items.length)return;e.preventDefault();let i=items.indexOf(pick);if(e.key==='ArrowLeft')i=(i-1+items.length)%items.length;if(e.key==='ArrowRight')i=(i+1)%items.length;if(e.key==='Home')i=0;if(e.key==='End')i=items.length-1;items[i]?.focus();
});

/* A click on a reaction picker is recorded as intent, useful to suppress accidental post-open bubbling. */
D.addEventListener('click',e=>{
  if(e.target.closest?.('.bd-rx-pick,.bd40-pick,.bd-reaction-option,.bd-comment-rx-picker,.bd-photo-rx-picker')){v129State.lastActionAt=now();v129State.lastActionType='reaction'}
  else if(e.target.closest?.('.bd-post-menu,.bd-more,[data-post-menu]')){v129State.lastActionAt=now();v129State.lastActionType='menu'}
  else if(e.target.closest?.('.bd-action,.bd40-action')){v129State.lastActionAt=now();v129State.lastActionType='social'}
},{capture:true});

/* Prevent only accidental background post-open immediately after a picker/menu interaction. */
D.addEventListener('click',e=>{
  if(now()-v129State.lastActionAt>260)return;
  const card=e.target.closest?.('.bd-post,.post-card,.post');if(!card)return;
  if(e.target.closest?.('.bd-media,.post-media,.bd-post-body,.bd-post-title')&&!e.target.closest?.('button,a,input,textarea,select')){
    if(v129State.lastActionType==='reaction'||v129State.lastActionType==='menu'){e.stopPropagation()}
  }
},{capture:true});

/* Adaptive image sizing based on natural ratio, class-only so the feed never jumps after load. */
function classifyImage(img){if(!img?.naturalWidth||!img?.naturalHeight)return;const ratio=img.naturalWidth/img.naturalHeight;img.dataset.bd129Ratio=ratio>1.45?'wide':ratio<.78?'portrait':'squareish'}
D.addEventListener('load',e=>{if(e.target instanceof HTMLImageElement)classifyImage(e.target)},true);
function classifyLoadedImages(){qa('img').forEach(img=>{if(img.complete)classifyImage(img)})}

/* Media double-click on desktop should not text-select around the photo. Touch gestures remain owned by feed module. */
D.addEventListener('dblclick',e=>{if(e.target.closest?.('.bd-media img,.post-media img,.bd-photo-cell img')){try{D.getSelection()?.removeAllRanges()}catch{}}},{capture:true});

/* Stable menu focus: after opening a menu, keyboard focus can enter first visible item without scrolling the card. */
D.addEventListener('keydown',e=>{
  const trigger=e.target.closest?.('.bd-post-menu,.bd-more,[data-post-menu]');if(!trigger)return;if(e.key!=='ArrowDown'&&e.key!=='Enter'&&e.key!==' ')return;
  const card=trigger.closest('.bd-post,.post-card,.post');const menu=card?.querySelector('.bd-post-menu-panel.open,.bd-post-menu-panel:not([hidden]),[data-post-menu-panel].open');if(!menu)return;
  const item=qa('button,a,[role="menuitem"]',menu).find(isVisible);if(item){e.preventDefault();item.focus({preventScroll:true})}
});
D.addEventListener('keydown',e=>{const menu=e.target.closest?.('.bd-post-menu-panel,.bd-comment-menu,.bd-photo-more-menu');if(!menu)return;const items=qa('button:not(:disabled),a[href],[role="menuitem"]',menu).filter(isVisible);if(!items.length)return;let i=items.indexOf(D.activeElement);if(e.key==='ArrowDown'){e.preventDefault();items[(i+1+items.length)%items.length].focus({preventScroll:true})}else if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus({preventScroll:true})}});

/* Scroll anchor helper for follow/report/hide actions, which must not move the feed. */
const noJumpSelector='.bd-follow,.bd-reactor-follow,[data-follow],[data-hide-post],[data-report-post],[data-see-less],[data-see-more-like-this]';
D.addEventListener('click',e=>{
  const action=e.target.closest?.(noJumpSelector);if(!action)return;const sc=getScroller(),card=action.closest('.bd-post,.post-card,.post,.bd-reactor-person,.bd75-person');if(!sc||!card)return;const before=card.getBoundingClientRect().top;raf(()=>raf(()=>{if(!card.isConnected)return;const after=card.getBoundingClientRect().top,delta=after-before;if(Math.abs(delta)>2&&Math.abs(delta)<220){if(sc===D.scrollingElement)W.scrollBy(0,delta);else sc.scrollTop+=delta}}));
},{capture:true});

/* Remember category filter scroll state without owning the feed filter implementation. */
const filterKey='bd:index:last-filter:v129';
D.addEventListener('click',e=>{const f=e.target.closest?.('.bd-feed-filter');if(!f)return;const value=f.dataset.filter||f.dataset.category||f.textContent.trim();try{sessionStorage.setItem(filterKey,value)}catch{}},{capture:true});

/* Route-safe link treatment: javascript: and empty links are never prefetched or marked busy. */
D.addEventListener('click',e=>{
  const a=e.target.closest?.('a[href]');if(!a)return;const href=(a.getAttribute('href')||'').trim();if(!href||href==='#'||href.startsWith('javascript:'))return;if(a.target==='_blank'||a.hasAttribute('download'))return;
  const u=internalHref(a);if(!u)return;if(u.pathname===location.pathname&&u.search===location.search&&u.hash){return}
  if(!e.defaultPrevented&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey){a.classList.add('bd129-navigating');setTimeout(()=>a.classList.remove('bd129-navigating'),1400)}
},{capture:false});

/* Accessible click feedback for destructive actions. */
D.addEventListener('click',e=>{
  const del=e.target.closest?.('[data-delete-comment],[data-delete-post],.delete-comment,.delete-post,.bd-comment-menu .delete,.bd-post-menu-panel .delete');if(!del)return;announce('মুছে ফেলার কাজ প্রক্রিয়াধীন')
},{capture:true});

/* Resize observer is restricted to center host geometry, not feed content loops. */
let centerRO=null;
function installCenterResize(){if(!('ResizeObserver'in W)||centerRO)return;const c=q('#centerHost');if(!c)return;centerRO=new ResizeObserver(()=>{onScroll();H.style.setProperty('--bd129-center-width',Math.round(c.getBoundingClientRect().width)+'px')});centerRO.observe(c)}

/* Page lifetime performance: suspend ticker-heavy decorative animation while hidden. */
D.addEventListener('visibilitychange',()=>{D.body.classList.toggle('bd129-page-hidden',D.hidden)});

/* Network-aware prefetch policy. */
function canPrefetch(){const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;if(!c)return true;if(c.saveData)return false;return !/2g/.test(String(c.effectiveType||''))}
function prefetchImportant(){if(!canPrefetch())return;['profile.html','notifications.html','messages.html','search.html'].forEach(href=>{if(prefetched.has(new URL(href,location.href).href))return;const l=D.createElement('link');l.rel='prefetch';l.href=href;l.as='document';D.head.appendChild(l);prefetched.add(new URL(href,location.href).href)})}

/* Feature hints are session-only and silent; no overlays are injected. */
function markCapabilities(){D.body.dataset.bdTouch=('ontouchstart'in W||navigator.maxTouchPoints>0)?'1':'0';D.body.dataset.bdHover=matchMedia('(hover:hover)').matches?'1':'0';D.body.dataset.bdStandalone=matchMedia('(display-mode: standalone)').matches?'1':'0'}

/* Focus-visible fallback for browsers with incomplete support. */
let usingKeyboard=false;D.addEventListener('keydown',e=>{if(e.key==='Tab'||e.key.startsWith('Arrow')){usingKeyboard=true;D.body.classList.add('bd129-keyboard-nav')}});D.addEventListener('pointerdown',()=>{usingKeyboard=false;D.body.classList.remove('bd129-keyboard-nav')},{passive:true});

/* Apply one-time extended normalization. */
function extendedFinalize(){installCenterResize();decorateIconControls();syncBusyControls();classifyLoadedImages();markCapabilities();}
installInk();installSearchHistory();
if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',()=>{extendedFinalize();idle(prefetchImportant)},{once:true});else{extendedFinalize();idle(prefetchImportant)}
W.addEventListener('bd:index-ready',()=>{extendedFinalize();setTimeout(extendedFinalize,420)},{once:true});

/* Expose only non-destructive quality tools for debugging production. */
Object.assign(W.BDIndexV129||{}, {
  refreshUI:extendedFinalize,
  searchHistory:()=>[...v129State.searchHistory],
  scrollState:()=>{const sc=getScroller();return{top:sc===D.scrollingElement?W.scrollY:sc.scrollTop,height:sc.scrollHeight,viewport:sc===D.scrollingElement?W.innerHeight:sc.clientHeight}},
  capabilities:()=>({touch:D.body.dataset.bdTouch,hover:D.body.dataset.bdHover,standalone:D.body.dataset.bdStandalone,online:navigator.onLine,prefetch:canPrefetch()})
});

})();
</script>
