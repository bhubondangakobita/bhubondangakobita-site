function safeJSON(v,f={}){try{return JSON.parse(v)||f}catch{return f}}
function readStore(key){return safeJSON(localStorage.getItem(key)||'{}',{})}
function writeStore(key,v){try{localStorage.setItem(key,JSON.stringify(v))}catch(_){}}
function langList(){return (navigator.languages||[navigator.language||'']).join(' ').toLowerCase()}
function timezone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(_){return''}}
function countryPreset(code,area='',hint=''){
  code=String(code||'').toUpperCase();area=String(area||'');hint=String(hint||'');
  if(hint==='IN_WB'||(code==='IN'&&WB.test(area)))return {...PRESETS.IN_WB};
  if(code==='BD')return {...PRESETS.BD};
  if(code==='IN')return {...PRESETS.IN_HI};
  if(PRESETS[code])return {...PRESETS[code]};
  if(ME_CODES.has(code))return {...(PRESETS[code]||PRESETS.AE),countryCode:code,key:code};
  return {...PRESETS.INTL,countryCode:code,key:code||'INTL'};
}
function normalizeRegion(x={}){
  const code=String(x.countryCode||x.country_code||x.home_country_code||'').toUpperCase();
  const area=[x.region,x.state,x.adminArea1,x.admin_area1,x.district,x.city,x.countryName,x.country_name].filter(Boolean).join(' ');
  const hint=String(x.preset||x.key||'');
  const base=countryPreset(code,area,hint);
  return {...base,...x,key:hint==='IN_WB'?'IN_WB':(base.key||code||'INTL'),countryCode:code||base.countryCode||'',countryName:x.countryName||x.country_name||base.countryName||base.label,region:x.region||x.state||x.adminArea1||x.admin_area1||base.region||'',city:x.city||''};
}
function inferRescue(){
  const saved=readStore(RESCUE_STORE);if(saved.countryCode||saved.preset||saved.key)return normalizeRegion(saved);
  const legacy=readStore(LEGACY_OPERATIONAL_STORE);if(legacy.countryCode||legacy.preset||legacy.key)return normalizeRegion(legacy);
  const tz=timezone(),langs=langList();
  const map=[[/dubai/i,'AE'],[/riyadh/i,'SA'],[/qatar/i,'QA'],[/kuwait/i,'KW'],[/muscat/i,'OM'],[/bahrain/i,'BH'],[/dhaka/i,'BD'],[/karachi|islamabad/i,'PK'],[/jakarta/i,'ID'],[/manila/i,'PH'],[/kolkata|calcutta/i,'IN']];
  for(const [rx,code] of map)if(rx.test(tz))return normalizeRegion({countryCode:code,region:code==='IN'?'West Bengal':''});
  if(/\bur\b/.test(langs))return normalizeRegion({countryCode:'PK'});
  if(/\bid\b/.test(langs))return normalizeRegion({countryCode:'ID'});
  if(/\bfil\b|\btl\b/.test(langs))return normalizeRegion({countryCode:'PH'});
  if(/\bar\b/.test(langs))return normalizeRegion({countryCode:'AE'});
  if(/\bhi\b/.test(langs))return normalizeRegion({countryCode:'IN'});
  if(/\bbn\b/.test(langs))return normalizeRegion({countryCode:'BD'});
  return normalizeRegion({});
}
function inferHome(){
  const saved=readStore(HOME_STORE);if(saved.countryCode||saved.preset||saved.key)return normalizeRegion(saved);
  const langs=langList(),docLang=String(H.lang||'').toLowerCase();
  if(/\bbn\b/.test(langs)||docLang.startsWith('bn'))return normalizeRegion({countryCode:'BD'});
  if(/\bur\b/.test(langs))return normalizeRegion({countryCode:'PK'});
  if(/\bid\b/.test(langs))return normalizeRegion({countryCode:'ID'});
  if(/\bfil\b|\btl\b/.test(langs))return normalizeRegion({countryCode:'PH'});
  if(/\bhi\b/.test(langs))return normalizeRegion({countryCode:'IN'});
  return inferRescue();
}

  root.querySelectorAll?.('[data-sos-tier="lora"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.lora?'ready':'bridge'));
  root.querySelectorAll?.('[data-sos-tier="satellite"] .bd-sos-dot').forEach(x=>x.className='bd-sos-dot '+(c.satellite?'ready':'bridge'));

function gps(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('GPS unavailable'));
    navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude||null,heading:p.coords.heading||null}),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:15000});
  });
}
function openDB(){
  return new Promise((resolve,reject)=>{const r=indexedDB.open(VOICE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('voice'))r.result.createObjectStore('voice',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
}
async function saveVoice(blob){
  const id='voice-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),db=await openDB();
  await new Promise((resolve,reject)=>{const t=db.transaction('voice','readwrite');t.objectStore('voice').put({id,createdAt:Date.now(),type:blob.type,size:blob.size,blob});t.oncomplete=resolve;t.onerror=()=>reject(t.error)});
  return id;
}
async function recordVoice30(scope=D){
  if(!navigator.mediaDevices?.getUserMedia||!W.MediaRecorder)throw new Error('Voice recording unsupported');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const chunks=[],rec=new MediaRecorder(stream),start=Date.now();
  rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
  const done=new Promise((resolve,reject)=>{rec.onerror=e=>reject(e.error||new Error('Recorder error'));rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const id=await saveVoice(blob);localStorage.setItem('bd-sos-last-voice',id);resolve({id,blob})}});
  rec.start(500);status('Voice recording started · 30 seconds max',scope);
  const tick=setInterval(()=>{const left=Math.max(0,30-Math.floor((Date.now()-start)/1000));status(`Voice recording · ${left}s`,scope)},1000);
  const stop=()=>{clearInterval(tick);if(rec.state!=='inactive')rec.stop()};
  setTimeout(stop,30000);
  const onHide=()=>{if(D.hidden)stop()};D.addEventListener('visibilitychange',onHide,{once:true});
  const x=await done;status('30-second voice note saved for SOS relay',scope);return x;
}
async function sendNetworkSOS(payload){
  const c=getClient();if(!c?.from)return {ok:false,reason:'No network client'};
  let user=null;try{user=(await c.auth?.getUser?.()).data?.user||null}catch(_){}
  const privateEvent={
    user_id:user?.id||null,
    event_type:'life_support',
    created_at:payload.createdAt,
    operational_region:payload.region,
    gps:payload.gps||null,
    voice_ref:payload.voiceId||null,
    routing_targets:payload.routingTargets||[],
    misuse_policy_version:'bd-sos-v1',
    status:'active'
  };
  try{
    const r=await c.from('sos_emergency_events').insert(privateEvent).select('id').single();
    if(!r.error)return {ok:true,id:r.data?.id||null,via:'private_sos_queue'};
  }catch(_){}
  const common={
    author_id:user?.id||null,
    category:'sos',
    urgency:'critical',
    status:'active',
    verification_status:'unverified',
    title:payload.title,
    description:'[BongDang sos]\n'+payload.description+'\nExact GPS/voice data is kept for private rescue relay when supported.',
    country_code:payload.region.countryCode||null,
    country_name:payload.region.countryName||null,
    admin_area1:payload.region.region||null,
    district:payload.region.region||payload.region.city||'SOS',
    city:payload.region.city||null,
    address_text:'BongDang sos · private emergency routing requested',
    expires_at:new Date(Date.now()+24*3600000).toISOString()
  };
  try{
    let r=await c.from('humanitarian_requests').insert(common).select('id').single();
    if(r.error){
      const fallback={...common,category:'urgent',title:'[BongDang sos] '+common.title};
      r=await c.from('humanitarian_requests').insert(fallback).select('id').single();
    }
    if(r.error)throw r.error;
    return {ok:true,id:r.data?.id||null,via:'humanitarian_queue'};
  }catch(e){return {ok:false,reason:e.message||'Network relay failed'}}
}
async function quickSOS(scope=D){
  const button=scope.closest?.('.bd-sos-panel,.bd-sos-mini')||scope;
  status('জরুরি জীবনরক্ষা বার্তা প্রস্তুত হচ্ছে · লোকেশন নেওয়া হচ্ছে…',button);
  let g=null;try{g=await gps();status('লোকেশন পাওয়া গেছে · জরুরি বার্তা পাঠানোর চেষ্টা হচ্ছে…',button)}catch(_){status('লাইভ লোকেশন পাওয়া যায়নি · সংরক্ষিত অপারেশনাল লোকেশন ব্যবহার করা হচ্ছে…',button)}
  const op={...rescue};
  const caps=capability(),voiceId=localStorage.getItem('bd-sos-last-voice')||null;
  const payload={kind:'bongdang_sos',createdAt:new Date().toISOString(),region:op,gps:g,voiceId,
  protocols:{nearby_device:caps.bluetooth,rescue_gateway:caps.lora,remote_hardware:caps.satellite},
  routingTargets:['BongDang sos emergency queue','verified local rescue/support team','approved nearby helpers','configured emergency contacts where integrated'],
  misusePolicy:'False/prank SOS or intentional misuse may trigger a 15-day SOS suspension; repeated/serious misuse may lead to permanent SOS restriction and Founder/Admin review.',
  title:'BongDang sos · Emergency Life Support Message',
  description:'Emergency Life Support Message with location and optional voice note. Route to verified rescue/support channels when available.'};
  localStorage.setItem('bd-sos-last-payload',JSON.stringify(payload));
  let nativeResult=null;
  try{if(W.BongDangSOSBridge?.send)nativeResult=await W.BongDangSOSBridge.send(payload)}catch(_){}
  const net=await sendNetworkSOS(payload);
  const ok=!!(nativeResult?.ok||net.ok);
  status(ok?`জরুরি বার্তা রিলে হয়েছে${net.id?' · '+net.id:''}`:'বার্তা লোকালি কিউ হয়েছে — সমর্থিত নেটওয়ার্ক/রেসকিউ গেটওয়ে পাওয়া গেলে পুনরায় রিলে চেষ্টা করা যাবে',button);
  if(!ok){const q=safeJSON(localStorage.getItem('bd-sos-queue')||'[]',[]);q.push(payload);localStorage.setItem('bd-sos-queue',JSON.stringify(q.slice(-20)))}
  W.dispatchEvent(new CustomEvent('bd:sos-dispatched',{detail:{payload,nativeResult,network:net}}));
  try{navigator.vibrate?.(ok?[80,50,80]:[120,80,120])}catch(_){}
  return {ok,payload,nativeResult,network:net};
}
D.addEventListener('click',async e=>{
  const el=e.target.closest?.('[data-bd-sos-action]');if(!el)return;
  const act=el.dataset.bdSosAction,scope=el.closest('.bd-sos-panel,.bd-sos-mini')||D;

});
